# Lets anyone who files or comments on an issue ask the helpdesk bot for help with
# "@helpdesk-bot", including people outside the organization. Runs on GitHub-hosted runners.
name: community-answers

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Tag mode: the "@helpdesk-bot ..." comment is the instruction, and the bot may edit files
  # and push a branch.
  assist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@helpdesk-bot"
          allowed_non_write_users: "*"

  # FAQ answers for everyone, with read tools only.
  faq:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: "Answer issue #${{ github.event.issue.number }} from docs/faq.md if it is a FAQ."
          claude_args: --allowedTools "Read" "Grep" "Bash(gh issue view:*)"
