  - rule: user-content-to-fine-tuning
    file: helpdesk/answer_feedback.py
    line_contains: 'helpful_answers.append(_as_example(fb.team, fb.turns))'
    note: >-
      Thumbs-up conversations from the request (client-sent assistant turns included) appended
      through a JsonlLog object built on HELPFUL_ANSWERS, a path under FINETUNE_DIR. The
      feedback_audit log built from the same class, and down votes sent to the review queue,
      must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/trend_crew.py
    line_contains: "max_iter=DEEP_DIVE_ITERATIONS,"
    note: >-
      A CrewAI agent built in a @CrewBase method with max_iter from a module constant of 10,000
      (default 25). The escalation reviewer's 2,000 with max_execution_time=900 and the headline
      editor's 40 must stay quiet.
  - rule: agent-loop-unbounded-iterations-crewai-yaml
    file: helpdesk/config/agents.yaml
    line_contains: "max_iter: 5000"
    note: >-
      The trend researcher's max_iter in the crew's config/agents.yaml, which CrewBase loads
      into Agent(config=...). The digest writer's 30 must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/kb_gap_agent.py
    line_contains: "return AgentExecutor(agent=_agent(), tools=TOOLS, max_iterations=None, **EXECUTOR_DEFAULTS)"
    note: >-
      LangChain classic AgentExecutor with the iteration cap removed and no time limit.
      build_article_checker (None with max_execution_time=120) and build_quick_lookup (30) must
      stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/handoff_desk.py
    line_contains: "max_turns=self.route_turns)"
    note: >-
      OpenAI Agents SDK run whose max_turns is a class attribute set to None, which removes the
      10-turn cap; handoffs can bounce the ticket between specialists forever. BILLING.as_tool's
      max_turns=None (falls back to 10) and the summary runs' class caps (25, and 40 on the EMEA
      subclass) must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/review_team.py
    line_contains: "return RoundRobinGroupChat("
    note: >-
      AutoGen round-robin team with neither a termination condition nor max_turns: the checker
      is told to say SHIP IT, but nothing stops the team, so run() never returns. The selector
      team with TextMentionTermination | MaxMessageTermination must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/backlog_graph.py
    line_contains: 'BACKFILL_CONFIG = {"recursion_limit": 1_000_000,'
    note: >-
      LangGraph run config in a module constant with a recursion limit of a million, a hundred
      times LangGraph's own default of 10,007. NIGHTLY_CONFIG's 400 and the env-driven limit in
      custom_sweep must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/log_digger.py
    line_contains: 'max_steps=float("inf") if exhaustive else 20'
    note: >-
      smolagents run whose max_steps is infinite in "exhaustive" mode, passed to agent.run on an
      agent built by a helper. The helper's max_steps=30 must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/war_room.py
    line_contains: '"max_consecutive_auto_reply": 5000,'
    note: >-
      AG2 (classic autogen) UserProxyAgent settings dict, spread into the constructor, that
      never asks a human and auto-replies 5,000 times (default 100). The on-call lead's 10,000
      with human_input_mode="ALWAYS" must stay quiet.
  - rule: agent-loop-unbounded-iterations
    file: helpdesk/war_room.py
    line_contains: "chat = autogen.GroupChat(agents=_agents(), messages=[], max_round=WAR_ROOM_ROUNDS)"
    note: >-
      AG2 GroupChat with max_round from a module constant of 50,000 (default 10). The
      post-mortem review's max_round=30 must stay quiet.
  - rule: agent-memory-write-untrusted
    file: helpdesk/shift_memory.py
    line_contains: '{"status_page": page_text[:MAX_READING], "checked_at": _now()},'
    note: >-
      A vendor status page, fetched with the class's own httpx client (self.http), stripped
      of tags, and cut to MAX_READING, written to the on-call graph's LangGraph store (aput on
      self.store, a namespace held in a module constant). The empty-body fallback,
      (resp.text or resp.reason_phrase).strip(), once made OpenGrep 1.30.2 drop every finding
      in the file (String.sub). The next shift's questions read it back. check_indicator,
      which stores only the vendor's status code, must stay quiet.
  - rule: agent-memory-write-untrusted
    file: helpdesk/shift_memory.py
    line_contains: 'Message(role="assistant", name="outage-search", content=reports),'
    note: >-
      Brave web search results (outage_lookup.web_search, imported) added to the shift's Zep
      thread, which feeds Zep's handover context. log_oncall_note, the engineer's own note,
      must stay quiet.
  - rule: agent-memory-write-untrusted
    file: helpdesk/shift_memory.py
    line_contains: "digest.output_text,"
    note: >-
      The planner model's digest of runbook excerpts (KnowledgeBase.search) stored in the triage
      agent's mem0 memory (Memory.from_config at module level): the model's answer about
      retrieved content carries the content's taint. remember_preference, the requester's own
      message in their own memory, must stay quiet.
  - rule: secret-in-system-prompt
    file: helpdesk/shift_memory.py
    line_contains: "password {RELAY['relay_pass']}."
    note: >-
      The SMTP relay password, read from HELPDESK_SMTP_RELAY_PASS into a module-level dict,
      written into the mailer agent's system message so it can log in with its smtp tool.
      handover_brief, whose prompt holds search results from the mem0 store built from
      HELPDESK_MEMORY_DATABASE_URL (Memory.from_config), and HandoverWriter, whose
      self._first_pass is a step of the drafting loop and not a password, must stay quiet
      (testbed change 2026-10-29).
  # project-mcp-server-no-prompt for other clients (Gemini CLI, Roo / Kilo, dev containers,
  # Continue, Codex): committed stdio servers these clients start after folder or workspace trust
  # alone. All in existing config files; remote servers in the same files stay quiet.
  - rule: project-mcp-server-no-prompt-gemini
    file: .gemini/settings.json
    line_contains: '"command": "node",'
    note: >-
      runbook-index in Gemini CLI workspace settings: connected at startup once the folder is
      trusted. docs-search, runbook-search and runbook-search-staging are remote and stay quiet,
      as does mcp.serverCommand (another rule's).
  - rule: project-mcp-server-no-prompt-roo
    file: .roo/mcp.json
    line_contains: '"command": "uvx",'
    note: >-
      tickets in Roo Code's project file ("disabled": false still starts it); Roo connects every
      server here as soon as the extension loads in a trusted workspace.
  - rule: project-mcp-server-no-prompt-roo
    file: .roo/mcp.json
    line_contains: '"command": "npx",'
    note: runbooks.
  - rule: project-mcp-server-no-prompt-devcontainer
    file: .devcontainer/ollama/devcontainer.json
    line_contains: '"command": "uvx",'
    note: >-
      local-models in customizations.vscode.mcp: copied into the container's user mcp.json,
      which VS Code treats as trusted. local-router (http) stays quiet.
  - rule: project-mcp-server-no-prompt-devcontainer
    file: .devcontainer/ollama/devcontainer.json
    line_contains: '"command": "npx",'
    note: model-router, the supergateway bridge.
  - rule: project-mcp-server-no-prompt-continue
    file: .continue/mcpServers/device-lookup.json
    line_contains: '"command": "bunx",'
    note: One server at the root of a Continue mcpServers JSON file.
  - rule: project-mcp-server-no-prompt-continue
    file: .continue/mcpServers/reply-drafts.json
    line_contains: '"command": "%USERPROFILE%'
    note: reply-drafts, a hidden-home program (also the hidden-path rule's).
  - rule: project-mcp-server-no-prompt-continue
    file: .continue/mcpServers/status-page.json
    line_contains: '"command": "uvx",'
    note: status-page, a pinned package; still runs without a prompt.
  - rule: project-mcp-server-no-prompt-yaml
    file: .continue/mcpServers/helpdesk.yaml
    line_contains: 'command: pipx'
    note: >-
      Ticket history, in a YAML block Continue adds to every assistant. The other three stdio
      servers in the block follow; knowledge-search.yaml and macro-suggester.yaml hold only
      remote servers and stay quiet.
  - rule: project-mcp-server-no-prompt-yaml
    file: .continue/mcpServers/helpdesk.yaml
    line_contains: 'command: npx'
    note: Runbooks.
  - rule: project-mcp-server-no-prompt-yaml
    file: .continue/mcpServers/helpdesk.yaml
    line_contains: 'command: bash'
    note: Macro sync.
  - rule: project-mcp-server-no-prompt-yaml
    file: .continue/mcpServers/helpdesk.yaml
    line_contains: 'command: ~/.local/bin/hd-shift-notes'
    note: Shift notes.
  - rule: project-mcp-server-no-prompt-toml
    file: .codex/config.toml
    line_contains: 'command = "npx"'
    note: >-
      ticket-sync in the Codex project config, started at session start in a trusted project.
      kb-search (url) stays quiet; the hook commands are not servers.
  - rule: project-mcp-server-no-prompt-toml
    file: .codex/config.toml
    line_contains: 'command = "python3"'
    note: ticket-digest and log-digest.
  - rule: project-mcp-server-no-prompt-toml
    file: .codex/config.toml
    line_contains: 'command = "uvx"'
    note: log-digest-pinned and helpdesk; pinned packages still run without a prompt.
  - rule: project-mcp-server-no-prompt-toml
    file: ops/nightly-triage/.codex/config.toml
    line_contains: 'command = "example-org-helpdesk-mcp"'
    note: >-
      tickets in the nested config Codex layers on when started in ops/nightly-triage/.
      status-page and notes (url) stay quiet.
  - rule: project-mcp-server-no-prompt-toml
    file: ops/nightly-triage/.codex/config.toml
    line_contains: 'wiki.command = "uvx"'
    note: wiki, a dotted key inside [mcp_servers].
  - rule: project-mcp-server-no-prompt-toml
    file: scripts/devbox/home/.codex/config.toml
    line_contains: 'command = "uvx"'
    note: >-
      The laptop home template is also a .codex/config.toml inside the repository: Codex loads
      it as project config when started at or below scripts/devbox/home/. Reported like any
      other nested Codex project file (paths can't tell a home template apart); LOW confidence.
  - rule: project-mcp-server-no-prompt-toml
    file: scripts/devbox/home/.codex/config.toml
    line_contains: 'runbooks = { command = "npx"'
    note: runbooks, an inline table.
  - rule: project-mcp-server-no-prompt-toml
    file: scripts/devbox/home/.codex/config.toml
    line_contains: 'command = "github-mcp-server"'
    note: github.
  - rule: project-mcp-server-no-prompt-toml
    file: scripts/devbox/home/.codex/config.toml
    line_contains: 'command = "~/.local/bin/hd-shift-notes"'
    note: shift-notes.
  - rule: llm-max-tokens-from-user-input
    file: helpdesk/reply_drafts.py
    line_contains: "max_tokens=max_tokens,"
    requires: taint-intrafile
    note: >-
      Each alternative's output cap comes straight from the request body (req.length) and
      reaches Claude through the _draft_once helper. outline, whose OutlineRequest bounds length
      and sections with Field(le=...), and plan_draft, which takes the cap from a per-plan table,
      must stay quiet.
  - rule: llm-max-tokens-from-user-input
    file: helpdesk/reply_drafts.py
    line_contains: "max_tokens=words * 2"
    note: >-
      An int query parameter, doubled, sets a LangChain ChatOpenAI model's max_tokens.
  - rule: llm-max-tokens-from-user-input
    file: helpdesk/reply_drafts.py
    line_contains: "max_turns=req.steps"
    note: >-
      The OpenAI Agents SDK run's turn cap comes from the request (PlanRequest.steps, unbounded).
  - rule: llm-max-tokens-from-user-input
    file: helpdesk/reply_drafts.py
    line_contains: "while req.alternatives > len(kept):"
    note: >-
      A while loop that calls Claude until it has as many short replies as the request asks
      for (DraftRequest.alternatives, unbounded), with the request value on the left.
  - rule: subagent-permission-mode
    file: .claude/agents/macro-backfill.md
    line_contains: "# the backfill runs in the batch container"
    note: >-
      A project subagent pinned to bypassPermissions, which Claude Code before v2.1.267
      applied under a Manual or dontAsk session. csat-digest.md (plan) and the plugin's
      stale-ticket-closer.md (plugin agents ignore permissionMode) stay quiet.
  - rule: agent-sdk-subagent-permission-mode
    file: helpdesk/agent_roster.py
    line_contains: '"kb-editor": replace(_KB_BASE'
    note: >-
      An Agent SDK subagent derived with dataclasses.replace, its acceptEdits mode from a
      module constant. kb-reviewer (plan) stays quiet.
  - rule: subagent-permission-mode-cli-py
    file: scripts/kb_backfill.py
    line_contains: 'KB_WRITER = {'
    note: >-
      A module dict passed through json.dumps to claude --agents inside a function; kb-writer
      runs in acceptEdits while the session is limited to Read and Agent. KB_CHECKER (no mode)
      stays quiet.
  - rule: agent-settings-endpoint-override-dotenv
    file: ops/ticket-backfill/.gemini/.env
    line_contains: "GOOGLE_GEMINI_BASE_URL=https://genai-cache"
    note: >-
      A job folder's .gemini/.env sends Gemini CLI's requests, with the developer's
      GEMINI_API_KEY, through another team's caching proxy. The job's own .env next to it points
      the SDK at a 127.0.0.1 emulator and sets OTEL_EXPORTER_OTLP_ENDPOINT for the app, and
      must stay quiet.
  - rule: agent-settings-endpoint-override
    file: ops/ticket-backfill/.gemini/settings.json
    line_contains: '"otlpEndpoint": "https://otel.analytics'
    note: >-
      Workspace telemetry turned on and exported to another team's collector; Gemini CLI logs
      prompt text by default (logPrompts), so every prompt goes there.
  - rule: agent-allowlist-webfetch-any-domain
    file: .gemini/settings.json
    line_contains: '"defaultApprovalMode": "auto_edit"'
    note: >-
      Gemini CLI's auto_edit mode approves web_fetch for every URL along with file edits
      (policies/write.toml, 0.65), so the project's Gemini sessions fetch without asking.
  - rule: agent-allowlist-webfetch-any-domain-cli
    file: .github/workflows/nightly-triage.yml
    line_contains: '--approval-mode auto_edit -p "Summarize this week'
    note: >-
      The step calls auto_edit "edits only, no shell", but the mode also approves web_fetch,
      so the nightly run reads KB text and may fetch any URL with nobody asked.
  - rule: agent-allowlist-webfetch-any-domain-cli
    file: .github/workflows/pr-chores.yml
    line_contains: '--approval-mode auto_edit -p "Update docs/'
    note: >-
      The same auto_edit run on pull request content, which the PR author controls.
  - rule: agent-allowlist-webfetch-any-domain-cli-py
    file: helpdesk/agent_jobs.py
    line_contains: '"gemini": ("gemini", "--approval-mode", "auto_edit"'
    note: >-
      The Gemini job argv in auto_edit, which approves web_fetch for any URL. The claude and
      copilot entries don't allow fetches and stay quiet.
  - rule: agent-allowlist-webfetch-any-domain
    file: ops/kb-import/.gemini/settings.json
    line_contains: '"web_fetch(https://kb.vendor.example.com)"'
    note: >-
      Looks scoped to one site, but Gemini CLI 0.65 ignores arguments for every tool but the
      shell, so this allows web_fetch for any URL.
  - rule: agent-allowlist-webfetch-any-domain
    file: ops/vendor-status/.claude/settings.json
    line_contains: '"WebFetch(domain:*.up.railway.app)"'
    note: >-
      Any Railway app, which anyone can deploy and read the request logs of. The
      status.example.com and *.statuspage.io rules, the sms.example.com ask, and the curl and
      wget denies stay quiet.
  - rule: agent-allowlist-webfetch-any-domain-qwen
    file: ops/vendor-status/.qwen/settings.json
    line_contains: '"WebFetch(domain:railway.app)"'
    note: >-
      Qwen Code matches a domain rule against the name and every subdomain, so this covers
      every Railway app. status.example.com stays quiet.
  - rule: agent-allowlist-webfetch-any-domain-skill
    file: plugins/helpdesk-tools/skills/vendor-changelog/SKILL.md
    line_contains: 'allowed-tools: Read, Grep, WebFetch'
    note: >-
      A plugin skill that pre-approves a bare WebFetch while it runs. The api-docs skill's
      docs.example.com rules stay quiet.
  - rule: agent-allowlist-webfetch-any-domain-cli
    file: scripts/vendor-docs-refresh.sh
    line_contains: '--allowedTools "Read,Edit,Glob,WebFetch"'
    note: >-
      A weekly claude -p run that reads vendor pages with a bare WebFetch allowed, so a page
      can steer it to fetch anywhere. The copilot run's url(status.example.com) and
      --allow-url entries stay quiet.
  - rule: agent-allowlist-webfetch-any-domain-py
    file: scripts/vendor_changelog_digest.py
    line_contains: 'CHANGELOG_TOOLS: list[str] = ["Read", "Grep", "WebFetch"]'
    note: >-
      An Agent SDK tool list with a bare WebFetch, passed as allowed_tools. TICKET_TOOLS'
      docs.example.com rule stays quiet.
  - rule: agent-skill-load-time-shell
    file: .claude/skills/env-doctor/SKILL.md
    line_contains: "bash scripts/collect-env.sh"
    note: >-
      A skill that runs a repo script through ``!`cmd` `` load-time injection: Claude Code runs
      it before the model sees the skill, with no per-command prompt, whenever the skill loads.
      The cat/head and git-branch lookups above it are read-only near-misses that stay quiet.
  - rule: agent-skill-load-time-shell-toml
    file: .gemini/commands/triage-context.toml
    line_contains: "bootstrap.sh | sh"
    note: >-
      A Gemini CLI custom command whose !{...} injection pipes a download into a shell when the
      command is invoked. The git log lookup on the line above is a read-only near-miss.
  - rule: llm-output-to-code-execution
    file: helpdesk/printer_fixes.py
    line_contains: "        args=fix,"
    requires: taint-intrafile
    note: >-
      The printer-queue fix the model suggests (returned by the _suggest helper), run through
      the shell with the command passed by keyword (subprocess.run(args=fix, shell=True)).
      queue_status, which puts the suggestion only in an environment value of a fixed lpstat
      argv, stays quiet.
  - rule: llm-output-to-code-execution
    file: helpdesk/printer_fixes.py
    line_contains: "ssh.exec_command(command=fix, timeout=60)"
    requires: taint-intrafile
    note: >-
      The same suggestion sent to a lobby kiosk over paramiko, passed as command=; the kiosk's
      login shell runs it.
  - rule: agent-tool-arg-to-shell
    file: helpdesk/kiosk_tools.py
    line_contains: 'subprocess.check_output(args=f"lpq -P {printer}", shell=True'
    note: >-
      A LangChain tool argument in a shell string passed as args= with shell=True. The uptime
      tool next to it passes the kiosk name in an argv list with no shell and stays quiet.
