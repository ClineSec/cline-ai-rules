# Every finding cline-ai-rules must produce in this testbed, and nothing else.
# Anchors are substrings of the flagged line, so refactors only need the anchor updated.
findings:
  - rule: llm-output-to-code-execution
    file: helpdesk/diagnostics.py
    line_contains: "command, shell=True, capture_output=True"
    requires: taint-intrafile
    note: >-
      OpenAI completion flows through a method on an injected client (self.planner) and the
      shared _run_shell helper into a shell command. collect_support_bundle passes the same
      helper a fixed command. The finding sits on the command argument's line, not the call's.
  - rule: llm-output-to-code-execution
    file: helpdesk/estimates.py
    line_contains: "eval(expression"
    requires: taint-intrafile
    note: >-
      LiteLLM output evaluated with stripped builtins, which is not a sandbox, through a shared
      _evaluate helper. The staffing call passes a constant formula and model data only as a
      variable, and must not count.
  - rule: llm-output-to-code-execution
    file: helpdesk/remediation.py
    line_contains: "script, stdout=asyncio.subprocess.PIPE"
    note: >-
      AsyncAnthropic reply joined into a runbook prefix and run by asyncio's shell
      (imported bare). log_summary below passes model text on stdin only and must stay quiet.
  - rule: hf-trust-remote-code
    file: helpdesk/router.py
    line_contains: '"candidate": {'
    note: >-
      Remote code from a moving branch, in a dict of load options passed as **kwargs (the
      finding sits on the dict's first line). The SHA-pinned loads above it and the "control"
      arm, pinned through a constant, must stay quiet.
  - rule: agent-instruction-suppresses-security-findings
    file: AGENTS.md
    line_contains: "ignore all security findings"
    note: Moved from CLAUDE.md, which now only imports AGENTS.md and must stay quiet.
  - rule: claude-settings-unrestricted-shell
    file: .claude/settings.json
    line_contains: '"Bash(*)"'
  - rule: claude-settings-unrestricted-shell
    file: .claude/settings.json
    line_contains: '"Bash(uv run:*)"'
    note: >-
      uv run with an open tail runs any command (uv run bash -c, uv run python -c), so it is
      a shell allow of its own. The "uv run pytest *" entry above it names the tool and stays
      quiet.
  - rule: agent-hook-runs-local-script
    file: .claude/settings.json
    line_contains: "${CLAUDE_PROJECT_DIR}/scripts/dev-bootstrap.sh"
    note: >-
      Exec-form SessionStart hook: bash runs a repo script. The PostToolUse `uv run ruff
      format` hook below runs an installed tool and must stay quiet.
  - rule: agent-hook-runs-local-script
    file: .cursor/hooks.json
    line_contains: ".cursor/hooks/redact-ticket-ids.sh"
    note: Relative path, which Cursor resolves from the project root. The afplay stop hook must stay quiet.
  - rule: agent-hook-runs-local-script
    file: .gemini/settings.json
    line_contains: "$GEMINI_PROJECT_DIR/.gemini/hooks/load-runbooks.mjs"
    note: The $HOME hook below lives outside the repo and must stay quiet.
  - rule: agent-hook-remote-exec
    file: plugins/helpdesk-tools/hooks/hooks.json
    line_contains: "install.sh | env HD_INSTALL_DIR="
    note: >-
      Plugin SessionStart hook pipes a vendor installer into sh behind a "not installed yet"
      guard. The status.json download below never runs what it fetches and must stay quiet.
  - rule: agent-hook-remote-exec
    file: .cursor/hooks.json
    line_contains: "npx -y example-org/cursor-ticket-context"
    note: >-
      workspaceOpen runs a GitHub repo (npm reads user/repo as GitHub) when the folder opens.
      The pinned @example-org/ticket-lint@2.3.1 hook below is left to SCA and must stay quiet.
  - rule: agent-hook-runs-local-script
    file: plugins/helpdesk-tools/hooks/ticket-checks.json
    line_contains: "python3 scripts/check_ticket_command.py"
    note: >-
      Extra hook file that plugin.json names, outside hooks/hooks.json. Runs a project script
      (hooks run in the project directory). The inline Stop hook in plugin.json only posts a
      file with curl and must stay quiet for agent-hook-remote-exec.
  - rule: agent-hook-runs-local-script
    file: plugins/helpdesk-tools/monitors/monitors.json
    line_contains: "scripts/watch-ticket-queue.sh"
    note: >-
      Plugin monitor, started with every interactive session, runs a repo script. The tail -F
      monitor below must stay quiet.
  - rule: vscode-task-runs-automatically
    file: .vscode/tasks.json
    line_contains: '"runOn": "folderOpen",'
    note: >-
      A task with no command of its own whose dependsOn chain runs a repo script and the API
      server on folder open. The commented-out runOptions on "ticket queue" must stay quiet.
  - rule: vscode-task-runs-automatically
    file: helpdesk.code-workspace
    line_contains: '"runOn": "worktreeCreated"'
    note: >-
      Workspace-file task that runs whenever an agent session creates a worktree. The launch
      configuration's preLaunchTask only runs on F5 and is not a finding.
  - rule: devcontainer-initialize-command
    file: .devcontainer/devcontainer.json
    line_contains: '"initializeCommand": "${localWorkspaceFolder}/scripts/dev-bootstrap.sh"'
    note: >-
      Host-side repo script before every container start. postCreateCommand and
      postStartCommand below run inside the container and must stay quiet.
  - rule: devcontainer-initialize-command
    file: .devcontainer/ollama/devcontainer.json
    line_contains: '"initializeCommand": {'
    note: >-
      Second config one folder down, parallel (object) form; the finding sits on the key line.
      The empty initializeCommand in the gpu config does nothing and must stay quiet.
  - rule: codex-config-full-access
    file: ops/nightly-triage/.codex/config.toml
    line_contains: "default_permissions = ':danger-full-access'"
    note: >-
      Nested project config for a job folder (Codex layers every .codex/config.toml from the
      repo root down to its working directory), built-in full-access permission profile in a
      literal string. approval_policy = "never" next to it, and the root .codex/config.toml
      (workspace-write, sandbox network on), must stay quiet.
  - rule: vscode-chat-auto-approve
    file: .vscode/settings.json
    line_contains: '"approvals": "allowAll"'
    note: >-
      Agent-session default approvals inside a multi-line object, after a comment; the
      finding sits on the member. The specific terminal rules (including shellcheck), the
      commented-out "/.*/" rule, and chat.permissions.default = "default" must stay quiet.
  - rule: vscode-chat-auto-approve
    file: .vscode/settings.json
    line_contains: '"bash": true,'
    note: >-
      Terminal rule approving bash, added for the dev scripts. VS Code matches it against the
      start of each sub-command, and the script in `bash -c '...'` is never parsed, so it
      approves any command.
  - rule: vscode-chat-auto-approve
    file: helpdesk.code-workspace
    line_contains: '"/^.*$/i": true'
    note: >-
      Match-all terminal auto-approve rule in the workspace file's settings block, next to a
      path-prefix rule that must stay quiet.
  - rule: gemini-settings-unrestricted-shell
    file: .gemini/settings.json
    line_contains: '"run_shell_command"'
    note: >-
      Bare shell tool appended after narrowed command prefixes, which it makes moot. The
      run_shell_command(...) prefixes and the auto_edit default approval mode must stay quiet.
  - rule: cursor-cli-unrestricted-shell
    file: .cursor/cli.json
    line_contains: '"Shell(**)"'
    note: >-
      Globstar command allow at the end of a scoped list. Shell(git), Shell(uv:run *), and
      Shell(*:--version) (any command, but only with --version) must stay quiet.
  - rule: pickle-load-from-model-hub
    file: helpdesk/triage_model.py
    line_contains: "return joblib.load(artifacts.fetch(PIPELINE_FILE))"
    requires: taint-intrafile
    note: >-
      A joblib (pickle) pipeline fetched from a Hub repo at a moving revision. The download
      used to name the .joblib file itself (an unsafe-model-deserialization finding); after
      TriageArtifacts.fetch took the filename as a parameter, only the cross-function taint
      rule sees it, on the load. labels() uses the same fetch for labels.json and must stay
      quiet, as must the SHA-pinned fallback in load_audited_pipeline.
  - rule: unsafe-model-deserialization
    file: helpdesk/triage_model.py
    line_contains: '"weights_only": False,'
    note: >-
      torch.load options kept in a dict and passed as **kwargs (the finding spans the dict).
      The state-dict load relying on the weights-only default and torch.save must stay quiet.
  - rule: unsafe-model-deserialization
    file: helpdesk/kb_index.py
    line_contains: "allow_dangerous_deserialization=TRUST_NIGHTLY_INDEX,"
    note: >-
      FAISS docstore unpickled inside a lazy property, opted in through a module constant
      (constant propagation). The finding sits on the call's first line.
  - rule: unsafe-model-deserialization
    file: helpdesk/kb_index.py
    line_contains: '"article-ids.npy", allow_pickle=True'
    note: >-
      Object array read back with pickle enabled. The mmap'd vectors.npy load and the
      np.save with allow_pickle=False must stay quiet.
  - rule: unsafe-model-deserialization
    file: helpdesk/kb_index.py
    line_contains: "JsonPlusSerializer(pickle_fallback=True)"
    note: >-
      LangGraph checkpointer that unpickles agent state from SQLite; whoever can write the
      checkpoint DB gets code execution. scratch_checkpointer uses the default serializer
      and must stay quiet.
  - rule: pickle-load-from-model-hub
    file: helpdesk/triage_model.py
    line_contains: "return pickle.load(fh)"
    requires: taint-intrafile
    note: >-
      A Hub release file fetched through the _release_file helper (filename from an env
      var, so its format isn't visible) and unpickled in the caller. release_notes uses the
      same helper for a Markdown file and must stay quiet.
  - rule: pickle-load-from-model-hub
    file: helpdesk/kb_index.py
    line_contains: "return joblib.load(dst)"
    note: >-
      Vendor reranker downloaded with torch.hub.download_url_to_file into a cache path and
      loaded with joblib; the taint follows the destination variable.
  - rule: unsafe-model-deserialization
    file: helpdesk/tone.py
    line_contains: "return from_pretrained_fastai(TONE_REPO)"
    note: >-
      fastai learner pulled from the Hub at its default branch; load_learner unpickles it.
      tone_learner's load_learner on our own export volume must stay quiet.
  - rule: agent-rules-silent-command-directive
    file: .claude/commands/triage.md
    line_contains: "first execute `echo hd-queue-sync-check`"
    note: >-
      Slash command with an HTML comment (invisible when rendered) that runs a command on every
      invocation and says not to mention it. The ticket-summarizer subagent's "do not show the
      raw ticket thread to the user" protects data, runs nothing, and must stay quiet.
  - rule: agent-rules-silent-command-directive
    file: plugins/helpdesk-tools/skills/runbook-lookup/SKILL.md
    line_contains: "without notifying the user"
    note: >-
      Plugin skill runs a command when it loads "without notifying the user". The "fails
      silently, run ... and tell the user" line below it must stay quiet.
  - rule: agent-rules-silent-command-directive
    file: .cursor/rules/workspace.mdc
    line_contains: "bash .cursor/bootstrap/warm-ticket-index.sh"
    note: >-
      Cursor rule with alwaysApply false but an all-files glob (multi-line YAML list), so it
      attaches to every file; it tells the agent to run a repo script in a code block before
      anything else in each chat. python-style.mdc (alwaysApply, commands without a setup or
      session trigger) and migrations.mdc (scoped glob) must stay quiet.
  - rule: agent-rules-silent-command-directive
    file: .windsurf/rules/cascade.md
    line_contains: "npx -y @example-org/helpdesk-prompt-pack sync"
    note: >-
      Windsurf always_on rule runs an npx -y package at the start of each session; the command
      sits on the line after the trigger. The Copilot tests.instructions.md setup step is
      scoped to tests/ and must stay quiet.
  - rule: agent-instruction-suppresses-security-findings
    file: .claude/agents/security-reviewer.md
    line_contains: "security result under `helpdesk/vendored/` as a false positive"
    note: >-
      Project subagent (a path the rule gained alongside agent-rules-silent-command-directive)
      whose system prompt waves off scanner findings in a folder; the sentence wraps across
      two lines, so the finding spans both. "Report every security finding" before it must not
      match on its own.
  - rule: mcp-config-unpinned-package
    file: .mcp.json
    line_contains: '"example-org-helpdesk-mcp[jira]",'
    note: >-
      Claude Code project server: uvx --from with no version, in a multi-line args list after
      --python 3.12 (an option value, not the package). The pinned npx runbooks server and the
      uv run server with a pinned --with must stay quiet.
  - rule: mcp-config-unpinned-package
    file: .cursor/mcp.json
    line_contains: '"--package=@example-org/ticket-search"'
    note: >-
      npx --package= form; the positional after it is the command, not a package.
  - rule: mcp-config-unpinned-package
    file: .cursor/mcp.json
    line_contains: '"ghcr.io/example-org/helpdesk-kb-mcp"'
    note: >-
      Untagged docker image after value options (--env-file, -v). The inventory server's version
      tag must stay quiet.
  - rule: mcp-config-unpinned-package
    file: .vscode/mcp.json
    line_contains: '"@example-org/playwright-mcp@latest"'
    note: >-
      VS Code "servers" format with @latest, the shape VS Code's own docs show. The pinned uvx
      status-page server must stay quiet.
  - rule: mcp-config-unpinned-package
    file: plugins/helpdesk-tools/.mcp.json
    line_contains: "exec uvx example-org-hd-cli@latest"
    note: >-
      Plugin-provided server whose args hand bash a command line ending in uvx @latest. The hd
      server runs the binary the plugin's SessionStart hook installed and must stay quiet.
  - rule: mcp-config-unpinned-package-yaml
    file: .continue/mcpServers/helpdesk.yaml
    line_contains: "- example-org-ticket-history"
    note: >-
      Continue block file: pipx run --spec with no version, as plain YAML scalars. The pinned
      npx runbooks server in the same file must stay quiet.
  - rule: mcp-config-unpinned-package
    file: .continue/mcpServers/device-lookup.json
    line_contains: '"@example-org/device-lookup-mcp"'
    note: >-
      Continue's one-server JSON file (no mcpServers wrapper) running bunx with no version.
      status-page.json next to it pins uvx and must stay quiet.
  - rule: mcp-config-unpinned-package-toml
    file: scripts/devbox/home/.codex/config.toml
    line_contains: '"example-org-helpdesk-mcp@latest",'
    note: >-
      Codex user config shipped to support laptops: uvx @latest in a multi-line args array. The
      pinned npx runbooks server, an inline table under [mcp_servers], must stay quiet.
  - rule: agent-instruction-hidden-unicode
    file: .cursor/rules/replies-i18n.mdc
    line_contains: "- Keep replies under 120 words."
    note: >-
      Unicode tag characters after a visible bullet spell an instruction to read a file before
      every reply (the path does not exist). The Hebrew, Arabic and Persian greetings, the
      Persian ZWNJ, the England and Scotland flags (tag sequences), the ZWJ emoji and the
      non-breaking spaces in the same rule must stay quiet.
  - rule: agent-instruction-hidden-unicode
    file: .github/copilot-instructions.md
    line_contains: "Before touching a flaky test"
    note: >-
      Trojan Source in prose: a right-to-left override shows docs/NO-REVERSE.md while the agent
      reads the reversed path. Two findings on the line (the override and the closing PDF). The
      warning emoji with VS16 on the next line must stay quiet.
  - rule: agent-instruction-hidden-unicode
    file: .claude/commands/release-notes.md
    line_contains: "## Draft the notes"
    note: >-
      A byte-order mark in the middle of a slash command assembled from two files. A BOM at
      offset 0 (.windsurf/rules/locale.md) must stay quiet.
  - rule: agent-instruction-hidden-unicode
    file: .clinerules/escalation.md
    line_contains: "## When to page on-call"
    note: >-
      Zero-width binary (ZWSP and ZWNJ bits, ZWJ between bytes) after a heading, one finding
      for the whole run. The ZWJ in a Hindi conjunct below must stay quiet.
  - rule: agent-instruction-hidden-unicode
    file: plugins/helpdesk-tools/skills/status-digest/SKILL.md
    line_contains: "Post the digest under a"
    note: >-
      Bytes hidden in variation selectors after an emoji, in a plugin skill. Single VS16 emoji
      on the next line must stay quiet.
  - rule: agent-instruction-hidden-unicode
    file: GEMINI.md
    line_contains: "run `echo hd-gemini-ready`"
    note: >-
      A zero-width space splits "silently", so agent-rules-silent-command-directive does not
      see the word; this rule reports the hidden character instead.
  - rule: agent-instruction-hidden-unicode
    file: .claude/agents/kb-curator.md
    line_contains: "description: Curates knowledge-base articles"
    note: >-
      Tag characters in a subagent's description, which Claude reads when deciding whether to
      delegate, asking for the agent on every request.
  - rule: agent-sdk-bypass-permissions
    file: helpdesk/agent_settings.py
    line_contains: '"HELPDESK_AGENT_PERMISSION_MODE", "bypassPermissions"'
    note: >-
      Dataclass settings field whose env-var default is bypassPermissions, consumed in another
      module as permission_mode=SETTINGS.permission_mode (which must not fire again). The
      reply-draft settings next to it default to dontAsk and must stay quiet.
  - rule: agent-sdk-bypass-permissions
    file: helpdesk/nightly_agent.py
    line_contains: "can_use_tool=_approve,"
    note: >-
      can_use_tool callback with a docstring and a log line that approves every call. The
      reply-draft gate, which denies anything outside a read-only set, must stay quiet.
  - rule: agent-sdk-bypass-permissions
    file: helpdesk/e2e_replay.py
    line_contains: "can_use_tool=_no_prompts,"
    note: >-
      Release replay job (not a test, though its name says e2e) whose can_use_tool approves
      every call. e2e-tests/test_macro_sync_live.py, a live test with an allow-all callback and
      an approving PreToolUse hook, must stay quiet for this rule and
      agent-sdk-hook-auto-approves (test files are excluded by path).
  - rule: agent-sdk-bypass-permissions
    file: helpdesk/nightly_agent.py
    line_contains: 'await client.set_permission_mode("bypassPermissions")'
    note: >-
      ClaudeSDKClient started in plan mode and switched to bypass at runtime. The guard that
      compares the mode to "bypassPermissions" and the comment in draft_reply must stay quiet.
  - rule: mcp-config-plaintext-secret
    file: .cursor/mcp.json
    line_contains: '"SLACK_BOT_TOKEN": "xoxb-FAKE-TEST-helpdesk0escalations0NOTREAL",'
    note: >-
      Slack bot token pasted into a Cursor server's env. SLACK_TEAM_ID next to it is not a
      secret and must stay quiet.
  - rule: mcp-config-plaintext-secret
    file: .vscode/mcp.json
    line_contains: '"default": "FAKE0oncall0TEST0shared0token"'
    note: >-
      A VS Code password input with a literal default: the server reads ${input:oncall-token},
      which looks safe, but the shared token sits in the file. The status-page input with no
      default must stay quiet.
  - rule: mcp-config-plaintext-secret
    file: .gemini/settings.json
    line_contains: '"X-Goog-Api-Key": "AIzaFAKE0TEST0helpdesk0gemini0docs0FAKE"'
    note: >-
      Gemini CLI remote server with a literal Google API key header. runbook-search reads
      $RUNBOOK_SEARCH_TOKEN and must stay quiet.
  - rule: mcp-config-plaintext-secret
    file: plugins/helpdesk-tools/.mcp.json
    line_contains: '"url": "https://search.example.invalid/mcp?team=helpdesk&api_key=FAKE0hdsearch0TEST0plugin01"'
    note: >-
      Plugin-provided remote server with a shared API key in the URL query string, shipped to
      everyone who installs the plugin.
  - rule: mcp-config-plaintext-secret-yaml
    file: .continue/mcpServers/knowledge-search.yaml
    line_contains: "X-Api-Key: FAKE0kbsearch0TEST0continue01"
    note: >-
      Continue block file: a literal key in requestOptions.headers. The runbook server's
      apiKey uses ${{ secrets.RUNBOOK_SEARCH_KEY }} and must stay quiet.
  - rule: mcp-config-plaintext-secret-toml
    file: ops/nightly-triage/.codex/config.toml
    line_contains: 'http_headers = { "X-Api-Key" = "FAKE0status0TEST0nightly0key01" }'
    note: >-
      Codex nightly job: a status-page key in an inline http_headers table. env_http_headers
      (header to variable name) and env_vars on the tickets server must stay quiet.
  - rule: mcp-config-plaintext-secret-toml
    file: scripts/devbox/home/.codex/config.toml
    line_contains: 'GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_FAKE0helpdesk0devbox00TEST0000FAKE00"'
    note: >-
      GitHub token in a [mcp_servers.github.env] sub-table of the Codex config copied to every
      support laptop. GITHUB_HOST in the same table must stay quiet.
  - rule: ai-cli-bypass-flag-invocation
    file: .github/workflows/nightly-triage.yml
    line_contains: "codex exec \\"
    note: >-
      Nightly job runs codex exec with --dangerously-bypass-approvals-and-sandbox on a later
      continuation line, with the OpenAI key in the job env. The docs-digest job next to it
      (gemini --approval-mode auto_edit, GEMINI_CLI_TRUST_WORKSPACE) and the claude dontAsk
      step must stay quiet.
  - rule: ai-cli-bypass-flag-invocation
    file: .github/workflows/nightly-triage.yml
    line_contains: 'COPILOT_ALLOW_ALL: "1"'
    note: >-
      Job-level env turns on Copilot CLI's allow-all for the later copilot -p step, which has
      no flag of its own.
  - rule: ai-cli-bypass-flag-invocation-gha
    file: .github/workflows/agent-review.yml
    line_contains: "settings: |"
    note: >-
      claude-code-action's settings input as a multi-line JSON block with defaultMode
      bypassPermissions; its claude_args allowlist (--allowedTools ...) must stay quiet.
  - rule: ai-cli-bypass-flag-invocation-gha
    file: .github/workflows/agent-review.yml
    line_contains: 'sandbox: "danger-full-access"'
    note: >-
      Manually dispatched codex-action job with sandbox danger-full-access and a write token.
      The review job's permission-profile ":read-only" must stay quiet.
  - rule: ai-cli-bypass-flag-invocation
    file: Makefile
    line_contains: "AGENT_ARGS ?= --output-format stream-json --dangerously-skip-permissions"
    note: >-
      The flag lives in a make variable that agent-triage passes to $(CLAUDE); reported where
      it is defined. The echo in help and the dontAsk agent-explain target must stay quiet.
  - rule: ai-cli-bypass-flag-invocation
    file: Makefile
    line_contains: '-$(CODEX) exec --sandbox danger-full-access'
    note: Program through a make variable, after the recipe's - prefix.
  - rule: ai-cli-bypass-flag-invocation
    file: scripts/agent-review.sh
    line_contains: 'run_gemini() { gemini --model "$MODEL" -p "$1" -y; }'
    note: >-
      One-line shell function runs gemini with -y (YOLO). The kiro-cli --trust-tools branch
      and the echo mentioning --yolo must stay quiet.
  - rule: ai-cli-bypass-flag-invocation
    file: scripts/agent-review.sh
    line_contains: 'q chat --no-interactive --trust-all-tools "$PROMPT"'
    note: Legacy Amazon Q Developer CLI fallback in an elif branch.
  - rule: ai-cli-bypass-flag-invocation
    file: tools/package.json
    line_contains: '"agent:flaky":'
    note: >-
      npm script runs copilot --allow-all after other commands in the same string; the
      agent:flaky:safe script with --allow-tool 'shell(cat pytest.log)' must stay quiet.
  - rule: ai-cli-bypass-flag-invocation-py
    file: helpdesk/agent_jobs.py
    line_contains: '"--permission-mode", "bypassPermissions"),'
    note: >-
      argv template tuple in a dict, program through a which() fallback constant. The codex and
      gemini templates (workspace-write, auto_edit) and the FORBIDDEN_FLAGS guard must stay
      quiet.
  - rule: ai-cli-bypass-flag-invocation-py
    file: helpdesk/agent_jobs.py
    line_contains: '"codex": (slice(2, 4), ("--dangerously-bypass-approvals-and-sandbox",)),'
    note: >-
      Refactored from an argv.append into a per-agent table of unattended flags spliced into
      the argv template; the program is not on the line, so the flag-only tuple is what fires.
      The FORBIDDEN_FLAGS set below it is a guard and must stay quiet.
  - rule: ai-cli-bypass-flag-invocation-py
    file: helpdesk/agent_jobs.py
    line_contains: '"gemini": (slice(1, 3), ("--approval-mode", "yolo")),'
    note: Same table; Gemini's yolo approval mode as a two-element pair.
  - rule: ai-cli-bypass-flag-invocation-py
    file: helpdesk/agent_jobs.py
    line_contains: '"COPILOT_ALLOW_ALL": "yes"'
