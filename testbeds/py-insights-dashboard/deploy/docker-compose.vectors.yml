# Vector stores for the semantic search pages, on the analytics VM next to the dashboard:
#   docker compose -f docker-compose.yml -f docker-compose.vectors.yml up -d
x-milvus-image: &milvus-image milvusdb/milvus:v3.0.2

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
      CHROMA_SERVER_AUTHN_CREDENTIALS: ${CHROMA_TOKEN}
    ports:
      - target: 8000
        published: 8000
    volumes:
      - chroma-data:/data

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.2
    command: --host 0.0.0.0 --port '8080' --scheme http
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    ports:
      - 8080:8080
      - 50051:50051
    volumes:
      - weaviate-data:/var/lib/weaviate

  weaviate-partner:
    image: semitechnologies/weaviate:1.40.2
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_PARTNER_KEYS}
      AUTHENTICATION_APIKEY_USERS: agency
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'
      AUTHORIZATION_ADMINLIST_USERS: agency
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    ports:
      - "8081:8080"

  milvus:
    image: *milvus-image
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus

  # Read-only replica for the finance agent; only the dashboard container talks to it.
  qdrant-replica:
    image: qdrant/qdrant:v1.20.0-unprivileged
    expose:
      - "6333"

volumes:
  qdrant-data:
  chroma-data:
  weaviate-data:
  milvus-data:
