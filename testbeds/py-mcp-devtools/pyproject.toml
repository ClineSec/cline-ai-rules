[project]
name = "devtools-mcp"
version = "0.7.0"
description = "Repository and ops tools for coding agents over MCP (cline-ai-rules testbed; intentionally vulnerable)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "anyio>=4.15",
    "GitPython>=3.1.45",
    "paramiko>=4.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.2"]
contrib = ["fastmcp>=4.1.3", "pydantic-ai-slim[openai]>=2.59"]

[project.scripts]
devtools-mcp = "devtools.server:main"
