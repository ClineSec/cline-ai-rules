rules:
  - id: llm-output-to-html-razor
    # Regex, because OpenGrep doesn't parse .razor components or .cshtml views. It reports a
    # raw-HTML wrapper only when the same file sets the wrapped value from a model call; values
    # set in a code-behind file or a PageModel are out of its sight. The C# twin
    # (llm-output-to-html-csharp) covers HtmlString and MarkupString built in .cs files,
    # including .razor.cs code-behind.
    languages: [regex]
    severity: ERROR
    message: >-
      Model output is written into this page as raw HTML. `@((MarkupString)value)`,
      `new MarkupString(value)`, `@Html.Raw(value)`, and `new HtmlString(value)` turn off the
      encoding Razor and Blazor normally apply, and this value comes from a model call in this
      file. Completions are untrusted input: anyone who can influence the prompt, directly or
      through a web page, document, or tool result the model reads, can make it emit
      `<img src=x onerror=...>` or a `javascript:` link, which runs in your page with the user's
      session (XSS, account takeover, data exfiltration). Markdig passes raw HTML and
      `javascript:` links through, so `Markdown.ToHtml` output is not safe either. Render the
      text with `@value` so Razor encodes it; if the page must show formatted HTML, sanitize it
      with an allowlist (HtmlSanitizer's `Sanitize`) before wrapping it.
    paths:
      include:
        - "*.razor"
        - "*.cshtml"
    pattern-either:
      # The raw-HTML value is set from a model call later in the file (markup above an @code
      # block).
      - pattern-regex: |-
          (?x)
          (?(DEFINE)
            # A model call: Semantic Kernel chat and text services and kernel prompts,
            # Microsoft.Extensions.AI IChatClient, OpenAI .NET ChatClient and ResponsesClient, or
            # an agent's run (an object named like an agent).
            (?<call> \. \s* (?: GetChatMessageContentsAsync | GetChatMessageContentAsync
                | GetStreamingChatMessageContentsAsync | GetTextContentsAsync | GetTextContentAsync
                | GetStreamingTextContentsAsync | InvokePromptAsync | InvokePromptStreamingAsync
                | GetResponseAsync | GetStreamingResponseAsync | CompleteChatAsync | CompleteChat
                | CompleteChatStreamingAsync | CreateResponseAsync ) \b
              | \b \w*[Aa]gent \s* \. \s* (?: RunAsync | RunStreamingAsync | InvokeAsync | InvokeStreamingAsync ) \b )
            # The rest of one statement up to a model call, with no sanitizer or encoder on the way.
            (?<to_call> (?: (?! Sanitiz | Encode | ; ) [\s\S] )*? (?&call) )
            # The rest of one statement, with no sanitizer or encoder in it.
            (?<clean> (?: (?! Sanitiz | Encode | ; ) [\s\S] )*? )
          )
          (?: \( \s* MarkupString \s* \) \s* \(? | \b new \s+ MarkupString \s* \( | \b Html \s* \. \s* Raw \s* \(
              | \b new \s+ HtmlString \s* \( )
            \s* (?: (?: Markdig \s* \. \s* )? Markdown \s* \. \s* ToHtml \s* \( \s* )? (?: this \s* \. \s* )?
            (?<name> [A-Za-z_]\w* ) \b (?! \s* \( )
          (?= (?s:.*?) \b \k<name> \s* \+?= (?!=) (?&to_call) )
      # ... or from a variable that holds the model's reply (or a streaming chunk).
      - pattern-regex: |-
          (?x)
          (?(DEFINE)
            # A model call: Semantic Kernel chat and text services and kernel prompts,
            # Microsoft.Extensions.AI IChatClient, OpenAI .NET ChatClient and ResponsesClient, or
            # an agent's run (an object named like an agent).
            (?<call> \. \s* (?: GetChatMessageContentsAsync | GetChatMessageContentAsync
                | GetStreamingChatMessageContentsAsync | GetTextContentsAsync | GetTextContentAsync
                | GetStreamingTextContentsAsync | InvokePromptAsync | InvokePromptStreamingAsync
                | GetResponseAsync | GetStreamingResponseAsync | CompleteChatAsync | CompleteChat
                | CompleteChatStreamingAsync | CreateResponseAsync ) \b
              | \b \w*[Aa]gent \s* \. \s* (?: RunAsync | RunStreamingAsync | InvokeAsync | InvokeStreamingAsync ) \b )
            # The rest of one statement up to a model call, with no sanitizer or encoder on the way.
            (?<to_call> (?: (?! Sanitiz | Encode | ; ) [\s\S] )*? (?&call) )
            # The rest of one statement, with no sanitizer or encoder in it.
            (?<clean> (?: (?! Sanitiz | Encode | ; ) [\s\S] )*? )
          )
          (?: \( \s* MarkupString \s* \) \s* \(? | \b new \s+ MarkupString \s* \( | \b Html \s* \. \s* Raw \s* \(
              | \b new \s+ HtmlString \s* \( )
            \s* (?: (?: Markdig \s* \. \s* )? Markdown \s* \. \s* ToHtml \s* \( \s* )? (?: this \s* \. \s* )?
            (?<name> [A-Za-z_]\w* ) \b (?! \s* \( )
          (?= (?s:.*?) (?: \b foreach \s* \( \s* (?: var | [\w.<>?]+ ) \s+ | \b )
            (?<v> [A-Za-z_]\w* ) (?: \s* = (?!=) (?&to_call) | \s+ in \s+ [^)]*? (?&call) ) (?s:.*?) \b \k<name> \s* \+?= (?!=) (?&clean) \b \k<v> \b )
