rules:
  - id: agent-sdk-bypass-permissions-ts
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      This Claude Agent SDK session runs with its tool permission check turned off
      (`permissionMode: 'bypassPermissions'`, the `dangerously-skip-permissions` CLI flag, or a
      `canUseTool` callback that approves every call), or is armed to switch it off later
      (`allowDangerouslySkipPermissions: true`). In bypass, the model's shell commands, file
      writes, and network requests are all approved, and `allowedTools` no longer limits them,
      so a prompt injection in any file, issue, web page, or tool result the agent reads can
      run arbitrary commands with this process's credentials. Keep the default mode, or use
      `dontAsk` with an explicit `allowedTools` list, and gate everything else in `canUseTool`
      or a PreToolUse hook. If a job truly needs bypass, run it in a disposable sandbox with no
      secrets and no open network access, and add `disallowedTools` deny rules, which bypass
      mode still honors.
    # Tests build permissive options on purpose (an allow-all canUseTool, a hook that
    # approves) and pass them to a mocked query, so test files are skipped, as in
    # llm-debug-logging-enabled-ts. OpenGrep's own ignore list skips only test/ and tests/.
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
        - "*.test.js"
        - "*.test.mjs"
        - "*.spec.ts"
        - "*.spec.tsx"
        - "*.spec.js"
        - "__tests__/"
        - "test/"
        - "tests/"
        - "e2e/"
        - "e2e-tests/"
    pattern-either:
      # A permission mode that is, or can fall back to, 'bypassPermissions': a literal, a
      # const (constant propagation), an env-var default (`?? 'bypassPermissions'`), or a
      # ternary, under any name ending in "mode". That covers `permissionMode` in Options, a
      # settings object's `defaultMode`, extraArgs' 'permission-mode', a helper's default
      # parameter, `opts.permissionMode = ...`, and a config const or property (which
      # constant propagation can't follow across an import or an env-var default, so it is
      # reported where it is assigned). Values that can't be resolved (process.env.MODE) are
      # left alone. The finding sits on the value. With bypass set, a sibling
      # allowDangerouslySkipPermissions is required by the SDK and is not reported again.
      - patterns:
          - pattern-either:
              - pattern: '{..., $KEY: $V, ...}'
              - pattern: const $KEY = $V
              - pattern: let $KEY = $V
              - pattern: var $KEY = $V
              - pattern: 'const $KEY: $T = $V'
              - pattern: 'let $KEY: $T = $V'
              - pattern: $KEY = $V
              - pattern: 'function $DEF(..., $KEY = $V, ...) {...}'
              - pattern: '($...BEFORE, $KEY = $V, $...AFTER) => $BODY'
          # Claude Code v2.1.267 and later never apply 'bypassPermissions' from a subagent's
          # AgentDefinition (agent-sdk-subagent-permission-mode-ts covers the modes it does apply):
          # inline under `agents`, or a standalone object, which always has the required
          # `description` and `prompt` keys. (`'{...} as T'` and `'{...} satisfies T'`
          # patterns match far too much, so they aren't used here.)
          - pattern-not-inside: 'agents: {...}'
          - pattern-not-inside: '{..., description: $DESC, prompt: $PROMPT, ...}'
          # Names that read as a guard (BLOCKED_MODE, UNSAFE_MODE) are left to the use site.
          # Keep this regex in step with the one on $V below.
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^["']?(?![\w.$-]*(?:bypass|block|forbid|deny|danger|unsafe|disallow))[\w.$-]*mode["']?$
          # A value that is itself a name ending in "mode" (including shorthand
          # `{ permissionMode }`) is reported where that name is assigned, so it isn't
          # reported twice.
          - metavariable-regex:
              metavariable: $V
              regex: ^(?!(?i:(?![\w.$]*(?:bypass|block|forbid|deny|danger|unsafe|disallow))[\w.$]*mode)$)
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern: '"bypassPermissions"'
                # `'bypassPermissions' as const` would otherwise match twice.
                - pattern-not-inside: $X as $T
                # A guard that clamps the mode is the safe variant, not a use of it.
                - pattern-not-inside: $A === $B
                - pattern-not-inside: $A !== $B
                - pattern-not-inside: $A == $B
                - pattern-not-inside: $A != $B
                - pattern-not-inside: $A.includes($B)
                # A list of allowed modes is a schema or a guard, not a setting:
                # `permissionMode: z.enum(['default', 'bypassPermissions'])`.
                - pattern-not-inside: '[...]'
          - focus-metavariable: $V
      # Switching a running query into bypass.
      - patterns:
          - pattern: $Q.setPermissionMode($V)
          - metavariable-regex:
              metavariable: $V
              regex: ^(?!(?i:(?![\w.$]*(?:bypass|block|forbid|deny|danger|unsafe|disallow))[\w.$]*mode)$)
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern: '"bypassPermissions"'
                # `'bypassPermissions' as const` would otherwise match twice.
                - pattern-not-inside: $X as $T
                # A guard that clamps the mode is the safe variant, not a use of it.
                - pattern-not-inside: $A === $B
                - pattern-not-inside: $A !== $B
                - pattern-not-inside: $A == $B
                - pattern-not-inside: $A != $B
                - pattern-not-inside: $A.includes($B)
          - focus-metavariable: $V
      # allowDangerouslySkipPermissions: true without bypass in the same object: its only
      # purpose is to let the session enter bypass later (setPermissionMode, a settings
      # defaultMode, or a mode read from the environment), so the object is armed.
      - patterns:
          - pattern: '{..., allowDangerouslySkipPermissions: $ALLOW, ...}'
          - metavariable-pattern:
              metavariable: $ALLOW
              pattern: 'true'
          - pattern-not: '{..., permissionMode: <... "bypassPermissions" ...>, ...}'
          - focus-metavariable: $ALLOW
      # extraArgs: { 'dangerously-skip-permissions': null } passes the CLI's bypass flag.
      - patterns:
          - pattern: '{..., "dangerously-skip-permissions": $V, ...}'
          - focus-metavariable: $V
      # A canUseTool callback that approves every call with no condition, deny, or throw: the
      # same as bypass for every tool the allow rules don't already cover. Skipped when the
      # same object also sets bypass, which is reported above. The regex rejects any callback
      # whose text branches, throws, or mentions 'deny'.
      - patterns:
          - pattern: '{..., canUseTool: $FUNC, ...}'
          - pattern-not: '{..., permissionMode: <... "bypassPermissions" ...>, ...}'
          - metavariable-pattern:
              metavariable: $FUNC
              pattern-either:
                - pattern: '($...P) => ({..., behavior: "allow", ...})'
                - pattern: 'async ($...P) => ({..., behavior: "allow", ...})'
                - pattern: '($...P) => { ... return {..., behavior: "allow", ...}; }'
                - pattern: 'async ($...P) => { ... return {..., behavior: "allow", ...}; }'
          - metavariable-regex:
              metavariable: $FUNC
              regex: (?s)^(?!.*(?:\b(?:if|throw|catch|switch|while|for)\b|["'`]deny["'`]|\?(?!\.)))
          - focus-metavariable: $FUNC
      # The same callback defined as a named const arrow function earlier in the file.
      - patterns:
          - pattern-inside: |
              const $CB = $FUNC;
              ...
          - pattern: '{..., canUseTool: $CB, ...}'
          - pattern-not: '{..., permissionMode: <... "bypassPermissions" ...>, ...}'
          - metavariable-pattern:
              metavariable: $FUNC
              pattern-either:
                - pattern: '($...P) => ({..., behavior: "allow", ...})'
                - pattern: 'async ($...P) => ({..., behavior: "allow", ...})'
                - pattern: '($...P) => { ... return {..., behavior: "allow", ...}; }'
                - pattern: 'async ($...P) => { ... return {..., behavior: "allow", ...}; }'
          - metavariable-regex:
              metavariable: $FUNC
              regex: (?s)^(?!.*(?:\b(?:if|throw|catch|switch|while|for)\b|["'`]deny["'`]|\?(?!\.)))
          - focus-metavariable: $CB
      # ... or as a function declaration.
      - patterns:
          - pattern-inside: |
              async function $CB($...P) {
                ...
                return {..., behavior: "allow", ...};
              }
              ...
          - pattern-not-inside: |
              async function $CB($...P) {
                ...
                if ($C) $S;
                ...
              }
              ...
          - pattern-not-inside: |
              async function $CB($...P) {
                ...
                throw $E;
                ...
              }
              ...
          - pattern-not-inside: |
              async function $CB($...P) {
                ...
                <... {..., behavior: "deny", ...} ...>;
                ...
              }
              ...
          - pattern: '{..., canUseTool: $CB, ...}'
          - pattern-not: '{..., permissionMode: <... "bypassPermissions" ...>, ...}'
          - focus-metavariable: $CB
    metadata:
      category: security
      subcategory: [audit]
      pack-category: ai-code
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-aisvs:
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
        - "AML.T0112.000 - Machine Compromise: Local AI Agent"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [claude-agent-sdk, anthropic]
      references:
        - https://code.claude.com/docs/en/agent-sdk/permissions
        - https://code.claude.com/docs/en/agent-sdk/typescript
        - https://www.npmjs.com/package/@anthropic-ai/claude-agent-sdk/v/0.3.308
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
