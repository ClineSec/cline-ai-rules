rules:
  - id: agent-allowlist-network-exfil-commands-ts
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      This Claude Agent SDK allow list lets the agent run a network tool (curl, wget, nc,
      ssh, scp, nslookup, dig, ping, Invoke-WebRequest, ...) without any check. The SDK
      applies allowedTools entries as Claude Code allow rules before canUseTool runs, so nothing
      reviews those commands. A prompt injection in a file, issue, web page, or tool result
      the agent reads can then have it read a secret (an environment variable, a token in its
      prompt, source code) and send it out in a request, an upload, or a DNS lookup of a name
      like <secret>.attacker.example. Narrowing the rule to one URL doesn't help: * matches
      any text, including a second URL or `-d @.env`. Give the agent a custom tool that calls
      the one service it needs, or check the command's host in canUseTool or a PreToolUse hook.
    patterns:
      - pattern-either:
          # allowedTools: [...] in query options, a subagent, or a helper's options object.
          - pattern: '{..., allowedTools: [..., "$V", ...], ...}'
          # A list kept in a named const (ALLOWED_TOOLS, allowedShellCommands, TRIAGE_TOOLS; not a
          # deny list) and passed in.
          - patterns:
              - pattern-either:
                  - pattern: const $NAME = [..., "$V", ...]
                  - pattern: 'const $NAME: $T = [..., "$V", ...]'
                  - pattern: let $NAME = [..., "$V", ...]
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^(?![\w.]*(?:disallow|deny|denied|block|forbid|exclude|risk|danger|unsafe))[\w.]*(?:allow|tools?$)
              # A file that starts the agent CLI with the list is the -cli twin's finding.
              - pattern-not-regex: (?s)\A(?=.*?--allowedTools).*
              - pattern-not-regex: (?s)\A(?=.*?--allowed-tools).*
      # Bypass mode approves everything already; agent-sdk-bypass-permissions-ts reports it.
      - pattern-not-inside: '{..., permissionMode: <... "bypassPermissions" ...>, ...}'
      - focus-metavariable: $V
      # A Bash(...) or PowerShell(...) rule for a network program with a wildcard (a rule
      # without * matches one exact command).
      - metavariable-regex:
          metavariable: $V
          regex: |-
            (?x)
            # --- network exfil programs (begin): build.py keeps this block identical in
            # the agent-allowlist-network-exfil-commands rules; edit every copy together. ---
            (?(DEFINE)
              # An optional directory, so /usr/bin/curl counts.
              (?<dir> (?: [^\s"'()\[\],:*]* [/\\]{1,2} )? )
              # Programs whose main use is sending or fetching data over the network: HTTP
              # clients, raw sockets, remote shells and file transfer, and DNS, ICMP, and
              # whois lookups (a looked-up name carries data to the name's DNS server).
              # General developer tools that can also reach the network (git, gh, npm,
              # aws, docker) are left out: approving them is common and is a different
              # question.
              (?<net> (?: curl | curlie | wget2? | https? | xhs? | aria2c | grpcurl | websocat | wscat
                        | nc | ncat | netcat | socat | telnet
                        | ssh | scp | sftp | rsync | ftp | lftp | tftp
                        | nslookup | dig | host | drill | whois
                        | ping6? | traceroute6? ) (?i:\.exe)?
                      | (?i: invoke-webrequest | invoke-restmethod | iwr | irm | resolve-dnsname ) )
            )
            # --- network exfil programs (end) ---
            ^ \s*+ (?: Bash | PowerShell ) \( \s*+ (?&dir) (?&net) (?= [\s*)] | : \s*+ \* \s*+ \) ) [^)]*? \*
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-aisvs:
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
      mitre-atlas:
        - "AML.T0086 - Exfiltration via AI Agent Tool Invocation"
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      # A headless SDK app has to allow the commands it uses, and some agents exist to call
      # one service; the allow is still a call nobody reviews.
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      technology: [claude-agent-sdk, anthropic]
      references:
        - https://code.claude.com/docs/en/agent-sdk/permissions
        - https://code.claude.com/docs/en/permissions
        - https://www.npmjs.com/package/@anthropic-ai/claude-agent-sdk/v/0.3.309
