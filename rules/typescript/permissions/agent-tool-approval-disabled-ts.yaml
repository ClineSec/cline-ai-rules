rules:
  - id: agent-tool-approval-disabled-ts
    # Generated by scripts/gen_mcp_auto_approve.py, which holds the tool-name test shared by the
    # MCP auto-approval rules. Edit the script and run scripts/build.py; build.py --check fails if
    # this file drifts.
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Human approval is switched off for tools this agent can call: require_approval "never" on a hosted MCP server (OpenAI Responses API), an OpenAI
      Agents SDK hostedMcpTool() without requireApproval (it defaults to "never") or with
      "never", Azure AI Agents MCPTool.setApprovalMode("never"), a never-filter or LangChain / deepagents interruptOn entry that
      auto-approves a tool whose name says it writes, sends, deletes, or runs something,
      or an onApproval callback that approves every call. The model's
      tool calls then run with nobody checking them, so a prompt injection in a document,
      ticket, email, web page, or tool result the model reads can make it take those
      actions (send messages, change or delete records, move money, push code) with the
      app's credentials. Keep approval on for tools that change things: leave
      require_approval at "always" (or list only read-only tools under "never"), limit
      allowed_tools to read-only tools, set interrupt_on entries for acting tools to True,
      and make approval callbacks decide from the tool name and arguments instead of
      approving everything.
    patterns:
      - pattern-either:
          # require_approval "never" on a Responses API MCP tool object.
          - patterns:
              - pattern-either:
                  - pattern: '{..., type: "mcp", ..., require_approval: $RA, ...}'
                  - pattern: '{..., server_label: $L, ..., require_approval: $RA, ...}'
              - metavariable-regex:
                  metavariable: $RA
                  regex: ^[^{\[]
              - metavariable-pattern:
                  metavariable: $RA
                  pattern: '"never"'
              - focus-metavariable: $RA
          # requireApproval "never": hostedMcpTool() options, an Azure AI Agents MCP tool
          # resource, or MCPTool.setApprovalMode() (Azure AI Agents, default "always").
          - patterns:
              - pattern-either:
                  - pattern: '{..., serverLabel: $L, ..., requireApproval: $RA, ...}'
              - metavariable-regex:
                  metavariable: $RA
                  regex: ^[^{\[]
              - metavariable-pattern:
                  metavariable: $RA
                  pattern: '"never"'
              - focus-metavariable: $RA
          # Azure AI Agents MCPTool (default "always") switched to "never", unless the MCPTool
          # it is called on reaches only read-only tools or a documentation server.
          - patterns:
              - pattern: $M.setApprovalMode($RA)
              - metavariable-regex:
                  metavariable: $RA
                  regex: ^[^{\[]
              - metavariable-pattern:
                  metavariable: $RA
                  pattern: '"never"'
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        const $M = new MCPTool($L2, $U2, $AT, ...);
                        ...
                    - metavariable-regex:
                        metavariable: $AT
                        regex: |-
                          (?x)
                          (?(DEFINE)
                            (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                            (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                            (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                            (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                          )
                          ^ (?: \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \]
                            | \{ \s*+ ["']?+ (?:tool_names|toolNames) ["']?+ \s*+ : \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \}
                            | \{ [^{}]*? ["']?+ (?:read_only|readOnly) ["']?+ \s*+ : \s*+ (?:True|true) \b [^{}]*+ \}
                            | [\w.]++ \( \s*+ tool_names \s*+ = \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \)
                            | [\w.]++ \( [^()]*? \b read_only \s*+ = \s*+ True \b [^()]*+ \)
                            ) $
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        const $M = new MCPTool($L2, $U, ...);
                        ...
                    - metavariable-regex:
                        metavariable: $U
                        regex: |-
                          ^(?:[fFrRuU]{0,2})?[\"'`]https?://(?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#\"'`$]|$)
              - focus-metavariable: $RA
          # hostedMcpTool({...}) without requireApproval sends "never".
          - patterns:
              - pattern-either:
                  - pattern-inside: hostedMcpTool($OPTS)
                  - pattern-inside: $NS.hostedMcpTool($OPTS)
              - pattern: '{..., serverLabel: $L, ...}'
              - pattern-not: '{..., requireApproval: $X, ...}'
              - pattern-not: '{..., ...$SPREAD, ...}'
          # The same, with shared options spread in from a const object in this file that sets
          # no requireApproval either. Other spreads (a parameter, an import) may carry it.
          - patterns:
              - pattern-either:
                  - pattern-inside: hostedMcpTool($OPTS)
                  - pattern-inside: $NS.hostedMcpTool($OPTS)
              - pattern: '{..., serverLabel: $L, ...}'
              - pattern-inside: '{..., ...$D, ...}'
              - pattern-inside: |
                  const $D = $DOBJ;
                  ...
              # A bare object pattern parses as a block inside metavariable-pattern, so test the
              # const's text: an object literal with no requireApproval key and no spread.
              - metavariable-regex:
                  metavariable: $DOBJ
                  regex: '^\{(?![\s\S]*\brequireApproval\b)(?![\s\S]*\.\.\.)'
              - pattern-not: '{..., requireApproval: $X, ...}'
              - pattern-not: '{..., ...$OTHER, ..., ...$D, ...}'
              - pattern-not: '{..., ...$D, ..., ...$OTHER, ...}'
          # A never-filter listing a tool that acts.
          - patterns:
              - pattern-either:
                  - pattern: '{..., require_approval: {..., never: {..., tool_names: [..., "$V", ...], ...}, ...}, ...}'
                  - pattern: '{..., requireApproval: {..., never: {..., toolNames: [..., "$V", ...], ...}, ...}, ...}'
                  - pattern: '$M.setApprovalMode({..., never: {..., toolNames: [..., "$V", ...], ...}, ...})'
              - focus-metavariable: $V
              - metavariable-regex:
                  metavariable: $V
                  regex: |-
                    (?x)
                    (?(DEFINE)
                      (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                      (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                      (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                      (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                    )
                    ^ \s*+ (?: (?! (?&read) ) [^*?"] )*? (?: [*?] | (?&act) )
          # onApproval that approves every call.
          - patterns:
              - pattern-either:
                  - pattern-inside: 'hostedMcpTool({..., onApproval: $CB, ...})'
                  - pattern-inside: '$NS.hostedMcpTool({..., onApproval: $CB, ...})'
              - pattern-either:
                  - pattern: '($...P) => ({..., approve: true, ...})'
                  - pattern: 'async ($...P) => ({..., approve: true, ...})'
                  - pattern: '($...P) => { return {..., approve: true, ...}; }'
                  - pattern: 'async ($...P) => { return {..., approve: true, ...}; }'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      function $FN(...) { return {..., approve: true, ...}; }
                      ...
                  - pattern-inside: |
                      async function $FN(...) { return {..., approve: true, ...}; }
                      ...
                  - pattern-inside: |
                      const $FN = ($...P) => ({..., approve: true, ...});
                      ...
                  - pattern-inside: |
                      const $FN = async ($...P) => ({..., approve: true, ...});
                      ...
              - pattern-either:
                  - pattern: 'hostedMcpTool({..., onApproval: $FN, ...})'
                  - pattern: '$NS.hostedMcpTool({..., onApproval: $FN, ...})'
          # interruptOn entries (humanInTheLoopMiddleware, createDeepAgent, a subagent) set to
          # false or to a config whose `when` always returns false.
          - patterns:
              - pattern-either:
                  - pattern: '{..., interruptOn: {..., $K: false, ...}, ...}'
                  - pattern: '{..., interruptOn: {..., $K: {..., when: ($...P) => false, ...}, ...}, ...}'
                  - patterns:
                      - pattern-inside: |
                          const $NAME = {...};
                          ...
                          <... {..., interruptOn: $NAME, ...} ...>;
                      - pattern-either:
                          - pattern: 'const $NAME = {..., $K: false, ...};'
                          - pattern: 'const $NAME: $TY = {..., $K: false, ...};'
              - focus-metavariable: $K
              - metavariable-regex:
                  metavariable: $K
                  regex: |-
                    (?x)
                    (?(DEFINE)
                      (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                      (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                      (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                      (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                    )
                    ^ ["'`]?+ (?: (?! (?&read) ) [^"'`*?] )*? (?&act)
      # Only read-only tools are reachable, or the server is a public documentation server.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: '{..., allowed_tools: $AT, ...}'
                - pattern: '{..., allowedTools: $AT, ...}'
            - metavariable-regex:
                metavariable: $AT
                regex: |-
                  (?x)
                  (?(DEFINE)
                    (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                    (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                    (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                    (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                  )
                  ^ (?: \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \]
                    | \{ \s*+ ["']?+ (?:tool_names|toolNames) ["']?+ \s*+ : \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \}
                    | \{ [^{}]*? ["']?+ (?:read_only|readOnly) ["']?+ \s*+ : \s*+ (?:True|true) \b [^{}]*+ \}
                    | [\w.]++ \( \s*+ tool_names \s*+ = \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \)
                    | [\w.]++ \( [^()]*? \b read_only \s*+ = \s*+ True \b [^()]*+ \)
                    ) $
      - pattern-not-inside: '{..., server_url: "=~/^https?:[/][/](?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#]|$)/", ...}'
      - pattern-not-inside: '{..., serverUrl: "=~/^https?:[/][/](?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#]|$)/", ...}'
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: '{..., server_url: $U, ...}'
                - pattern: '{..., serverUrl: $U, ...}'
            - metavariable-regex:
                metavariable: $U
                regex: |-
                  ^(?:[fFrRuU]{0,2})?[\"'`]https?://(?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#\"'`$]|$)
    metadata:
      category: security
      subcategory: [audit]
      pack-category: ai-code
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI09 - Human-Agent Trust Exploitation"
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-aisvs:
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-862: Missing Authorization"
      # The setting is certain; whether the server's tools act is judged from allowed_tools,
      # never-filters, and tool names, which can't see what an unlisted server tool does.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [openai, openai-agents, langchainjs, deepagents, mcp, node]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-Security-Corpus/blob/main/corpus/agentic-top10/2026-final/OWASP-Top-10-for-Agentic-Applications-2026-v1.0.pdf
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
        - https://developers.openai.com/api/docs/guides/tools-connectors-mcp
        - https://www.npmjs.com/package/openai/v/7.43.0
        - https://github.com/openai/openai-agents-js/blob/v0.21.0/packages/agents-core/src/tool.ts
        - https://github.com/openai/openai-agents-js/blob/v0.21.0/packages/agents-core/src/utils/mcpApproval.ts
        - https://www.npmjs.com/package/langchain/v/1.5.19
        - https://www.npmjs.com/package/deepagents/v/1.15.1
        - https://www.npmjs.com/package/@azure/ai-agents/v/1.2.0-beta.2
