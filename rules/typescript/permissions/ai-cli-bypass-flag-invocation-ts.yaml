rules:
  - id: ai-cli-bypass-flag-invocation-ts
    # JavaScript/TypeScript twin of ai-cli-bypass-flag-invocation (shell, CI, Makefile,
    # package.json): the same CLIs and flags, here as separate argv elements (spawn,
    # execFile, execa, Bun.spawn) or inside a command string (exec, execSync). Flags are
    # verified against Claude Code 2.1.308, Codex 0.163, Gemini CLI 0.65, Qwen Code 0.26, Copilot
    # CLI 1.0.102, Kiro CLI docs and q chat 1.19.7, Cursor CLI docs, Cline CLI 3.0.73, opencode 1.19.3, and goose
    # 1.55 (2026-10-22).
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      This code starts a coding agent CLI with its approvals or sandbox turned off, so every
      shell command and file edit the model decides on runs at once with this process's full
      access: its files, network, and credentials. Agents launched from code usually work on
      text other people control (a ticket, an issue, a pull request, a log), and a prompt
      injection in that text can then run arbitrary commands. If this only ever runs in a
      disposable container or VM with no secrets, that may be intended; otherwise allowlist the
      tools the task needs (claude --permission-mode dontAsk --allowedTools ..., codex --sandbox
      workspace-write, gemini --approval-mode auto_edit, copilot --allow-tool ... or --sandbox,
      kiro-cli --trust-tools=..., GOOSE_MODE=smart_approve, cline --auto-approve false) or use the vendor SDK with a permission callback.
    pattern-either:
      # --- Claude Code: --dangerously-skip-permissions, --permission-mode bypassPermissions ---
      - patterns:
          - pattern-either:
              # The program: a string (a module constant counts, through constant propagation),
              # an expression that ends in one (which("claude"), X ?? "codex"), or a name that
              # says which CLI it holds (CLAUDE_BIN). In a list, a name or call counts first,
              # second, or anywhere after a known wrapper first, and a string anywhere: a free
              # $PROG anywhere in a list pairs every element with every later one, which times out
              # on lists of a few hundred elements and drops the file's findings.
              - patterns:
                  - pattern-either:
                      - pattern: '[$PROG, ..., $FLAG, ...]'
                      - pattern: '[$W, $PROG, ..., $FLAG, ...]'
                      - pattern: '$F(..., $PROG, ..., $FLAG, ...)'
                      - pattern: '$F(..., $PROG, ..., [..., $FLAG, ...], ...)'
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., $PROG, ..., $ARGS, ...);
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., [..., $PROG, ..., ...$ARGS, ...], ...);
                  # The cheap flag test first, so the program test runs on few pairs.
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^["'`](?:--dangerously-skip-permissions|bypassPermissions|--permission-mode=bypassPermissions)["'`]$
                  - metavariable-pattern:
                      metavariable: $PROG
                      pattern-either:
                        - pattern: '"=~/^(?:.*\/)?(?:claude|@anthropic-ai\/claude-code(?:@.*)?)$/"'
                        - pattern-regex: (?i)^[\w.$]*claude\w*(?:\(\))?$
              # After a known wrapper first (timeout, sudo, env, nice, uv run, ...), a name
              # anywhere: the flag and the program are each found in one pass over the list and
              # joined on it, so a long list never pairs its elements.
              - patterns:
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $FLAG, ...], ...)'
                      - metavariable-regex:
                          metavariable: $FLAG
                          regex: ^["'`](?:--dangerously-skip-permissions|bypassPermissions|--permission-mode=bypassPermissions)["'`]$
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $PROG, ...], ...)'
                      - metavariable-pattern:
                          metavariable: $PROG
                          pattern-regex: (?i)^[\w.$]*claude\w*(?:\(\))?$
              - pattern: '[..., "=~/^(?:.*\/)?(?:claude|@anthropic-ai\/claude-code(?:@.*)?)$/", ..., $FLAG, ...]'
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^["'`](?:--dangerously-skip-permissions|bypassPermissions|--permission-mode=bypassPermissions)["'`]$
          - focus-metavariable: $FLAG
      # --- Codex: --dangerously-bypass-approvals-and-sandbox / --yolo, danger-full-access ---
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: '[$PROG, ..., $FLAG, ...]'
                      - pattern: '[$W, $PROG, ..., $FLAG, ...]'
                      - pattern: '$F(..., $PROG, ..., $FLAG, ...)'
                      - pattern: '$F(..., $PROG, ..., [..., $FLAG, ...], ...)'
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., $PROG, ..., $ARGS, ...);
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., [..., $PROG, ..., ...$ARGS, ...], ...);
                  # The cheap flag test first, so the program test runs on few pairs.
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^["'`](?:--dangerously-bypass-approvals-and-sandbox|--yolo|danger-full-access|--sandbox=danger-full-access|(?:sandbox_mode|default_permissions)\s*=\s*\\?["']?:?danger-full-access\\?["']?)["'`]$
                  - metavariable-pattern:
                      metavariable: $PROG
                      pattern-either:
                        - pattern: '"=~/^(?:.*\/)?(?:codex|@openai\/codex(?:@.*)?)$/"'
                        - pattern-regex: (?i)^[\w.$]*codex\w*(?:\(\))?$
              # After a known wrapper first (timeout, sudo, env, nice, uv run, ...), a name
              # anywhere: the flag and the program are each found in one pass over the list and
              # joined on it, so a long list never pairs its elements.
              - patterns:
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $FLAG, ...], ...)'
                      - metavariable-regex:
                          metavariable: $FLAG
                          regex: ^["'`](?:--dangerously-bypass-approvals-and-sandbox|--yolo|danger-full-access|--sandbox=danger-full-access|(?:sandbox_mode|default_permissions)\s*=\s*\\?["']?:?danger-full-access\\?["']?)["'`]$
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $PROG, ...], ...)'
                      - metavariable-pattern:
                          metavariable: $PROG
                          pattern-regex: (?i)^[\w.$]*codex\w*(?:\(\))?$
              - pattern: '[..., "=~/^(?:.*\/)?(?:codex|@openai\/codex(?:@.*)?)$/", ..., $FLAG, ...]'
          - metavariable-regex:
              metavariable: $FLAG
              # danger-full-access alone is the value of -s/--sandbox; the -c forms set
              # sandbox_mode or default_permissions.
              regex: ^["'`](?:--dangerously-bypass-approvals-and-sandbox|--yolo|danger-full-access|--sandbox=danger-full-access|(?:sandbox_mode|default_permissions)\s*=\s*\\?["']?:?danger-full-access\\?["']?)["'`]$
          - focus-metavariable: $FLAG
      # --- Gemini CLI and Qwen Code (a fork, 0.26): --yolo / -y / --approval-mode yolo, unless
      # --sandbox / -s is on ---
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: '[$PROG, ..., $FLAG, ...]'
                      - pattern: '[$W, $PROG, ..., $FLAG, ...]'
                      - pattern: '$F(..., $PROG, ..., $FLAG, ...)'
                      - pattern: '$F(..., $PROG, ..., [..., $FLAG, ...], ...)'
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., $PROG, ..., $ARGS, ...);
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., [..., $PROG, ..., ...$ARGS, ...], ...);
                  # The cheap flag test first, so the program test runs on few pairs.
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^["'`](?:--yolo|--yolo=true|-y|--approval-mode=yolo)["'`]$
                  - metavariable-pattern:
                      metavariable: $PROG
                      pattern-either:
                        - pattern: '"=~/^(?:.*\/)?(?:gemini|@google\/gemini-cli(?:@.*)?|qwen|@qwen-code\/qwen-code(?:@.*)?)$/"'
                        - pattern-regex: (?i)^[\w.$]*(?:gemini|qwen)\w*(?:\(\))?$
              # After a known wrapper first (timeout, sudo, env, nice, uv run, ...), a name
              # anywhere: the flag and the program are each found in one pass over the list and
              # joined on it, so a long list never pairs its elements.
              - patterns:
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $FLAG, ...], ...)'
                      - metavariable-regex:
                          metavariable: $FLAG
                          regex: ^["'`](?:--yolo|--yolo=true|-y|--approval-mode=yolo)["'`]$
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $PROG, ...], ...)'
                      - metavariable-pattern:
                          metavariable: $PROG
                          pattern-regex: (?i)^[\w.$]*(?:gemini|qwen)\w*(?:\(\))?$
              - pattern: '[..., "=~/^(?:.*\/)?(?:gemini|@google\/gemini-cli(?:@.*)?|qwen|@qwen-code\/qwen-code(?:@.*)?)$/", ..., $FLAG, ...]'
          - pattern-not-inside: '[..., "--sandbox", ...]'
          - pattern-not-inside: '[..., "-s", ...]'
          - pattern-not-inside: '$F(..., "--sandbox", ...)'
          - pattern-not-inside: '$F(..., [..., "--sandbox", ...], ...)'
          - pattern-not-inside: '$F(..., "-s", ...)'
          - pattern-not-inside: '$F(..., [..., "-s", ...], ...)'
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^["'`](?:--yolo|--yolo=true|-y|--approval-mode=yolo)["'`]$
          - focus-metavariable: $FLAG
      # "--approval-mode", "yolo" as two elements.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: '[$PROG, ..., "--approval-mode", $FLAG, ...]'
                      - pattern: '[$W, $PROG, ..., "--approval-mode", $FLAG, ...]'
                      - pattern: '$F(..., $PROG, ..., "--approval-mode", $FLAG, ...)'
                      - pattern: '$F(..., $PROG, ..., [..., "--approval-mode", $FLAG, ...], ...)'
                  # The cheap flag test first, so the program test runs on few pairs.
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^["'`]yolo["'`]$
                  - metavariable-pattern:
                      metavariable: $PROG
                      pattern-either:
                        - pattern: '"=~/^(?:.*\/)?(?:gemini|@google\/gemini-cli(?:@.*)?|qwen|@qwen-code\/qwen-code(?:@.*)?)$/"'
                        - pattern-regex: (?i)^[\w.$]*(?:gemini|qwen)\w*(?:\(\))?$
              # After a known wrapper first (timeout, sudo, env, nice, uv run, ...), a name
              # anywhere: the flag and the program are each found in one pass over the list and
              # joined on it, so a long list never pairs its elements.
              - patterns:
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., "--approval-mode", $FLAG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., "--approval-mode", $FLAG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., "--approval-mode", $FLAG, ...], ...)'
                      - metavariable-regex:
                          metavariable: $FLAG
                          regex: ^["'`]yolo["'`]$
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $PROG, ...], ...)'
                      - metavariable-pattern:
                          metavariable: $PROG
                          pattern-regex: (?i)^[\w.$]*(?:gemini|qwen)\w*(?:\(\))?$
              - pattern: '[..., "=~/^(?:.*\/)?(?:gemini|@google\/gemini-cli(?:@.*)?|qwen|@qwen-code\/qwen-code(?:@.*)?)$/", ..., "--approval-mode", $FLAG, ...]'
          - pattern-not-inside: '[..., "--sandbox", ...]'
          - pattern-not-inside: '[..., "-s", ...]'
          - pattern-not-inside: '$F(..., "--sandbox", ...)'
          - pattern-not-inside: '$F(..., [..., "--sandbox", ...], ...)'
          - pattern-not-inside: '$F(..., "-s", ...)'
          - pattern-not-inside: '$F(..., [..., "-s", ...], ...)'
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^["'`]yolo["'`]$
          - focus-metavariable: $FLAG
      # --- Copilot CLI: --allow-all-tools / --allow-all / --yolo, unless --sandbox is on ---
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: '[$PROG, ..., $FLAG, ...]'
                      - pattern: '[$W, $PROG, ..., $FLAG, ...]'
                      - pattern: '$F(..., $PROG, ..., $FLAG, ...)'
                      - pattern: '$F(..., $PROG, ..., [..., $FLAG, ...], ...)'
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., $PROG, ..., $ARGS, ...);
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., [..., $PROG, ..., ...$ARGS, ...], ...);
                  # The cheap flag test first, so the program test runs on few pairs.
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^["'`](?:--allow-all-tools|--allow-all|--yolo)["'`]$
                  - metavariable-pattern:
                      metavariable: $PROG
                      pattern-either:
                        - pattern: '"=~/^(?:.*\/)?(?:copilot|@github\/copilot(?:@.*)?)$/"'
                        - pattern-regex: (?i)^[\w.$]*copilot\w*(?:\(\))?$
              # After a known wrapper first (timeout, sudo, env, nice, uv run, ...), a name
              # anywhere: the flag and the program are each found in one pass over the list and
              # joined on it, so a long list never pairs its elements.
              - patterns:
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $FLAG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $FLAG, ...], ...)'
                      - metavariable-regex:
                          metavariable: $FLAG
                          regex: ^["'`](?:--allow-all-tools|--allow-all|--yolo)["'`]$
                  - patterns:
                      - pattern-either:
                          - pattern: '["=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...]'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", ..., $PROG, ...)'
                          - pattern: '$F("=~/^(?:.*\/)?(?:sudo|doas|env|exec|nohup|time|command|timeout|xargs|nice|ionice|setsid|stdbuf|unbuffer|xvfb-run|script|uv|uvx|poetry|pipenv|pdm|hatch|npx|bunx|pnpm|yarn)$/", [..., $PROG, ...], ...)'
                      - metavariable-pattern:
                          metavariable: $PROG
                          pattern-regex: (?i)^[\w.$]*copilot\w*(?:\(\))?$
              - pattern: '[..., "=~/^(?:.*\/)?(?:copilot|@github\/copilot(?:@.*)?)$/", ..., $FLAG, ...]'
          - pattern-not-inside: '[..., "--sandbox", ...]'
          - pattern-not-inside: '$F(..., "--sandbox", ...)'
          - pattern-not-inside: '$F(..., [..., "--sandbox", ...], ...)'
          - metavariable-regex:
              metavariable: $FLAG
              regex: ^["'`](?:--allow-all-tools|--allow-all|--yolo)["'`]$
          - focus-metavariable: $FLAG
      # --- opencode 1.19: --auto and its hidden aliases --yolo, --dangerously-skip-permissions ---
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: '[$PROG, ..., $FLAG, ...]'
                      - pattern: '[$W, $PROG, ..., $FLAG, ...]'
                      - pattern: '$F(..., $PROG, ..., $FLAG, ...)'
                      - pattern: '$F(..., $PROG, ..., [..., $FLAG, ...], ...)'
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., $PROG, ..., $ARGS, ...);
                      - pattern: |
                          $ARGS = [..., $FLAG, ...];
                          ...
                          $F(..., [..., $PROG, ..., ...$ARGS, ...], ...);
                  # The cheap flag test first, so the program test runs on few pairs.
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^["'`](?:--auto|--yolo|--dangerously-skip-permissions)["'`]$
                  - metavariable-pattern:
                      metavariable: $PROG
                      pattern-either:
                        - pattern: '"=~/^(?:.*\/)?(?:opencode|opencode-ai(?:@.*)?)$/"'
                        - pattern-regex: (?i)^[\w.$]*opencode\w*(?:\(\))?$
              # After a known wrapper first (timeout, sudo, env, nice, uv run, ...), a name
              # anywhere: the flag and the program are each found in one pass over the list and
              # joined on it, so a long list never pairs its elements.
              - patterns:
