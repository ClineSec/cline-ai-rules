                      regex: ^(?!.*(?i:forbid|block|deny|denied|disallow|ban|reject|refuse|unsafe|dangerous))
          - focus-metavariable: $FLAG
      # --- COPILOT_ALLOW_ALL in a child process environment ---
      - patterns:
          - pattern-either:
              - pattern: '{..., COPILOT_ALLOW_ALL: $V, ...}'
              - pattern: '{..., "COPILOT_ALLOW_ALL": $V, ...}'
              - pattern: '$ENV.COPILOT_ALLOW_ALL = $V'
              - pattern: '$ENV["COPILOT_ALLOW_ALL"] = $V'
          - metavariable-regex:
              metavariable: $V
              regex: ^["'`]\s*(?i:true|1|yes|on|y)\s*["'`]$
      # --- GOOSE_MODE=auto (goose 1.55's autonomous mode) in a child process environment ---
      - patterns:
          - pattern-either:
              - pattern: '{..., GOOSE_MODE: $V, ...}'
              - pattern: '{..., "GOOSE_MODE": $V, ...}'
              - pattern: '$ENV.GOOSE_MODE = $V'
              - pattern: '$ENV["GOOSE_MODE"] = $V'
          - metavariable-regex:
              metavariable: $V
              regex: ^["'`]auto["'`]$
      # --- A whole command line in one string or template literal (exec, execSync, execa's
      # $`...` and command(), shell: true) ---
      - patterns:
          - pattern-regex: |-
              (?x)
              (?<![\w$]) (?<qt>["'`]) [ \t]*
              # Optional path and package runner in front of the program.
              (?: [\w.~/${}-]*/ )?
              (?:
                  (?: (?:npx|bunx|pnpx) (?:[ \t]+(?:-y|--yes))? [ \t]+
                      @(?:anthropic-ai/claude-code|openai/codex|google/gemini-cli|github/copilot)
                      (?:@[\w.^~-]+)? | claude | codex | copilot | gh[ \t]+copilot | kiro-cli | kiro | q[ \t]+chat )
                  (?=[ \t]) (?: (?!\k<qt>) [^\n\\] | \\. )*? [ \t]
                  (?: --dangerously-skip-permissions | --permission-mode[= \t]bypassPermissions
                    | --dangerously-bypass-approvals-and-sandbox | --yolo
                    | (?:-s|--sandbox)[= \t]danger-full-access | --allow-all-tools | --allow-all
                    | --trust-all-tools )
                | (?:gemini|qwen) (?=[ \t]) (?! (?: (?!\k<qt>) [^\n\\] | \\. )*? [ \t] (?:--sandbox|-s) (?=[ \t]|\k<qt>) )
                  (?: (?!\k<qt>) [^\n\\] | \\. )*? [ \t] (?: --yolo | -y | --approval-mode[= \t]yolo )
                | opencode (?=[ \t]) (?: (?!\k<qt>) [^\n\\] | \\. )*? [ \t]
                  (?: --auto | --yolo | --dangerously-skip-permissions )
                | cline (?=[ \t]) (?: (?!\k<qt>) [^\n\\] | \\. )*? [ \t]
                  (?: --yolo | -y | --auto-approve[= \t]true )
                | cursor-agent (?=[ \t]) (?: (?!\k<qt>) [^\n\\] | \\. )*? [ \t]
                  (?: --force | -f | --yolo | --sandbox[= \t]disabled )
              )
              (?= [ \t;&|] | \k<qt> )
          # Not in a // line comment or a /* */ block comment line.
          - pattern-not-regex: (?m)^[ \t]*(?://|/?\*)[^\n]*
