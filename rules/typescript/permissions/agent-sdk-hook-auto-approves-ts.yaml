          # A const arrow function defined earlier in the file (typed `: HookCallback` or not), that
          # returns an allow object kept in a const, with no `if` other than the hook_event_name
          # guard.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $C = <... {..., permissionDecision: "allow", ...} ...>;
                      ...
                  - pattern-inside: |
                      const $C: $CT = <... {..., permissionDecision: "allow", ...} ...>;
                      ...
                  - pattern-inside: |
