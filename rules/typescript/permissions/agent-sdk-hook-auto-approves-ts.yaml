                              )
                              ^ (?! (?&safe) $ ) [\w-]+ $
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: |-
                    (?sm)^(?!.*(?:\bif\s*+\((?![^\n]*hook_event_name)(?![^\n]*tool\w*\s*+===?\s*+["'`])(?!\s*+\[[^\]\n]*\]\.includes\()|\b(?:throw|switch|case)\b|\s\?\s|["'`](?:deny|ask|block|defer)["'`]|\b\w*(?i:check|verify|validate|enforce|ensure|guard|authori[sz]e|require|policy|reject|forbid|permit)\w*\s*+\())
          # A const arrow function defined earlier in the file (typed `: HookCallback` or not). It
          # grants permission outside any `if` (an early `return {}` for another event or named tools
          # leaves every other tool approved), or inside `if (tool_name === 'Bash')` and the like,
          # which is the same as a matcher on that tool; and nothing else in it could decide otherwise
          # (no other `if`, ternary, switch, throw, other decision, or a call that reads as a check).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $CB = $FUNC;
                      ...
                  - pattern-inside: |
