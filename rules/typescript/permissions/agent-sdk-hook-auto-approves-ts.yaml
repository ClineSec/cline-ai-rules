rules:
  - id: agent-sdk-hook-auto-approves-ts
    # Generated by scripts/gen_agent_hooks.py, which holds the read-only tool list, command
    # test, and `if` filter test shared by the hook auto-approval rules, and the SDK, client,
    # and docs versions they were checked against. Edit the script and run scripts/build.py;
    # build.py --check fails if this file drifts.
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      This Claude Agent SDK hook approves every tool call it is registered for: the callback
      returns `permissionDecision: 'allow'` (or a PermissionRequest `behavior: 'allow'`, or the
      legacy `decision: 'approve'`) without checking anything, and its matcher covers every tool
      or a tool that runs commands, writes files, or reaches the network. A hook's allow skips
      the permission prompt, `allowedTools`, and the `canUseTool` callback, so for those tools
      the session acts as if it ran in `bypassPermissions` mode; only deny and ask rules still
      apply. A prompt injection in any file, issue, web page, or tool result the agent reads can
      then run commands or change files with this process's credentials. Approve only calls the
      hook has checked (a read-only tool, an allowlisted command, a path inside the workspace),
      return `{}` to leave the rest to the normal permission flow, and deny or ask on anything
      it can't verify.
    # Tests register approving hooks on purpose against a mocked or throwaway session, so
    # test files are skipped, as in agent-sdk-bypass-permissions. OpenGrep's own ignore list
    # skips only test/ and tests/.
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
        - "*.test.js"
        - "*.test.mjs"
        - "*.spec.ts"
        - "*.spec.tsx"
        - "*.spec.js"
        - "__tests__/"
        - "test/"
        - "tests/"
        - "e2e/"
        - "e2e-tests/"
    patterns:
      - pattern-either:
          # An arrow function written in the hooks array. It grants permission outside any `if` (an
          # early `return {}` for another event or named tools leaves every other tool approved), or
          # inside `if (tool_name === 'Bash')` and the like, which is the same as a matcher on that
          # tool; and nothing else in it could decide otherwise (no other `if`, ternary, switch,
          # throw, other decision, or a call that reads as a check).
          - patterns:
              - pattern-inside: '{..., hooks: [..., $FUNC, ...], ...}'
              - pattern: $FUNC
              - metavariable-pattern:
                  metavariable: $FUNC
                  pattern-either:
                    - pattern: '($...P) => $BODY'
                    - pattern: 'async ($...P) => $BODY'
              - metavariable-pattern:
                  metavariable: $FUNC
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '{..., permissionDecision: "allow", ...}'
                            - pattern: '{..., decision: {..., behavior: "allow", ...}, ...}'
                            - pattern: '{..., decision: "approve", ...}'
                            - pattern: return $F(..., "allow", ...);
                            - pattern: '($...P) => $F(..., "allow", ...)'
                            - pattern: 'async ($...P) => $F(..., "allow", ...)'
                        - pattern-not-inside: if ($C) $S
                    - patterns:
                        - pattern-either:
                            - pattern-inside: if ($TOOL === "$TN") $S
                            - pattern-inside: if ($TOOL == "$TN") $S
                            - pattern-inside: if ([..., "$TN", ...].includes($TOOL)) $S
                        - pattern-either:
                            - pattern: '{..., permissionDecision: "allow", ...}'
                            - pattern: '{..., decision: {..., behavior: "allow", ...}, ...}'
                            - pattern: '{..., decision: "approve", ...}'
                            - pattern: return $F(..., "allow", ...);
                        - metavariable-regex:
                            metavariable: $TOOL
                            regex: (?i).*tool
                        - metavariable-regex:
                            metavariable: $TN
                            regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                              )
                              ^ (?! (?&safe) $ ) [\w-]+ $
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: |-
                    (?sm)^(?!.*(?:\bif\s*+\((?![^\n]*hook_event_name)(?![^\n]*tool\w*\s*+===?\s*+["'`])(?!\s*+\[[^\]\n]*\]\.includes\()|\b(?:throw|switch|case)\b|\s\?\s|["'`](?:deny|ask|block|defer)["'`]|\b\w*(?i:check|verify|validate|enforce|ensure|guard|authori[sz]e|require|policy|reject|forbid|permit)\w*\s*+\())
          # An arrow function written in the hooks array, in a list kept in a const and passed as
          # hooks:. It grants permission outside any `if` (an early `return {}` for another event or
          # named tools leaves every other tool approved), or inside `if (tool_name === 'Bash')` and
          # the like, which is the same as a matcher on that tool; and nothing else in it could decide
          # otherwise (no other `if`, ternary, switch, throw, other decision, or a call that reads as
          # a check).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $L = [..., $FUNC, ...];
                      ...
                  - pattern-inside: |
                      const $L: $LT = [..., $FUNC, ...];
                      ...
              - pattern-inside: '{..., hooks: $L, ...}'
              - pattern: $L
              - metavariable-pattern:
                  metavariable: $FUNC
                  pattern-either:
                    - pattern: '($...P) => $BODY'
                    - pattern: 'async ($...P) => $BODY'
              - metavariable-pattern:
                  metavariable: $FUNC
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '{..., permissionDecision: "allow", ...}'
                            - pattern: '{..., decision: {..., behavior: "allow", ...}, ...}'
                            - pattern: '{..., decision: "approve", ...}'
                            - pattern: return $F(..., "allow", ...);
                            - pattern: '($...P) => $F(..., "allow", ...)'
                            - pattern: 'async ($...P) => $F(..., "allow", ...)'
                        - pattern-not-inside: if ($C) $S
                    - patterns:
                        - pattern-either:
                            - pattern-inside: if ($TOOL === "$TN") $S
                            - pattern-inside: if ($TOOL == "$TN") $S
                            - pattern-inside: if ([..., "$TN", ...].includes($TOOL)) $S
                        - pattern-either:
                            - pattern: '{..., permissionDecision: "allow", ...}'
                            - pattern: '{..., decision: {..., behavior: "allow", ...}, ...}'
                            - pattern: '{..., decision: "approve", ...}'
                            - pattern: return $F(..., "allow", ...);
                        - metavariable-regex:
                            metavariable: $TOOL
                            regex: (?i).*tool
                        - metavariable-regex:
