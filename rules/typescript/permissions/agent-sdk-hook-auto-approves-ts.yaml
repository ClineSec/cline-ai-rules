                            - pattern: '{..., decision: {..., behavior: "allow", ...}, ...}'
                            - pattern: '{..., decision: "approve", ...}'
                            - pattern: return $F(..., "allow", ...);
                            - pattern: '($...P) => $F(..., "allow", ...)'
                            - pattern: 'async ($...P) => $F(..., "allow", ...)'
                        - pattern-not-inside: if ($C) $S
