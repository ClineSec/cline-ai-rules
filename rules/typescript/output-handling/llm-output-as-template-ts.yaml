rules:
  - id: llm-output-as-template-ts
    # JavaScript/TypeScript twin of llm-output-as-template. Shared blocks (build.py
    # SHARED_BLOCKS), so edit them together: the pattern-sources and pattern-propagators are
    # identical to llm-output-to-code-execution-ts, llm-output-to-vm2-sandbox, and
    # llm-output-to-sql-ts (the first 21 sources and first 2 propagators also to
    # llm-output-to-html-ts), and the 6 pattern-sanitizers are the first 6 of those rules.
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Model output is compiled as a template here, so the model's text becomes template code
      rather than data. Anyone who can influence the prompt, directly or through a web page,
      document, or tool result the model reads, can make it write template syntax that runs
      on your server: EJS, lodash and Underscore `template`, Pug, doT, and Eta compile
      templates into JavaScript functions with no sandbox, Nunjucks says it is not safe for
      user-defined templates, and Handlebars says not to rely on it as a sandbox
      (server-side template injection). Keep the template fixed and pass the model's text in
      as data (`Handlebars.compile(FIXED)({ reply: text })`), or use a logic-less renderer
      such as Mustache for templates the model writes.
    mode: taint
    pattern-sources:
      # Vercel AI SDK (server): the result object and every field of it (`text`, `steps`,
      # `textStream`, `content`, `object`).
      - pattern: generateText(...)
      - pattern: streamText(...)
      - pattern: generateObject(...)
      - pattern: streamObject(...)
      # AI SDK agents: `agent.generate()` / `agent.stream()` on a ToolLoopAgent built in this
      # file, or on a receiver named like an agent.
      - patterns:
          - pattern-inside: |
              $AGENT = new $CLASS(...);
              ...
          - metavariable-regex:
              metavariable: $CLASS
              regex: ^(?:ToolLoopAgent|Experimental_Agent)$
          - pattern-either:
              - pattern: $AGENT.generate(...)
              - pattern: $AGENT.stream(...)
      - patterns:
          - pattern-either:
              - pattern: $AGENT.generate(...)
              - pattern: $AGENT.stream(...)
          - metavariable-regex:
              metavariable: $AGENT
              regex: (?i)^(?:[\w$]+\.)*[\w$]*agent$
      # AI SDK (client): messages, completions, and streamed objects from the React hooks.
      - pattern: useChat(...)
      - pattern: useCompletion(...)
      - pattern: useObject(...)
      - pattern: experimental_useObject(...)
      # A value typed as an AI SDK chat message or text part (a message component's props).
      - pattern: '($M : UIMessage)'
      - pattern: '($M : TextUIPart)'
      - pattern: '($M : UIMessage[])'
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $F({..., $P, ...}: $TY, ...) {...}'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => $BODY'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => {...}'
          - metavariable-regex:
              metavariable: $TY
              regex: (?s)^\{.*:\s*(?:Array<|ReadonlyArray<)?(?:UIMessage|TextUIPart)\b
          - pattern: $P
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      type $TY = $DEF;
                      ...
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: (?s)^\{.*:\s*(?:Array<|ReadonlyArray<)?(?:UIMessage|TextUIPart)\b
              - patterns:
                  - pattern-inside: |
                      interface $TY { $K: $DEF }
                      ...
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: ^(?:Array<|ReadonlyArray<)?(?:UIMessage|TextUIPart)\b
          - pattern-either:
              - pattern-inside: 'function $F({..., $P, ...}: $TY, ...) {...}'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => $BODY'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => {...}'
          - pattern: $P
      # OpenAI Node: Chat Completions (also legacy Completions) and Responses.
      - patterns:
          - pattern: $CLIENT.completions.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:create|parse|stream|runTools)$
      - patterns:
          - pattern: $CLIENT.responses.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:create|parse|stream|retrieve)$
      # Anthropic TypeScript SDK (also `client.beta.messages`).
      - patterns:
          - pattern: $CLIENT.messages.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:create|parse|stream|toolRunner)$
      # Google Gen AI SDK.
      - patterns:
          - pattern: $CLIENT.models.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:generateContent|generateContentStream)$
      - patterns:
          - pattern-inside: |
              $CHAT = $CLIENT.chats.create(...);
              ...
          - pattern-either:
              - pattern: $CHAT.sendMessage(...)
              - pattern: $CHAT.sendMessageStream(...)
      # LangChain.js / LangGraph.js runnables. `.invoke` is a common method name (Electron's
      # ipcRenderer.invoke), so require a LangChain import in the file or a receiver named like
      # a model, chain, agent, or graph.
      - patterns:
          - pattern-either:
              - pattern: $RUNNABLE.invoke(...)
              - pattern: $RUNNABLE.stream(...)
              - pattern: $RUNNABLE.batch(...)
          - pattern-either:
              - pattern-inside: |
                  import $IMPORT from "=~/^@?langchain(?:\/|$)/";
                  ...
              - pattern-inside: |
                  import {...} from "=~/^@?langchain(?:\/|$)/";
                  ...
              - patterns:
                  - pattern: $RUNNABLE.invoke(...)
                  - metavariable-regex:
                      metavariable: $RUNNABLE
                      regex: (?i)^(?:[\w$]+\.)*[\w$]*(?:llm|model|chain|agent|graph|runnable)$
      # Agent SDKs: the messages of the Claude Agent SDK's query() (`message.result`) and the
      # result of the OpenAI Agents SDK's run() and Runner.run() (`result.finalOutput`). Gated
      # on the import, since query and run are common names.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      import { $NAME } from "$MOD";
                      ...
                  - pattern: $NAME(...)
              - patterns:
                  - pattern-inside: |
                      import { $NAME as $ALIAS } from "$MOD";
                      ...
                  - pattern: $ALIAS(...)
          - metavariable-comparison:
              comparison: >-
                (str($MOD) == "@anthropic-ai/claude-agent-sdk" and str($NAME) == "query")
                or (re.match("^@openai/agents(?:-core)?$", str($MOD)) and str($NAME) == "run")
      - patterns:
          - pattern-inside: |
              import {...} from "=~/^@openai\/agents(?:-core)?$/";
              ...
          - pattern-inside: |
              $RUNNER = new Runner(...);
              ...
          - pattern: $RUNNER.run(...)
    pattern-propagators:
      # Array callbacks over tainted messages (`messages.map((m) => ...)`, then
      # `m.parts.map((p) => ...)`) taint the callback's element parameter.
      - patterns:
          - pattern-either:
              - pattern: $XS.$METHOD(($X, ...) => $BODY)
              - pattern: $XS.$METHOD(($X, ...) => {...})
              - pattern: $XS.$METHOD(function ($X, ...) {...})
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|forEach|filter|find|findLast|reduce)$
        from: $XS
        to: $X
      # Stream event listeners: `stream.on("text", (delta, snapshot) => ...)` (Anthropic) and
      # `stream.on("content", ...)` (OpenAI).
      - patterns:
          - pattern-either:
              - pattern: $XS.on($EVENT, ($X, ...) => $BODY)
              - pattern: $XS.on($EVENT, ($X, ...) => {...})
              - pattern: $XS.on($EVENT, ($A, $X, ...) => $BODY)
              - pattern: $XS.on($EVENT, ($A, $X, ...) => {...})
        from: $XS
        to: $X
      # In --taint-intrafile mode, OpenGrep drops taint from the result of an array method that
      # takes a callback (`const part = message.parts.find((p) => p.type === "text")`); carry it
      # when the result is assigned. Default mode doesn't need this.
      - patterns:
          - pattern: $R = $XS.$METHOD($CALLBACK)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:find|findLast|filter)$
        from: $XS
        to: $R
    pattern-sanitizers:
      # Values that can't carry code: a lookup in a constant table (`RECIPES[choice]`,
      # `COMMANDS.get(choice)`), which is the allowlist dispatch the message recommends, and
      # metadata fields (counts, IDs, roles, finish reasons).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $TABLE[$KEY]
                      - pattern: $TABLE.get($KEY)
                  - metavariable-regex:
                      metavariable: $TABLE
                      regex: ^(?:[\w$]+\.)*[A-Z][A-Z0-9_]*$
              - patterns:
                  - pattern: $OBJ.$FIELD
                  - metavariable-regex:
                      metavariable: $FIELD
                      regex: ^(usage|id|role|type|model|created|length|status|finish_reason|finishReason|stop_reason|stopReason|totalUsage|duration_ms|num_turns|total_cost_usd)$
      # An allowlist check before use: /^...$/.test(value).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # An allowlist membership check before use: ALLOWED.has(value), ALLOWED.includes(value).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.has($X)
              - pattern: $ALLOWED.includes($X)
          - focus-metavariable: $X
      - exact: true
        pattern: Number(...)
      - exact: true
        pattern: parseInt(...)
      - exact: true
        pattern: parseFloat(...)
    pattern-sinks:
      # The template source argument of a module-level compile or render call, on the module
      # imported or required whole (`import Handlebars from "handlebars"`, `import * as ejs`,
      # `const _ = require("lodash")`) or as a named import. Checked 2026-10-23: handlebars
      # 4.7.10 compile / precompile; lodash 4.18.1 and underscore 1.13.8 template (lodash:
      # "`_.template` is insecure and should not be used"); ejs 7.0.2 render / compile; nunjucks
      # 3.2.4 renderString / compile; pug 3.0.4 compile / render / compileClient /
      # compileClientWithDependenciesTracked; dot 1.1.3 template / compile; eta 2.x render /
      # renderAsync / compile. renderFile and compileFile take a path and are left out.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import $LIB from "$MOD";
                          ...
                      - pattern-inside: |
                          import * as $LIB from "$MOD";
                          ...
                      - pattern-inside: |
                          $LIB = require("$MOD");
                          ...
                  - pattern-inside: $LIB.$FN($SRC, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { $FN } from "$MOD";
                          ...
                      - pattern-inside: |
                          const { $FN } = require("$MOD");
                          ...
                  - pattern-inside: $FN($SRC, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { $FN as $ALIAS } from "$MOD";
                          ...
                      - pattern-inside: |
                          const { $FN: $ALIAS } = require("$MOD");
                          ...
                  - pattern-inside: $ALIAS($SRC, ...)
          - metavariable-comparison:
              comparison: >-
                (str($MOD) == "handlebars" and re.match("^(?:compile|precompile)$", str($FN)))
                or (re.match("^(?:lodash|lodash-es|underscore)$", str($MOD)) and str($FN) == "template")
                or (str($MOD) == "ejs" and re.match("^(?:render|compile)$", str($FN)))
                or (str($MOD) == "nunjucks" and re.match("^(?:renderString|compile)$", str($FN)))
                or (str($MOD) == "pug" and re.match("^(?:compile|render|compileClient|compileClientWithDependenciesTracked)$", str($FN)))
                or (str($MOD) == "dot" and re.match("^(?:template|compile)$", str($FN)))
                or (str($MOD) == "eta" and re.match("^(?:render|renderAsync|compile)$", str($FN)))
          - pattern: $SRC
      # The template function packages: lodash/template, lodash-es/template, lodash.template.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $TEMPLATE from "$MOD";
                  ...
              - pattern-inside: |
                  $TEMPLATE = require("$MOD");
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(?:lodash(?:-es)?/template|lodash\.template)$
          - pattern-inside: $TEMPLATE($SRC, ...)
          - pattern: $SRC
      # new nunjucks.Template(src), or Template imported by name.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import $LIB from "nunjucks";
                          ...
                      - pattern-inside: |
                          import * as $LIB from "nunjucks";
                          ...
                      - pattern-inside: |
                          $LIB = require("nunjucks");
                          ...
                  - pattern-inside: new $LIB.Template($SRC, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { Template } from "nunjucks";
                          ...
                      - pattern-inside: |
                          const { Template } = require("nunjucks");
                          ...
                  - pattern-inside: new Template($SRC, ...)
          - pattern: $SRC
      # Engine objects: a nunjucks Environment (`new Environment(...)`,
      # `nunjucks.configure(...)`) and its renderString, an Eta 3/4 instance (`new Eta(...)`)
      # and its renderString / renderStringAsync / compile, and a Handlebars instance from
      # `Handlebars.create()`.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import $LIB from "$MOD";
                          ...
                      - pattern-inside: |
                          import * as $LIB from "$MOD";
                          ...
                      - pattern-inside: |
                          $LIB = require("$MOD");
                          ...
                  - pattern-either:
                      - pattern-inside: |
                          $OBJ = new $LIB.$CLASS(...);
                          ...
                      - pattern-inside: |
                          $OBJ = $LIB.$CLASS(...);
                          ...
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { $CLASS } from "$MOD";
                          ...
                      - pattern-inside: |
                          const { $CLASS } = require("$MOD");
                          ...
                  - pattern-inside: |
                      $OBJ = new $CLASS(...);
                      ...
          - pattern-inside: $OBJ.$FN($SRC, ...)
          - metavariable-comparison:
              comparison: >-
                (str($MOD) == "nunjucks" and re.match("^(?:Environment|configure)$", str($CLASS)) and str($FN) == "renderString")
                or (str($MOD) == "eta" and str($CLASS) == "Eta" and re.match("^(?:renderString|renderStringAsync|compile)$", str($FN)))
                or (str($MOD) == "handlebars" and str($CLASS) == "create" and re.match("^(?:compile|precompile)$", str($FN)))
          - pattern: $SRC
      # An engine instance kept elsewhere (a class field, another module) in a file that
      # imports the engine or a module named like a templating helper:
      # `this.eta.renderString(src, data)`, `import { env } from "./template-engine"` then
      # `env.renderString(src, ctx)`.
      - patterns:
          - pattern-either:
              - pattern-inside: $OBJ.renderString($SRC, ...)
              - pattern-inside: $OBJ.renderStringAsync($SRC, ...)
          # A module-name string regex, not "$MOD" plus metavariable-regex: an unconstrained
          # import region binds only the file's first import.
          - pattern-either:
              - pattern-inside: |
                  import $LIB from "=~/(?i)^(?:nunjucks|eta)$|(?:^|[\/.-])(?:templat\w*|nunjucks\w*|eta|engine)(?:$|[\/.-])/";
                  ...
              - pattern-inside: |
                  import {...} from "=~/(?i)^(?:nunjucks|eta)$|(?:^|[\/.-])(?:templat\w*|nunjucks\w*|eta|engine)(?:$|[\/.-])/";
                  ...
              - pattern-inside: |
                  import * as $LIB from "=~/(?i)^(?:nunjucks|eta)$|(?:^|[\/.-])(?:templat\w*|nunjucks\w*|eta|engine)(?:$|[\/.-])/";
                  ...
          - pattern: $SRC
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM10:2026 - Improper Output Handling"
        - "LLM05:2025 - Improper Output Handling"
      owasp-agentic:
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-aisvs:
        - "v1.01-C7.1.1 - Output Format Enforcement"
      mitre-atlas:
        - "AML.T0051 - LLM Prompt Injection"
        - "AML.T0050 - Command and Scripting Interpreter"
      cwe:
        - "CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine"
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [vercel-ai-sdk, openai, anthropic, google-genai, langchain, claude-agent-sdk, openai-agents, handlebars, lodash, underscore, ejs, nunjucks, pug, dot, eta]
      # API shapes checked 2026-10-23 against handlebars 4.7.10 (security guide: "Do not rely
      # on Handlebars alone as a security sandbox"; JavaScript-injection advisories through
      # compile in 2026), lodash 4.18.1 (template builds a Function), underscore 1.13.8, ejs
      # 7.0.2 (SECURITY.md: giving users the render method is "inherently un-secure"),
      # nunjucks 3.2.4 ("not safe to run user-defined templates"), pug 3.0.4, dot 1.1.3, and
      # eta 4.6.0 (new Eta().renderString / compile; module-level render in 2.x). Mustache
      # is logic-less, and @langchain/core 1.3.0 prompt templates ("f-string" and "mustache")
      # only look up names, so neither is reported.
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM10_ImproperOutputHandling.md
        - https://cwe.mitre.org/data/definitions/1336.html
        - https://handlebarsjs.com/guide/security.html
        - https://mozilla.github.io/nunjucks/api.html#user-defined-templates-warning
        - https://github.com/mde/ejs/blob/main/SECURITY.md
        - https://github.com/lodash/lodash/blob/main/threat-model.md
