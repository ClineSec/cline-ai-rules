<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Answer preview</title>
  <link rel="stylesheet" href="https://cdn.example.com/npm/katex@0.19.0/dist/katex.min.css">
  <script src="https://cdn.example.com/npm/katex@0.19.0/dist/katex.min.js"></script>
  <script src="https://cdn.example.com/npm/katex@0.19.0/dist/contrib/auto-render.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.example.com/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: true,
      // ruleid: mermaid-or-katex-unsafe-config-markup
      securityLevel: "loose",
    });
  </script>
</head>
<body>
  <main id="answer"></main>
  <!-- A sample diagram in the help text: init directives can't change securityLevel. -->
  <pre class="mermaid">
    <!-- ok: mermaid-or-katex-unsafe-config-markup -->
    %%{init: {"theme": "dark", "securityLevel": "loose"}}%%
    graph TD; A-->B
  </pre>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderMathInElement(document.getElementById("answer"), {
        delimiters: [{ left: "$$", right: "$$", display: true }],
        // ruleid: mermaid-or-katex-unsafe-config-markup
        trust: true,
      });
      // ruleid: mermaid-or-katex-unsafe-config-markup
      katex.render(window.formula, document.getElementById("formula"), { trust: (ctx) => ctx.command !== "\\includegraphics" });
      // ok: mermaid-or-katex-unsafe-config-markup
      katex.render(window.caption, document.getElementById("caption"), { trust: (ctx) => ctx.command === "\\href" && ctx.protocol === "https" });
      // ok: mermaid-or-katex-unsafe-config-markup
      katex.render(window.label, document.getElementById("label"), { throwOnError: false, trust: false });
      // ok: mermaid-or-katex-unsafe-config-markup
      // mermaid.initialize({ startOnLoad: true, securityLevel: "loose" }) was the old setup.
    });
  </script>
  <!-- ok: mermaid-or-katex-unsafe-config-markup -->
  <p>Diagrams render with securityLevel: "strict" here.</p>
</body>
</html>
