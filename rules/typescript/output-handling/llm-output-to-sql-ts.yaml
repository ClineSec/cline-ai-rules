rules:
  - id: llm-output-to-sql-ts
    # JavaScript/TypeScript twin of llm-output-to-sql. Shared blocks (build.py SHARED_BLOCKS),
    # so edit them together: the pattern-sources and pattern-propagators are identical to
    # llm-output-to-code-execution-ts and llm-output-to-vm2-sandbox (the first 21 sources and
    # both propagators also to llm-output-to-html-ts), the first 6 pattern-sanitizers are
    # shared with those two rules, and the pattern-sinks and last 6 sanitizers with
    # mcp-tool-arg-to-sql-ts and agent-tool-arg-to-sql-ts.
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Model output is run as SQL here, or spliced into SQL text. Completions are untrusted
      input: anyone who can influence the prompt, directly or through a document, web page,
      ticket, or tool result the model reads, can choose the statement, and it runs with this
      connection's privileges (read other users' or tenants' rows, change or delete data).
      Keep the SQL fixed and pass model-supplied values as parameters
      (`pool.query("... WHERE id = $1", [value])`, Prisma's tagged `$queryRaw`, Drizzle's
      `sql` template, knex bindings); pick identifiers from a constant allowlist
      (`COLUMNS[choice]`). If the feature is text-to-SQL, a read-only role and an LLM query
      checker reduce the damage but don't remove it: run generated SQL on a dedicated
      read-only connection limited to the views it may read, with row-level security, a
      statement timeout, and a row limit, and parse it (for example with node-sql-parser) to
      reject anything but one SELECT over allowed tables.
    mode: taint
    pattern-sources:
      # Vercel AI SDK (server): the result object and every field of it (`text`, `steps`,
      # `textStream`, `content`, `object`).
      - pattern: generateText(...)
      - pattern: streamText(...)
      - pattern: generateObject(...)
      - pattern: streamObject(...)
      # AI SDK agents: `agent.generate()` / `agent.stream()` on a ToolLoopAgent built in this
      # file, or on a receiver named like an agent.
      - patterns:
          - pattern-inside: |
              $AGENT = new $CLASS(...);
              ...
          - metavariable-regex:
              metavariable: $CLASS
              regex: ^(?:ToolLoopAgent|Experimental_Agent)$
          - pattern-either:
              - pattern: $AGENT.generate(...)
              - pattern: $AGENT.stream(...)
      - patterns:
          - pattern-either:
              - pattern: $AGENT.generate(...)
              - pattern: $AGENT.stream(...)
          - metavariable-regex:
              metavariable: $AGENT
              regex: (?i)^(?:[\w$]+\.)*[\w$]*agent$
      # AI SDK (client): messages, completions, and streamed objects from the React hooks.
      - pattern: useChat(...)
      - pattern: useCompletion(...)
      - pattern: useObject(...)
      - pattern: experimental_useObject(...)
      # A value typed as an AI SDK chat message or text part (a message component's props).
      - pattern: '($M : UIMessage)'
      - pattern: '($M : TextUIPart)'
      - pattern: '($M : UIMessage[])'
      - patterns:
          - pattern-either:
              - pattern-inside: 'function $F({..., $P, ...}: $TY, ...) {...}'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => $BODY'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => {...}'
          - metavariable-regex:
              metavariable: $TY
              regex: (?s)^\{.*:\s*(?:Array<|ReadonlyArray<)?(?:UIMessage|TextUIPart)\b
          - pattern: $P
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      type $TY = $DEF;
                      ...
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: (?s)^\{.*:\s*(?:Array<|ReadonlyArray<)?(?:UIMessage|TextUIPart)\b
              - patterns:
                  - pattern-inside: |
                      interface $TY { $K: $DEF }
                      ...
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: ^(?:Array<|ReadonlyArray<)?(?:UIMessage|TextUIPart)\b
          - pattern-either:
              - pattern-inside: 'function $F({..., $P, ...}: $TY, ...) {...}'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => $BODY'
              - pattern-inside: '({..., $P, ...}: $TY, ...) => {...}'
          - pattern: $P
      # OpenAI Node: Chat Completions (also legacy Completions) and Responses.
      - patterns:
          - pattern: $CLIENT.completions.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:create|parse|stream|runTools)$
      - patterns:
          - pattern: $CLIENT.responses.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:create|parse|stream|retrieve)$
      # Anthropic TypeScript SDK (also `client.beta.messages`).
      - patterns:
          - pattern: $CLIENT.messages.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:create|parse|stream|toolRunner)$
      # Google Gen AI SDK.
      - patterns:
          - pattern: $CLIENT.models.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:generateContent|generateContentStream)$
      - patterns:
          - pattern-inside: |
              $CHAT = $CLIENT.chats.create(...);
              ...
          - pattern-either:
              - pattern: $CHAT.sendMessage(...)
              - pattern: $CHAT.sendMessageStream(...)
      # LangChain.js / LangGraph.js runnables. `.invoke` is a common method name (Electron's
      # ipcRenderer.invoke), so require a LangChain import in the file or a receiver named like
      # a model, chain, agent, or graph.
      - patterns:
          - pattern-either:
              - pattern: $RUNNABLE.invoke(...)
              - pattern: $RUNNABLE.stream(...)
              - pattern: $RUNNABLE.batch(...)
          - pattern-either:
              - pattern-inside: |
                  import $IMPORT from "=~/^@?langchain(?:\/|$)/";
                  ...
              - pattern-inside: |
                  import {...} from "=~/^@?langchain(?:\/|$)/";
                  ...
              - patterns:
                  - pattern: $RUNNABLE.invoke(...)
                  - metavariable-regex:
                      metavariable: $RUNNABLE
                      regex: (?i)^(?:[\w$]+\.)*[\w$]*(?:llm|model|chain|agent|graph|runnable)$
      # Agent SDKs: the messages of the Claude Agent SDK's query() (`message.result`) and the
      # result of the OpenAI Agents SDK's run() and Runner.run() (`result.finalOutput`). Gated
      # on the import, since query and run are common names.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      import { $NAME } from "$MOD";
                      ...
                  - pattern: $NAME(...)
              - patterns:
                  - pattern-inside: |
                      import { $NAME as $ALIAS } from "$MOD";
                      ...
                  - pattern: $ALIAS(...)
          - metavariable-comparison:
              comparison: >-
                (str($MOD) == "@anthropic-ai/claude-agent-sdk" and str($NAME) == "query")
                or (re.match("^@openai/agents(?:-core)?$", str($MOD)) and str($NAME) == "run")
      - patterns:
          - pattern-inside: |
              import {...} from "=~/^@openai\/agents(?:-core)?$/";
              ...
          - pattern-inside: |
              $RUNNER = new Runner(...);
              ...
          - pattern: $RUNNER.run(...)
    pattern-propagators:
      # Array callbacks over tainted messages (`messages.map((m) => ...)`, then
      # `m.parts.map((p) => ...)`) taint the callback's element parameter.
      - patterns:
          - pattern-either:
              - pattern: $XS.$METHOD(($X, ...) => $BODY)
              - pattern: $XS.$METHOD(($X, ...) => {...})
              - pattern: $XS.$METHOD(function ($X, ...) {...})
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|forEach|filter|find|findLast|reduce)$
        from: $XS
        to: $X
      # Stream event listeners: `stream.on("text", (delta, snapshot) => ...)` (Anthropic) and
      # `stream.on("content", ...)` (OpenAI).
      - patterns:
          - pattern-either:
              - pattern: $XS.on($EVENT, ($X, ...) => $BODY)
              - pattern: $XS.on($EVENT, ($X, ...) => {...})
              - pattern: $XS.on($EVENT, ($A, $X, ...) => $BODY)
              - pattern: $XS.on($EVENT, ($A, $X, ...) => {...})
        from: $XS
        to: $X
      # In --taint-intrafile mode, OpenGrep drops taint from the result of an array method that
      # takes a callback (`const part = message.parts.find((p) => p.type === "text")`); carry it
      # when the result is assigned. Default mode doesn't need this.
      - patterns:
          - pattern: $R = $XS.$METHOD($CALLBACK)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:find|findLast|filter)$
        from: $XS
        to: $R
    pattern-sanitizers:
      # Values that can't carry code: a lookup in a constant table (`RECIPES[choice]`,
      # `COMMANDS.get(choice)`), which is the allowlist dispatch the message recommends, and
      # metadata fields (counts, IDs, roles, finish reasons).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $TABLE[$KEY]
                      - pattern: $TABLE.get($KEY)
                  - metavariable-regex:
                      metavariable: $TABLE
                      regex: ^(?:[\w$]+\.)*[A-Z][A-Z0-9_]*$
              - patterns:
                  - pattern: $OBJ.$FIELD
                  - metavariable-regex:
                      metavariable: $FIELD
                      regex: ^(usage|id|role|type|model|created|length|status|finish_reason|finishReason|stop_reason|stopReason|totalUsage|duration_ms|num_turns|total_cost_usd)$
      # This sanitizer and the rest are shared with mcp-tool-arg-to-sql-ts and
      # agent-tool-arg-to-sql-ts (build.py SHARED_BLOCKS "SQL sanitizers (TypeScript)").
      # An allowlist check before use: /^...$/.test(value).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # An allowlist membership check before use: ALLOWED.has(value), ALLOWED.includes(value).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.has($X)
              - pattern: $ALLOWED.includes($X)
          - focus-metavariable: $X
      - exact: true
        pattern: Number(...)
      - exact: true
        pattern: parseInt(...)
      - exact: true
        pattern: parseFloat(...)
      # The drivers' own quoting: mysql / mysql2 / sqlstring escape() and escapeId(), and
      # node-postgres escapeLiteral() and escapeIdentifier().
      - exact: true
        patterns:
          - pattern: $ESC.$FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(?:escape|escapeId|escapeLiteral|escapeIdentifier)$
          - metavariable-regex:
              metavariable: $ESC
              regex: (?:^(?:mysql2?|SqlString|sqlstring)$|(?:[\w$]+\.)*(?:[\w$]*[a-z0-9_$](?=[A-Z])|[\w$]*_)?(?i:db|database|pool|conn|connection|pg|mysql|sqlite|knex|sequelize|tx|trx|transaction)$)
    pattern-sinks:
      # Shared with mcp-tool-arg-to-sql-ts and agent-tool-arg-to-sql-ts (build.py
      # SHARED_BLOCKS "SQL sinks (TypeScript)"): edit them together.
      # Every sink below skips a statement built by a parameterizing API, inline or assigned
      # to a variable first: tagged templates (`sql`...`` from Drizzle, postgres.js, Kysely,
      # @vercel/postgres, and Neon; `SQL`...``; Prisma's `Prisma.sql`...``) send
      # interpolations as parameters, and `format()` on a $FMT receiver is only excluded when
      # assigned (inline, only mysql / SqlString format() counts). Model text passed to
      # sql.raw() or as format()'s SQL is still reported, by the last sink.
      #
      # node-postgres, mysql2, libsql, Neon, PlanetScale, Sequelize, Drizzle's db.execute(string),
      # BigQuery: `query` / `execute` with the statement first, or the statement inside a
      # query config object (pg `{ text, values }`, mysql2 and libsql `{ sql, args }`,
      # Sequelize and BigQuery `{ query }`). Only the statement counts, not the values array
      # or options. Both method names are common, so the receiver must be named like a
      # database (first two sinks) or the file must import a SQL driver (next two); a call
      # both cover is reported once. For speed on large files, method names are spelled out
      # (`$DB.$M(...)` plus a regex matches every call first), and "imports a driver" is a
      # whole-file regex used as pattern-not-regex (it matches the whole file only when no
      # line imports or requires one), which is much cheaper than `import ... from "$MOD"`
      # regions.
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
          - pattern-not: $DB.query({...}, ...)
          - pattern-not: $DB.execute({...}, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: ^(?:[\w$]+\.)*(?:[\w$]*[a-z0-9_$](?=[A-Z])|[\w$]*_)?(?i:db|database|pool|conn|connection|pg|mysql|sqlite|knex|sequelize|tx|trx|transaction)$
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!(?:[\w$]+\.)*(?:sql|SQL|\$queryRaw|\$executeRaw|\$queryRawTyped)\s*`)(?!(?:mysql2?|SqlString|sqlstring)\.format\s*\()(?!Prisma\.join\s*\()
          - pattern-not-inside: |
              $Q = sql`...`;
              ...
          - pattern-not-inside: |
              $Q = SQL`...`;
              ...
          - pattern-not-inside: |
              $Q = $X.sql`...`;
              ...
          - pattern-not-inside: |
              $Q = $FMT.format(...);
              ...
          - pattern-not-inside: |
              $Q = Prisma.join(...);
              ...
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: '$DB.query({..., $K: $Q, ...}, ...)'
              - pattern: '$DB.execute({..., $K: $Q, ...}, ...)'
              - pattern: '$DB.createQueryJob({..., $K: $Q, ...}, ...)'
          - metavariable-regex:
              metavariable: $K
              regex: ^(?:text|sql|query)$
          - metavariable-regex:
              metavariable: $DB
              regex: ^(?:[\w$]+\.)*(?:[\w$]*[a-z0-9_$](?=[A-Z])|[\w$]*_)?(?i:db|database|pool|conn|connection|pg|mysql|sqlite|knex|sequelize|tx|trx|transaction)$
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!(?:[\w$]+\.)*(?:sql|SQL|\$queryRaw|\$executeRaw|\$queryRawTyped)\s*`)(?!(?:mysql2?|SqlString|sqlstring)\.format\s*\()(?!Prisma\.join\s*\()
          - pattern-not-inside: |
              $Q = sql`...`;
              ...
          - pattern-not-inside: |
              $Q = SQL`...`;
              ...
          - pattern-not-inside: |
              $Q = $X.sql`...`;
              ...
          - pattern-not-inside: |
              $Q = $FMT.format(...);
              ...
          - pattern-not-inside: |
              $Q = Prisma.join(...);
              ...
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
          - pattern-not: $DB.query({...}, ...)
          - pattern-not: $DB.execute({...}, ...)
          - pattern-not-regex: '\A(?:(?![^\n]*?\b(?:from|require\(|import\(?)\s*[\"''](?:pg|pg-pool|mysql|mysql2(?:/promise)?|better-sqlite3|sqlite3?|node:sqlite|bun:sqlite|@libsql/client(?:/[\w./-]*)?|@neondatabase/serverless|@vercel/postgres|@planetscale/database|postgres|sequelize|knex|drizzle-orm(?:/[\w./-]*)?|kysely|duckdb|@duckdb/node-api|mssql|oracledb|snowflake-sdk|@google-cloud/bigquery)[\"''])[^\n]*+\n)*+(?![^\n]*?\b(?:from|require\(|import\(?)\s*[\"''](?:pg|pg-pool|mysql|mysql2(?:/promise)?|better-sqlite3|sqlite3?|node:sqlite|bun:sqlite|@libsql/client(?:/[\w./-]*)?|@neondatabase/serverless|@vercel/postgres|@planetscale/database|postgres|sequelize|knex|drizzle-orm(?:/[\w./-]*)?|kysely|duckdb|@duckdb/node-api|mssql|oracledb|snowflake-sdk|@google-cloud/bigquery)[\"''])[^\n]*+\z'
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!(?:[\w$]+\.)*(?:sql|SQL|\$queryRaw|\$executeRaw|\$queryRawTyped)\s*`)(?!(?:mysql2?|SqlString|sqlstring)\.format\s*\()(?!Prisma\.join\s*\()
          - pattern-not-inside: |
              $Q = sql`...`;
              ...
          - pattern-not-inside: |
              $Q = SQL`...`;
              ...
          - pattern-not-inside: |
              $Q = $X.sql`...`;
              ...
          - pattern-not-inside: |
              $Q = $FMT.format(...);
              ...
          - pattern-not-inside: |
              $Q = Prisma.join(...);
              ...
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: '$DB.query({..., $K: $Q, ...}, ...)'
              - pattern: '$DB.execute({..., $K: $Q, ...}, ...)'
              - pattern: '$DB.createQueryJob({..., $K: $Q, ...}, ...)'
          - metavariable-regex:
              metavariable: $K
              regex: ^(?:text|sql|query)$
          - pattern-not-regex: '\A(?:(?![^\n]*?\b(?:from|require\(|import\(?)\s*[\"''](?:pg|pg-pool|mysql|mysql2(?:/promise)?|better-sqlite3|sqlite3?|node:sqlite|bun:sqlite|@libsql/client(?:/[\w./-]*)?|@neondatabase/serverless|@vercel/postgres|@planetscale/database|postgres|sequelize|knex|drizzle-orm(?:/[\w./-]*)?|kysely|duckdb|@duckdb/node-api|mssql|oracledb|snowflake-sdk|@google-cloud/bigquery)[\"''])[^\n]*+\n)*+(?![^\n]*?\b(?:from|require\(|import\(?)\s*[\"''](?:pg|pg-pool|mysql|mysql2(?:/promise)?|better-sqlite3|sqlite3?|node:sqlite|bun:sqlite|@libsql/client(?:/[\w./-]*)?|@neondatabase/serverless|@vercel/postgres|@planetscale/database|postgres|sequelize|knex|drizzle-orm(?:/[\w./-]*)?|kysely|duckdb|@duckdb/node-api|mssql|oracledb|snowflake-sdk|@google-cloud/bigquery)[\"''])[^\n]*+\z'
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!(?:[\w$]+\.)*(?:sql|SQL|\$queryRaw|\$executeRaw|\$queryRawTyped)\s*`)(?!(?:mysql2?|SqlString|sqlstring)\.format\s*\()(?!Prisma\.join\s*\()
          - pattern-not-inside: |
              $Q = sql`...`;
              ...
          - pattern-not-inside: |
              $Q = SQL`...`;
              ...
          - pattern-not-inside: |
              $Q = $X.sql`...`;
              ...
          - pattern-not-inside: |
              $Q = $FMT.format(...);
              ...
          - pattern-not-inside: |
              $Q = Prisma.join(...);
              ...
          - focus-metavariable: $Q
      # SQLite drivers: better-sqlite3 and node:sqlite `prepare` / `exec`, and sqlite3, sqlite,
      # and bun:sqlite `run` / `all` / `get` / `each`, on a receiver named like a database or
      # built with `new Database(...)` / `new DatabaseSync(...)`. RegExp.prototype.exec is
      # not a database.
      - patterns:
          - pattern-either:
              - pattern: $DB.prepare($Q, ...)
              - pattern: $DB.exec($Q, ...)
              - pattern: $DB.run($Q, ...)
              - pattern: $DB.all($Q, ...)
              - pattern: $DB.get($Q, ...)
              - pattern: $DB.each($Q, ...)
          - pattern-inside: |
              $DB = new $CLS(...);
              ...
          - metavariable-regex:
              metavariable: $CLS
              regex: ^(?:[\w$]+\.)?(?:Database|DatabaseSync)$
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!(?:[\w$]+\.)*(?:sql|SQL|\$queryRaw|\$executeRaw|\$queryRawTyped)\s*`)(?!(?:mysql2?|SqlString|sqlstring)\.format\s*\()(?!Prisma\.join\s*\()
          - pattern-not-inside: |
              $Q = sql`...`;
              ...
          - pattern-not-inside: |
              $Q = SQL`...`;
              ...
          - pattern-not-inside: |
              $Q = $X.sql`...`;
              ...
          - pattern-not-inside: |
              $Q = $FMT.format(...);
              ...
          - pattern-not-inside: |
              $Q = Prisma.join(...);
              ...
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: $DB.prepare($Q, ...)
              - pattern: $DB.exec($Q, ...)
              - pattern: $DB.run($Q, ...)
              - pattern: $DB.all($Q, ...)
              - pattern: $DB.get($Q, ...)
              - pattern: $DB.each($Q, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: ^(?:[\w$]+\.)*(?:[\w$]*[a-z0-9_$](?=[A-Z])|[\w$]*_)?(?i:db|database|pool|conn|connection|pg|mysql|sqlite|knex|sequelize|tx|trx|transaction)$
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!(?:[\w$]+\.)*(?:sql|SQL|\$queryRaw|\$executeRaw|\$queryRawTyped)\s*`)(?!(?:mysql2?|SqlString|sqlstring)\.format\s*\()(?!Prisma\.join\s*\()
          - pattern-not-inside: |
              $Q = sql`...`;
              ...
          - pattern-not-inside: |
              $Q = SQL`...`;
              ...
          - pattern-not-inside: |
              $Q = $X.sql`...`;
              ...
          - pattern-not-inside: |
              $Q = $FMT.format(...);
              ...
          - pattern-not-inside: |
              $Q = Prisma.join(...);
              ...
          - focus-metavariable: $Q
      # Raw-SQL escape hatches: Prisma $queryRawUnsafe / $executeRawUnsafe, postgres.js
      # sql.unsafe(), Drizzle / knex / Kysely / Prisma `raw()`, knex's *Raw builder methods,
      # Sequelize literal(), and the SQL template of mysql / sqlstring format().
      - patterns:
          - pattern-either:
              - pattern: $X.$queryRawUnsafe($Q, ...)
              - pattern: $X.$executeRawUnsafe($Q, ...)
              - pattern: $X.unsafe($Q, ...)
              - patterns:
                  - pattern: $X.raw($Q, ...)
                  - pattern-not: String.raw(...)
              - pattern: $X.whereRaw($Q, ...)
              - pattern: $X.orWhereRaw($Q, ...)
              - pattern: $X.andWhereRaw($Q, ...)
              - pattern: $X.havingRaw($Q, ...)
              - pattern: $X.orHavingRaw($Q, ...)
              - pattern: $X.orderByRaw($Q, ...)
              - pattern: $X.groupByRaw($Q, ...)
              - pattern: $X.joinRaw($Q, ...)
              - pattern: $X.fromRaw($Q, ...)
              - patterns:
                  - pattern: $X.literal($Q)
                  - metavariable-regex:
                      metavariable: $X
                      regex: ^(?:[\w$]+\.)*[Ss]equelize$
              - patterns:
                  - pattern-inside: |
                      import {..., literal, ...} from "sequelize";
                      ...
                  - pattern: literal($Q)
              - patterns:
                  - pattern: $FMT.format($Q, ...)
                  - metavariable-regex:
                      metavariable: $FMT
                      regex: ^(?:mysql2?|SqlString|sqlstring)$
          - focus-metavariable: $Q
      # SQL text built from untrusted input (a template literal or `+` whose text starts like
      # an uppercase SQL statement) and handed to any call, such as a module's own run-query
      # helper, so it is reported where the text is built, in the default scan too. Console and
      # logger calls are skipped, and so are tagged templates (`sql`...``, `pg`...``,
      # `prisma.$queryRaw`...``), which OpenGrep treats as calls but which send interpolations
      # as parameters. A statement built into a variable first is left to the sinks above, so
      # it is reported once.
      - patterns:
          - pattern-inside: $F(..., $Q, ...)
          - pattern: $Q
          - pattern-not-inside: $TAG`...`
          - metavariable-regex:
              metavariable: $Q
              regex: ^[`"']\s*(?:SELECT\b[\s\S]*?\bFROM\b|WITH\s+\w+\s+AS\s*\(|INSERT\s+INTO\b|UPDATE\s+\w+\s+SET\b|DELETE\s+FROM\b)
          - metavariable-regex:
              metavariable: $F
              regex: ^(?!console\.|(?:[\w$]+\.)*(?:log|logger|debug|info|warn|warning|error|trace)$)
          - focus-metavariable: $Q
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM10:2026 - Improper Output Handling"
        - "LLM05:2025 - Improper Output Handling"
      # A model choosing the SQL a connection runs is the textbook tool-misuse case (a "run
      # SQL" tool, an agent's database step), even when the call isn't wrapped as a tool.
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-aisvs:
        - "v1.01-C7.1.1 - Output Format Enforcement"
      mitre-atlas:
        - "AML.T0051 - LLM Prompt Injection"
        - "AML.T0036 - Data from Information Repositories"
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      # MEDIUM: text-to-SQL features run model SQL on purpose, often on a read-only role,
      # which limits (but doesn't remove) the damage.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [vercel-ai-sdk, openai, anthropic, google-genai, langchain, claude-agent-sdk, openai-agents, node-postgres, mysql2, better-sqlite3, knex, prisma, sequelize, drizzle, postgres-js, libsql]
