      # @types/better-sqlite3 9.6.0 (prepare, exec), node:sqlite in Node 25.8.0 (DatabaseSync
      # prepare / exec), knex 3.3.0 (raw, whereRaw, orWhereRaw, andWhereRaw, havingRaw,
