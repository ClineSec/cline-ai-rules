rules:
  - id: llm-max-tokens-from-user-input-ts
    # Generated by scripts/gen_llm_max_tokens_from_user_input.py. The first pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt-ts's request-data sources and
    # allowlist checks, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # SDKs checked 2026-10-25 from package source: openai 7.43.0, @anthropic-ai/sdk 1.3.0, ai
    # 7.0.153 (and ai 4.3.19 for maxTokens), @langchain/openai 1.7.0, @langchain/anthropic
    # 1.6.0; agent step caps as in agent-loop-unbounded-iterations-ts.
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A request value decides how much work a model call does: its output-token cap
      (`max_tokens`, `max_completion_tokens`, `max_output_tokens`, `maxOutputTokens`), how many completions it returns (`n`), how many steps an agent run may take,
      or how many times a loop calls the model. Nothing caps it on the way, so any caller can
      ask for the model's longest output, many choices, or thousands of calls in one request,
      and a script that repeats it runs up the provider bill or uses up the rate limit that
      every other user shares (denial of wallet). Choose the limit on the server, or cap the
      request value before use: `Math.min(body.maxTokens, 1024)`, a schema bound (`z.number().int().max(1024)`), or a per-plan table. If this endpoint is itself a metered model gateway that
      bills each caller for the tokens they ask for, this may be by design.
    mode: taint
    options:
      # A comparison says something about the request without carrying its value. Numbers
      # stay tainted: here the number is the risk.
      taint_assume_safe_booleans: true
    pattern-sources:
      # Request data read from the request object: Express and Fastify (req.body, req.query,
      # req.params, req.get()), the Fetch API Request in Next.js route handlers (await
      # request.json(), request.formData(), request.url), Next.js NextRequest (request.nextUrl),
      # Hono (c.req.json(), c.req.query(), c.req.param()), and Koa (ctx.request.body).
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:[\w$.]*\.)?(?:req|request)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:body|query|queries|params|param|headers|header|get|cookies|signedCookies|url|originalUrl|path|nextUrl|json|formData|text|parseBody|valid)$
      # Next.js route handlers, whatever the request parameter is called, and their dynamic
      # route segments: export async function POST(r: Request, { params }).
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, ...) { ... }
              - pattern: export function $M($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, $CTX, ...) { ... }
              - pattern: export function $M($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      # URL query parameters: a Next.js page's searchParams prop, useSearchParams().
      - patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: ^searchParams$
      # Server actions: the client chooses every argument of an exported function in a
      # "use server" module, or of a function marked "use server", and TypeScript types are not
      # checked at runtime.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  "use server";
                  ...
              - pattern-inside: |
                  'use server';
                  ...
          - pattern-either:
              - pattern: export async function $F(..., $P, ...) { ... }
              - pattern: export const $F = async (..., $P, ...) => {...};
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: 'async function $F(..., $P, ...) { "use server"; ... }'
              - pattern: "async function $F(..., $P, ...) { 'use server'; ... }"
              - pattern: 'async (..., $P, ...) => { "use server"; ... }'
          - focus-metavariable: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone). The table is the
      # application's own text, whatever key the caller sends.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:[\w$.]*\.)?(?:req|request)\.)(?:[\w$.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if (!ALLOWED_TONES.includes(tone)) return ...`. Only the
      # checked value, and not a blocklist.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.includes($X)
              - pattern: $ALLOWED.has($X)
              - pattern: $X in $ALLOWED
              - pattern: Object.hasOwn($ALLOWED, $X)
              - pattern: $ALLOWED.hasOwnProperty($X)
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check anchored at both ends: /^[a-z]{2}(-[A-Z]{2})?$/.test(locale).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # A cap applied on the server: Math.min(body.maxTokens, 4096), a clamp helper.
      - exact: true
        pattern: Math.min(...)
      - exact: true
        patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?i)^(?:[\w$.]*\.)?_?(?:[\w$]*?(?:clamp|clip)[\w$]*|(?:cap|bound|limit)(?:[A-Z_][\w$]*)?)$
      # A conditional that compares first: n > MAX_TOKENS ? MAX_TOKENS : n.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: '$L < $R ? $A : $B'
              - pattern: '$L <= $R ? $A : $B'
              - pattern: '$L > $R ? $A : $B'
              - pattern: '$L >= $R ? $A : $B'
          - metavariable-regex:
              metavariable: $L
              regex: |-
                ^(?!-?[01]$|null$|undefined$)
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?!-?[01]$|null$|undefined$)
      # A comparison before use: `if (body.maxTokens > 4096) return ...`. Either operand is
      # cleared from then on when the other is a real bound (not 0, 1, null, or undefined).
      # Not a for or while loop's own condition (i < body.variants), which is the count, not a
      # check.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $L < $R
              - pattern: $L <= $R
              - pattern: $L > $R
              - pattern: $L >= $R
          - pattern-not-inside: 'for (let $I = $START; $L < $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L < $R) { ... }'
          - pattern-not-inside: 'for (let $I = $START; $L <= $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L <= $R) { ... }'
          - pattern-not-inside: 'for (let $I = $START; $L > $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L > $R) { ... }'
          - pattern-not-inside: 'for (let $I = $START; $L >= $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L >= $R) { ... }'
          - focus-metavariable: $L
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?!-?[01]$|null$|undefined$)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $L < $R
              - pattern: $L <= $R
              - pattern: $L > $R
              - pattern: $L >= $R
          - pattern-not-inside: 'for (let $I = $START; $L < $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L < $R) { ... }'
          - pattern-not-inside: 'for (let $I = $START; $L <= $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L <= $R) { ... }'
          - pattern-not-inside: 'for (let $I = $START; $L > $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L > $R) { ... }'
          - pattern-not-inside: 'for (let $I = $START; $L >= $R; $NEXT) { ... }'
          - pattern-not-inside: 'while ($L >= $R) { ... }'
          - focus-metavariable: $R
          - metavariable-regex:
              metavariable: $L
              regex: |-
                ^(?!-?[01]$|null$|undefined$)
      # Fields of a zod schema in this file with an upper bound,
      # z.object({ maxTokens: z.number().int().max(4096) }), read from a value parsed with it:
      # const { maxTokens } = Body.parse(...), body.maxTokens after body = Body.parse(...), or
      # parsed.data.maxTokens after parsed = Body.safeParse(...).
      - patterns:
          - pattern-inside: |
              const $S = z.object({..., $FIELD: $V, ...});
              ...
          - metavariable-regex:
              metavariable: $V
              regex: |-
                (?s)^z\..*\.(?:max|lte|lt)\(
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FIELD, ...} = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const {..., $FIELD, ...} = await $S.parseAsync(...);
                          ...
                  - pattern: $FIELD
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $O = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const $O = await $S.parseAsync(...);
                          ...
                  - pattern: $O.$FIELD
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $O = $S.safeParse(...);
                          ...
                      - pattern-inside: |
                          const $O = await $S.safeParseAsync(...);
                          ...
                  - pattern: $O.data.$FIELD
      # A value parsed with a schema declared in another module (DraftRequest.parse(...),
      # draftSchema.safeParse(...)) may be bounded where the rule can't see; schemas declared in
      # this file are judged by the field sanitizer above.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $S.parse(...)
              - pattern: $S.parseAsync(...)
              - pattern: $S.safeParse(...)
              - pattern: $S.safeParseAsync(...)
          - metavariable-regex:
              metavariable: $S
              regex: |-
                ^(?!(?:JSON|Number|Date|URL)$)(?:[A-Z][\w$]*|[\w$]*(?:Schema|Body|Input|Request|Params|Query))$
          - pattern-not-inside: |
              const $S = $SCHEMA;
              ...
      # A whole value parsed with a bounded schema: z.number().max(8).parse(x).
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $Z.parse(...)
              - pattern: $Z.safeParse(...)
          - metavariable-regex:
              metavariable: $Z
              regex: |-
                (?s)^z\..*\.(?:max|lte|lt)\(
    pattern-sinks:
      # A model call's output-token cap, choice count, tool-call cap, or an agent run's
      # step cap, in its options object.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: '$C.chat.completions.$M({..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:create|parse|stream)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|max_completion_tokens|n)$
              - patterns:
                  - pattern: '$C.completions.create({..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|n|best_of)$
              - patterns:
                  - pattern: '$C.responses.$M({..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:create|parse|stream)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_output_tokens|max_tool_calls)$
              - patterns:
                  - pattern: '$C.messages.$M({..., max_tokens: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:create|stream|parse)$
              - patterns:
                  - pattern: '$F({..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:generateText|streamText|generateObject|streamObject)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:maxOutputTokens|maxTokens)$
              - patterns:
                  - pattern: 'new $F({..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w$.]*\.)?(?:ToolLoopAgent|Experimental_Agent|Agent)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:maxOutputTokens|maxTokens)$
              - patterns:
                  - pattern: '$C.models.$M({..., config: {..., $K: $X, ...}, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:generateContent|generateContentStream)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:maxOutputTokens|candidateCount)$
              - patterns:
                  - pattern: 'new $F({..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w$.]*\.)?(?:Azure)?Chat[A-Z][\w$]*$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:maxTokens|maxCompletionTokens|maxOutputTokens|n|candidateCount)$
              - patterns:
                  - pattern: 'initChatModel($MODEL, {..., $K: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:maxTokens|maxCompletionTokens|maxOutputTokens|max_tokens)$
              - patterns:
                  - pattern: '$F($AGENT, $INPUT, {..., maxTurns: $X, ...})'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w$.]*\.)?run$
              - pattern: 'new Runner({..., maxTurns: $X, ...})'
              - pattern: 'query({..., options: {..., maxTurns: $X, ...}, ...})'
              - pattern: 'new AgentExecutor({..., maxIterations: $X, ...})'
              - pattern: 'AgentExecutor.fromAgentAndTools({..., maxIterations: $X, ...})'
              - patterns:
                  - pattern: '$F($X)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:stepCountIs|isStepCount)$
              - patterns:
                  - pattern: '$F({..., maxSteps: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:generateText|streamText|generateObject|streamObject)$
              - patterns:
                  - pattern: '$A.$M($P, {..., maxSteps: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:generate|stream|generateLegacy|streamLegacy)$
              - pattern: '{..., recursionLimit: $X, ...}'
              - pattern: '$C.beta.messages.toolRunner({..., max_iterations: $X, ...}, ...)'
          - focus-metavariable: $X
      # A JSON body for a model API sent with fetch or axios: fetch(url, { body:
      # JSON.stringify({ max_tokens }) }).
      - patterns:
          - pattern-either:
              - pattern: 'fetch($URL, {..., body: JSON.stringify({..., $K: $X, ...}), ...})'
              - pattern: '$AX.post($URL, {..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $K
              regex: |-
                ^(?:max_tokens|max_completion_tokens|max_output_tokens)$
          - focus-metavariable: $X
      # An options object built before the call: const opts = { maxOutputTokens: n };
      # generateText({ ...opts, model }), or client.chat.completions.create(params).
      - patterns:
          - pattern-either:
              - pattern: |
                  const $OPTS = {..., $K: $X, ...};
                  ...
                  $CALL(..., $OPTS, ...);
              - pattern: |
                  const $OPTS = {..., $K: $X, ...};
                  ...
                  $CALL(..., {..., ...$OPTS, ...}, ...);
          - metavariable-regex:
              metavariable: $K
              regex: |-
                ^(?:max_tokens|max_completion_tokens|max_output_tokens|max_tool_calls|n|maxOutputTokens|maxTokens|maxCompletionTokens|maxSteps|maxTurns)$
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                ^(?:[\w$.]*\.)?(?:chat\.completions\.(?:create|parse|stream)|completions\.create|responses\.(?:create|parse|stream)|messages\.(?:create|stream|parse)|models\.generateContent\w*|generateText|streamText|generateObject|streamObject|fetch|axios(?:\.(?:post|request))?)$
          - focus-metavariable: $X
      # A loop that calls the model once per step, its count from the request: for (let i =
      # 0; i < body.variants; i++), while (i < body.variants), Array.from({ length: n }, () =>
      # generateText(...)). while (true) with a break on a constant isn't matched.
      - patterns:
          - pattern-either:
              - pattern: |
                  for (let $I = $S; $I < $X; $INC) { $...BODY }
              - pattern: |
                  for (let $I = $S; $I <= $X; $INC) { $...BODY }
              # while (i < body.variants) { ... }, while (kept.length < wanted) { ... }
              - pattern: |
                  while ($C < $X) { $...BODY }
              - pattern: |
                  while ($C <= $X) { $...BODY }
              - pattern: |
                  while ($X > $C) { $...BODY }
              - pattern: |
                  while ($X >= $C) { $...BODY }
          - metavariable-pattern:
              metavariable: $...BODY
              pattern-either:
                - pattern: $O.chat.completions.$MC(...)
                - pattern: $O.responses.$MC(...)
                - pattern: $O.messages.$MC(...)
                - pattern: $O.models.generateContent(...)
                - pattern: generateText(...)
                - pattern: streamText(...)
                - pattern: generateObject(...)
                - pattern: streamObject(...)
                - pattern: $O.invoke(...)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: 'Array.from({ length: $X }, $FN)'
              - pattern: 'Array.from({ length: $X }).map($FN)'
          - metavariable-pattern:
              metavariable: $FN
              pattern-either:
                - pattern: $O.chat.completions.$MC(...)
                - pattern: $O.responses.$MC(...)
                - pattern: $O.messages.$MC(...)
                - pattern: $O.models.generateContent(...)
                - pattern: generateText(...)
                - pattern: streamText(...)
                - pattern: generateObject(...)
                - pattern: streamObject(...)
                - pattern: $O.invoke(...)
          - focus-metavariable: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM06:2026 - Unbounded Consumption"
        - "LLM10:2025 - Unbounded Consumption"
      owasp-aisvs:
        - "v1.01-C9.1.2 - Execution Budgets, Loop Control, and Circuit Breakers"
      mitre-atlas:
        - "AML.T0034.001 - Cost Harvesting: Resource-Intensive Queries"
      cwe:
        - "CWE-770: Allocation of Resources Without Limits or Throttling"
      # A cap the rule can't see (a gateway or provider-side budget, a check in another
      # module, an endpoint that is itself a metered model API) makes some findings safe.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [express, nextjs, hono, openai, anthropic, vercel-ai-sdk, langchain, gemini, openai-agents, claude-agent-sdk, mastra, langgraph]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM06_UnboundedConsumption.md
        - https://github.com/OWASP/AISVS/blob/v1.01/1.01/en/0x10-C09-Orchestration-and-Agentic-Action.md
        - https://cwe.mitre.org/data/definitions/770.html
        - https://github.com/openai/openai-node/blob/v7.43.0/src/resources/chat/completions/completions.ts
        - https://github.com/openai/openai-node/blob/v7.43.0/src/resources/responses/responses.ts
        - https://github.com/anthropics/anthropic-sdk-typescript/blob/sdk-v1.3.0/src/resources/messages/messages.ts
        - https://github.com/vercel/ai/blob/ai%407.0.153/packages/ai/src/prompt/language-model-call-options.ts
        - https://github.com/vercel/ai/blob/ai%404.3.19/packages/ai/core/prompt/call-settings.ts
        - https://github.com/langchain-ai/langchainjs/blob/%40langchain/openai%401.7.0/libs/providers/langchain-openai/src/chat_models/base.ts
        - https://github.com/langchain-ai/langchainjs/blob/%40langchain/anthropic%401.6.0/libs/providers/langchain-anthropic/src/chat_models.ts
