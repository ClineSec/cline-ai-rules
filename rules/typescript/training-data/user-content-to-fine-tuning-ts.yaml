rules:
  - id: user-content-to-fine-tuning-ts
    # Generated by scripts/gen_user_content_to_fine_tuning.py. The pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt-ts's request-data sources and
    # lookup sanitizers, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # SDKs checked 2026-10-24: openai 7.43.0 (resources/files.d.ts, resources/uploads/),
    # @mistralai/mistralai 3.2.0 (sdk/files.d.ts), together-ai 1.0.0 (resources/files.d.ts).
    languages: [typescript, javascript]
    severity: WARNING
    paths:
      exclude:
        - "app/**/admin/**"
        - "pages/**/admin/**"
    message: >-
      Request data (an uploaded file, a feedback form, a conversation the client sends back)
      goes straight into fine-tuning or training data:
      a file uploaded with `purpose: "fine-tune"`, or a file named like training
      data. Anyone who can call this endpoint writes training examples, so they can plant a
      trigger phrase that unlocks a behavior, teach wrong answers, or forge the assistant's side
      of a conversation, and the next fine-tune passes that on to every user of the model
      (OWASP LLM05, scenario 3). Store submissions for review and build training files only
      from records a person approved, using transcripts the server kept rather than turns the
      client sent back. If each customer fine-tunes a model only they use, this is the
      intended flow.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Express and Fastify (req.body, req.query,
      # req.params, req.get()), the Fetch API Request in Next.js route handlers (await
      # request.json(), request.formData(), request.url), Next.js NextRequest (request.nextUrl),
      # Hono (c.req.json(), c.req.query(), c.req.param()), and Koa (ctx.request.body).
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:[\w$.]*\.)?(?:req|request)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:body|query|queries|params|param|headers|header|get|cookies|signedCookies|url|originalUrl|path|nextUrl|json|formData|text|parseBody|valid)$
      # Next.js route handlers, whatever the request parameter is called, and their dynamic
      # route segments: export async function POST(r: Request, { params }).
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, ...) { ... }
              - pattern: export function $M($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, $CTX, ...) { ... }
              - pattern: export function $M($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      # URL query parameters: a Next.js page's searchParams prop, useSearchParams().
      - patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: ^searchParams$
      # Server actions: the client chooses every argument of an exported function in a
      # "use server" module, or of a function marked "use server", and TypeScript types are not
      # checked at runtime.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  "use server";
                  ...
              - pattern-inside: |
                  'use server';
                  ...
          - pattern-either:
              - pattern: export async function $F(..., $P, ...) { ... }
              - pattern: export const $F = async (..., $P, ...) => {...};
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: 'async function $F(..., $P, ...) { "use server"; ... }'
              - pattern: "async function $F(..., $P, ...) { 'use server'; ... }"
              - pattern: 'async (..., $P, ...) => { "use server"; ... }'
          - focus-metavariable: $P
    pattern-propagators:
      # Rows collected into an array taint the array: rows.push({...}).
      - pattern: $L.push($X)
        from: $X
        to: $L
      # An array mapped or filtered stays tainted: body.examples.map((e) => JSON.stringify(e)).
      # With --taint-intrafile, OpenGrep drops the receiver's taint through these callbacks;
      # propagating to the call itself keeps it.
      - patterns:
          - pattern: $XS.$XSM(...)
          - metavariable-regex:
              metavariable: $XSM
              regex: ^(?:map|filter|flatMap)$
          - pattern: $XSCALL
          # $XSCALL also binds every expression inside the call (`JSON` in the callback); keep
          # only the call itself.
          - metavariable-regex:
              metavariable: $XSCALL
              regex: |-
                (?s)^.+\.(?:map|filter|flatMap)\(.*\)$
        from: $XS
        to: $XSCALL
      # Text written to a scratch file taints its path, so uploading that file later counts:
      # await writeFile(tmp, jsonl), then fs.createReadStream(tmp). A training-data path is a
      # sink of its own.
      - patterns:
          - pattern-either:
              - pattern: $FS.$W($P, $X, ...)
              - pattern: $W($P, $X, ...)
          - metavariable-regex:
              metavariable: $W
              regex: ^(?:appendFile|appendFileSync|writeFile|writeFileSync|outputFile|outputFileSync)$
          - metavariable-regex:
              metavariable: $P
              regex: |-
                ^(?!(?s).*(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z]))
        from: $X
        to: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone). The table is the
      # application's own text, whatever key the caller sends.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:[\w$.]*\.)?(?:req|request)\.)(?:[\w$.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if (!ALLOWED_TONES.includes(tone)) return ...`. Only the
      # checked value, and not a blocklist.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.includes($X)
              - pattern: $ALLOWED.has($X)
              - pattern: $X in $ALLOWED
              - pattern: Object.hasOwn($ALLOWED, $X)
              - pattern: $ALLOWED.hasOwnProperty($X)
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check anchored at both ends: /^[a-z]{2}(-[A-Z]{2})?$/.test(locale).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # Fields of a zod schema in this file that only admit a fixed set or a number,
      # z.object({ tone: z.enum(["formal", "casual"]) }), read from a value parsed with it:
      # const { tone } = ChatBody.parse(...), or body.tone after body = ChatBody.parse(...).
      - patterns:
          - pattern-inside: |
              const $S = z.object({..., $FIELD: $V, ...});
              ...
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FIELD, ...} = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const {..., $FIELD, ...} = await $S.parseAsync(...);
                          ...
                  - pattern: $FIELD
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $O = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const $O = await $S.parseAsync(...);
                          ...
                  - pattern: $O.$FIELD
      # A whole value parsed with such a schema: Tone.parse(x), z.enum([...]).parse(x).
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      const $S = $Z;
                      ...
                  - pattern-either:
                      - pattern: $S.parse(...)
                      - pattern: $S.safeParse(...)
              - patterns:
                  - pattern-either:
                      - pattern: $Z.parse(...)
                      - pattern: $Z.safeParse(...)
          - metavariable-regex:
              metavariable: $Z
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
      - exact: true
        pattern-either:
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
      # A lookup keyed by request data returns stored data, not the caller's text: a Prisma,
      # Drizzle, or SQL query, a vector-store or retriever search, a getX / fetchX / findX
      # helper, or fetch(). (Stored data that came from users earlier is a different, indirect
      # injection.) `exact` keeps a sink inside the call's own arguments, and calls that are
      # themselves a system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: fetch(...)
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w$.]*\.)?(?:get|fetch|find|load|lookup|search|retrieve|query|select)[A-Z_][\w$]*$
                  # Not the request's own readers.
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:[\w$.]*\.)?(?:req|request|searchParams)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:find(?:Unique|First|Many|One|ById|ByPk|All)\w*|similaritySearch\w*|maxMarginalRelevanceSearch|getRelevantDocuments|query|execute|all|first)$
                  # Not Hono's c.req.query("x").
                  - metavariable-regex:
                      metavariable: $O
                      regex: ^(?!(?:[\w$.]*\.)?(?:req|request)$)
              - patterns:
                  - pattern: $O.invoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:retriever|vectorStore|vectorDb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.retrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:retriever|vectorStore|vectorDb|kb|knowledgeBase|docStore|docIndex|searchIndex|index|corpus|tavily\w*)$
              - pattern: axios(...)
              - pattern: axios.$M(...)
              - pattern: got(...)
              - pattern: ky(...)
          - pattern-not: new SystemMessage(...)
          - pattern-not: '$G(..., {..., system: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., instructions: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., systemPrompt: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., systemInstruction: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., role: $X, ...}, ...)'
    pattern-sinks:
      # A file uploaded for fine-tuning: OpenAI (and Azure OpenAI) files.create({ file,
      # purpose: "fine-tune" }) and the parts of an upload created for fine-tuning; Mistral
      # files.upload({ file: { fileName, content }, purpose: "fine-tune" }); Together
      # files.upload(path, "fine-tune"). The purpose may be a constant. Fine-tuning jobs take a
      # file ID, which this reports where the file is made.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '$C.files.$M({..., purpose: "fine-tune", ...}, ...)'
                  - pattern: '$C.files.$M({..., file: $X, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:create|upload)$
              - pattern: $C.files.upload($X, "fine-tune")
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $U = await $C.uploads.create({..., purpose: "fine-tune", ...});
                          ...
                      - pattern-inside: |
                          const $U = $C.uploads.create({..., purpose: "fine-tune", ...});
                          ...
                  - pattern: '$C2.uploads.parts.create($ID, {..., data: $X, ...}, ...)'
          - focus-metavariable: $X
          # Handlers only an administrator can call: that is how vetted datasets get in. An
          # Express or Hono route under /admin or behind admin middleware, or a handler that
          # checks for an administrator first.
          - pattern-not-inside:
              patterns:
                - pattern-inside: $ADMAPP.$ADMV(..., $ADMARG, ...)
                - metavariable-regex:
                    metavariable: $ADMV
                    regex: ^(?:get|post|put|patch|delete|all|use|route|on)$
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s)^(?:[\"'`]/(?:api/)?(?:v\d+/)?admin\b.*|(?:[\w$.]*\.)?[\w$]*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)[\w$]*(?:\(.*\))?)$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $ADMCHK(...);
                        ...
                    - pattern-inside: |
                        await $ADMCHK(...);
                        ...
                - metavariable-regex:
                    metavariable: $ADMCHK
                    regex: ^(?:[\w$.]*\.)?(?:require|ensure|assert|check|verify)(?:Admin|Staff|Superuser)[\w$]*$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        if (!$ADMU.$ADMA) { ... }
                        ...
                    - pattern-inside: |
                        if (!$ADMU.$ADMA) return $ADMRET;
                        ...
                - metavariable-regex:
                    metavariable: $ADMA
                    regex: ^(?:isAdmin|isStaff|isSuperuser|admin|isOrgAdmin)$
          # A client built with the caller's own provider key fine-tunes the caller's own model.
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    const $KC = new $KCLS({..., apiKey: $KEY, ...});
                    ...
                - pattern-either:
                    - pattern-inside: $KC.$KR.$KM(...)
                    - pattern-inside: $KC.$KR.$KS.$KM(...)
                - metavariable-regex:
                    metavariable: $KEY
                    regex: |-
                      (?is)^(?!.*(?:process\.env|import\.meta\.env|config|settings)).*(?:^|[.\[\"'?])(?:user|tenant|customer|account|org|organization|workspace|profile|session|req|request|body|payload|form)(?:$|[.\]\"'?(])
      # A write to a file named like training data: appendFile("data/sft/feedback.jsonl", ...),
      # fs.appendFileSync(TRAINING_FILE, ...), a write stream on such a path. The path is
      # inline, a constant, or a variable assigned from a training-data name earlier.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $FS.$W($PATH, $X, ...)
                      - pattern: $W($PATH, $X, ...)
                  - metavariable-regex:
                      metavariable: $W
                      regex: ^(?:appendFile|appendFileSync|writeFile|writeFileSync|outputFile|outputFileSync)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $S = $FS.createWriteStream($PATH, ...);
                          ...
                      - pattern-inside: |
                          const $S = createWriteStream($PATH, ...);
                          ...
                  - pattern: $S.write($X, ...)
          - metavariable-pattern:
              metavariable: $PATH
              pattern-either:
                - pattern: '"=~/(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])/"'
                - pattern-regex: (?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])
          - focus-metavariable: $X
          # Handlers only an administrator can call: that is how vetted datasets get in. An
          # Express or Hono route under /admin or behind admin middleware, or a handler that
          # checks for an administrator first.
          - pattern-not-inside:
              patterns:
                - pattern-inside: $ADMAPP.$ADMV(..., $ADMARG, ...)
                - metavariable-regex:
                    metavariable: $ADMV
                    regex: ^(?:get|post|put|patch|delete|all|use|route|on)$
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s)^(?:[\"'`]/(?:api/)?(?:v\d+/)?admin\b.*|(?:[\w$.]*\.)?[\w$]*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)[\w$]*(?:\(.*\))?)$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $ADMCHK(...);
                        ...
                    - pattern-inside: |
                        await $ADMCHK(...);
                        ...
                - metavariable-regex:
                    metavariable: $ADMCHK
                    regex: ^(?:[\w$.]*\.)?(?:require|ensure|assert|check|verify)(?:Admin|Staff|Superuser)[\w$]*$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        if (!$ADMU.$ADMA) { ... }
                        ...
                    - pattern-inside: |
                        if (!$ADMU.$ADMA) return $ADMRET;
                        ...
                - metavariable-regex:
                    metavariable: $ADMA
                    regex: ^(?:isAdmin|isStaff|isSuperuser|admin|isOrgAdmin)$
      - patterns:
          - pattern-inside: |
              const $PATH = $PATHRHS;
              ...
          - metavariable-pattern:
              metavariable: $PATHRHS
              pattern-either:
                - pattern: '"=~/(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])/"'
                - pattern-regex: (?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $FS.$W($PATH, $X, ...)
                      - pattern: $W($PATH, $X, ...)
                  - metavariable-regex:
                      metavariable: $W
                      regex: ^(?:appendFile|appendFileSync|writeFile|writeFileSync|outputFile|outputFileSync)$
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $S = $FS.createWriteStream($PATH, ...);
                          ...
                      - pattern-inside: |
                          const $S = createWriteStream($PATH, ...);
                          ...
                  - pattern: $S.write($X, ...)
          - focus-metavariable: $X
          # Handlers only an administrator can call: that is how vetted datasets get in. An
          # Express or Hono route under /admin or behind admin middleware, or a handler that
          # checks for an administrator first.
          - pattern-not-inside:
              patterns:
                - pattern-inside: $ADMAPP.$ADMV(..., $ADMARG, ...)
                - metavariable-regex:
                    metavariable: $ADMV
                    regex: ^(?:get|post|put|patch|delete|all|use|route|on)$
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s)^(?:[\"'`]/(?:api/)?(?:v\d+/)?admin\b.*|(?:[\w$.]*\.)?[\w$]*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)[\w$]*(?:\(.*\))?)$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $ADMCHK(...);
                        ...
                    - pattern-inside: |
                        await $ADMCHK(...);
                        ...
                - metavariable-regex:
                    metavariable: $ADMCHK
                    regex: ^(?:[\w$.]*\.)?(?:require|ensure|assert|check|verify)(?:Admin|Staff|Superuser)[\w$]*$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        if (!$ADMU.$ADMA) { ... }
                        ...
                    - pattern-inside: |
                        if (!$ADMU.$ADMA) return $ADMRET;
                        ...
                - metavariable-regex:
                    metavariable: $ADMA
                    regex: ^(?:isAdmin|isStaff|isSuperuser|admin|isOrgAdmin)$
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      const $LOG = new $CLS(..., $LPATH, ...);
                      ...
                  - metavariable-pattern:
                      metavariable: $LPATH
                      pattern-either:
                        - pattern: '"=~/(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])/"'
                        - pattern-regex: (?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])
              - patterns:
                  - pattern-inside: |
                      const $PATH = $PATHRHS;
                      ...
                  - metavariable-pattern:
                      metavariable: $PATHRHS
                      pattern-either:
                        - pattern: '"=~/(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])/"'
                        - pattern-regex: (?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z])
                  - pattern-inside: |
                      const $LOG = new $CLS(..., $PATH, ...);
                      ...
          - pattern: $LOG.$LM(..., $X, ...)
          - metavariable-regex:
              metavariable: $LM
              regex: ^(?:append|add|write|log|record|save|put|extend|insert)\w*$
          - focus-metavariable: $X
          # Handlers only an administrator can call: that is how vetted datasets get in. An
          # Express or Hono route under /admin or behind admin middleware, or a handler that
          # checks for an administrator first.
          - pattern-not-inside:
              patterns:
                - pattern-inside: $ADMAPP.$ADMV(..., $ADMARG, ...)
                - metavariable-regex:
                    metavariable: $ADMV
