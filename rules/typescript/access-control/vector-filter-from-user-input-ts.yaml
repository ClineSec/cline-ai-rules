rules:
  - id: vector-filter-from-user-input-ts
    # Generated by scripts/gen_vector_filter_from_user_input.py. The first pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt-ts's request-data sources and
    # value sanitizers (the ones before its lookup sanitizer), imported from
    # gen_user_input_in_system_prompt.py (build.py SHARED_BLOCKS checks the copy). Edit the
    # scripts and run scripts/build.py; build.py --check fails if this file drifts.
    # SDKs checked 2026-10-24 from package source: chromadb 3.5.0, @pinecone-database/pinecone
    # 9.1.0, @qdrant/js-client-rest 1.20.0, @langchain/core 1.3.0 (VectorStore,
    # VectorStoreRetriever); weaviate-client 3.15.1 takes only filter builder
    # objects, so it has no sink.
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The request supplies the whole metadata filter of a vector-store query (or the last word
      in it: a trailing spread or a request-chosen key that overrides the server's). The filter
      is what keeps a search inside the caller's tenant, so whoever sends the request picks
      which documents it reads, or deletes: another customer's, by asking for their tenant ID
      or an `$or` that matches everything. Build the filter on the server, with the tenant
      from the session and request values only as field values:
      `filter: { orgId: session.orgId, topic: body.topic }`.
      Or pick it from an allowlist of saved filters. If the collection or namespace is already
      per-tenant, this finding may be safe.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Express and Fastify (req.body, req.query,
      # req.params, req.get()), the Fetch API Request in Next.js route handlers (await
      # request.json(), request.formData(), request.url), Next.js NextRequest (request.nextUrl),
      # Hono (c.req.json(), c.req.query(), c.req.param()), and Koa (ctx.request.body).
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:[\w$.]*\.)?(?:req|request)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:body|query|queries|params|param|headers|header|get|cookies|signedCookies|url|originalUrl|path|nextUrl|json|formData|text|parseBody|valid)$
      # Next.js route handlers, whatever the request parameter is called, and their dynamic
      # route segments: export async function POST(r: Request, { params }).
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, ...) { ... }
              - pattern: export function $M($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, $CTX, ...) { ... }
              - pattern: export function $M($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      # URL query parameters: a Next.js page's searchParams prop, useSearchParams().
      - patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: ^searchParams$
      # Server actions: the client chooses every argument of an exported function in a
      # "use server" module, or of a function marked "use server", and TypeScript types are not
      # checked at runtime.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  "use server";
                  ...
              - pattern-inside: |
                  'use server';
                  ...
          - pattern-either:
              - pattern: export async function $F(..., $P, ...) { ... }
              - pattern: export const $F = async (..., $P, ...) => {...};
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: 'async function $F(..., $P, ...) { "use server"; ... }'
              - pattern: "async function $F(..., $P, ...) { 'use server'; ... }"
              - pattern: 'async (..., $P, ...) => { "use server"; ... }'
          - focus-metavariable: $P
      # OpenGrep 1.30.2 carries no taint into or out of an object literal with a computed key,
      # so a filter literal whose last key is computed from the request is itself a source:
      # the key is a name read from the request in this function (const body = await
      # req.json(); const { field } = req.body), or a request path (req.body.field).
      - patterns:
          - pattern-either:
              - pattern-inside: '$C.$M(..., {..., where: $OBJ, ...}, ...)'
              - pattern-inside: '$C.$M(..., {..., filter: $OBJ, ...}, ...)'
              - pattern-inside: '$C.$M(..., {..., query: {..., filter: $OBJ, ...}, ...}, ...)'
              - pattern-inside: '$C.$M(..., {..., preFilter: $OBJ, ...}, ...)'
              - pattern-inside: '{..., $vectorSearch: {..., filter: $OBJ, ...}, ...}'
              - pattern-inside: $C.$M($Q, $K, $OBJ, ...)
              - pattern-inside: $C.asRetriever($K, $OBJ, ...)
          - pattern: $OBJ
          - metavariable-regex:
              metavariable: $OBJ
              regex: |-
                (?s)^\{.*,\s*\[[^\]]*\]\s*:(?:"[^"\n]*"|'[^'\n]*'|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|\{[^{}]*\}|[^,{}()\[\]"'])++\s*,?\s*\}$
          - pattern-either:
              - pattern-inside: |
                  const $B = await $R.$READ(...);
                  ...
              - pattern-inside: |
                  const {..., $B, ...} = await $R.$READ(...);
                  ...
              - pattern-inside: |
                  const $B = $R.$READ;
                  ...
              - pattern-inside: |
                  const {..., $B, ...} = $R.$READ;
                  ...
          - metavariable-regex:
              metavariable: $R
              regex: ^(?:[\w$.]*\.)?(?:req|request)$
          - metavariable-regex:
              metavariable: $READ
              regex: ^(?:json|formData|text|parseBody|body|query|params)$
          - metavariable-pattern:
              metavariable: $OBJ
              patterns:
                - pattern: '{..., [$CK]: $CV, ...}'
                - metavariable-comparison:
                    comparison: str($CK) == str($B) or re.match("^[A-Za-z_$][A-Za-z0-9_$]*[.[]", str($CK)) and str($B) in str($CK)
      - patterns:
          - pattern-either:
              - pattern-inside: '$C.$M(..., {..., where: $OBJ, ...}, ...)'
              - pattern-inside: '$C.$M(..., {..., filter: $OBJ, ...}, ...)'
              - pattern-inside: '$C.$M(..., {..., query: {..., filter: $OBJ, ...}, ...}, ...)'
              - pattern-inside: '$C.$M(..., {..., preFilter: $OBJ, ...}, ...)'
              - pattern-inside: '{..., $vectorSearch: {..., filter: $OBJ, ...}, ...}'
              - pattern-inside: $C.$M($Q, $K, $OBJ, ...)
              - pattern-inside: $C.asRetriever($K, $OBJ, ...)
          - pattern: $OBJ
          - metavariable-regex:
              metavariable: $OBJ
              regex: |-
                (?s)^\{.*,\s*\[[^\]]*\]\s*:(?:"[^"\n]*"|'[^'\n]*'|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|\{[^{}]*\}|[^,{}()\[\]"'])++\s*,?\s*\}$
          - metavariable-pattern:
              metavariable: $OBJ
              patterns:
                - pattern: '{..., [$CK]: $CV, ...}'
                - metavariable-regex:
                    metavariable: $CK
                    regex: ^(?:[\w$.]*\.)?(?:req|request)\.(?:body|query|params)\b
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone). The table is the
      # application's own text, whatever key the caller sends.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:[\w$.]*\.)?(?:req|request)\.)(?:[\w$.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if (!ALLOWED_TONES.includes(tone)) return ...`. Only the
      # checked value, and not a blocklist.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.includes($X)
              - pattern: $ALLOWED.has($X)
              - pattern: $X in $ALLOWED
              - pattern: Object.hasOwn($ALLOWED, $X)
              - pattern: $ALLOWED.hasOwnProperty($X)
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check anchored at both ends: /^[a-z]{2}(-[A-Z]{2})?$/.test(locale).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # Fields of a zod schema in this file that only admit a fixed set or a number,
      # z.object({ tone: z.enum(["formal", "casual"]) }), read from a value parsed with it:
      # const { tone } = ChatBody.parse(...), or body.tone after body = ChatBody.parse(...).
      - patterns:
          - pattern-inside: |
              const $S = z.object({..., $FIELD: $V, ...});
              ...
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FIELD, ...} = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const {..., $FIELD, ...} = await $S.parseAsync(...);
                          ...
                  - pattern: $FIELD
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $O = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const $O = await $S.parseAsync(...);
                          ...
                  - pattern: $O.$FIELD
      # A whole value parsed with such a schema: Tone.parse(x), z.enum([...]).parse(x).
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      const $S = $Z;
                      ...
                  - pattern-either:
                      - pattern: $S.parse(...)
                      - pattern: $S.safeParse(...)
              - patterns:
                  - pattern-either:
                      - pattern: $Z.parse(...)
                      - pattern: $Z.safeParse(...)
          - metavariable-regex:
              metavariable: $Z
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
      - exact: true
        pattern-either:
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
      # An object literal is the server's own structure: { orgId: session.orgId, topic:
      # body.topic } keeps its scope even though a field value comes from the request. Not when
      # the request may get the last word, which overrides a server key: a trailing ...spread
      # or a computed last key.
      # Nor an options object that holds the filter itself
      # ({ topK, filter }), since a sanitizer also hides the sink inside it.
      - exact: true
        patterns:
          - pattern-inside: '{...}'
          - pattern: $D
          - pattern-not: '{..., filter: $KWV, ...}'
          - pattern-not: '{..., where: $KWV, ...}'
          - pattern-not: '{..., expr: $KWV, ...}'
          - pattern-not: '{..., preFilter: $KWV, ...}'
          - pattern-not: '{..., $vectorSearch: $KWV, ...}'
          - pattern-not: '{..., data: [..., {..., expr: $KWV, ...}, ...], ...}'
          - pattern-not: '{..., query: {..., filter: $KWV, ...}, ...}'
          - metavariable-regex:
              metavariable: $D
              regex: |-
                (?s)^\{(?!.*(?:\.\.\.(?:"[^"\n]*"|'[^'\n]*'|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|\{[^{}]*\}|[^,{}()\[\]"'])++|,\s*\[[^\]]*\]\s*:(?:"[^"\n]*"|'[^'\n]*'|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|\{[^{}]*\}|[^,{}()\[\]"'])++)\s*,?\s*\}$).*\}$
      # Any other call builds a new value on the server: a helper that adds the tenant, a
      # filter builder. Not the readers, parsers, and copies that hand the request's structure
      # through, and never the query calls themselves, since a sanitizer on a call also hides
      # a sink in its arguments.
      - exact: true
        patterns:
          - pattern: $F(...)
          - pattern-not: '$F(..., {..., filter: $KWV, ...}, ...)'
          - pattern-not: '$F(..., {..., where: $KWV, ...}, ...)'
          - pattern-not: '$F(..., {..., expr: $KWV, ...}, ...)'
          - pattern-not: '$F(..., {..., data: [..., {..., expr: $KWV, ...}, ...], ...}, ...)'
          - pattern-not: $C.aggregate(...)
          # Nor a call that takes a handler (app.post("/x", async (req, res) => {...})): as a
          # sanitizer it stops every call inside the handler from clearing taint.
          - pattern-not: $F(..., ($P, ...) => {...}, ...)
          - pattern-not: $F(..., function ($P, ...) {...}, ...)
          - pattern-not: '$F(..., {..., query: {..., filter: $KWV, ...}, ...}, ...)'
          - pattern-not: $O.similaritySearch(...)
          - pattern-not: $O.similaritySearchWithScore(...)
          - pattern-not: $O.similaritySearchVectorWithScore(...)
          - pattern-not: $O.asRetriever(...)
          - pattern-not: $S.where(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?s)^(?!(?:.*\.)?(?:json|text|formData|get|getAll|parse|safeParse|parseAsync|safeParseAsync|structuredClone|assign|fromEntries|entries|clone|toJSON|valueOf|param|query|queries|header|valid|parseBody|String|toString|trim|trimStart|trimEnd|toLowerCase|toUpperCase)$)
      # A lookup keyed by request data returns the server's value: savedViews.get(viewId),
      # presets[body.preset]. A literal key reads the request itself (params.get("filter")).
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $T.get($K)
              - pattern: $T[$K]
          # Not Chroma's collection.get({ where }), a query call.
          - pattern-not: $T.get({...})
          - metavariable-regex:
              metavariable: $K
              regex: ^(?!["'`]|-?\d)
      # A Pinecone namespace or Qdrant shard key chosen on the server (index.namespace(orgId),
      # namespace: `org-${orgId}`, shard_key: session.orgId) partitions the index per tenant, so
      # the filter only narrows inside it.
      - patterns:
          - pattern-either:
              - pattern-inside: '$I.namespace($NS).$M({..., filter: $X, ...})'
              - patterns:
                  - pattern-inside: |
                      const $N = $I.namespace($NS);
                      ...
                  - pattern-inside: '$N.$M({..., filter: $X, ...})'
              - patterns:
                  - pattern-inside: '$O.$M({..., namespace: $NS, ...})'
                  - pattern-either:
                      - pattern-inside: '$O.$M({..., filter: $X, ...})'
                      - pattern-inside: '$O.$M({..., query: {..., filter: $X, ...}, ...})'
              - patterns:
                  - pattern-inside: '$O.$M($COLL, {..., shard_key: $NS, ...})'
                  - pattern-inside: '$O.$M($COLL, {..., filter: $X, ...})'
          - metavariable-regex:
              metavariable: $NS
              regex: |-
                ^(?![\"'`][^$]*$|(?:[\w$.]*\.)?[A-Z][A-Z0-9_]*$)
          - pattern: $X
    pattern-sinks:
      # chromadb 3.5: collection.query / get / delete({ where }). whereDocument only matches
      # document text and is ANDed with where, so it can't widen the scope. delete({ where })
      # is also Prisma's, so only on a receiver named like a Chroma collection.
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: '$C.query({..., where: $X, ...})'
              - pattern-inside: '$C.get({..., where: $X, ...})'
              - patterns:
                  - pattern-inside: '$C.delete({..., where: $X, ...})'
                  - metavariable-regex:
                      metavariable: $C
                      regex: (?i).*(?:collection|chroma)
          - pattern: $X
      # Chroma's Search API: new Search({ where }), new Search().where(...).
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: 'new Search({..., where: $X, ...})'
              - pattern-inside: new Search(...).where($X)
          - pattern: $X
      # Pinecone 9: index.query, deleteMany, fetchByMetadata({ filter }), update({ filter }) on a
      # receiver named like an index, and searchRecords({ query: { filter } }).
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '$I.$M({..., filter: $X, ...})'
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:query|deleteMany|fetchByMetadata)$
              - patterns:
                  - pattern-inside: '$I.update({..., filter: $X, ...})'
                  - metavariable-regex:
                      metavariable: $I
                      regex: (?i)^(?:.*(?:index|pinecone|namespace)|(?:[\w$.]*\.)?ns$)
              - pattern-inside: '$I.searchRecords({..., query: {..., filter: $X, ...}, ...})'
          - pattern: $X
      # @zilliz/milvus2-sdk-node 3.0: search, query, delete, deleteEntities, count,
      # queryIterator, searchIterator, hybridSearch({ collection_name, filter | expr }), a
      # string expression; exprValues templating keeps request values out of it.
      - exact: true
        patterns:
          - pattern-inside: '$C.$M({..., collection_name: $COLL, ...})'
          - pattern-either:
              - pattern-inside: '$C.$M({..., filter: $X, ...})'
              - pattern-inside: '$C.$M({..., expr: $X, ...})'
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:search|query|delete|deleteEntities|count|queryIterator|searchIterator|hybridSearch)$
          - pattern: $X
      # hybridSearch also takes an expression per sub-search: data: [{ anns_field, data, expr }],
      # inline or built in an array first.
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '$C.hybridSearch({..., collection_name: $COLL, ...})'
                  - pattern-inside: '$C.hybridSearch({..., data: [..., {..., expr: $X, ...}, ...], ...})'
              - pattern-inside: |
                  const $REQS = [..., {..., expr: $X, ...}, ...];
                  ...
                  $C.hybridSearch({..., data: $REQS, ...});
          - pattern: $X
      # MongoDB Atlas Vector Search: the filter of a $vectorSearch stage, in a pipeline passed
      # to collection.aggregate or built beforehand. A later $match only narrows what the stage
      # returned.
      - exact: true
        patterns:
          - pattern-inside: '{..., $vectorSearch: {..., filter: $X, ...}, ...}'
          - pattern: $X
      # @qdrant/js-client-rest 1.20: query, queryGroups, scroll, count, facet, searchMatrix*,
      # the older search / recommend / discover, and delete / deleteVectors / setPayload /
      # overwritePayload / deletePayload / clearPayload by filter (collection, { filter }).
      - exact: true
        patterns:
          - pattern-inside: '$Q.$M($COLL, {..., filter: $X, ...})'
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:query|queryGroups|scroll|count|facet|searchMatrixPairs|searchMatrixOffsets|search|searchGroups|recommend|recommendGroups|discover|delete|deleteVectors|setPayload|overwritePayload|deletePayload|clearPayload)$
          - pattern: $X
      # The same options built in a variable first: const search = { topK, filter }, then
      # index.query(search) or qdrant.query("docs", search).
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      const $OPTS = {..., filter: $X, ...};
                      ...
                      $I.$M($OPTS);
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:query|deleteMany|fetchByMetadata)$
              - patterns:
                  - pattern-inside: |
                      const $OPTS = {..., where: $X, ...};
                      ...
                      $I.$M($OPTS);
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:query|get)$
              - patterns:
                  - pattern-inside: |
                      const $OPTS = {..., filter: $X, ...};
                      ...
                      $I.$M($COLL, $OPTS);
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:query|queryGroups|scroll|count|facet|search|recommend|discover|delete)$
          - pattern: $X
      # LangChain.js (@langchain/core 1.3 VectorStore): similaritySearch(query, k, filter),
      # similaritySearchWithScore, similaritySearchVectorWithScore, maxMarginalRelevanceSearch(
      # query, { filter }), asRetriever(k, filter) / asRetriever({ filter }), new
      # VectorStoreRetriever({ filter }), retriever.filter set afterwards, and the store-wide
      # filter of @langchain/community 1.1 Chroma and @langchain/pinecone 1.0 PineconeStore.
      # @langchain/mongodb 1.3 takes { preFilter } as that filter, so an object holding
      # preFilter isn't cleared as the server's own.
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $VS.similaritySearch($Q, $K, $X, ...)
              - pattern-inside: $VS.similaritySearchWithScore($Q, $K, $X, ...)
              - pattern-inside: $VS.similaritySearchVectorWithScore($Q, $K, $X, ...)
              - pattern-inside: '$VS.maxMarginalRelevanceSearch($Q, {..., filter: $X, ...}, ...)'
              - pattern-inside: $VS.asRetriever($K, $X, ...)
              - pattern-inside: '$VS.asRetriever({..., filter: $X, ...}, ...)'
              - pattern-inside: 'new VectorStoreRetriever({..., filter: $X, ...})'
              # A store-wide filter: new Chroma(embeddings, { filter }), PineconeStore
              # .fromExistingIndex(embeddings, { pineconeIndex, filter }).
              - patterns:
                  - pattern-either:
                      - pattern-inside: 'new $VSC($EMB, {..., filter: $X, ...})'
                      - pattern-inside: '$VSC.fromExistingIndex($EMB, {..., filter: $X, ...})'
                      - pattern-inside: '$VSC.fromExistingCollection($EMB, {..., filter: $X, ...})'
                  - metavariable-regex:
                      metavariable: $VSC
                      regex: ^(?:[\w$.]*\.)?(?:Chroma|PineconeStore)$
              - patterns:
                  - pattern-inside: $R.filter = $X
                  - metavariable-regex:
                      metavariable: $R
                      regex: (?i).*retriever
          - pattern: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM09:2026 - Vector and Embedding Weaknesses"
        - "LLM08:2025 - Vector and Embedding Weaknesses"
      owasp-aisvs:
        - "v1.01-C8.1.3 - Access Controls on Memory & RAG Indices"
      mitre-atlas:
        - "AML.T0085.000 - Data from AI Services: RAG Databases"
      cwe:
        - "CWE-639: Authorization Bypass Through User-Controlled Key"
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      # A collection, namespace, or database that is already per-tenant makes a filter from
      # the request a search option rather than the access boundary; the rule skips Pinecone
      # namespaces and Qdrant shard keys set from a variable, but can't see per-tenant
      # collections.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [nextjs, express, hono, chromadb, pinecone, qdrant, langchain]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM09_VectorAndEmbeddingWeaknesses.md
        - https://github.com/OWASP/AISVS/blob/v1.01/1.01/en/0x10-C08-Memory-Embeddings-and-Vector-Database.md
        - https://cwe.mitre.org/data/definitions/639.html
        - https://www.npmjs.com/package/chromadb/v/3.5.0
        - https://www.npmjs.com/package/@pinecone-database/pinecone/v/9.1.0
        - https://www.npmjs.com/package/@qdrant/js-client-rest/v/1.20.0
        - https://www.npmjs.com/package/@langchain/core/v/1.3.0
