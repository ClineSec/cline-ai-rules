rules:
  - id: langchain-load-untrusted-input-ts
    # Generated by scripts/gen_langchain_load_untrusted_input.py. The pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt-ts's request-data sources and
    # lookup sanitizers, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # Load APIs checked 2026-10-25: @langchain/core 1.3.0, 1.1.8, 1.1.7, 0.3.80, 0.3.79
    # (dist/load/index.js), langchain 1.5.19 (dist/load/index.js).
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Request data (a JSON body, form field, query parameter, or server action argument) is
      handed to LangChain.js `load()`, which builds objects from it. A request is not a trusted
      manifest: the caller can describe any class in the import maps, with their own
      constructor arguments. With the defaults that means @langchain/core's prompt, message,
      document, and runnable classes (and the langchain package's own classes for
      `langchain/load`), so the caller writes the prompts and chat history this app then runs;
      every class added through `importMap` or `optionalImportsMap`, such as a chat model, can
      be built with the caller's base URL. Before @langchain/core 0.3.80 and 1.1.8, an entry
      like `{"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}` also came back as the key
      read from the environment. Parse the request into plain fields or message objects you
      validate with a schema, and build LangChain objects from them in code.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Express and Fastify (req.body, req.query,
      # req.params, req.get()), the Fetch API Request in Next.js route handlers (await
      # request.json(), request.formData(), request.url), Next.js NextRequest (request.nextUrl),
      # Hono (c.req.json(), c.req.query(), c.req.param()), and Koa (ctx.request.body).
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:[\w$.]*\.)?(?:req|request)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:body|query|queries|params|param|headers|header|get|cookies|signedCookies|url|originalUrl|path|nextUrl|json|formData|text|parseBody|valid)$
      # Next.js route handlers, whatever the request parameter is called, and their dynamic
      # route segments: export async function POST(r: Request, { params }).
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, ...) { ... }
              - pattern: export function $M($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, $CTX, ...) { ... }
              - pattern: export function $M($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      # URL query parameters: a Next.js page's searchParams prop, useSearchParams().
      - patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: ^searchParams$
      # Server actions: the client chooses every argument of an exported function in a
      # "use server" module, or of a function marked "use server", and TypeScript types are not
      # checked at runtime.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  "use server";
                  ...
              - pattern-inside: |
                  'use server';
                  ...
          - pattern-either:
              - pattern: export async function $F(..., $P, ...) { ... }
              - pattern: export const $F = async (..., $P, ...) => {...};
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: 'async function $F(..., $P, ...) { "use server"; ... }'
              - pattern: "async function $F(..., $P, ...) { 'use server'; ... }"
              - pattern: 'async (..., $P, ...) => { "use server"; ... }'
          - focus-metavariable: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone). The table is the
      # application's own text, whatever key the caller sends.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:[\w$.]*\.)?(?:req|request)\.)(?:[\w$.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if (!ALLOWED_TONES.includes(tone)) return ...`. Only the
      # checked value, and not a blocklist.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.includes($X)
              - pattern: $ALLOWED.has($X)
              - pattern: $X in $ALLOWED
              - pattern: Object.hasOwn($ALLOWED, $X)
              - pattern: $ALLOWED.hasOwnProperty($X)
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check anchored at both ends: /^[a-z]{2}(-[A-Z]{2})?$/.test(locale).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # Fields of a zod schema in this file that only admit a fixed set or a number,
      # z.object({ tone: z.enum(["formal", "casual"]) }), read from a value parsed with it:
      # const { tone } = ChatBody.parse(...), or body.tone after body = ChatBody.parse(...).
      - patterns:
          - pattern-inside: |
              const $S = z.object({..., $FIELD: $V, ...});
              ...
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FIELD, ...} = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const {..., $FIELD, ...} = await $S.parseAsync(...);
                          ...
                  - pattern: $FIELD
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $O = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const $O = await $S.parseAsync(...);
                          ...
                  - pattern: $O.$FIELD
      # A whole value parsed with such a schema: Tone.parse(x), z.enum([...]).parse(x).
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      const $S = $Z;
                      ...
                  - pattern-either:
                      - pattern: $S.parse(...)
                      - pattern: $S.safeParse(...)
              - patterns:
                  - pattern-either:
                      - pattern: $Z.parse(...)
                      - pattern: $Z.safeParse(...)
          - metavariable-regex:
              metavariable: $Z
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
      - exact: true
        pattern-either:
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
      # A lookup keyed by request data returns stored data, not the caller's text: a Prisma,
      # Drizzle, or SQL query, a vector-store or retriever search, a getX / fetchX / findX
      # helper, or fetch(). (Stored data that came from users earlier is a different, indirect
      # injection.) `exact` keeps a sink inside the call's own arguments, and calls that are
      # themselves a system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: fetch(...)
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w$.]*\.)?(?:get|fetch|find|load|lookup|search|retrieve|query|select)[A-Z_][\w$]*$
                  # Not the request's own readers.
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:[\w$.]*\.)?(?:req|request|searchParams)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:find(?:Unique|First|Many|One|ById|ByPk|All)\w*|similaritySearch\w*|maxMarginalRelevanceSearch|getRelevantDocuments|query|execute|all|first)$
                  # Not Hono's c.req.query("x").
                  - metavariable-regex:
                      metavariable: $O
                      regex: ^(?!(?:[\w$.]*\.)?(?:req|request)$)
              - patterns:
                  - pattern: $O.invoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:retriever|vectorStore|vectorDb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.retrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:retriever|vectorStore|vectorDb|kb|knowledgeBase|docStore|docIndex|searchIndex|index|corpus|tavily\w*)$
              - pattern: axios(...)
              - pattern: axios.$M(...)
              - pattern: got(...)
              - pattern: ky(...)
          - pattern-not: new SystemMessage(...)
          - pattern-not: '$G(..., {..., system: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., instructions: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., systemPrompt: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., systemInstruction: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., role: $X, ...}, ...)'
    pattern-sinks:
      # The text handed to @langchain/core/load or langchain/load load(text, ...).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { load } from "=~/^(?:@langchain\/core\/load|langchain\/load)$/";
                          ...
                      - pattern-inside: |
                          const { load } = require("=~/^(?:@langchain\/core\/load|langchain\/load)$/");
                          ...
                  - pattern-either:
                      - pattern: load($X, ...)
                      # OpenGrep 1.30.2 parses `await load<T>(x)` as a call whose callee is
                      # `await load`, so a generic call under await needs its own shape.
                      - patterns:
                          - pattern: $AW($X, ...)
                          - metavariable-pattern:
                              metavariable: $AW
                              language: generic
                              pattern: await load
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { load as $L } from "=~/^(?:@langchain\/core\/load|langchain\/load)$/";
                          ...
                      - pattern-inside: |
                          const { load: $L } = require("=~/^(?:@langchain\/core\/load|langchain\/load)$/");
                          ...
                  - pattern-either:
                      - pattern: $L($X, ...)
                      # OpenGrep 1.30.2 parses `await load<T>(x)` as a call whose callee is
                      # `await load`, so a generic call under await needs its own shape.
                      - patterns:
                          - pattern: $AW($X, ...)
                          - metavariable-pattern:
                              metavariable: $AW
                              language: generic
                              pattern: await $L
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import * as $NS from "=~/^(?:@langchain\/core\/load|langchain\/load)$/";
                          ...
                      - pattern-inside: |
                          const $NS = require("=~/^(?:@langchain\/core\/load|langchain\/load)$/");
                          ...
                  - pattern-either:
                      - pattern: $NS.load($X, ...)
                      # OpenGrep 1.30.2 parses `await load<T>(x)` as a call whose callee is
                      # `await load`, so a generic call under await needs its own shape.
                      - patterns:
                          - pattern: $AW($X, ...)
                          - metavariable-pattern:
                              metavariable: $AW
                              language: generic
                              pattern: await $NS.load
          # Calls langchain-load-unsafe-objects-ts reports: secretsFromEnv turned on (inline,
          # in a const options object, or langchain/load's fifth argument) or the whole
          # environment as the secrets map.
          - pattern-not-inside: '$G($Y, {..., secretsFromEnv: true, ...}, ...)'
          - pattern-not-inside: '$G($Y, {..., secretsMap: process.env, ...}, ...)'
          - pattern-not-inside: $G($Y, $SM, $OM, $AM, true)
          - pattern-not-inside: $G($Y, process.env, ...)
          - pattern-not-inside: |
              const $OPTS = {..., secretsFromEnv: true, ...};
              ...
              $G($Y, $OPTS);
          - focus-metavariable: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
        - "LLM02:2026 - Sensitive Information Disclosure"
        - "LLM02:2025 - Sensitive Information Disclosure"
      owasp-aisvs:
        - "v1.01-C4.1.2 - AI Workload Sandboxing & Validation"
      mitre-atlas:
        - "AML.T0011.000 - User Execution: Unsafe AI Artifacts"
        - "AML.T0055 - Unsecured Credentials"
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      # LangChain's own guidance is never to load() request data, so a match is almost always
      # real; how much the caller can build depends on the installed version (see the message).
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [express, nextjs, hono, node, langchain]
      references:
        - https://github.com/advisories/GHSA-c67j-w6g6-q2cm
        - https://github.com/advisories/GHSA-pjwx-r37v-7724
        - https://github.com/advisories/GHSA-r399-636x-v7f6
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
        - https://cwe.mitre.org/data/definitions/502.html
        - https://www.npmjs.com/package/@langchain/core/v/1.3.0
