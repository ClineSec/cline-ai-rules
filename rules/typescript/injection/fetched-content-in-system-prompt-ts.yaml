rules:
  - id: fetched-content-in-system-prompt-ts
    # Generated by scripts/gen_fetched_content_in_system_prompt.py. The pattern-sinks up to
    # the LangChain template block are secret-in-system-prompt-ts's (imported from
    # gen_secret_in_system_prompt.py), and the template block is user-input-in-system-prompt-ts's
    # (build.py SHARED_BLOCKS checks both copies). Edit the scripts and run scripts/build.py;
    # build.py --check fails if this file drifts.
    # Sources checked 2026-10-23: @langchain/core 1.3.0 (vectorstores, retrievers,
    # document_loaders/base), langchain 1.5.19 (dynamicSystemPromptMiddleware),
    # @langchain/classic 1.0.55 (createStuffDocumentsChain), @llamaindex/core 0.6.23,
    # axios 1.20.0, pg 8.23.1, drizzle-orm 0.45.4, @prisma/client 7.10.1, @tavily/core 0.7.14,
    # exa-js 2.26.0, @mendable/firecrawl-js 4.51.0, chromadb 3.5.0,
    # @pinecone-database/pinecone 9.1.0, @qdrant/js-client-rest 1.20.0, weaviate-client 3.15.1,
    # @langchain/community 1.1.29, @langchain/tavily 1.2.0, serpapi 2.2.1, duck-duck-scrape 2.2.7,
    # googleapis 188.0.0, playwright-core 1.64.1, puppeteer-core 25.16.0; 2026-10-24:
    # @modelcontextprotocol/sdk 1.32.2 and @modelcontextprotocol/client 2.4.0 (callTool).
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Content the application fetched or looked up (a retrieved document, a web page or HTTP
      response body, a search result, an MCP server's tool result, or the text of a stored
      ticket, message, or comment) reaches the model's system prompt or developer instructions.
      Whoever wrote that content (a page's author, anyone who can add a document to the index,
      the server's operator, the customer who filed the ticket) can plant instructions in it,
      and in the system slot those instructions carry the application's own authority: they
      can switch off guardrails, unlock tools, and steer what the agent does with its
      permissions (indirect prompt injection). Keep the system prompt fixed or chosen on the
      server, and pass fetched content in a user message or tool result, delimited and labeled
      as data to use, not instructions to follow.
    mode: taint
    options:
      # A count or a comparison says something about the content without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Retrieved documents. LangChain.js vector stores (similaritySearch*,
      # maxMarginalRelevanceSearch, and the pre-1.0 getRelevantDocuments), retrievers (invoke /
      # batch on an object named like a retriever, or anything asRetriever() returns, which also
      # covers LCEL chains), and LlamaIndex.TS retrievers (retrieve); search() on a store or
      # index named like one.
      - exact: true
        pattern-either:
          - patterns:
              - pattern: $O.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:similaritySearch\w*|maxMarginalRelevanceSearch|getRelevantDocuments)$
          - pattern: $X.asRetriever(...)
          - patterns:
              - pattern-either:
                  - pattern: $O.invoke(...)
                  - pattern: $O.batch(...)
                  - pattern: $O.retrieve(...)
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    (?i)^(?:[\w$.]*\.)?[\w$]*retriever$
          - patterns:
              - pattern: $O.search(...)
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    (?i)^(?:[\w$.]*\.)?[\w$]*(?:vectorStore|vectorDb|kb|knowledgeBase|docStore|docIndex|searchIndex|index|corpus)$
      # Document loaders and readers (LangChain.js BaseDocumentLoader.load, LlamaIndex.TS
      # readers' loadData): web pages, uploaded files, and synced workspaces.
      - exact: true
        patterns:
          - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:load|loadAndSplit|loadData|lazyLoad)$
          - pattern-either:
              - pattern: new $CLS(...).$M(...)
              - patterns:
                  - pattern-inside: |
                      const $L = new $CLS(...);
                      ...
                  - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $CLS
              regex: |-
                ^(?:[\w$.]*\.)?(?!(?:Data|Base)Loader$)[A-Z][\w$]*(?:Loader|Reader)$
      # Web search, scraping, and vector database results. Tavily (tavily({ apiKey })), Exa,
      # and Firecrawl clients; LangChain.js search tools (SerpAPI, Bing, Brave, DuckDuckGo,
      # Google Custom Search, SearchApi, SearxNG, Serper, Tavily); serpapi 2.2.1's getJson /
      # getHtml with an engine; googleapis' customsearch; or a client named like one of these
      # (ddg for duck-duck-scrape 2.2.7, serp, brave, bing, webSearch, searchTool); Chroma collection.query({
      # queryTexts }), Pinecone index.query({ includeMetadata: true }), Qdrant
      # client.query(collection, { query }), and Weaviate collection.query.nearText / hybrid /
      # bm25 / nearVector / fetchObjects.
      - exact: true
        pattern-either:
          - pattern: tavily(...)
          - pattern: new Exa(...)
          - pattern: new Firecrawl(...)
          - pattern: new FirecrawlApp(...)
          - pattern: new FirecrawlClient(...)
          - patterns:
              - pattern: new $CLS(...)
              - metavariable-regex:
                  metavariable: $CLS
                  regex: |-
                    ^(?:[\w$.]*\.)?(?:SerpAPI|BingSerpAPI|BraveSearch|DuckDuckGoSearch|GoogleCustomSearch|SearchApi|SearxngSearch|Serper|Tavily(?:Search|Extract|Crawl|Research|GetResearch)(?:APIWrapper)?)$
          - patterns:
              - pattern-either:
                  - pattern: '$F({..., engine: $E, ...}, ...)'
                  - pattern: '$F("$E", {...}, ...)'
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(?:[\w$.]*\.)?get(?:Json|Html)$
          - pattern: google.customsearch(...)
          - pattern: customsearch(...)
          - patterns:
              - pattern: $T.$M(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    ^(?:[\w$.]*\.)?(?:(?i:[\w$]*tavily[\w$]*|[\w$]*firecrawl[\w$]*|[\w$]*duckduckgo[\w$]*|ddg[\w$]*)|exa(?:[A-Z_][\w$]*)?|[\w$]*Exa|serp[\w$]*|[\w$]*Serp[\w$]*|brave(?:[A-Z_][\w$]*)?|[\w$]*Brave|bing(?:[A-Z_][\w$]*)?|[\w$]*Bing|webSearch[\w$]*|[\w$]*WebSearch|searchTool|[\w$]*SearchTool)$
              - metavariable-regex:
                  metavariable: $M
                  regex: |-
                    ^(?:search|extract|crawl|searchQNA|searchContext|searchAndContents|getContents|findSimilarAndContents|answer|scrape|scrapeUrl|batchScrape|crawlUrl|invoke|call|run|getJson|getHtml)$
          - pattern: '$C.query({..., queryTexts: $Q, ...})'
          - pattern: '$C.query({..., queryEmbeddings: $Q, ...})'
          - pattern: '$I.query({..., includeMetadata: true, ...})'
          - pattern: '$C.query($N, {..., query: $Q, ...})'
          - patterns:
              - pattern: $C.query.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:nearText|nearVector|nearObject|hybrid|bm25|fetchObjects)$
      # A helper that fetches a page or retrieves documents by its name: fetchPage(url),
      # scrapeUrl(...), findRelevantContent(question), searchDocs(query).
      - exact: true
        patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:[\w$.]*\.)?_?(?:(?:fetch|scrape|crawl|download|browse)[\w$]*?(?:Page|Webpage|Html|HTML|Url|URL|Website|Site|Link|Web)s?(?:[A-Z][\w$]*)?|(?:get|find|search|retrieve|query|fetch|lookup)[\w$]*?(?:Docs|Documents|Chunks|Passages|Articles|Snippets|Nodes|Knowledge|Kb|KB|SearchResults|RelevantContent|(?:Relevant|Retrieved|Kb|Rag)Context))$
      # An MCP server's tool result, read through an MCP client: Client.callTool
      # (@modelcontextprotocol/sdk 1.32.2, @modelcontextprotocol/client 2.4.0).
      - exact: true
        pattern: $C.callTool(...)
      # Records (label RECORD), which count only through a field named like people's text below.
      # HTTP responses: fetch, axios (and axios.create clients), got, ky, and a client call
      # whose first argument looks like a URL. Not a route registration (app.get("/x", (req,
      # res) => ...), router.post("/y", auth, handler)): as a source it would cover the whole
      # handler, and OpenGrep then drops the sources inside it.
      - label: RECORD
        exact: true
        pattern-either:
          - pattern: fetch(...)
          - pattern: axios(...)
          - pattern: axios.$M(...)
          - pattern: got(...)
          - pattern: got.$M(...)
          - pattern: ky(...)
          - pattern: ky.$M(...)
          - patterns:
              - pattern: $S.$VERB($URL, ...)
              - pattern-not: $S.$VERB($URL, ..., ($...P) => $BODY, ...)
              - pattern-not: $S.$VERB($URL, ..., function ($...P) {...}, ...)
              - metavariable-regex:
                  metavariable: $VERB
                  regex: ^(?:get|post|put|patch|request|fetch)$
              - metavariable-regex:
                  metavariable: $URL
                  regex: |-
                    (?i)^(?:[\"'`](?:https?://|/)|[\w$.]*(?:url|uri|endpoint|link|href)s?(?:\[.*\])?$)
              - metavariable-regex:
                  metavariable: $S
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:req|request)$)(?!Promise$)(?!.*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))
              - metavariable-regex:
                  metavariable: $S
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:app|server|fastify|hono|routes?|[\w$]*[rR]outer)$)
      # Database reads: Prisma (findUnique, findFirst, findMany), Drizzle (select().from(),
      # db.query.*.find*), pg and mysql2 query / execute, Kysely, TypeORM, Mongoose,
      # better-sqlite3 prepare().get() / all(), postgres.js sql`...`, and helpers named like a
      # lookup (getTicket, fetchThread). Clients, tables, and helpers named like configuration
      # (tenantSettings, getPersona) are the operators' own text and don't count.
      - label: RECORD
        exact: true
        pattern-either:
          - patterns:
              - pattern: $F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?[\w$]*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))(?!(?:[\w$.]*\.)?(?:req|request|searchParams)\.)(?:[\w$.]*\.)?_?(?:get|fetch|find|load|lookup|query|select)[A-Z_][\w$]*$
          - patterns:
              - pattern: $O.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: |-
                    ^(?:find(?:Unique|First|Many|One|ById|ByPk|All|By)\w*|query|execute|executeTakeFirst\w*|all|first|aggregate)$
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:req|request)$)(?!Promise$)(?!.*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))
          - patterns:
              - pattern-either:
                  - pattern: $DB.select(...).from($T)
                  - pattern: $DB.prepare(...).get(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:req|request)$)(?!Promise$)(?!.*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))
          - pattern: sql`...`
      # A browser page (Playwright or Puppeteer newPage): page.content(), page.innerText("main").
      - label: RECORD
        exact: true
        pattern: $B.newPage(...)
      # What a page script returns, when the script reads the page's text: Playwright and
      # Puppeteer page.evaluate(() => document.body.innerText), page.$eval("article", (e) =>
      # e.textContent), locator.evaluateAll(...).
      - requires: RECORD
        patterns:
          - pattern-either:
              - pattern: $P.evaluate($JS, ...)
              - pattern: $P.evaluateAll($JS, ...)
              - patterns:
                  - pattern: $P.$EV($SEL, $JS, ...)
                  - metavariable-regex:
                      metavariable: $EV
                      regex: ^\$\$?eval$
          - metavariable-regex:
              metavariable: $JS
              regex: |-
                (?is).*(?:\b(?:inner|outer)(?:text|html)\b|\btextcontent\b|document\.(?:body|documentelement)\b|getselection)
      # The text in a record: a field, key, or variable named like something a person writes
      # (ticket.body, row["comment"], const lastMessage = ...), or the decoded body of an HTTP
      # response or page (await res.text(), cheerio's $("main").text(), page.innerText("main")).
      - requires: RECORD
        patterns:
          - pattern: $O.$F
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)$
      - requires: RECORD
        patterns:
          - pattern: $O[$K]
          - metavariable-regex:
              metavariable: $K
              regex: |-
                ^["'`](?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)["'`]$
      - requires: RECORD
        patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme)$
      # An array callback over records that reads a text field: rows.map((c) => c.text). The
      # callback parameter doesn't keep the RECORD label in default mode, so the call counts.
      - requires: RECORD
        patterns:
          - pattern-either:
              - pattern: $XS.$METHOD(($X, ...) => <... $X.$F ...>)
              - pattern: '$XS.$METHOD(($X, ...) => { ... <... $X.$F ...>; ... })'
              - pattern: '$XS.$METHOD(function ($X, ...) { ... <... $X.$F ...>; ... })'
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|filter|find|findLast|reduce)$
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)$
      # LangChain.js's stuff-documents chain (@langchain/classic 1.0.55) fills the prompt's
      # {context} variable with the retrieved documents, so a system message holding it is the
      # system prompt with the documents in it.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], ...], ...);
                  ...
                  <... createStuffDocumentsChain({..., prompt: $P, ...}) ...>;
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), ...], ...);
                  ...
                  <... createStuffDocumentsChain({..., prompt: $P, ...}) ...>;
          - metavariable-regex:
              metavariable: $T
              regex: (?s).*\{context\}
          - pattern: '"$T"'
    pattern-propagators:
      # Array callbacks over records or documents (rows.map((c) => c.text)) taint the callback's
      # element parameter, which default mode doesn't do on its own.
      - patterns:
          - pattern-either:
              - pattern: $XS.$METHOD(($X, ...) => $BODY)
              - pattern: $XS.$METHOD(($X, ...) => {...})
              - pattern: $XS.$METHOD(function ($X, ...) {...})
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|forEach|filter|find|findLast|reduce)$
        from: $XS
        to: $X
      # And the call's result. --taint-intrafile drops the receiver's taint from an array
      # callback on a field (found.results.map((r) => r.content)), though not on a plain name.
      - patterns:
          - pattern: $CALL
          - pattern: $XS.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|forEach|filter|find|findLast|reduce)$
        from: $XS
        to: $CALL
    pattern-sanitizers:
      # Facts about the content are not the content: a count, a number, a flag.
      - exact: true
        pattern-either:
          - pattern: $X.length
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
    pattern-sinks:
      # Request objects: Anthropic messages.create / stream, Bedrock ConverseCommand, AI SDK
      # generateText / streamText / generateObject / streamObject (system is deprecated in
      # favor of instructions in AI SDK 7), OpenAI Responses, and OpenAI Realtime sessions. The
      # Assistants API is not a sink: OpenAI removed it on 2026-08-26
      # (https://developers.openai.com/api/docs/deprecations, checked 2026-10-22).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '{..., system: $X, ...}'
                  - pattern-either:
                      - pattern-inside: '{..., messages: $IN, ...}'
                      - pattern-inside: '{..., prompt: $IN, ...}'
              - patterns:
                  - pattern-inside: '{..., instructions: $X, ...}'
                  - pattern-either:
                      - pattern-inside: '{..., messages: $IN, ...}'
                      - pattern-inside: '{..., prompt: $IN, ...}'
                      - pattern-inside: '{..., input: $IN, ...}'
              - pattern-inside: '$C.messages.$M({..., system: $X, ...}, ...)'
              - pattern-inside: '$C.responses.$M({..., instructions: $X, ...}, ...)'
              # OpenAI Realtime session config (session.update, clientSecrets.create).
              - patterns:
                  - pattern-inside: '{..., type: "realtime", ...}'
                  - pattern-inside: '{..., instructions: $X, ...}'
          - focus-metavariable: $X
      # Agent classes: OpenAI Agents SDK new Agent({ instructions }), AI SDK ToolLoopAgent, Mastra.
      - patterns:
          - pattern-either:
              - pattern-inside: 'new $AGENT({..., instructions: $X, ...}, ...)'
              - pattern-inside: 'new $AGENT({..., system: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $AGENT
              regex: ^(?:[\w$.]*\.)?[\w$]*Agent$
          - focus-metavariable: $X
      # Instructions given as a function (OpenAI Agents SDK dynamic instructions, Mastra): what
      # an inline function, or a function declared or assigned to a const earlier in the file,
      # returns. Only the function's own returns count, not what a tool's execute() returns (a
      # tool result, which the model reads as data) or the body of a callback inside the
      # function (docs.map((d) => d.title)). Its final return always counts, and so does an
      # earlier one (inside an if or a loop) unless it sits in a callback, a function passed as
      # an argument. An inline or const function is bound as $FNX and its returns are matched
      # with metavariable-pattern, so the callback test sees only that function, not a route
      # handler the agent is built in; the paren guard before it is OpenGrep's String.sub crash
      # (gen_mcp_unpinned.py).
      - patterns:
          - pattern-either:
              - pattern-inside: 'new $AGENT({..., instructions: ($...ARGS) => $X, ...}, ...)'
              - pattern-inside: 'new $AGENT({..., instructions: async ($...ARGS) => $X, ...}, ...)'
              - pattern-inside: |
                  const $FN = ($...P) => $X;
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: |
                  const $FN = async ($...P) => $X;
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: 'new $AGENT({..., instructions: ($...ARGS) => { $...BODY; return $X; }, ...}, ...)'
              - pattern-inside: 'new $AGENT({..., instructions: async ($...ARGS) => { $...BODY; return $X; }, ...}, ...)'
              - pattern-inside: 'new $AGENT({..., instructions: function ($...ARGS) { $...BODY; return $X; }, ...}, ...)'
              - pattern-inside: 'new $AGENT({..., instructions: async function ($...ARGS) { $...BODY; return $X; }, ...}, ...)'
              - pattern-inside: |
                  function $FN($...P) { $...BODY; return $X; }
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: |
                  async function $FN($...P) { $...BODY; return $X; }
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: |
                  const $FN = ($...P) => { $...BODY; return $X; };
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: |
                  const $FN = async ($...P) => { $...BODY; return $X; };
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: |
                  const $FN = function ($...P) { $...BODY; return $X; };
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - pattern-inside: |
                  const $FN = async function ($...P) { $...BODY; return $X; };
                  ...
                  new $AGENT({..., instructions: $FN, ...}, ...);
              - patterns:
                  - pattern-either:
                      - pattern-inside: 'new $AGENT({..., instructions: $FNX, ...}, ...)'
                      - pattern-inside: |
                          const $FN = $FNX;
                          ...
                          new $AGENT({..., instructions: $FN, ...}, ...);
                  - metavariable-regex:
                      metavariable: $FNX
                      regex: |-
                        ^(?!(?:\(\s*)*(?<p>\((?:[^()"'`]++|"(?:[^"\\]|\\.)*+"|'(?:[^'\\]|\\.)*+'|`(?:[^`\\]|\\.)*+`|(?&p))*+\))\s*+(?!=>|:|$|\)))
                  - metavariable-pattern:
                      metavariable: $FNX
                      patterns:
                        - pattern: return $X;
                        - pattern-not-inside: '$F(..., ($...A) => $B, ...)'
                        - pattern-not-inside: '$F(..., async ($...A) => $B, ...)'
                        - pattern-not-inside: '$F(..., function ($...A) { ... }, ...)'
                        - pattern-not-inside: '$F(..., async function ($...A) { ... }, ...)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          function $FN($...P) { ... return $X; ... }
                          ...
                          new $AGENT({..., instructions: $FN, ...}, ...);
                      - pattern-inside: |
                          async function $FN($...P) { ... return $X; ... }
                          ...
                          new $AGENT({..., instructions: $FN, ...}, ...);
                  - pattern: return $X;
                  - pattern-not-inside: '$F(..., ($...A) => $B, ...)'
                  - pattern-not-inside: '$F(..., async ($...A) => $B, ...)'
                  - pattern-not-inside: '$F(..., function ($...A) { ... }, ...)'
                  - pattern-not-inside: '$F(..., async function ($...A) { ... }, ...)'
          - metavariable-regex:
              metavariable: $AGENT
              regex: ^(?:[\w$.]*\.)?[\w$]*Agent$
          - focus-metavariable: $X
      # Keys that are the system prompt wherever they appear: Claude Agent SDK options and
      # LangChain createAgent (systemPrompt), Gemini config (systemInstruction), and the Claude
      # Agent SDK preset's append and custom prompt; LangGraph createReactAgent (prompt).
      - patterns:
          - pattern-either:
              - pattern-inside: '{..., systemPrompt: $X, ...}'
              - pattern-inside: '{..., systemInstruction: $X, ...}'
              - pattern-inside: '{..., system_prompt: $X, ...}'
              - patterns:
                  - pattern-inside: '{..., type: "preset", ...}'
                  - pattern-inside: '{..., append: $X, ...}'
              - patterns:
                  - pattern-inside: '{..., type: "custom", ...}'
                  - pattern-inside: '{..., prompt: $X, ...}'
              - pattern-inside: 'createReactAgent({..., prompt: $X, ...})'
          - focus-metavariable: $X
      # Chat messages with the system or developer role (OpenAI, AI SDK, Anthropic, LiteLLM).
      - patterns:
          - pattern-inside: '{..., role: $R, ...}'
          - pattern-inside: '{..., content: $X, ...}'
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:["'`](?:system|developer)["'`]|(?:[\w$.]*\.)?(?i:system|developer)(?:_\w+)?|(?i:system|developer)_\w*)$
          - focus-metavariable: $X
      # LangChain.js system messages and prompt templates.
      - patterns:
          - pattern-either:
              - pattern-inside: new SystemMessage($X, ...)
              - pattern-inside: 'new SystemMessage({..., content: $X, ...}, ...)'
              - pattern-inside: SystemMessagePromptTemplate.fromTemplate($X, ...)
              - pattern-inside: '["system", $X]'
          - focus-metavariable: $X
      # LangChain.js 1.x dynamicSystemPromptMiddleware: what the callback returns becomes the
      # system prompt of each model call.
      - patterns:
          - pattern-either:
              - pattern-inside: 'dynamicSystemPromptMiddleware(($...ARGS) => $X)'
              - pattern-inside: 'dynamicSystemPromptMiddleware(async ($...ARGS) => $X)'
              # The final return of a block body: with `{ ... }` and `return $X;`, the
              # expression body of a nested arrow function (docs.map((d) => d.text)) matches too.
              - pattern-inside: 'dynamicSystemPromptMiddleware(($...ARGS) => { $...BODY; return $X; })'
              - pattern-inside: 'dynamicSystemPromptMiddleware(async ($...ARGS) => { $...BODY; return $X; })'
              - pattern-inside: |
                  function $FN($...P) { $...BODY; return $X; }
                  ...
                  <... dynamicSystemPromptMiddleware($FN) ...>;
              - pattern-inside: |
                  async function $FN($...P) { $...BODY; return $X; }
                  ...
                  <... dynamicSystemPromptMiddleware($FN) ...>;
          - focus-metavariable: $X
      # A LangChain.js prompt template whose system message has a {placeholder}, filled from
      # the request when the template, or a chain built on it, is invoked or formatted:
      # prompt.invoke({ persona }), prompt.pipe(model).invoke(...),
      # prompt.formatMessages({ persona }). The system template is inline or a module constant. The key must appear in
      # the system template and in none of the other messages, so a key that only names a word
      # in the system text ("answer questions") and fills {question} in the human message
      # doesn't count; OpenGrep can't compare a key with each {placeholder} exactly. Templates
      # whose system message isn't first, or with more than 3 other messages, are not
      # recognized.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"]], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...)], ...);
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: |
                      const $CH = <... $P ...>;
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:invoke|stream|batch|formatMessages|formatPromptValue|format|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], $M1], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), $M1], ...);
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: |
                      const $CH = <... $P ...>;
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:invoke|stream|batch|formatMessages|formatPromptValue|format|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1))
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], $M1, $M2], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), $M1, $M2], ...);
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: |
                      const $CH = <... $P ...>;
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:invoke|stream|batch|formatMessages|formatPromptValue|format|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1)) and not (str($K) in str($M2))
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], $M1, $M2, $M3], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), $M1, $M2, $M3], ...);
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: |
                      const $CH = <... $P ...>;
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:invoke|stream|batch|formatMessages|formatPromptValue|format|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1)) and not (str($K) in str($M2)) and not (str($K) in str($M3))
          - focus-metavariable: $X
      # A LangChain.js chain that pipes a mapping into the template instead of invoking it:
      # RunnableSequence.from([{ context: retriever.pipe(formatDocs), question }, prompt, llm]),
      # RunnablePassthrough.assign({ context }).pipe(prompt). Same template forms and key test as above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"]], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...)], ...);
                  ...
          - pattern-either:
              - pattern-inside: 'RunnableSequence.from([{..., $K: $X, ...}, $P, ...], ...)'
              - pattern-inside: 'RunnableSequence.from([RunnablePassthrough.assign({..., $K: $X, ...}), $P, ...], ...)'
              - pattern-inside: 'RunnableMap.from({..., $K: $X, ...}).pipe($P)'
              - pattern-inside: 'RunnablePassthrough.assign({..., $K: $X, ...}).pipe($P)'
          - metavariable-comparison:
              comparison: str($K) in str($T)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], $M1], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), $M1], ...);
                  ...
          - pattern-either:
              - pattern-inside: 'RunnableSequence.from([{..., $K: $X, ...}, $P, ...], ...)'
              - pattern-inside: 'RunnableSequence.from([RunnablePassthrough.assign({..., $K: $X, ...}), $P, ...], ...)'
              - pattern-inside: 'RunnableMap.from({..., $K: $X, ...}).pipe($P)'
              - pattern-inside: 'RunnablePassthrough.assign({..., $K: $X, ...}).pipe($P)'
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1))
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], $M1, $M2], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), $M1, $M2], ...);
                  ...
          - pattern-either:
              - pattern-inside: 'RunnableSequence.from([{..., $K: $X, ...}, $P, ...], ...)'
              - pattern-inside: 'RunnableSequence.from([RunnablePassthrough.assign({..., $K: $X, ...}), $P, ...], ...)'
              - pattern-inside: 'RunnableMap.from({..., $K: $X, ...}).pipe($P)'
              - pattern-inside: 'RunnablePassthrough.assign({..., $K: $X, ...}).pipe($P)'
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1)) and not (str($K) in str($M2))
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([["system", "$T"], $M1, $M2, $M3], ...);
                  ...
              - pattern-inside: |
                  const $P = ChatPromptTemplate.fromMessages([SystemMessagePromptTemplate.fromTemplate("$T", ...), $M1, $M2, $M3], ...);
                  ...
          - pattern-either:
              - pattern-inside: 'RunnableSequence.from([{..., $K: $X, ...}, $P, ...], ...)'
              - pattern-inside: 'RunnableSequence.from([RunnablePassthrough.assign({..., $K: $X, ...}), $P, ...], ...)'
              - pattern-inside: 'RunnableMap.from({..., $K: $X, ...}).pipe($P)'
              - pattern-inside: 'RunnablePassthrough.assign({..., $K: $X, ...}).pipe($P)'
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1)) and not (str($K) in str($M2)) and not (str($K) in str($M3))
          - focus-metavariable: $X
