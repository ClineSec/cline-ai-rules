rules:
  - id: client-message-roles-with-tools
    # Generated by scripts/gen_client_message_roles.py. The first pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt-ts's request-data sources and
    # lookup sanitizers, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # SDKs checked 2026-10-23: ai 7.0.152 (ui/convert-to-model-messages.ts,
    # ui/validate-ui-messages.ts, agent/), openai 7.43.0, @anthropic-ai/sdk 1.2.0,
    # @langchain/core 1.3.0 (messages/utils), langchain 1.5.19, @langchain/langgraph 1.5.2,
    # @google/genai 2.31.0, @openai/agents 0.21.0, @aws-sdk/client-bedrock-runtime 3.1156.0.
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The request's own message list reaches a model call whose tools this server runs, and
      nothing on the way in limits which roles it holds. Whoever sends the request writes the whole
      conversation: a system or developer turn with new rules, an assistant turn that already
      called a tool, or a tool result the server never produced (a `tool` message, an Anthropic
      `tool_result` or Bedrock `toolResult` block after a forged tool use, or a Gemini
      `functionResponse` part after a forged `model` turn's `functionCall`). The model treats
      that history as its own, so forged turns steer which tools it calls and with what
      arguments. Keep the
      conversation on the server (load it by chat ID) and accept only the new user turn, or keep
      only user turns from the client: `messages.filter((m) => m.role === "user")`, or a zod
      schema with `role: z.literal("user")`.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Express and Fastify (req.body, req.query,
      # req.params, req.get()), the Fetch API Request in Next.js route handlers (await
      # request.json(), request.formData(), request.url), Next.js NextRequest (request.nextUrl),
      # Hono (c.req.json(), c.req.query(), c.req.param()), and Koa (ctx.request.body).
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:[\w$.]*\.)?(?:req|request)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:body|query|queries|params|param|headers|header|get|cookies|signedCookies|url|originalUrl|path|nextUrl|json|formData|text|parseBody|valid)$
      # Next.js route handlers, whatever the request parameter is called, and their dynamic
      # route segments: export async function POST(r: Request, { params }).
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, ...) { ... }
              - pattern: export function $M($REQ, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $REQ
      - patterns:
          - pattern-either:
              - pattern: export async function $M($REQ, $CTX, ...) { ... }
              - pattern: export function $M($REQ, $CTX, ...) { ... }
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
          - focus-metavariable: $CTX
      # URL query parameters: a Next.js page's searchParams prop, useSearchParams().
      - patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: ^searchParams$
      # Server actions: the client chooses every argument of an exported function in a
      # "use server" module, or of a function marked "use server", and TypeScript types are not
      # checked at runtime.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  "use server";
                  ...
              - pattern-inside: |
                  'use server';
                  ...
          - pattern-either:
              - pattern: export async function $F(..., $P, ...) { ... }
              - pattern: export const $F = async (..., $P, ...) => {...};
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: 'async function $F(..., $P, ...) { "use server"; ... }'
              - pattern: "async function $F(..., $P, ...) { 'use server'; ... }"
              - pattern: 'async (..., $P, ...) => { "use server"; ... }'
          - focus-metavariable: $P
      # The part of the request that is a message list (label MSGS): body.messages,
      # const { messages } = await req.json(), const { history: past } = req.body. Only request
      # data counts (requires), and only a field with a list's name, so request text that a
      # helper turns into server-built messages doesn't.
      - label: MSGS
        requires: __SOURCE__
        patterns:
          - pattern-either:
              - pattern: $O.$F
              - pattern: $O[$F]
              - patterns:
                  - pattern-either:
                      - pattern-inside: const {..., $F, ...} = $E;
                      - pattern-inside: let {..., $F, ...} = $E;
                  - pattern: $F
              # A renamed field ({ messages: history }) can't be a source itself in OpenGrep
              # 1.30.2, so the whole destructured value carries the label.
              - patterns:
                  - pattern-either:
                      - pattern-inside: 'const {..., $F: $V, ...} = $E;'
                      - pattern-inside: 'let {..., $F: $V, ...} = $E;'
                  # A shorthand { messages } also matches { messages: messages }.
                  - metavariable-comparison:
                      comparison: str($F) != str($V)
                  - focus-metavariable: $E
              # A server action's parameter: export async function chat(messages: UIMessage[]).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          "use server";
                          ...
                      - pattern-inside: |
                          'use server';
                          ...
                  - pattern-either:
                      - pattern: export async function $FN(..., $F, ...) { ... }
                      - pattern: export const $FN = async (..., $F, ...) => {...};
                  - focus-metavariable: $F
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?i)^["'`]?\w*(?:messages|msgs|history|conversation|turns|transcript)["'`]?$
      # One message object from the request placed in an array (label ONE), the AI SDK's
      # "send only the last message" shape: [...await loadChat(id), message]. Its role is still
      # the client's. Not for LangChain, which reads a bare string there as a user turn.
      - label: ONE
        requires: __SOURCE__
        patterns:
          - pattern-inside: '[..., $X, ...]'
          - pattern: $X
          - metavariable-regex:
              metavariable: $X
              regex: |-
                ^(?:[\w$]+\.)*[\w$]*[mM]essage$
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone). The table is the
      # application's own text, whatever key the caller sends.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:[\w$.]*\.)?(?:req|request)\.)(?:[\w$.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if (!ALLOWED_TONES.includes(tone)) return ...`. Only the
      # checked value, and not a blocklist.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.includes($X)
              - pattern: $ALLOWED.has($X)
              - pattern: $X in $ALLOWED
              - pattern: Object.hasOwn($ALLOWED, $X)
              - pattern: $ALLOWED.hasOwnProperty($X)
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check anchored at both ends: /^[a-z]{2}(-[A-Z]{2})?$/.test(locale).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # Fields of a zod schema in this file that only admit a fixed set or a number,
      # z.object({ tone: z.enum(["formal", "casual"]) }), read from a value parsed with it:
      # const { tone } = ChatBody.parse(...), or body.tone after body = ChatBody.parse(...).
      - patterns:
          - pattern-inside: |
              const $S = z.object({..., $FIELD: $V, ...});
              ...
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const {..., $FIELD, ...} = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const {..., $FIELD, ...} = await $S.parseAsync(...);
                          ...
                  - pattern: $FIELD
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          const $O = $S.parse(...);
                          ...
                      - pattern-inside: |
                          const $O = await $S.parseAsync(...);
                          ...
                  - pattern: $O.$FIELD
      # A whole value parsed with such a schema: Tone.parse(x), z.enum([...]).parse(x).
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      const $S = $Z;
                      ...
                  - pattern-either:
                      - pattern: $S.parse(...)
                      - pattern: $S.safeParse(...)
              - patterns:
                  - pattern-either:
                      - pattern: $Z.parse(...)
                      - pattern: $Z.safeParse(...)
          - metavariable-regex:
              metavariable: $Z
              regex: |-
                ^z\.(?:enum|nativeEnum|literal|number|boolean|coerce\.number|coerce\.boolean|int|uuid)\b
      - exact: true
        pattern-either:
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
      # A lookup keyed by request data returns stored data, not the caller's text: a Prisma,
      # Drizzle, or SQL query, a vector-store or retriever search, a getX / fetchX / findX
      # helper, or fetch(). (Stored data that came from users earlier is a different, indirect
      # injection.) `exact` keeps a sink inside the call's own arguments, and calls that are
      # themselves a system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: fetch(...)
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w$.]*\.)?(?:get|fetch|find|load|lookup|search|retrieve|query|select)[A-Z_][\w$]*$
                  # Not the request's own readers.
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:[\w$.]*\.)?(?:req|request|searchParams)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:find(?:Unique|First|Many|One|ById|ByPk|All)\w*|similaritySearch\w*|maxMarginalRelevanceSearch|getRelevantDocuments|query|execute|all|first)$
                  # Not Hono's c.req.query("x").
                  - metavariable-regex:
                      metavariable: $O
                      regex: ^(?!(?:[\w$.]*\.)?(?:req|request)$)
              - patterns:
                  - pattern: $O.invoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:retriever|vectorStore|vectorDb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.retrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:retriever|vectorStore|vectorDb|kb|knowledgeBase|docStore|docIndex|searchIndex|index|corpus|tavily\w*)$
              - pattern: axios(...)
              - pattern: axios.$M(...)
              - pattern: got(...)
              - pattern: ky(...)
          - pattern-not: new SystemMessage(...)
          - pattern-not: '$G(..., {..., system: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., instructions: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., systemPrompt: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., systemInstruction: $X, ...}, ...)'
          - pattern-not: '$G(..., {..., role: $X, ...}, ...)'
      # A message the server builds with a role it chose: { role: "user", content: last.text },
      # or a role limited to user and assistant. Not when a spread after the role puts the
      # client's role back ({ role: "user", ...m }).
      - patterns:
          - pattern: '{..., role: $R, ...}'
          - pattern-not: '{..., role: $R, ..., ...$S}'
          - metavariable-regex:
              metavariable: $R
              regex: |-
                (?x)^(?:
                    ["'`](?:user|assistant|system|developer|human|ai)["'`]
                    # role: m.role === "user" ? "user" : "assistant"
                  | [^?]+\?\s*["'`](?:user|assistant)["'`]\s*:\s*["'`](?:user|assistant)["'`]
                    # role: ["user", "assistant"].includes(m.role) ? m.role : "user"
                  | \[\s*["'`](?:user|assistant)["'`]\s*(?:,\s*["'`](?:user|assistant)["'`]\s*)?\]\.includes\([^()]+\)\s*\?\s*[\w$.]+\s*:\s*["'`](?:user|assistant)["'`]
                )$
      - pattern-either:
          - pattern: new HumanMessage(...)
          - pattern: new AIMessage(...)
      # Only the client's user turns: messages.filter((m) => m.role === "user").
      - patterns:
          - pattern-either:
              - pattern: $XS.filter(($M, ...) => $COND)
              - pattern: '$XS.filter(($M, ...) => { return $COND; })'
              - pattern: $XS.filter(function ($M, ...) { return $COND; })
          - metavariable-regex:
              metavariable: $COND
              regex: |-
                (?s)^(?!.*\|\|)(?!.*!==?)(?=.*\brole\s*===?\s*["'`]user["'`]|.*["'`]user["'`]\s*===?\s*(?:[\w$]+\.)?role\b)
      # A check before use that every turn is a user turn:
      # if (!messages.every((m) => m.role === "user")) return badRequest().
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $XS.every(($M, ...) => $COND)
                      - pattern: '$XS.every(($M, ...) => { return $COND; })'
                  - metavariable-regex:
                      metavariable: $COND
                      regex: |-
                        (?s)^(?!.*\|\|)(?!.*!==?)(?=.*\brole\s*===?\s*["'`]user["'`]|.*["'`]user["'`]\s*===?\s*(?:[\w$]+\.)?role\b)
              - patterns:
                  - pattern-either:
                      - pattern: $XS.some(($M, ...) => $COND)
                      - pattern: '$XS.some(($M, ...) => { return $COND; })'
                  - metavariable-regex:
                      metavariable: $COND
                      regex: |-
                        (?s)^(?!.*(?:\|\||&&))(?=.*\brole\s*!==?\s*["'`]user["'`]|.*["'`]user["'`]\s*!==?\s*(?:[\w$]+\.)?role\b)
          - focus-metavariable: $XS
      # Every turn rebuilt with a role the server chose:
      # messages.map((m) => ({ role: "user", content: String(m.content) })).
      - patterns:
          - pattern-either:
              - pattern: '$XS.$MAP(($M, ...) => ({..., role: $R, ...}))'
              - pattern: '$XS.$MAP(($M, ...) => { ... return {..., role: $R, ...}; })'
          - pattern-not: '$XS.$MAP(($M, ...) => ({..., role: $R, ..., ...$S}))'
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(?:map|flatMap)$
          - metavariable-regex:
              metavariable: $R
              regex: |-
                (?x)^(?:
                    ["'`](?:user|assistant|system|developer|human|ai)["'`]
                    # role: m.role === "user" ? "user" : "assistant"
                  | [^?]+\?\s*["'`](?:user|assistant)["'`]\s*:\s*["'`](?:user|assistant)["'`]
                    # role: ["user", "assistant"].includes(m.role) ? m.role : "user"
                  | \[\s*["'`](?:user|assistant)["'`]\s*(?:,\s*["'`](?:user|assistant)["'`]\s*)?\]\.includes\([^()]+\)\s*\?\s*[\w$.]+\s*:\s*["'`](?:user|assistant)["'`]
                )$
      # ... or as LangChain messages of a class the server chose:
      # history.map((t) => (t.role === "assistant" ? new AIMessage(t.content) : new HumanMessage(t.content))).
      - patterns:
          - pattern-either:
              - pattern: $XS.$MAP(($M, ...) => $BODY)
              - pattern: '$XS.$MAP(($M, ...) => { ... return $BODY; })'
          - metavariable-regex:
              metavariable: $MAP
              regex: ^(?:map|flatMap)$
          - metavariable-regex:
              metavariable: $BODY
              regex: |-
                (?x)^\(?\s*(?:
                    new\s+(?:HumanMessage|AIMessage)\(
                  | [^?]+\?\s*new\s+(?:HumanMessage|AIMessage)\((?:[^()]|\([^()]*\))*\)\s*:\s*new\s+(?:HumanMessage|AIMessage)\(
                )
      # A zod schema in this file that fixes each message's role to "user" (or to user and
      # assistant): z.array(z.object({ role: z.literal("user"), content: z.string() })),
      # directly or through a named message schema.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $S = <... {..., role: $RV, ...} ...>;
                  ...
              - pattern-inside: |
                  const $MSG = z.object({..., role: $RV, ...});
                  ...
                  const $S = <... z.array($MSG) ...>;
                  ...
          - metavariable-regex:
              metavariable: $RV
              regex: |-
                ^z\.(?:literal\(\s*["'`]user["'`]\s*\)|enum\(\s*\[\s*["'`](?:user|assistant)["'`](?:\s*,\s*["'`](?:user|assistant)["'`])?\s*,?\s*\]\s*\))
          - pattern-either:
              - pattern: $S.parse(...)
              - pattern: $S.parseAsync(...)
              - pattern: $S.safeParse(...).data
      # Tools the request supplies itself: const { messages, tools } = await req.json(), body.tools,
      # or a list made from them ((tools ?? []).map(addAuthHeader)). The sender already picks
      # every tool and MCP server, so forged turns add nothing: the values in that options object
      # are clean (2026-10-28 corpus run). Server tools picked by client-sent names still count.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: '{..., tools: $TF, ...}'
                      - pattern-inside: '{..., tools: <... $TF ...>.$TM(...), ...}'
                      - patterns:
                          - pattern-inside: '{..., tools: $T, ...}'
                          - pattern-either:
                              - pattern-inside: |
                                  const $T = $TF;
                                  ...
                              - pattern-inside: |
                                  const $T = <... $TF ...>.$TM(...);
                                  ...
                  - pattern-inside: |
                      const {..., $TF, ...} = $E;
                      ...
                  - metavariable-regex:
                      metavariable: $TF
                      regex: |-
                        (?i)^["'`]?\w*tools["'`]?$
                  - metavariable-regex:
                      metavariable: $E
                      regex: |-
                        (?s)^\(?\s*(?:await\s+[\w$.]+\.json\(\)|(?:(?:req|request|ctx\.request|c\.req)\.)?body|payload|json|data|input|params|args)\s*\)?(?:\s+as\s+.+)?$
              # Renamed on the way: const { messages, tools: picked } = body.
              - patterns:
                  - pattern-inside: '{..., tools: $T, ...}'
                  - pattern-inside: |
                      const {..., $TF: $T, ...} = $E;
                      ...
                  - metavariable-regex:
                      metavariable: $TF
                      regex: |-
                        (?i)^["'`]?\w*tools["'`]?$
                  - metavariable-regex:
                      metavariable: $E
                      regex: |-
                        (?s)^\(?\s*(?:await\s+[\w$.]+\.json\(\)|(?:(?:req|request|ctx\.request|c\.req)\.)?body|payload|json|data|input|params|args)\s*\)?(?:\s+as\s+.+)?$
              - patterns:
                  - pattern-either:
                      - pattern-inside: '{..., tools: $O.$TF, ...}'
                      - pattern-inside: '{..., tools: <... $O.$TF ...>.$TM(...), ...}'
                      - patterns:
                          - pattern-inside: '{..., tools: $T, ...}'
                          - pattern-either:
                              - pattern-inside: |
                                  const $T = $O.$TF;
                                  ...
                              - pattern-inside: |
                                  const $T = <... $O.$TF ...>.$TM(...);
                                  ...
                      - pattern-inside: '{..., tools: $O[$TF], ...}'
                      - pattern-inside: '{..., tools: <... $O[$TF] ...>.$TM(...), ...}'
                      - patterns:
                          - pattern-inside: '{..., tools: $T, ...}'
                          - pattern-either:
                              - pattern-inside: |
                                  const $T = $O[$TF];
                                  ...
                              - pattern-inside: |
                                  const $T = <... $O[$TF] ...>.$TM(...);
                                  ...
                  - metavariable-regex:
                      metavariable: $TF
                      regex: |-
                        (?i)^["'`]?\w*tools["'`]?$
                  - metavariable-regex:
                      metavariable: $O
                      regex: |-
                        ^(?:(?:req|request|ctx\.request|c\.req)\.body|body|payload|json|data|input|params|args)$
          - pattern-inside: '{..., $K: $M, ...}'
          - focus-metavariable: $M
    pattern-sinks:
      # Vercel AI SDK: streamText / generateText with tools. convertToModelMessages (ai 7.0.152)
      # keeps system UI messages and turns tool parts into tool calls and tool results, and
      # validateUIMessages accepts the system role, so useChat routes count.
      - requires: MSGS or ONE
        patterns:
          - pattern-inside: '$CALL({..., messages: $M, ...}, ...)'
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                ^(?:streamText|generateText)$
          - pattern-either:
              - pattern-inside: '$CALL({..., tools: $T, ...}, ...)'
              - patterns:
                  - pattern-inside: '$CALL({..., ...$CFG, ...}, ...)'
                  # Deep, so `{ ... } satisfies T` and `as const` count too (the JavaScript
                  # parser rejects `satisfies` in a pattern).
                  - pattern-inside: |
                      const $CFG = <... {..., $TK: $T, ...} ...>;
                      ...
                  - metavariable-regex:
                      metavariable: $TK
                      regex: ^(?:tools)$
          # An empty tool list, or tool use switched off for this call.
          - pattern-not-inside: '$CALL({..., tools: [], ...}, ...)'
          - pattern-not-inside: '$CALL({..., tools: {}, ...}, ...)'
          - pattern-not-inside: '$CALL({..., tools: undefined, ...}, ...)'
          - pattern-not-inside: '$CALL({..., toolChoice: "none", ...}, ...)'
          - pattern-not-inside: '$CALL({..., tool_choice: "none", ...}, ...)'
          - focus-metavariable: $M
      # `prompt` also takes a message array in ai 7.
      - requires: MSGS or ONE
        patterns:
          - pattern-inside: '$CALL({..., prompt: $M, ...}, ...)'
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                ^(?:streamText|generateText)$
          - pattern-either:
              - pattern-inside: '$CALL({..., tools: $T, ...}, ...)'
              - patterns:
                  - pattern-inside: '$CALL({..., ...$CFG, ...}, ...)'
                  - pattern-inside: |
                      const $CFG = <... {..., $TK: $T, ...} ...>;
                      ...
                  - metavariable-regex:
                      metavariable: $TK
                      regex: ^(?:tools)$
          - pattern-not-inside: '$CALL({..., tools: [], ...}, ...)'
          - pattern-not-inside: '$CALL({..., tools: {}, ...}, ...)'
          - pattern-not-inside: '$CALL({..., tools: undefined, ...}, ...)'
          - pattern-not-inside: '$CALL({..., toolChoice: "none", ...}, ...)'
          - pattern-not-inside: '$CALL({..., tool_choice: "none", ...}, ...)'
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?!(?:[\w$]+\.)*[\w$]*[mM]essage$)
          - focus-metavariable: $M
      # OpenAI Chat Completions (openai 7.43.0): system, developer, assistant tool_calls, and tool
      # messages are all client-writable. This and the other raw provider calls below only
      # return the model's tool calls, so they report only where the file runs them.
      - requires: MSGS or ONE
        patterns:
          - pattern-inside: '$CALL({..., messages: $M, ...}, ...)'
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                ^(?:[\w$]+\.)*(?:chat\.completions|beta\.chat\.completions)\.(?:create|stream|parse|runTools)$
          - pattern-either:
              - pattern-inside: '$CALL({..., tools: $T, ...}, ...)'
              - pattern-inside: '$CALL({..., functions: $T, ...}, ...)'
              - patterns:
