# Generated by scripts/gen_mcp_hidden_unicode.py from agent-instruction-hidden-unicode (the
# characters) and mcp-tool-description-instructions-ts (the description surfaces).
# Edit those rules, or the script, not this file.
rules:
  - id: mcp-tool-description-hidden-unicode-ts
    # JavaScript/TypeScript twin of mcp-tool-description-hidden-unicode: the same surfaces as
    # mcp-tool-description-instructions-ts (MCP TypeScript SDK v2.3.1 and 1.32.1, punkpeye fastmcp,
    # Claude Agent SDK tool(), Vercel AI SDK tool()); McpServer still lists descriptions unchanged in
    # SDK v2.4.0. Escapes count as the character they decode to: "\u200b", "\u{E0041}", octal
    # "\255", and UTF-16 surrogate pairs ("\uDB40\uDC41"), which is how bundlers such as esbuild
    # write non-ASCII text by default, so a bundled server is covered too (OpenGrep's default ignore
    # list skips dist/ and vendor/ folders). String.raw text is not decoded, judged literal by literal.
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      This tool description (or an MCP prompt's or resource's, a parameter description, or the
      server instructions) contains invisible Unicode: tag characters (which the model reads as
      ASCII text that no editor, diff, or MCP client shows), bidirectional controls that display
      the text in a different order than the model reads it, zero-width characters, a run of
      variation selectors that can encode hidden bytes, or a byte-order mark, written as the
      characters themselves or as escapes that decode to them. MCP clients and agent frameworks
      put this text in the model's context as trusted, so a hidden instruction there steers
      every agent that loads the tool while the user approving it sees only the visible text
      (tool poisoning). Decode the text (print it with non-ASCII characters escaped, as Python's
      ascii() does) to see what it says, remove the characters, and if the server came from
      someone else, don't connect it until you know who added them. To mention such a character
      in a description, name it ("U+200B") or double the backslash.
    patterns:
      - pattern-either:
          # registerTool(name, {title, description, inputSchema}, cb) in SDK v2 and v1, and
          # registerPrompt / registerResource configs, whose descriptions clients list too.
          - patterns:
              - pattern: '$S.$REG(..., {..., description: $D, ...}, ...)'
              - metavariable-regex:
                  metavariable: $REG
                  regex: ^register(?:Tool|Prompt|Resource)$
          # The deprecated v1 overloads: server.tool(name, description, [schema], cb) and
          # server.prompt(name, description, [args], cb).
          - patterns:
              - pattern: $S.$REG($N, $D, $X, ...)
              - metavariable-regex:
                  metavariable: $REG
                  regex: ^(?:tool|prompt)$
              - metavariable-regex:
                  metavariable: $D
                  regex: ^["'`]
          # Claude Agent SDK: tool(name, description, inputSchema, handler).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import { $TOOL } from "@anthropic-ai/claude-agent-sdk";
                      ...
                  - pattern-inside: |
                      import { $ORIG as $TOOL } from "@anthropic-ai/claude-agent-sdk";
                      ...
              - pattern: $TOOL($N, $D, $SCHEMA, ...)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^["'`]
          # A tool definition object: a low-level tools/list entry ({name, description,
          # inputSchema}), fastmcp's addTool({description, parameters}), an AI SDK
          # tool({description, inputSchema}), or a registerTool config built separately.
          - pattern: '{..., description: $D, inputSchema: $I, ...}'
          - pattern: '{..., description: $D, parameters: $I, ...}'
          # Parameter descriptions inside such an object's schema: z.string().describe(...)
          # and JSON Schema {description: ...}.
          - patterns:
              - pattern-either:
                  - pattern-inside: '{..., inputSchema: $I, ...}'
                  - pattern-inside: '{..., parameters: $I, ...}'
                  - pattern-inside: '$S.registerTool(...)'
                  - pattern-inside: '$S.registerPrompt(...)'
                  - pattern-inside: '$S.tool(...)'
                  - pattern-inside: '$S.prompt(...)'
              - pattern-either:
                  - pattern: $Z.describe($D)
                  - pattern: '{..., description: $D, ...}'
          # Anywhere in a file that imports an MCP SDK, fastmcp, or the Claude Agent SDK:
          # schema descriptions kept in their own constant, the server's instructions
          # (new McpServer(info, {instructions}), new Server(info, {instructions})), and
          # named description constants.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import $X from "$MOD";
                      ...
                  - pattern-inside: |
                      import {...} from "$MOD";
                      ...
                  - pattern-inside: |
                      import * as $X from "$MOD";
                      ...
                  - pattern-inside: |
                      $X = require("$MOD");
                      ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^(?:@modelcontextprotocol/|@anthropic-ai/claude-agent-sdk|fastmcp$)
              - pattern-either:
                  - pattern: $Z.describe($D)
                  - pattern: '{..., description: $D, ...}'
                  - pattern: '{..., instructions: $D, ...}'
                  # Description or instructions text kept in a constant (const DESCRIPTION
                  # = "..." and later {description: DESCRIPTION}), recognized by its name.
                  # Linking the constant to its use times out on large modules.
                  - patterns:
                      - pattern-either:
                          - pattern: const $NAME = $D;
                          - pattern: let $NAME = $D;
                      - metavariable-regex:
                          metavariable: $NAME
                          regex: (?i)^\w*(?:desc|instruction|usage|hint)
                      # Text: a string or template literal, a concatenation, or an array
                      # joined into one, not a zod schema reported where it is defined.
                      - metavariable-regex:
                          metavariable: $D
                          regex: ^["'`(\[]
      - focus-metavariable: $D
      - metavariable-regex:
          metavariable: $D
          regex: |-
            (?x)
            (?(DEFINE)
              # --- hidden Unicode characters (begin): build.py keeps this block identical in
              # mcp-tool-description-hidden-unicode (+ -ts), via scripts/gen_mcp_hidden_unicode.py ---
              (?<hidden> [\x{00AD}\x{034F}\x{061C}\x{115F}\x{1160}\x{17B4}\x{17B5}\x{180B}-\x{180F}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{206F}\x{3164}\x{FE00}-\x{FE0F}\x{FEFF}\x{FFA0}\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}\x{E0000}-\x{E0FFF}] )
              (?<strong>
                  [\x{E0000}-\x{E00FF}\x{E01F0}-\x{E0FFF}]
                | [\x{202A}-\x{202E}\x{2066}-\x{2069}]
                | [\x{2060}-\x{2065}\x{206A}-\x{206F}]
                | [\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}]
                | (?<!\A) \x{FEFF}
                | (?<![\p{Thai}\p{Lao}\p{Khmer}\p{Myanmar}\p{Han}\p{Hiragana}\p{Katakana}\p{Tibetan}]) \x{200B}
                | (?<! (?=[\p{L}\p{M}]) \P{Latin} ) \x{200C}
                | (?<!\p{Mongolian}) [\x{180B}-\x{180F}]
                | (?<!\p{Khmer}) [\x{17B4}\x{17B5}] )
              (?<flag> (?<=\x{1F3F4}) (?: [\x{E0061}-\x{E007A}]{2} | [\x{E0030}-\x{E0039}]{3} )
                [\x{E0030}-\x{E0039}\x{E0061}-\x{E007A}]{1,4} \x{E007F} (?!(?&hidden)) )
              # --- hidden Unicode characters (end) ---
              # The same characters written as escapes: \xAD, \u200B, \u{E0041}, and UTF-16 surrogate pairs (\uDB40\uDC41).
              (?<ehidden> \\(?:255 | x[aA][dD] | u(?:00[aA][dD] | 034[fF] | 061[cC] | 11(?:5[fF]|60) | 17[bB][4-5] | 180[b-fB-F] | 200[b-fB-F] | 202[a-eA-E] | 206[0-9a-fA-F] | 3164 | [fF][eE]0[0-9a-fA-F] | [fF][eE][fF][fF] | [fF][fF][aA]0 | [fF][fF][fF][0-8] | [dD]82[fF]\\u[dD][cC][aA][0-3] | [dD]834\\u[dD][dD]7[3-9aA] | [dD][bB]4[0-3]\\u[dD][c-fC-F][0-9a-fA-F]{2}) | u\{0*+(?:[aA][dD] | 34[fF] | 61[cC] | 11(?:5[fF]|60) | 17[bB][4-5] | 180[b-fB-F] | 200[b-fB-F] | 202[a-eA-E] | 206[0-9a-fA-F] | 3164 | [fF][eE]0[0-9a-fA-F] | [fF][eE][fF][fF] | [fF][fF][aA]0 | [fF][fF][fF][0-8] | 1[bB][cC][aA][0-3] | 1[dD]17[3-9aA] | [eE]0[0-9a-fA-F]{3})\}) )
              (?<estrong>
                  \\(?:u(?:202[a-eA-E] | 206[0-9a-fA-F] | [fF][eE][fF][fF] | [fF][fF][fF][0-8] | [dD]82[fF]\\u[dD][cC][aA][0-3] | [dD]834\\u[dD][dD]7[3-9aA] | [dD][bB]40\\u[dD][cC][0-9a-fA-F]{2} | [dD][bB]40\\u[dD](?:[dD][fF][0-9a-fA-F]|[e-fE-F][0-9a-fA-F]{2}) | [dD][bB]4[1-3]\\u[dD][c-fC-F][0-9a-fA-F]{2}) | u\{0*+(?:202[a-eA-E] | 206[0-9a-fA-F] | [fF][eE][fF][fF] | [fF][fF][fF][0-8] | 1[bB][cC][aA][0-3] | 1[dD]17[3-9aA] | [eE]00[0-9a-fA-F]{2} | [eE]0(?:1[fF][0-9a-fA-F]|[2-9a-fA-F][0-9a-fA-F]{2}))\})
                | (?<!\p{Khmer}) (?<! \\u(?:17[8-9a-fA-F][0-9a-fA-F] | 19[e-fE-F][0-9a-fA-F]) ) \\(?:u17[bB][4-5] | u\{0*+17[bB][4-5]\})
                | (?<!\p{Mongolian}) (?<! \\u18[0-9aA][0-9a-fA-F] ) \\(?:u180[b-fB-F] | u\{0*+180[b-fB-F]\})
                | (?<![\p{Thai}\p{Lao}\p{Khmer}\p{Myanmar}\p{Han}\p{Hiragana}\p{Katakana}\p{Tibetan}]) (?<! \\u(?:(?:0[e-fE-F][0-9a-fA-F]{2}|10[0-9][0-9a-fA-F]) | 17[8-9a-fA-F][0-9a-fA-F] | 30[4-9a-fA-F][0-9a-fA-F] | (?:3[4-9a-fA-F][0-9a-fA-F]{2}|4(?:[0-9a-cA-C][0-9a-fA-F]{2}|[dD][0-9a-bA-B][0-9a-fA-F])) | (?:4[e-fE-F][0-9a-fA-F]{2}|[5-9][0-9a-fA-F]{3}) | [fF][9aA][0-9a-fA-F]{2}) ) \\(?:u200[bB] | u\{0*+200[bB]\})
                | (?<! (?=[\p{L}\p{M}]) \P{Latin} ) (?<! \\u(?:(?:0(?:3[7-9a-fA-F][0-9a-fA-F]|[4-9a-fA-F][0-9a-fA-F]{2})|1(?:[0-9a-cA-C][0-9a-fA-F]{2}|[dD][0-9a-bA-B][0-9a-fA-F])) | 1[fF][0-9a-fA-F]{2} | 2[cC][0-5][0-9a-fA-F] | 2(?:[cC][8-9a-fA-F][0-9a-fA-F]|[dD][0-9a-fA-F]{2}) | (?:3(?:0[4-9a-fA-F][0-9a-fA-F]|[1-9a-fA-F][0-9a-fA-F]{2})|[4-9][0-9a-fA-F]{3}|[aA][0-6][0-9a-fA-F]{2}) | (?:[aA][8-9a-fA-F][0-9a-fA-F]{2}|[b-cB-C][0-9a-fA-F]{3}|[dD][0-7][0-9a-fA-F]{2}) | [fF](?:[bB](?:1[d-fD-F]|[2-9a-fA-F][0-9a-fA-F])|[c-dC-D][0-9a-fA-F]{2}) | [fF][eE](?:[7-9a-eA-E][0-9a-fA-F]|[fF][0-9a-cA-C])) ) \\(?:u200[cC] | u\{0*+200[cC]\}) )
              # A subdivision flag (England, Scotland, Wales) written as escapes.
              (?<etagletter> \\(?:u[dD][bB]40\\u[dD][cC](?:6[1-9a-fA-F]|7[0-9aA]) | u\{0*+[eE]00(?:6[1-9a-fA-F]|7[0-9aA])\}) )
              (?<etagdigit> \\(?:u[dD][bB]40\\u[dD][cC]3[0-9] | u\{0*+[eE]003[0-9]\}) )
              (?<eflag> (?<= \x{1F3F4} | \\u\{1[fF]3[fF]4\} | \\u[dD]83[cC]\\u[dD][fF][fF]4 )
                (?: (?&etagletter){2} | (?&etagdigit){3} ) (?: (?&etagletter) | (?&etagdigit) ){1,4}
                \\(?:u[dD][bB]40\\u[dD][cC]7[fF] | u\{0*+[eE]007[fF]\}) (?!(?&h)) )
              # One character of a run, as itself or as an escape.
              (?<h> (?&hidden) | (?&ehidden) )
              # At the start of a run: one that holds a strong character or is at least three long
              # and isn't a subdivision flag, counting characters only or escapes too.
              (?<litrun> (?!(?&flag)) (?= (?&hidden){3} | (?&hidden)*? (?: (?&strong) | \x{FEFF} ) ) )
              (?<anyrun> (?! (?&flag) | (?&eflag) )
                (?= (?&h){3} | (?&h)*? (?: (?&strong) | (?&estrong) | \x{FEFF} ) ) )
              # A literal that doesn't process escapes (Python raw strings, String.raw), whole.
              (?<rawlit> (?<= (?<![\w$.])String\.raw )
                  ` (?: [^`\\\x{00AD}\x{034F}\x{061C}\x{115F}\x{1160}\x{17B4}\x{17B5}\x{180B}-\x{180F}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{206F}\x{3164}\x{FE00}-\x{FE0F}\x{FEFF}\x{FFA0}\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}\x{E0000}-\x{E0FFF}]++ | \\[^\x{00AD}\x{034F}\x{061C}\x{115F}\x{1160}\x{17B4}\x{17B5}\x{180B}-\x{180F}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{206F}\x{3164}\x{FE00}-\x{FE0F}\x{FEFF}\x{FFA0}\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}\x{E0000}-\x{E0FFF}] | (?!(?&litrun)) (?&hidden)++ )*+ ` )
            )
            # The first run that counts. The scan is possessive (it never backtracks, so long descriptions
            # stay under PCRE's limits): raw literals whole, other text in chunks up to a backslash, a
            # quote, or a hidden character, an escaped backslash as a pair (so the text after it isn't
            # read as an escape), and runs that don't count whole.
            \A (?: (?&rawlit) | [^\\`\x{00AD}\x{034F}\x{061C}\x{115F}\x{1160}\x{17B4}\x{17B5}\x{180B}-\x{180F}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{206F}\x{3164}\x{FE00}-\x{FE0F}\x{FEFF}\x{FFA0}\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}\x{E0000}-\x{E0FFF}]++ | [`] | \\\\ | (?!(?&h)) \\ (?!\\)
              | (?!(?&anyrun)) (?&h)++ )*+ (?&anyrun)
    metadata:
      category: security
      subcategory: [audit]
      pack-category: mcp-server
      owasp-llm:
        - "LLM01:2026 - Prompt Injection"
        - "LLM01:2025 - Prompt Injection"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI01 - Agent Goal Hijack"
      owasp-mcp:
        - "MCP03:2025 - Tool Poisoning"
      owasp-aisvs:
        - "v1.01-C10.4.2 - Schema, Message, and Input Validation"
      mitre-atlas:
        - "AML.T0011.002 - User Execution: Poisoned AI Agent Tool"
        - "AML.T0068 - LLM Prompt Obfuscation"
      cwe:
        - "CWE-1427: Improper Neutralization of Input Used for LLM Prompting"
        - "CWE-451: User Interface (UI) Misrepresentation of Critical Information"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, fastmcp, claude-agent-sdk, vercel-ai-sdk]
      references:
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP03-2025%E2%80%93Tool-Poisoning.md
        - https://embracethered.com/blog/posts/2024/hiding-and-finding-text-with-unicode-tags/
        - https://trojansource.codes/
        - https://www.unicode.org/Public/18.0.0/ucd/DerivedCoreProperties.txt
        - https://github.com/modelcontextprotocol/typescript-sdk/blob/v2.4.0/packages/server/src/server/mcp.ts
        - https://esbuild.github.io/api/#charset
