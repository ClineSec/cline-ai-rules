rules:
  - id: agent-memory-write-untrusted-ts
    # Generated by scripts/gen_agent_memory_write_untrusted.py. The pattern-sources (and the
    # first pattern-sanitizer and the pattern-propagators) are fetched-content-in-system-prompt-ts's, imported from
    # gen_fetched_content_in_system_prompt.py (build.py SHARED_BLOCKS checks the copies). Edit the
    # scripts and run scripts/build.py; build.py --check fails if this file drifts.
    # Sinks checked 2026-10-24: mem0ai 3.3.1 (dist/index.d.ts, dist/oss/index.d.ts),
    # @langchain/langgraph-checkpoint 1.2.1 (store/base), @langchain/langgraph 1.5.2 (getStore),
    # @letta-ai/letta-client 1.12.1, @getzep/zep-cloud 4.0.1 and 3.30.0.
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Content the application fetched or looked up (a retrieved document, a web page or HTTP
      response body, a search result, an MCP server's tool result, or the text of a stored
      ticket, message, or comment), or a model's answer about it, is written to the agent's
      long-term memory without review. Memory is read back into the prompt in later sessions,
      often for other users or other agents, so instructions planted in that content keep
      steering the agent after the page or ticket is gone (memory poisoning): they can change
      what it tells people, which tools it calls, and where it sends data. Screen what you store
      for instructions and keep it to facts you extracted and checked, record where each memory
      came from, and keep memory from untrusted sources scoped to the user or tenant it came
      from, apart from memory the agent treats as its own.
    mode: taint
    options:
      # A count or a comparison says something about the content without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Retrieved documents. LangChain.js vector stores (similaritySearch*,
      # maxMarginalRelevanceSearch, and the pre-1.0 getRelevantDocuments), retrievers (invoke /
      # batch on an object named like a retriever, or anything asRetriever() returns, which also
      # covers LCEL chains), and LlamaIndex.TS retrievers (retrieve); search() on a store or
      # index named like one.
      - exact: true
        pattern-either:
          - patterns:
              - pattern: $O.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:similaritySearch\w*|maxMarginalRelevanceSearch|getRelevantDocuments)$
          - pattern: $X.asRetriever(...)
          - patterns:
              - pattern-either:
                  - pattern: $O.invoke(...)
                  - pattern: $O.batch(...)
                  - pattern: $O.retrieve(...)
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    (?i)^(?:[\w$.]*\.)?[\w$]*retriever$
          - patterns:
              - pattern: $O.search(...)
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    (?i)^(?:[\w$.]*\.)?[\w$]*(?:vectorStore|vectorDb|kb|knowledgeBase|docStore|docIndex|searchIndex|index|corpus)$
      # Document loaders and readers (LangChain.js BaseDocumentLoader.load, LlamaIndex.TS
      # readers' loadData): web pages, uploaded files, and synced workspaces.
      - exact: true
        patterns:
          - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:load|loadAndSplit|loadData|lazyLoad)$
          - pattern-either:
              - pattern: new $CLS(...).$M(...)
              - patterns:
                  - pattern-inside: |
                      const $L = new $CLS(...);
                      ...
                  - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $CLS
              regex: |-
                ^(?:[\w$.]*\.)?(?!(?:Data|Base)Loader$)[A-Z][\w$]*(?:Loader|Reader)$
      # Web search, scraping, and vector database results. Tavily (tavily({ apiKey })), Exa,
      # and Firecrawl clients; LangChain.js search tools (SerpAPI, Bing, Brave, DuckDuckGo,
      # Google Custom Search, SearchApi, SearxNG, Serper, Tavily); serpapi 2.2.1's getJson /
      # getHtml with an engine; googleapis' customsearch; or a client named like one of these
      # (ddg for duck-duck-scrape 2.2.7, serp, brave, bing, webSearch, searchTool); Chroma collection.query({
      # queryTexts }), Pinecone index.query({ includeMetadata: true }), Qdrant
      # client.query(collection, { query }), and Weaviate collection.query.nearText / hybrid /
      # bm25 / nearVector / fetchObjects.
      - exact: true
        pattern-either:
          - pattern: tavily(...)
          - pattern: new Exa(...)
          - pattern: new Firecrawl(...)
          - pattern: new FirecrawlApp(...)
          - pattern: new FirecrawlClient(...)
          - patterns:
              - pattern: new $CLS(...)
              - metavariable-regex:
                  metavariable: $CLS
                  regex: |-
                    ^(?:[\w$.]*\.)?(?:SerpAPI|BingSerpAPI|BraveSearch|DuckDuckGoSearch|GoogleCustomSearch|SearchApi|SearxngSearch|Serper|Tavily(?:Search|Extract|Crawl|Research|GetResearch)(?:APIWrapper)?)$
          - patterns:
              - pattern-either:
                  - pattern: '$F({..., engine: $E, ...}, ...)'
                  - pattern: '$F("$E", {...}, ...)'
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(?:[\w$.]*\.)?get(?:Json|Html)$
          - pattern: google.customsearch(...)
          - pattern: customsearch(...)
          - patterns:
              - pattern: $T.$M(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    ^(?:[\w$.]*\.)?(?:(?i:[\w$]*tavily[\w$]*|[\w$]*firecrawl[\w$]*|[\w$]*duckduckgo[\w$]*|ddg[\w$]*)|exa(?:[A-Z_][\w$]*)?|[\w$]*Exa|serp[\w$]*|[\w$]*Serp[\w$]*|brave(?:[A-Z_][\w$]*)?|[\w$]*Brave|bing(?:[A-Z_][\w$]*)?|[\w$]*Bing|webSearch[\w$]*|[\w$]*WebSearch|searchTool|[\w$]*SearchTool)$
              - metavariable-regex:
                  metavariable: $M
                  regex: |-
                    ^(?:search|extract|crawl|searchQNA|searchContext|searchAndContents|getContents|findSimilarAndContents|answer|scrape|scrapeUrl|batchScrape|crawlUrl|invoke|call|run|getJson|getHtml)$
          - pattern: '$C.query({..., queryTexts: $Q, ...})'
          - pattern: '$C.query({..., queryEmbeddings: $Q, ...})'
          - pattern: '$I.query({..., includeMetadata: true, ...})'
          - pattern: '$C.query($N, {..., query: $Q, ...})'
          - patterns:
              - pattern: $C.query.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:nearText|nearVector|nearObject|hybrid|bm25|fetchObjects)$
      # A helper that fetches a page or retrieves documents by its name: fetchPage(url),
      # scrapeUrl(...), findRelevantContent(question), searchDocs(query).
      - exact: true
        patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:[\w$.]*\.)?_?(?:(?:fetch|scrape|crawl|download|browse)[\w$]*?(?:Page|Webpage|Html|HTML|Url|URL|Website|Site|Link|Web)s?(?:[A-Z][\w$]*)?|(?:get|find|search|retrieve|query|fetch|lookup)[\w$]*?(?:Docs|Documents|Chunks|Passages|Articles|Snippets|Nodes|Knowledge|Kb|KB|SearchResults|RelevantContent|(?:Relevant|Retrieved|Kb|Rag)Context))$
      # An MCP server's tool result, read through an MCP client: Client.callTool
      # (@modelcontextprotocol/sdk 1.32.2, @modelcontextprotocol/client 2.4.0).
      - exact: true
        pattern: $C.callTool(...)
      # Records (label RECORD), which count only through a field named like people's text below.
      # HTTP responses: fetch, axios (and axios.create clients), got, ky, and a client call
      # whose first argument looks like a URL. Not a route registration (app.get("/x", (req,
      # res) => ...), router.post("/y", auth, handler)): as a source it would cover the whole
      # handler, and OpenGrep then drops the sources inside it.
      - label: RECORD
        exact: true
        pattern-either:
          - pattern: fetch(...)
          - pattern: axios(...)
          - pattern: axios.$M(...)
          - pattern: got(...)
          - pattern: got.$M(...)
          - pattern: ky(...)
          - pattern: ky.$M(...)
          - patterns:
              - pattern: $S.$VERB($URL, ...)
              - pattern-not: $S.$VERB($URL, ..., ($...P) => $BODY, ...)
              - pattern-not: $S.$VERB($URL, ..., function ($...P) {...}, ...)
              - metavariable-regex:
                  metavariable: $VERB
                  regex: ^(?:get|post|put|patch|request|fetch)$
              - metavariable-regex:
                  metavariable: $URL
                  regex: |-
                    (?i)^(?:[\"'`](?:https?://|/)|[\w$.]*(?:url|uri|endpoint|link|href)s?(?:\[.*\])?$)
              - metavariable-regex:
                  metavariable: $S
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:req|request)$)(?!Promise$)(?!.*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))
              - metavariable-regex:
                  metavariable: $S
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:app|server|fastify|hono|routes?|[\w$]*[rR]outer)$)
      # Database reads: Prisma (findUnique, findFirst, findMany), Drizzle (select().from(),
      # db.query.*.find*), pg and mysql2 query / execute, Kysely, TypeORM, Mongoose,
      # better-sqlite3 prepare().get() / all(), postgres.js sql`...`, and helpers named like a
      # lookup (getTicket, fetchThread). Clients, tables, and helpers named like configuration
      # (tenantSettings, getPersona) are the operators' own text and don't count.
      - label: RECORD
        exact: true
        pattern-either:
          - patterns:
              - pattern: $F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?[\w$]*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))(?!(?:[\w$.]*\.)?(?:req|request|searchParams)\.)(?:[\w$.]*\.)?_?(?:get|fetch|find|load|lookup|query|select)[A-Z_][\w$]*$
          - patterns:
              - pattern: $O.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: |-
                    ^(?:find(?:Unique|First|Many|One|ById|ByPk|All|By)\w*|query|execute|executeTakeFirst\w*|all|first|aggregate)$
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:req|request)$)(?!Promise$)(?!.*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))
          - patterns:
              - pattern-either:
                  - pattern: $DB.select(...).from($T)
                  - pattern: $DB.prepare(...).get(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    ^(?!(?:[\w$.]*\.)?(?:req|request)$)(?!Promise$)(?!.*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))
          - pattern: sql`...`
      # A browser page (Playwright or Puppeteer newPage): page.content(), page.innerText("main").
      - label: RECORD
        exact: true
        pattern: $B.newPage(...)
      # What a page script returns, when the script reads the page's text: Playwright and
      # Puppeteer page.evaluate(() => document.body.innerText), page.$eval("article", (e) =>
      # e.textContent), locator.evaluateAll(...).
      - requires: RECORD
        patterns:
          - pattern-either:
              - pattern: $P.evaluate($JS, ...)
              - pattern: $P.evaluateAll($JS, ...)
              - patterns:
                  - pattern: $P.$EV($SEL, $JS, ...)
                  - metavariable-regex:
                      metavariable: $EV
                      regex: ^\$\$?eval$
          - metavariable-regex:
              metavariable: $JS
              regex: |-
                (?is).*(?:\b(?:inner|outer)(?:text|html)\b|\btextcontent\b|document\.(?:body|documentelement)\b|getselection)
      # The text in a record: a field, key, or variable named like something a person writes
      # (ticket.body, row["comment"], const lastMessage = ...), or the decoded body of an HTTP
      # response or page (await res.text(), cheerio's $("main").text(), page.innerText("main")).
      - requires: RECORD
        patterns:
          - pattern: $O.$F
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)$
      - requires: RECORD
        patterns:
          - pattern: $O[$K]
          - metavariable-regex:
              metavariable: $K
              regex: |-
                ^["'`](?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)["'`]$
      - requires: RECORD
        patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme)$
      # An array callback over records that reads a text field: rows.map((c) => c.text). The
      # callback parameter doesn't keep the RECORD label in default mode, so the call counts.
      - requires: RECORD
        patterns:
          - pattern-either:
              - pattern: $XS.$METHOD(($X, ...) => <... $X.$F ...>)
              - pattern: '$XS.$METHOD(($X, ...) => { ... <... $X.$F ...>; ... })'
              - pattern: '$XS.$METHOD(function ($X, ...) { ... <... $X.$F ...>; ... })'
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|filter|find|findLast|reduce)$
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)$
    pattern-propagators:
      # Array callbacks over records or documents (rows.map((c) => c.text)) taint the callback's
      # element parameter, which default mode doesn't do on its own.
      - patterns:
          - pattern-either:
              - pattern: $XS.$METHOD(($X, ...) => $BODY)
              - pattern: $XS.$METHOD(($X, ...) => {...})
              - pattern: $XS.$METHOD(function ($X, ...) {...})
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|forEach|filter|find|findLast|reduce)$
        from: $XS
        to: $X
      # And the call's result. --taint-intrafile drops the receiver's taint from an array
      # callback on a field (found.results.map((r) => r.content)), though not on a plain name.
      - patterns:
          - pattern: $CALL
          - pattern: $XS.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:map|flatMap|forEach|filter|find|findLast|reduce)$
        from: $XS
        to: $CALL
    pattern-sanitizers:
      # Facts about the content are not the content: a count, a number, a flag.
      - exact: true
        pattern-either:
          - pattern: $X.length
          - pattern: Number(...)
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Boolean(...)
      # A value that went through a step named like a check or clean-up (sanitize_memory(text),
      # screen_for_injection(page)), or that such a check looked at before the write (if not
      # is_safe(note): ...). The step's name is all the rule can see, so it trusts the name.
      - by-side-effect: true
        patterns:
          - pattern: $F($X, ...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?i)^(?![\w$.]*(?:model_validate|validate_(?:json|python|strings)|parse_obj))(?:[\w$.]*[._])?_?(?:[\w$]*_)?(?:sanitiz|validat|moderat|review|screen|vet_|scan_?for|detect_?injection|check_?injection|strip_?instructions|is_?safe|looks_?safe|is_?clean)[\w$]*$
          - focus-metavariable: $X
    pattern-sinks:
      # mem0 (mem0ai 3.3.1): MemoryClient (platform, "mem0ai") and Memory (open source,
      # "mem0ai/oss") add(messages, { userId, ... }) store the messages (or the facts an LLM
      # extracts from them), and search() returns them into later prompts. A client made in
      # this file, or one named like one (memory, mem0) called with the scope ids mem0 takes, so
      # a Set's add(x) doesn't count.
      - patterns:
          - pattern-inside: $M.add($X, ...)
          - pattern-inside: |
              import MemoryClient from "mem0ai";
              ...
          - pattern-inside: |
              const $M = new MemoryClient(...);
              ...
          - pattern: $X
      - patterns:
          - pattern-inside: $M.add($X, ...)
          - pattern-inside: |
              import {...} from "=~/^mem0ai(?:/oss)?$/";
              ...
          - pattern-either:
              - pattern-inside: |
                  const $M = new MemoryClient(...);
                  ...
              - pattern-inside: |
                  const $M = new Memory(...);
                  ...
          - pattern: $X
      - patterns:
          - pattern-inside: '$M.add($X, {..., $K: $ID, ...}, ...)'
          - metavariable-regex:
              metavariable: $K
              regex: |-
                ^(?:userId|agentId|runId|appId|user_id|agent_id|run_id|app_id)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:[\w$.]*\.)?(?i:[\w$]*mem0[\w$]*|(?:[\w$]*?)mem(?:ory|ories)?(?:_?client)?)$
          - pattern: $X
      # mem0 update(memoryId, { text }) (OSS also takes the text itself, or the deprecated data)
      # and MemoryClient.batchUpdate.
      - patterns:
          - pattern-either:
              - pattern-inside: '$M.update($ID, {..., text: $X, ...}, ...)'
              - pattern-inside: '$M.update($ID, {..., data: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: $M.update($ID, $X)
                  - metavariable-regex:
                      metavariable: $X
                      regex: ^(?!\{)
              - pattern-inside: $M.batchUpdate($X, ...)
          - pattern-inside: |
              import MemoryClient from "mem0ai";
              ...
          - pattern-inside: |
              const $M = new MemoryClient(...);
              ...
          - pattern: $X
      - patterns:
          - pattern-either:
              - pattern-inside: '$M.update($ID, {..., text: $X, ...}, ...)'
              - pattern-inside: '$M.update($ID, {..., data: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: $M.update($ID, $X)
                  - metavariable-regex:
                      metavariable: $X
                      regex: ^(?!\{)
              - pattern-inside: $M.batchUpdate($X, ...)
          - pattern-inside: |
              import {...} from "=~/^mem0ai(?:/oss)?$/";
              ...
          - pattern-either:
              - pattern-inside: |
                  const $M = new MemoryClient(...);
                  ...
              - pattern-inside: |
                  const $M = new Memory(...);
                  ...
          - pattern: $X
      - patterns:
          - pattern-either:
              - pattern-inside: '$M.update($ID, {..., text: $X, ...}, ...)'
              - pattern-inside: '$M.update($ID, {..., data: $X, ...}, ...)'
              - patterns:
                  - pattern-inside: $M.update($ID, $X)
                  - metavariable-regex:
                      metavariable: $X
                      regex: ^(?!\{)
              - pattern-inside: $M.batchUpdate($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:[\w$.]*\.)?(?i:[\w$]*mem0[\w$]*|(?:[\w$]*?)mem(?:ory|ories)?(?:_?client)?)$
          - pattern: $X
      # LangGraph.js long-term memory (@langchain/langgraph-checkpoint 1.2.1 BaseStore,
      # @langchain/langgraph 1.5.2): store.put(namespace, key, value) on a store named like one
      # (store, config.store, runtime.store, getStore()), with an array namespace or in a file
      # that imports LangGraph, so IndexedDB's objectStore.put(value, key) doesn't count.
      # config.store is optional in the node's config, so the call is often config.store?.put().
      - patterns:
          - pattern-either:
              - pattern-inside: $S.put($NS, $KEY, $V, ...)
              - pattern-inside: $S?.put($NS, $KEY, $V, ...)
          - metavariable-regex:
              metavariable: $S
              regex: |-
                ^(?:(?:[\w$.]*\.)?[\w$]*(?:store|Store)|(?:[\w$.]*\.)?getStore\(.*\))$
          - pattern-either:
              - pattern-inside: $S.put([...], $KEY, $V, ...)
              - pattern-inside: $S?.put([...], $KEY, $V, ...)
              - pattern-inside: |
                  import {...} from "=~/^@langchain\/langgraph/";
                  ...
          - pattern: $V
      # Letta (@letta-ai/letta-client 1.12.1): core memory blocks, in the agent's context on
      # every turn (agents.blocks.update(label, { agent_id, value }), blocks.create({ label,
      # value }), blocks.update(id, { value }), agents.create({ memory_blocks })), and archival
      # passages the agent searches (agents.passages.create(id, { text }),
      # archives.passages.create / createMany).
      - patterns:
          - pattern-either:
              - pattern-inside: '$C.agents.blocks.$M($L, {..., value: $X, ...}, ...)'
              - pattern-inside: '$C.blocks.$M($ID, {..., value: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:update|modify)$
          - pattern: $X
      - patterns:
          - pattern-either:
              - pattern-inside: '$C.blocks.create({..., value: $X, ...}, ...)'
              - pattern-inside: '$C.agents.create({..., memory_blocks: $X, ...}, ...)'
              - pattern-inside: '$C.agents.create({..., memoryBlocks: $X, ...}, ...)'
              - pattern-inside: '$C.agents.passages.create($ID, {..., text: $X, ...}, ...)'
              - pattern-inside: '$C.archives.passages.create($ID, {..., text: $X, ...}, ...)'
              - pattern-inside: '$C.archives.passages.createMany($ID, {..., passages: $X, ...}, ...)'
          - pattern: $X
      # Zep (@getzep/zep-cloud 4.0.1 and 3.30.0): graph episodes (graph.add({ data }) in 3.x,
      # graph.episode.add(graphUuid, { data }) in 4.x, addBatch({ episodes }), addFactTriple({
      # fact })) and thread messages (thread.addMessages(threadId, { messages }),
      # addMessagesBatch), which Zep turns into the facts its context block returns.
      - patterns:
          - pattern-either:
              - pattern-inside: '$C.graph.add({..., data: $X, ...}, ...)'
              - pattern-inside: '$C.graph.episode.add($G, {..., data: $X, ...}, ...)'
              - pattern-inside: '$C.graph.addBatch({..., episodes: $X, ...}, ...)'
              - pattern-inside: '$C.graph.addFactTriple({..., fact: $X, ...}, ...)'
              - pattern-inside: '$C.thread.addMessages($T, {..., messages: $X, ...}, ...)'
              - pattern-inside: '$C.thread.addMessagesBatch($T, {..., messages: $X, ...}, ...)'
              - pattern-inside: '$C.memory.add($T, {..., messages: $X, ...}, ...)'
          - pattern: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM01:2026 - Prompt Injection"
        - "LLM01:2025 - Prompt Injection"
      owasp-agentic:
        - "ASI06 - Memory & Context Poisoning"
      owasp-aisvs:
