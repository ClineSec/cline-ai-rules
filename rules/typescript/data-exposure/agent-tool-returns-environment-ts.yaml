                      # A named function passed as execute, or as LangChain.js tool()'s func,
                      # declared before the call: a regex over the declaration (signature and
                      # balanced body) that looks ahead for tool(...) or dynamicTool(...) naming
                      # it. NAMED must name the function. A statement region from every function
                      # to a later tool() call took about 11 s on a 5,000-line file (OpenGrep
                      # 1.30.2).
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  import { $FN } from "$MOD";
                                  ...
                              - pattern-inside: |
                                  const { $FN } = require("$MOD");
                                  ...
                          - pattern-regex: |-
                                  (?x)
                                  (?(DEFINE)
                                    (?<str> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\\\n]|\\.)*+' | `(?:[^`\\]|\\.)*+` )
                                    (?<com> //[^\n]*+ | /\*(?:[^*]++|\*(?!/))*+\*/ )
                                    (?<br> \{ (?: [^{}"'`/]++ | (?&com) | (?&str) | (?&br) | [/"'`] )*+ \} )
                                    (?<pa> \( (?: [^()"'`/]++ | (?&com) | (?&str) | (?&pa) | [/"'`] )*+ \) )
                                    (?<ang> < (?: [^<>=]++ | =>? | (?&ang) )*+ > )
                                    (?<ty> (?: [^{}()<>=;]++ | (?&ang) | (?&pa) | => )*? )
