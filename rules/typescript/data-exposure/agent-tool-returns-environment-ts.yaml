    pattern-sinks:
      # What an agent tool's execute function returns (an expression body counts as a return):
      # the tool result the model reads next. The registration shapes are
      # agent-tool-arg-to-shell-ts's sources, for functions with or without parameters.
      - requires: ENV
        exact: true
        patterns:
          - pattern-either:
              # Vercel AI SDK tool({ inputSchema, execute }) and dynamicTool, OpenAI Agents
              # tool({ parameters, execute }), LangChain.js tool(fn, { schema }). Gated by the
              # import, since tool() is a common name.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  import { $FN } from "$MOD";
                                  ...
                              - pattern-inside: |
                                  const { $FN } = require("$MOD");
                                  ...
                          - pattern-either:
                              - pattern: '$FN({..., execute: (...) => {...}, ...})'
                              - pattern: '$FN({..., execute(...) {...}, ...})'
                              - pattern: $FN((...) => {...}, ...)
