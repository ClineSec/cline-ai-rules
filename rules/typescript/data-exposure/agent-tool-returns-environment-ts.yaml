                          - pattern-either:
                              - pattern-inside: |
                                  import { $FN as $TOOL } from "$MOD";
                                  ...
                              - pattern-inside: |
                                  const { $FN: $TOOL } = require("$MOD");
                                  ...
                          - pattern-either:
                              - pattern: '$TOOL({..., execute: (...) => {...}, ...})'
                              - pattern: '$TOOL({..., execute(...) {...}, ...})'
