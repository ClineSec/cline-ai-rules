# Generated by scripts/gen_tool_returns_environment.py from agent-tool-arg-to-shell-ts (the tool handler
# shapes) and gen_secret_in_system_prompt.py (secret names). Edit those, or the script, not this file.
rules:
  - id: agent-tool-returns-environment-ts
    # JavaScript/TypeScript twin of agent-tool-returns-environment, with agent-tool-arg-to-shell-ts's
    # tool shapes (Vercel AI SDK ai 7.0.150 tool({ execute }) and dynamicTool, OpenAI Agents JS 0.21.0
    # tool({ execute }), LangChain.js @langchain/core 1.3.0 tool(fn), DynamicStructuredTool and
    # StructuredTool._call).
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      An agent tool returns the process environment to the model: the whole environment (process.env, a parsed .env file, `env` or `printenv` output) or
      a variable named like a secret. What it returns goes into the model's context and the
      run's transcript, so every API key, token, and connection string the agent was started with can be
      repeated in a reply, written into another tool call, or sent somewhere by a prompt
      injection in anything the model reads, and it stays in provider and tracing logs. Return
      only the non-secret settings the tool needs, read by name (`{ tz: process.env.TZ }`), or say whether a
      secret is set rather than what it is.
    mode: taint
    options:
      # Only the propagators below carry the environment through a call: subprocess.run(env=env),
      # a client built from it, len(env), and bool(token) return clean values.
      taint_assume_safe_functions: true
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # The tool's arguments, unlabeled (__SOURCE__): only an environment lookup they name
      # (below) is reported, not an argument the tool echoes back. Copied from agent-tool-arg-to-shell-ts, with
      # its allowlist sanitizers.
      # The execute function's first parameter (the validated input object, destructured or
      # not). `($ARGS, ...) => {...}` also matches function expressions and expression bodies.
      - patterns:
          - pattern-either:
              # Vercel AI SDK tool({ inputSchema, execute }) and dynamicTool, OpenAI Agents
              # tool({ parameters, execute }), LangChain.js tool(fn, { schema }). Gated by the
              # import, since tool() is a common name.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  import { $FN } from "$MOD";
                                  ...
                              - pattern-inside: |
                                  const { $FN } = require("$MOD");
                                  ...
                          - pattern-either:
                              - pattern: '$FN({..., execute: ($ARGS, ...) => {...}, ...})'
                              - pattern: '$FN({..., execute($ARGS, ...) {...}, ...})'
                              - pattern: $FN(($ARGS, ...) => {...}, ...)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  import { $FN as $TOOL } from "$MOD";
                                  ...
                              - pattern-inside: |
                                  const { $FN: $TOOL } = require("$MOD");
                                  ...
                          - pattern-either:
                              - pattern: '$TOOL({..., execute: ($ARGS, ...) => {...}, ...})'
                              - pattern: '$TOOL({..., execute($ARGS, ...) {...}, ...})'
                              - pattern: $TOOL(($ARGS, ...) => {...}, ...)
                      # A named function passed as execute, or as LangChain.js tool()'s func,
                      # declared before the call: a regex over the declaration (signature and
                      # balanced body) that looks ahead for tool(...) or dynamicTool(...) naming
                      # it. NAMED must name the function. A statement region from every function
                      # to a later tool() call took about 11 s on a 5,000-line file (OpenGrep
                      # 1.30.2).
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  import { $FN } from "$MOD";
                                  ...
                              - pattern-inside: |
                                  const { $FN } = require("$MOD");
                                  ...
                          - pattern-regex: |-
                                  (?x)
                                  (?(DEFINE)
                                    (?<str> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\\\n]|\\.)*+' | `(?:[^`\\]|\\.)*+` )
                                    (?<com> //[^\n]*+ | /\*(?:[^*]++|\*(?!/))*+\*/ )
                                    (?<br> \{ (?: [^{}"'`/]++ | (?&com) | (?&str) | (?&br) | [/"'`] )*+ \} )
                                    (?<pa> \( (?: [^()"'`/]++ | (?&com) | (?&str) | (?&pa) | [/"'`] )*+ \) )
                                    (?<ang> < (?: [^<>=]++ | =>? | (?&ang) )*+ > )
                                    (?<ty> (?: [^{}()<>=;]++ | (?&ang) | (?&pa) | => )*? )
                                    (?<reg> \( \s*+ (?: \k<NAMED> \b \s*+ [,)]
                                      | \{ (?: [^{}"'`/e]++ | (?&com) | (?&str) | (?&br) | [/"'`] | e(?!xecute \s*+ : \s*+ \k<NAMED> \b \s*+ [,}]) )*+
                                        execute \s*+ : \s*+ \k<NAMED> \b \s*+ [,}] ) )
                                  )
                                  (?| (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ (?<NAMED>[\w$]++)
                                      \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br)
                                    | (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ (?<NAMED>[\w$]++) \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                      (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                                  (?= (?: [^(]++ | (?<!\btool)(?<!\bdynamicTool) \( | (?!(?&reg)) \( )*+ (?<=\btool|\bdynamicTool) (?&reg) )
                          - pattern-either:
                              - pattern: function $H($ARGS, ...) {...}
                              - pattern: const $H = ($ARGS, ...) => {...};
                          - metavariable-comparison:
                              comparison: str($H) == str($NAMED)
                  - metavariable-regex:
                      metavariable: $MOD
                      regex: ^(?:ai|@openai/agents(?:-core)?|@langchain/core/tools|langchain)$
                  - metavariable-regex:
                      metavariable: $FN
                      regex: ^(?:tool|dynamicTool)$
              # LangChain.js classes: new DynamicStructuredTool({ func }), and the _call
              # method of a StructuredTool / Tool subclass.
              - pattern: 'new DynamicStructuredTool({..., func: ($ARGS, ...) => {...}, ...})'
              - pattern: 'new DynamicTool({..., func: ($ARGS, ...) => {...}, ...})'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          class $C extends StructuredTool {...}
                      - pattern-inside: |
                          class $C extends Tool {...}
                  - pattern: |
                      _call($ARGS, ...) {...}
          - focus-metavariable: $ARGS
      # The whole environment as a value: process.env returned, spread ({...process.env}),
      # serialized, or listed with Object.entries. A lookup (process.env.HOME), a membership
      # test, and Object.keys alone are not its values.
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: process.env
              - pattern: Bun.env
          - pattern-not-inside: $RT.env.$KEY
          - pattern-not-inside: $RT.env[$KEY]
          - pattern-not-inside: $KEY in $RT.env
      - label: ENV
        pattern: Deno.env.toObject()
      # A parsed .env file: dotenv.config() (its .parsed), dotenv.parse(text).
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: dotenv.config(...)
              - pattern: dotenv.parse(...)
              - patterns:
                  - pattern-inside: |
                      import { $FN } from "dotenv";
                      ...
                  - pattern: $FN(...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: ^(?:config|parse)$
      # A command that prints the whole environment: execSync("env"), execFileSync("printenv"),
      # spawnSync("env"), execa("printenv").
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: $EXEC($CMD)
              - pattern: '$EXEC($CMD, {...})'
              - pattern: $EXEC($CMD, [], ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(?:[\w$]+\.)?(?:execSync|execFileSync|spawnSync|execa|execaSync|execAsync|execFileAsync)$
          - metavariable-regex:
              metavariable: $CMD
              regex: |-
                ^["'`](?:/usr)?(?:/bin/)?(?:env|printenv)(?:\s+(?:-0|--null))?(?:\s*\|\s*sort)?["'`]$
      # The environment file of a process: readFileSync("/proc/self/environ").
      - label: ENV
        patterns:
          - pattern: $READ($PATH, ...)
          - metavariable-regex:
              metavariable: $PATH
              regex: |-
                ^[fF]?["'`]/proc/(?:self|\d+|[$]?\{[^}"'`]+\})/environ["'`]$
      # One variable named like a secret: process.env.GITHUB_TOKEN, process.env["DB_PASSWORD"].
      # The names are the ones secret-in-system-prompt-ts treats as secrets.
      - label: ENV
        patterns:
          - pattern: $RT.env.$NAME
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
          - metavariable-regex:
              metavariable: $NAME
              regex: |-
                (?x)
                ^ (?=[A-Za-z_$][\w$]* $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) $ )
                (?! (?i:pwd|dsn) $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) $
      - label: ENV
        patterns:
          - pattern: $RT.env[$NAME]
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
          - metavariable-regex:
              metavariable: $NAME
              regex: |-
                (?x)
                ^ ["'`] (?=[\w$.-]+ ["'`] $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) ["'`] $ )
                (?! (?i:pwd|dsn) ["'`] $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) ["'`] $
      # A variable the model names: process.env[name] with a tool argument as the name, so a
      # prompt injection can ask for AWS_SECRET_ACCESS_KEY.
      - label: ENV
        requires: __SOURCE__
        patterns:
          - pattern: $RT.env[$KEY]
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
    pattern-propagators:
      # Copies, serializations, and text built from a value carry it: JSON.stringify(env),
      # Object.entries(env).map(...).join("\n"), structuredClone(env), out.toString().
      - patterns:
          - pattern-either:
              - pattern: JSON.stringify($X, ...)
              - pattern: Object.entries($X)
              - pattern: Object.values($X)
              - pattern: Object.fromEntries($X)
              - pattern: Object.assign($T, ..., $X, ...)
              - pattern: structuredClone($X, ...)
              - pattern: String($X)
              - pattern: util.inspect($X, ...)
              - pattern: util.format(..., $X, ...)
              - pattern: $DEC.decode($X, ...)
              - pattern: Buffer.from($X, ...)
              - pattern: btoa($X)
              - pattern: encodeURIComponent($X)
              - pattern: encodeURI($X)
              - pattern: querystring.stringify($X, ...)
              - patterns:
                  - pattern: $X.$METHOD(...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(?:map|flatMap|filter|find|findLast|join|sort|toSorted|reverse|flat|concat|toString|trim|trimEnd|trimStart|split|replace|replaceAll|toUpperCase|toLowerCase|padStart|padEnd|normalize|at|slice|substring|substr)$
          - pattern: $CALL
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                (?sx)
                ^ (?(DEFINE)
                    (?<bal> (?: [^()] | \( (?&bal) \) )* )
                    (?<built>
                      (?: (?:JSON\.stringify|Object\.(?:entries|values|fromEntries|assign)|structuredClone|String|util\.(?:inspect|format)|[\w$.]+\.decode|Buffer\.from|btoa|encodeURIComponent|encodeURI|querystring\.stringify) \( (?: [^()]*? , \s* )? (?&built) (?: \s* , (?&bal) )? \)
                        | [^()]* )
                      (?: \. (?! (?:slice|substring|substr) \( \s* (?: 0 \s* , \s* )? -? [0-9] \s* \) )
                          (?:map|flatMap|filter|find|findLast|join|sort|toSorted|reverse|flat|concat|toString|trim|trimEnd|trimStart|split|replace|replaceAll|toUpperCase|toLowerCase|padStart|padEnd|normalize|at|slice|substring|substr) \( (?&bal) \) )* ) )
                # A short preview (token.slice(0, 4), key.slice(-4)) ends the chain.
                # A call, not a bare name inside one: binding $CALL to `JSON` or `process` taints the global.
                (?= .* \) $ ) (?&built) $
        from: $X
        to: $CALL
      - pattern: Object.assign($T, ..., $X, ...)
        from: $X
        to: $T
    pattern-sanitizers:
      # Shared with agent-tool-arg-option-injection-ts (the first sanitizer; build.py
      # SHARED_BLOCKS). A field whose schema only admits safe values: z.enum, z.literal,
      # z.number, z.boolean, or a string with an anchored .regex(/^...$/). The frameworks
      # validate the model's arguments against the schema before calling execute, so uses
      # of that field (destructured or input.field) are clean.
      - patterns:
          - pattern-either:
              - pattern-inside: '$TOOL({..., inputSchema: $Z.object({..., $KEY: $TYPE, ...}), ...})'
              - pattern-inside: '$TOOL({..., parameters: $Z.object({..., $KEY: $TYPE, ...}), ...})'
              - pattern-inside: '$TOOL($FUNC, {..., schema: $Z.object({..., $KEY: $TYPE, ...}), ...})'
              - pattern-inside: 'new $CLASS({..., schema: $Z.object({..., $KEY: $TYPE, ...}), ...})'
          - metavariable-pattern:
              metavariable: $TYPE
              pattern-either:
                - pattern: $Z.enum(...)
                - pattern: $Z.nativeEnum(...)
                - pattern: $Z.literal(...)
                - pattern: $Z.number(...)
                - pattern: $Z.boolean(...)
                - pattern: $Z.int(...)
                - patterns:
                    - pattern: $STR.regex($RE, ...)
                    - metavariable-regex:
                        metavariable: $RE
                        regex: ^/\^.*\$/[a-z]*$
          - pattern-either:
              - pattern: $KEY
              - pattern: $OBJ.$KEY
      # An allowlist check before use: /^...$/.test(value).
      - by-side-effect: true
        patterns:
          - pattern: $RE.test($X)
          - metavariable-regex:
              metavariable: $RE
              regex: ^/\^.*\$/[a-z]*$
          - focus-metavariable: $X
      # An allowlist membership check before use: ALLOWED.has(value), ALLOWED.includes(value).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $ALLOWED.has($X)
              - pattern: $ALLOWED.includes($X)
          - focus-metavariable: $X
      # One variable read by a name that isn't a secret's: env.HOME, env["TZ"]. A name the
      # caller chooses (env[name]) or a secret's name (env.GITHUB_TOKEN) stays tainted, and so
      # do the members that hold the environment itself (dotenv's .parsed, a command's .stdout).
      - exact: true
        patterns:
          - pattern: $MAP.$KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: ^(?!(?:env|parsed|stdout|output|environment|variables|vars)$)
          - metavariable-regex:
              metavariable: $KEY
              regex: |-
                (?x)
                ^ (?=[A-Z][A-Z0-9_]* $)
                (?!
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) $ )
                (?! (?i:pwd|dsn) $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) $
                )
      # Any non-secret name read straight from process.env (a lower-case npm_config_* or
      # http_proxy too): once process.env is a source anywhere in a file, OpenGrep treats every
      # later process.env.<name> read, in any function, as part of it.
      - exact: true
        patterns:
          - pattern: $RT.env.$KEY
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
          - metavariable-regex:
              metavariable: $KEY
              regex: |-
                (?x)
                ^ (?=[A-Za-z_$][\w$]* $)
                (?!
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
