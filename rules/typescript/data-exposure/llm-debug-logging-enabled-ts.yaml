rules:
  - id: llm-debug-logging-enabled-ts
    # Prompt and completion logging switched on in committed TypeScript / JavaScript. Verified
    # 2026-10-24:
    # - LangChain.js (@langchain/core 1.3.0): `verbose: true` on a model, chain, tool, or agent
    #   (BaseLangChain), or LANGCHAIN_VERBOSE === "true", makes CallbackManager.configure add a
    #   ConsoleCallbackHandler, which console.logs every LLM prompt and output, chain input and
    #   output, and tool call (tracers/console.js). Unlike Python's verbose, this is the full
    #   trace.
    # - LangGraph.js (@langchain/langgraph 1.5.2): `debug: true` in invoke / stream config, or
    #   on a Pregel, prints each step's tasks and writes with their inputs (pregel/debug.js).
    # - OpenTelemetry (@opentelemetry/instrumentation-openai 0.22.0): captureMessageContent,
    #   or OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true, records prompts and
    #   completions on spans and log events; off by default.
    # - OpenAI Agents SDK (@openai/agents-core 0.21.0): setSensitiveDataLoggingEnabled(true),
    #   or OPENAI_AGENTS_DONT_LOG_MODEL_DATA / OPENAI_AGENTS_DONT_LOG_TOOL_DATA set to "0" or
    #   "false", logs model and tool data through the openai-agents debug loggers.
    # - Vercel AI SDK (ai 7.0.153) experimental_telemetry recordInputs / recordOutputs default
    #   to true once telemetry is on, so neither is a switch and neither is reported.
    # - A console or logger call (not debug) given the whole message list that the same
    #   function sends to a chat call (AI SDK generateText / streamText, OpenAI, Anthropic).
    # A switch behind an `if` on a debug / dev / local / verbose / test condition, or inside a
    # function named for debugging, stays quiet.
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Prompt and completion content is logged: LangChain.js `verbose: true` or
      `LANGCHAIN_VERBOSE`, a `ConsoleCallbackHandler`, LangGraph.js `debug: true`,
      OpenTelemetry GenAI message-content capture, the OpenAI Agents SDK's sensitive data
      logging, or a log call given the whole message list sent to the model. Every user
      message, system prompt, retrieved document, tool result, and answer then goes to the
      server's console logs (or the tracing backend), which are kept longer and read by more
      people and systems than the conversation itself, so personal data, credentials pasted
      into a chat, and the system prompt leak through log access. Leave these switches off in
      committed code, turn them on only behind an explicit debug setting, and log message
      counts, token usage, and IDs instead of message content.
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
        - "*.test.js"
        - "*.spec.ts"
        - "*.spec.js"
        - "__tests__/"
        - "test/"
        - "tests/"
    patterns:
      - pattern-either:
          # LangChain.js verbose: a constructor or factory of a class imported from LangChain.
          - patterns:
              - pattern-inside: |
                  import {$C} from "=~/^(?:@langchain\/|langchain(?:\/|$))/";
                  ...
              - pattern-either:
                  - pattern: 'new $C({..., verbose: $ON, ...})'
                  - pattern: '$C.$FACTORY({..., verbose: $ON, ...})'
                  - pattern: |
                      const $OPTS = {..., verbose: $ON, ...};
                      ...
                      new $C(<... $OPTS ...>);
              - metavariable-regex:
                  metavariable: $ON
                  regex: ^true$
              - focus-metavariable: $ON
          - patterns:
              - pattern-regex: (?s)\A(?=.*?["']@?langchain[/"']).*
              - pattern: new ConsoleCallbackHandler(...)
          # LangGraph.js debug mode.
          - patterns:
              - pattern-regex: (?s)\A(?=.*?["']@langchain/langgraph).*
              - pattern-either:
                  - pattern: '$G.invoke($IN, {..., debug: $ON, ...})'
                  - pattern: '$G.stream($IN, {..., debug: $ON, ...})'
                  - pattern: '$G.batch($IN, {..., debug: $ON, ...})'
                  - pattern: 'new Pregel({..., debug: $ON, ...})'
              - metavariable-regex:
                  metavariable: $ON
                  regex: ^true$
              - focus-metavariable: $ON
          # OpenTelemetry OpenAI instrumentation with message content.
          - patterns:
              - pattern-regex: (?s)\A(?=.*?["']@opentelemetry/instrumentation-openai["']).*
              - pattern: 'new OpenAIInstrumentation({..., captureMessageContent: $ON, ...})'
              - metavariable-regex:
                  metavariable: $ON
                  regex: ^true$
              - focus-metavariable: $ON
          # OpenAI Agents SDK sensitive data logging.
          - patterns:
              - pattern-regex: (?s)\A(?=.*?["']@openai/agents).*
              - pattern: setSensitiveDataLoggingEnabled(true)
          # The LiteLLM proxy started with --detailed_debug from a Node script.
          - pattern: '"--detailed_debug"'
          # Environment switches set from code before the SDK reads them.
          - patterns:
              - pattern: process.env.$K = $V
              - metavariable-comparison:
                  comparison: >-
                    (str($K) == "LANGCHAIN_VERBOSE" and str($V) == "true")
                    or (str($K) == "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT" and re.match("(?i)true$", str($V)))
                    or (re.match("OPENAI_AGENTS_DONT_LOG_(MODEL|TOOL)_DATA$", str($K)) and re.match("(0|false)$", str($V)))
          - patterns:
              - pattern: process.env[$KS] = $V
              - metavariable-comparison:
                  comparison: >-
                    (str($KS) == "LANGCHAIN_VERBOSE" and str($V) == "true")
                    or (str($KS) == "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT" and re.match("(?i)true$", str($V)))
                    or (re.match("OPENAI_AGENTS_DONT_LOG_(MODEL|TOOL)_DATA$", str($KS)) and re.match("(0|false)$", str($V)))
          # The same switches kept in an object of env defaults (Object.assign(process.env, …),
          # a child process's env).
          - patterns:
              - pattern: '{..., $K: $V, ...}'
              - metavariable-comparison:
                  comparison: >-
                    (str($K) == "LANGCHAIN_VERBOSE" and str($V) == "true")
                    or (str($K) == "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT" and re.match("(?i)true$", str($V)))
                    or (re.match("OPENAI_AGENTS_DONT_LOG_(MODEL|TOOL)_DATA$", str($K)) and re.match("(0|false)$", str($V)))
              - focus-metavariable: $V
          # The whole message list sent to a chat call, logged by the same function.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      function $FN(...) {
                        ...
                        <... $LLM({..., messages: $MSGS, ...}) ...>;
                        ...
                      }
                  - pattern-inside: |
                      ($...P) => {
                        ...
                        <... $LLM({..., messages: $MSGS, ...}) ...>;
                        ...
                      }
                  - pattern-inside: |
                      function $FN(...) {
                        ...
                        <... $LLM({..., input: $MSGS, ...}) ...>;
                        ...
                      }
                  - pattern-inside: |
                      ($...P) => {
                        ...
                        <... $LLM({..., input: $MSGS, ...}) ...>;
                        ...
                      }
              - metavariable-regex:
                  metavariable: $LLM
                  regex: >-
                    ^(?:generateText|streamText|generateObject|streamObject|[\w.]+\.(?:chat\.completions\.(?:create|parse|stream)|messages\.(?:create|stream)|responses\.(?:create|stream|parse)))$
              - metavariable-regex:
                  metavariable: $MSGS
                  regex: ^[A-Za-z_$][\w$.]*$
              - pattern-either:
                  - pattern: $LOG.$LVL(..., $MSGS, ...)
                  - pattern: $LOG.$LVL(..., JSON.stringify($MSGS, ...), ...)
                  - pattern: $LOG.$LVL(..., `...${$MSGS}...`, ...)
                  - pattern: $LOG.$LVL(..., `...${JSON.stringify($MSGS, ...)}...`, ...)
                  - pattern: '$LOG.$LVL(..., {..., $LK: $MSGS, ...}, ...)'
              - metavariable-regex:
                  metavariable: $LOG
                  regex: ^(?:console|(?:this\.)?_*(?:\w*[_.])?(?i:logger|log))$
              - metavariable-regex:
                  metavariable: $LVL
                  regex: ^(?:log|info|warn|warning|error|fatal|trace)$
      - pattern-not-inside:
          patterns:
            - pattern-inside: |
                if ($COND) { ... }
            - metavariable-regex:
                metavariable: $COND
                regex: (?i).*(?:debug|dev|local|verbose|trace|test)
      - pattern-not-inside:
          patterns:
            - pattern-inside: |
                function $DBG(...) { ... }
            - metavariable-regex:
                metavariable: $DBG
                regex: (?i).*(?:debug|verbose)
    metadata:
      category: security
      subcategory: [audit]
      pack-category: ai-code
      owasp-llm:
        - "LLM02:2026 - Sensitive Information Disclosure"
        - "LLM02:2025 - Sensitive Information Disclosure"
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [langchain, langgraph, opentelemetry, openai-agents, vercel-ai-sdk, openai, anthropic]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM02_SensitiveInformationDisclosure.md
        - https://cwe.mitre.org/data/definitions/532.html
        - https://github.com/langchain-ai/langchainjs/blob/%40langchain/core%401.3.0/libs/langchain-core/src/callbacks/manager.ts
        - https://github.com/langchain-ai/langchainjs/blob/%40langchain/core%401.3.0/libs/langchain-core/src/tracers/console.ts
        - https://github.com/langchain-ai/langchainjs/blob/%40langchain/core%401.3.0/libs/langchain-core/src/language_models/base.ts
        - https://github.com/langchain-ai/langgraphjs/blob/%40langchain/langgraph%401.5.2/libs/langgraph-core/src/pregel/debug.ts
        - https://github.com/open-telemetry/opentelemetry-js-contrib/blob/instrumentation-openai-v0.22.0/packages/instrumentation-openai/src/instrumentation.ts
        - https://github.com/openai/openai-agents-js/blob/v0.21.0/packages/agents-core/src/config.ts
        - https://github.com/vercel/ai/blob/ai%407.0.153/packages/ai/src/telemetry/telemetry-options.ts
