# Generated by scripts/gen_tool_returns_environment.py from mcp-tool-arg-to-shell-ts (the tool handler
# shapes) and gen_secret_in_system_prompt.py (secret names). Edit those, or the script, not this file.
rules:
  - id: mcp-tool-returns-environment-ts
    # JavaScript/TypeScript twin of mcp-tool-returns-environment. Handler shapes:
    # mcp-tool-arg-to-shell-ts (MCP TypeScript SDK v2.3.1 @modelcontextprotocol/server registerTool,
    # registerResource, registerPrompt, and setRequestHandler("tools/call" | "resources/read" |
    # "prompts/get"), 1.32.1 the same plus the tool() / resource() / prompt() overloads and the
    # request schemas, punkpeye fastmcp addTool / addResourceTemplate / addPrompt, Claude Agent SDK
    # tool()), with every prompt and resource handler (fixed URIs and argument-less prompts too); a v2
    # handler for a tool without inputSchema takes only the context (checked in v2.4.0 too). A named
    # handler for a resource at a fixed URI string isn't a sink.
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      An MCP tool, resource, or prompt handler returns the process environment to the model: the whole environment (process.env, a parsed .env file, `env` or `printenv` output) or
      a variable named like a secret. What it returns goes into the model's context and the
      client's transcript, so every API key, token, and connection string the server was started with can be
      repeated in a reply, written into another tool call, or sent somewhere by a prompt
      injection in anything the model reads, and it stays in provider and tracing logs. Return
      only the non-secret settings the tool needs, read by name (`{ tz: process.env.TZ }`), or say whether a
      secret is set rather than what it is.
    mode: taint
    options:
      # Only the propagators below carry the environment through a call: subprocess.run(env=env),
      # a client built from it, len(env), and bool(token) return clean values.
      taint_assume_safe_functions: true
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # The tool's arguments, unlabeled (__SOURCE__): only an environment lookup they name
      # (below) is reported, not an argument the tool echoes back. Copied from mcp-tool-arg-to-shell-ts, with
      # its allowlist sanitizers.
      # The handler's first parameter (the validated arguments object, destructured or not).
      # `($ARGS, ...) => {...}` also matches function expressions and expression bodies.
      # Resource templates and prompts count since 2026-10-25: the client fills a template's
      # variables and a prompt's arguments, and clients let the model fill them.
      - patterns:
          - pattern-either:
              - pattern: $SERVER.registerTool($NAME, $CONFIG, ($ARGS, ...) => {...})
              # Deprecated v1 overloads: the handler is the last argument. tool(name, cb) and
              # tool(name, description, cb) register zero-argument tools whose handler only
              # gets the request context.
              - patterns:
                  - pattern: $SERVER.tool($NAME, $X, ..., ($ARGS, ...) => {...})
                  - pattern-not: $SERVER.tool($NAME, "$DESC", ($ARGS, ...) => {...})
              - pattern: '$SERVER.addTool({..., execute: ($ARGS, ...) => {...}, ...})'
              # Prompts: registerPrompt(name, { argsSchema }, (args, ctx) => ...). Without
              # argsSchema the handler gets only the context. The v1 prompt(name,
              # [description,] argsSchema, cb) overloads are like tool()'s.
              - pattern: '$SERVER.registerPrompt($NAME, {..., argsSchema: $SCHEMA, ...}, ($ARGS, ...) => {...})'
              - patterns:
                  - pattern: $SERVER.registerPrompt($NAME, $CONFIG, ($ARGS, ...) => {...})
                  - pattern-not: '$SERVER.registerPrompt($NAME, {...}, ($ARGS, ...) => {...})'
              - patterns:
                  - pattern: $SERVER.prompt($NAME, $X, ..., ($ARGS, ...) => {...})
                  - pattern-not: $SERVER.prompt($NAME, "$DESC", ($ARGS, ...) => {...})
              # Resource templates: registerResource(name, new ResourceTemplate("x://{name}",
              # ...), config, (uri, variables, ctx) => ...) and v1 resource(name, template,
              # [metadata,] cb): the filled-in URI and its variables. A resource at a fixed
              # URI string gets only that URI.
              - patterns:
                  - pattern-either:
                      - pattern: $SERVER.registerResource($NAME, $TPL, $CONFIG, ($ARGS, ...) => {...})
                      - pattern: $SERVER.registerResource($NAME, $TPL, $CONFIG, ($URI, $ARGS, ...) => {...})
                      - pattern: $SERVER.resource($NAME, $TPL, ..., ($ARGS, ...) => {...})
                      - pattern: $SERVER.resource($NAME, $TPL, ..., ($URI, $ARGS, ...) => {...})
                  - pattern-not: $SERVER.registerResource($NAME, "$FIXED", ...)
                  - pattern-not: $SERVER.resource($NAME, "$FIXED", ...)
              # punkpeye fastmcp: addResourceTemplate and addPrompt take load(args, ...).
              - pattern: '$SERVER.addResourceTemplate({..., load: ($ARGS, ...) => {...}, ...})'
              - pattern: '$SERVER.addPrompt({..., load: ($ARGS, ...) => {...}, ...})'
              # Low-level handlers: the request (request.params.arguments, request.params.uri).
              - patterns:
                  - pattern: $SERVER.setRequestHandler($KIND, ($ARGS, ...) => {...})
                  - metavariable-regex:
                      metavariable: $KIND
                      regex: ^(?:[\w.]*(?:CallTool|ReadResource|GetPrompt)RequestSchema|["'](?:tools/call|resources/read|prompts/get)["'])$
              # Claude Agent SDK: tool(name, description, schema, handler).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { $TOOL } from "@anthropic-ai/claude-agent-sdk";
                          ...
                      - pattern-inside: |
                          import { $ORIG as $TOOL } from "@anthropic-ai/claude-agent-sdk";
                          ...
                  - pattern: $TOOL($NAME, $DESC, $SCHEMA, ($ARGS, ...) => {...}, ...)
              # A named handler registered elsewhere in the file: registerTool, tool,
              # registerPrompt, prompt, registerResource, or resource(..., handler), or
              # setRequestHandler(<call-tool, read-resource, or get-prompt>, handler). Declared
              # before its registration, it's found by a regex over the declaration (signature and
              # balanced body) that looks ahead for the registration; NAMED must name the
              # function. A statement region from every function to a later registration took
              # about 15 s on a 5,000-line file (OpenGrep 1.30.2). Declared after it, by regions
              # that start at the registration (hoisting) or at a function that contains it (a
              # factory such as createServer() with its handlers declared below it).
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<str> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\\\n]|\\.)*+' | `(?:[^`\\]|\\.)*+` )
                                (?<com> //[^\n]*+ | /\*(?:[^*]++|\*(?!/))*+\*/ )
                                (?<br> \{ (?: [^{}"'`/]++ | (?&com) | (?&str) | (?&br) | [/"'`] )*+ \} )
                                (?<pa> \( (?: [^()"'`/]++ | (?&com) | (?&str) | (?&pa) | [/"'`] )*+ \) )
                                (?<ang> < (?: [^<>=]++ | =>? | (?&ang) )*+ > )
                                (?<ty> (?: [^{}()<>=;]++ | (?&ang) | (?&pa) | => )*? )
                                (?<arg> [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) | [,"'`/] )
                                (?<fn> (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ \k<NAMED> \b
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br) )
                                (?<arrow> (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ \k<NAMED> \b \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                                (?<reg> (?:registerTool|tool|registerPrompt|prompt) \( (?&arg)*? , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                      | (?:registerResource|resource) \( (?: [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) )++ , \s*+ (?!["'`]) (?&arg)*? , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                      | setRequestHandler \( \s*+ (?: [\w$.]*(?:CallTool|ReadResource|GetPrompt)RequestSchema | "(?:tools/call|resources/read|prompts/get)" | '(?:tools/call|resources/read|prompts/get)' ) \s*+ , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                )
                              )
                              (?| (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ (?<NAMED>[\w$]++)
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br)
                                | (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ (?<NAMED>[\w$]++) \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                              (?= (?: [^.]++ | \.(?!(?&reg)) )*+ \.(?&reg) )
                          - pattern-either:
                              - pattern: function $H($ARGS, ...) {...}
                              - pattern: const $H = ($ARGS, ...) => {...};
                          - metavariable-comparison:
                              comparison: str($H) == str($NAMED)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: "$SERVER.registerTool(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerTool(..., $H);\n  ...\n}\n..."
                              - pattern-inside: "$SERVER.tool(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.tool(..., $H);\n  ...\n}\n..."
                              - pattern-inside: "$SERVER.registerPrompt(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerPrompt(..., $H);\n  ...\n}\n..."
                              - pattern-inside: "$SERVER.prompt(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.prompt(..., $H);\n  ...\n}\n..."
                              - patterns:
                                  - pattern-either:
                                      - pattern-inside: "$SERVER.registerResource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerResource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                      - pattern-inside: "$SERVER.resource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.resource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                  - metavariable-regex:
                                      metavariable: $TPL
                                      regex: ^[^"'`]
                              - patterns:
                                  - pattern-either:
                                      - pattern-inside: "$SERVER.setRequestHandler($KIND, $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.setRequestHandler($KIND, $H);\n  ...\n}\n..."
                                  - metavariable-regex:
                                      metavariable: $KIND
                                      regex: ^(?:[\w.]*(?:CallTool|ReadResource|GetPrompt)RequestSchema|["'](?:tools/call|resources/read|prompts/get)["'])$
                          - pattern-either:
                              - pattern: function $H($ARGS, ...) {...}
                              - pattern: const $H = ($ARGS, ...) => {...};
              # The second parameter of a named resource-template handler: its variables.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<str> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\\\n]|\\.)*+' | `(?:[^`\\]|\\.)*+` )
                                (?<com> //[^\n]*+ | /\*(?:[^*]++|\*(?!/))*+\*/ )
                                (?<br> \{ (?: [^{}"'`/]++ | (?&com) | (?&str) | (?&br) | [/"'`] )*+ \} )
                                (?<pa> \( (?: [^()"'`/]++ | (?&com) | (?&str) | (?&pa) | [/"'`] )*+ \) )
                                (?<ang> < (?: [^<>=]++ | =>? | (?&ang) )*+ > )
                                (?<ty> (?: [^{}()<>=;]++ | (?&ang) | (?&pa) | => )*? )
                                (?<arg> [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) | [,"'`/] )
                                (?<fn> (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ \k<NAMED> \b
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br) )
                                (?<arrow> (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ \k<NAMED> \b \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                                (?<reg> (?:registerResource|resource) \( (?: [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) )++ , \s*+ (?!["'`]) (?&arg)*? , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                )
                              )
                              (?| (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ (?<NAMED>[\w$]++)
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br)
                                | (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ (?<NAMED>[\w$]++) \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                              (?= (?: [^.]++ | \.(?!(?&reg)) )*+ \.(?&reg) )
                          - pattern-either:
                              - pattern: function $H($URI, $ARGS, ...) {...}
                              - pattern: const $H = ($URI, $ARGS, ...) => {...};
                          - metavariable-comparison:
                              comparison: str($H) == str($NAMED)
                      - patterns:
                          - pattern-either:
                              - patterns:
                                  - pattern-either:
                                      - pattern-inside: "$SERVER.registerResource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerResource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                      - pattern-inside: "$SERVER.resource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.resource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                  - metavariable-regex:
                                      metavariable: $TPL
                                      regex: ^[^"'`]
                          - pattern-either:
                              - pattern: function $H($URI, $ARGS, ...) {...}
                              - pattern: const $H = ($URI, $ARGS, ...) => {...};
          - focus-metavariable: $ARGS
      # The whole environment as a value: process.env returned, spread ({...process.env}),
      # serialized, or listed with Object.entries. A lookup (process.env.HOME), a membership
      # test, and Object.keys alone are not its values.
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: process.env
              - pattern: Bun.env
          - pattern-not-inside: $RT.env.$KEY
          - pattern-not-inside: $RT.env[$KEY]
          - pattern-not-inside: $KEY in $RT.env
      - label: ENV
        pattern: Deno.env.toObject()
      # A parsed .env file: dotenv.config() (its .parsed), dotenv.parse(text).
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: dotenv.config(...)
              - pattern: dotenv.parse(...)
              - patterns:
                  - pattern-inside: |
                      import { $FN } from "dotenv";
                      ...
                  - pattern: $FN(...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: ^(?:config|parse)$
      # A command that prints the whole environment: execSync("env"), execFileSync("printenv"),
      # spawnSync("env"), execa("printenv").
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: $EXEC($CMD)
              - pattern: '$EXEC($CMD, {...})'
              - pattern: $EXEC($CMD, [], ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(?:[\w$]+\.)?(?:execSync|execFileSync|spawnSync|execa|execaSync|execAsync|execFileAsync)$
          - metavariable-regex:
              metavariable: $CMD
              regex: |-
                ^["'`](?:/usr)?(?:/bin/)?(?:env|printenv)(?:\s+(?:-0|--null))?(?:\s*\|\s*sort)?["'`]$
      # The environment file of a process: readFileSync("/proc/self/environ").
      - label: ENV
        patterns:
          - pattern: $READ($PATH, ...)
          - metavariable-regex:
              metavariable: $PATH
              regex: |-
                ^[fF]?["'`]/proc/(?:self|\d+|[$]?\{[^}"'`]+\})/environ["'`]$
      # One variable named like a secret: process.env.GITHUB_TOKEN, process.env["DB_PASSWORD"].
      # The names are the ones secret-in-system-prompt-ts treats as secrets.
      - label: ENV
        patterns:
          - pattern: $RT.env.$NAME
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
          - metavariable-regex:
              metavariable: $NAME
              regex: |-
                (?x)
                ^ (?=[A-Za-z_$][\w$]* $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) $ )
                (?! (?i:pwd|dsn) $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) $
      - label: ENV
        patterns:
          - pattern: $RT.env[$NAME]
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
          - metavariable-regex:
              metavariable: $NAME
              regex: |-
                (?x)
                ^ ["'`] (?=[\w$.-]+ ["'`] $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) ["'`] $ )
                (?! (?i:pwd|dsn) ["'`] $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) ["'`] $
      # A variable the model names: process.env[name] with a tool argument as the name, so a
      # prompt injection can ask for AWS_SECRET_ACCESS_KEY.
      - label: ENV
        requires: __SOURCE__
        patterns:
          - pattern: $RT.env[$KEY]
          - metavariable-regex:
              metavariable: $RT
              regex: ^(?:process|Bun)$
    pattern-propagators:
      # Copies, serializations, and text built from a value carry it: JSON.stringify(env),
      # Object.entries(env).map(...).join("\n"), structuredClone(env), out.toString().
      - patterns:
          - pattern-either:
              - pattern: JSON.stringify($X, ...)
              - pattern: Object.entries($X)
              - pattern: Object.values($X)
              - pattern: Object.fromEntries($X)
              - pattern: Object.assign($T, ..., $X, ...)
              - pattern: structuredClone($X, ...)
              - pattern: String($X)
              - pattern: util.inspect($X, ...)
              - pattern: util.format(..., $X, ...)
              - pattern: $DEC.decode($X, ...)
              - pattern: Buffer.from($X, ...)
              - pattern: btoa($X)
              - pattern: encodeURIComponent($X)
              - pattern: encodeURI($X)
