                        - pattern-either:
                          - pattern: $KEYNAME === $LIT
                          - pattern: $LIT === $KEYNAME
                          - pattern: $KEYNAME == $LIT
                          - pattern: $LIT == $KEYNAME
                        - metavariable-regex:
                            metavariable: $LIT
                            regex: ^[rbuRBU]?["'`]
                    - pattern-not-inside: $Y || $Z
                    - pattern-not-inside: '!$Z'
                  - patterns:
                    - pattern-either:
                      - patterns:
                        - pattern: '!$Q'
                        - metavariable-regex:
                            metavariable: $Q
                            regex: ^(?!(?:\(\s*)*(?<p>\((?:[^()"'`]++|"(?:[^"\\]|\\.)*+"|'(?:[^'\\]|\\.)*+'|`(?:[^`\\]|\\.)*+`|(?&p))*+\))\s*+(?!=>|:|$|\)))
                        - metavariable-pattern:
                            metavariable: $Q
                            pattern-either:
                            - patterns:
                              - pattern-either:
                                - pattern: $KEYNAME.$TEST($ARG)
                                - pattern: $KEYNAME.$M().$TEST($ARG)
                              - metavariable-regex:
                                  metavariable: $TEST
                                  regex: ^(?:includes|startsWith|endsWith|match|search)$
                              - metavariable-regex:
                                  metavariable: $ARG
                                  regex: (?is)^.*(?:key|token|secret|passw|pwd|auth|cred|private|session|cookie|signature|cert|bearer|dsn|sensitive)
                            - patterns:
                              - pattern: $RE.test($KEYNAME)
                              - metavariable-regex:
                                  metavariable: $RE
                                  regex: (?is)^.*(?:key|token|secret|passw|pwd|auth|cred|private|session|cookie|signature|cert|bearer|dsn|sensitive)
                            - patterns:
                              - pattern: $F($KEYNAME, ...)
                              - metavariable-regex:
                                  metavariable: $F
                                  regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:secret|sensitive|private|credential|redact|mask)[\w$]*$
                            - patterns:
                              - pattern-either:
                                - pattern: $DENY.has($KEYNAME)
                                - pattern: $DENY.includes($KEYNAME)
                              - metavariable-regex:
                                  metavariable: $DENY
                                  regex: (?i)^(?:[\w$.]*\.)?[\w$]*(?:secret|sensitive|deny|denied|block|redact|hidden|private|mask|exclu|credential)[\w$]*$
                            - patterns:
                              - pattern: $WORDS.some(...)
                              - metavariable-regex:
                                  metavariable: $WORDS
                                  regex: (?is)^.*(?:key|token|secret|passw|pwd|auth|cred|private|session|cookie|signature|cert|bearer|dsn|sensitive)
                    - pattern-not-inside: $Y || $Z
    pattern-sinks:
      # What an MCP tool, resource, or prompt handler returns (an expression body counts as a
      # return): the tool result, resource contents, or prompt messages the client hands the
      # model. The registration shapes are mcp-tool-arg-to-shell-ts's sources, for handlers with
      # or without parameters.
      - requires: ENV
        exact: true
        patterns:
          - pattern-either:
              - pattern: $SERVER.registerTool($NAME, $CONFIG, (...) => {...})
              # Deprecated v1 overloads: the handler is the last argument, including
              # tool(name, cb) and tool(name, description, cb) for a tool without input.
              - pattern: $SERVER.tool($NAME, ..., (...) => {...})
              - pattern: '$SERVER.addTool({..., execute: (...) => {...}, ...})'
              # Prompts (registerPrompt, v1 prompt), with or without arguments.
              - pattern: $SERVER.registerPrompt($NAME, $CONFIG, (...) => {...})
              - pattern: $SERVER.prompt($NAME, ..., (...) => {...})
              # Resource templates: registerResource(name, new ResourceTemplate("x://{name}",
              # ...), config, (uri, variables, ctx) => ...) and v1 resource(name, template,
              # [metadata,] cb): the filled-in URI and its variables. A resource at a fixed
              # URI string gets only that URI.
              - patterns:
                  - pattern-either:
                      - pattern: $SERVER.registerResource($NAME, $TPL, $CONFIG, (...) => {...})
                      - pattern: $SERVER.registerResource($NAME, $TPL, $CONFIG, ($URI, ...) => {...})
                      - pattern: $SERVER.resource($NAME, $TPL, ..., (...) => {...})
                      - pattern: $SERVER.resource($NAME, $TPL, ..., ($URI, ...) => {...})
              # punkpeye fastmcp: addResourceTemplate and addPrompt take load(args, ...).
              - pattern: '$SERVER.addResourceTemplate({..., load: (...) => {...}, ...})'
              - pattern: '$SERVER.addPrompt({..., load: (...) => {...}, ...})'
              # Low-level handlers: the request (request.params.arguments, request.params.uri).
              - patterns:
                  - pattern: $SERVER.setRequestHandler($KIND, (...) => {...})
                  - metavariable-regex:
                      metavariable: $KIND
                      regex: ^(?:[\w.]*(?:CallTool|ReadResource|GetPrompt)RequestSchema|["'](?:tools/call|resources/read|prompts/get)["'])$
              # Claude Agent SDK: tool(name, description, schema, handler).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import { $TOOL } from "@anthropic-ai/claude-agent-sdk";
                          ...
                      - pattern-inside: |
                          import { $ORIG as $TOOL } from "@anthropic-ai/claude-agent-sdk";
                          ...
                  - pattern: $TOOL($NAME, $DESC, $SCHEMA, (...) => {...}, ...)
              # A named handler registered elsewhere in the file: registerTool, tool,
              # registerPrompt, prompt, registerResource, or resource(..., handler), or
              # setRequestHandler(<call-tool, read-resource, or get-prompt>, handler). Declared
              # before its registration, it's found by a regex over the declaration (signature and
              # balanced body) that looks ahead for the registration; NAMED must name the
              # function. A statement region from every function to a later registration took
              # about 15 s on a 5,000-line file (OpenGrep 1.30.2). Declared after it, by regions
              # that start at the registration (hoisting) or at a function that contains it (a
              # factory such as createServer() with its handlers declared below it).
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<str> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\\\n]|\\.)*+' | `(?:[^`\\]|\\.)*+` )
                                (?<com> //[^\n]*+ | /\*(?:[^*]++|\*(?!/))*+\*/ )
                                (?<br> \{ (?: [^{}"'`/]++ | (?&com) | (?&str) | (?&br) | [/"'`] )*+ \} )
                                (?<pa> \( (?: [^()"'`/]++ | (?&com) | (?&str) | (?&pa) | [/"'`] )*+ \) )
                                (?<ang> < (?: [^<>=]++ | =>? | (?&ang) )*+ > )
                                (?<ty> (?: [^{}()<>=;]++ | (?&ang) | (?&pa) | => )*? )
                                (?<arg> [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) | [,"'`/] )
                                (?<fn> (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ \k<NAMED> \b
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br) )
                                (?<arrow> (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ \k<NAMED> \b \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                                (?<reg> (?:registerTool|tool|registerPrompt|prompt) \( (?&arg)*? , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                      | (?:registerResource|resource) \( (?: [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) )++ , \s*+ (?!["'`]) (?&arg)*? , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                      | setRequestHandler \( \s*+ (?: [\w$.]*(?:CallTool|ReadResource|GetPrompt)RequestSchema | "(?:tools/call|resources/read|prompts/get)" | '(?:tools/call|resources/read|prompts/get)' ) \s*+ , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                )
                              )
                              (?| (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ (?<NAMED>[\w$]++)
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br)
                                | (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ (?<NAMED>[\w$]++) \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                              (?= (?: [^.]++ | \.(?!(?&reg)) )*+ \.(?&reg) )
                          - pattern-either:
                              - pattern: function $H(...) {...}
                              - pattern: const $H = (...) => {...};
                          - metavariable-comparison:
                              comparison: str($H) == str($NAMED)
                      - patterns:
                          - pattern-either:
                              - pattern-inside: "$SERVER.registerTool(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerTool(..., $H);\n  ...\n}\n..."
                              - pattern-inside: "$SERVER.tool(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.tool(..., $H);\n  ...\n}\n..."
                              - pattern-inside: "$SERVER.registerPrompt(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerPrompt(..., $H);\n  ...\n}\n..."
                              - pattern-inside: "$SERVER.prompt(..., $H);\n..."
                              - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.prompt(..., $H);\n  ...\n}\n..."
                              - patterns:
                                  - pattern-either:
                                      - pattern-inside: "$SERVER.registerResource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerResource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                      - pattern-inside: "$SERVER.resource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.resource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                  - metavariable-regex:
                                      metavariable: $TPL
                                      regex: ^[^"'`]
                              - patterns:
                                  - pattern-either:
                                      - pattern-inside: "$SERVER.setRequestHandler($KIND, $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.setRequestHandler($KIND, $H);\n  ...\n}\n..."
                                  - metavariable-regex:
                                      metavariable: $KIND
                                      regex: ^(?:[\w.]*(?:CallTool|ReadResource|GetPrompt)RequestSchema|["'](?:tools/call|resources/read|prompts/get)["'])$
                          - pattern-either:
                              - pattern: function $H(...) {...}
                              - pattern: const $H = (...) => {...};
              # The second parameter of a named resource-template handler: its variables.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern-regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<str> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\\\n]|\\.)*+' | `(?:[^`\\]|\\.)*+` )
                                (?<com> //[^\n]*+ | /\*(?:[^*]++|\*(?!/))*+\*/ )
                                (?<br> \{ (?: [^{}"'`/]++ | (?&com) | (?&str) | (?&br) | [/"'`] )*+ \} )
                                (?<pa> \( (?: [^()"'`/]++ | (?&com) | (?&str) | (?&pa) | [/"'`] )*+ \) )
                                (?<ang> < (?: [^<>=]++ | =>? | (?&ang) )*+ > )
                                (?<ty> (?: [^{}()<>=;]++ | (?&ang) | (?&pa) | => )*? )
                                (?<arg> [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) | [,"'`/] )
                                (?<fn> (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ \k<NAMED> \b
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br) )
                                (?<arrow> (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ \k<NAMED> \b \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                                (?<reg> (?:registerResource|resource) \( (?: [^(),"'`/]++ | (?&com) | (?&str) | (?&pa) )++ , \s*+ (?!["'`]) (?&arg)*? , \s*+ \k<NAMED> \s*+ ,? \s*+ \)
                                )
                              )
                              (?| (?: \bexport [ \t]++ (?:default [ \t]++)? )? (?: \basync [ \t]++ )? \bfunction\b [ \t]*+ \*? [ \t]*+ (?<NAMED>[\w$]++)
                                  \s*+ (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? (?&br)
                                | (?: \bexport [ \t]++ )? \b(?:const|let|var) [ \t]++ (?<NAMED>[\w$]++) \s*+ (?: : (?&ty) )? = \s*+ (?: async\b \s*+ )?
                                  (?&ang)? \s*+ (?&pa) \s*+ (?: : (?&ty) )? => \s*+ (?&br) [ \t]*+ ;? )
                              (?= (?: [^.]++ | \.(?!(?&reg)) )*+ \.(?&reg) )
                          - pattern-either:
                              - pattern: function $H($URI, ...) {...}
                              - pattern: const $H = ($URI, ...) => {...};
                          - metavariable-comparison:
                              comparison: str($H) == str($NAMED)
                      - patterns:
                          - pattern-either:
                              - patterns:
                                  - pattern-either:
                                      - pattern-inside: "$SERVER.registerResource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.registerResource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                      - pattern-inside: "$SERVER.resource($NAME, $TPL, ..., $H);\n..."
                                      - pattern-inside: "function $F(...) {\n  ...\n  $SERVER.resource($NAME, $TPL, ..., $H);\n  ...\n}\n..."
                                  - metavariable-regex:
                                      metavariable: $TPL
                                      regex: ^[^"'`]
                          - pattern-either:
                              - pattern: function $H($URI, ...) {...}
                              - pattern: const $H = ($URI, ...) => {...};
          - pattern: return $E
          - pattern-not-inside:
              patterns:
                - pattern: $X.$METHOD((...) => {...}, ...)
                - metavariable-regex:
                    metavariable: $METHOD
                    regex: ^(?:map|flatMap|filter|forEach|reduce|reduceRight|some|every|find|findIndex|findLast|findLastIndex|sort|toSorted|then|catch|finally|replace|replaceAll)$
          - focus-metavariable: $E
