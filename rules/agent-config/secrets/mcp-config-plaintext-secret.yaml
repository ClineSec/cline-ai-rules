rules:
  - id: mcp-config-plaintext-secret
    # Generated by scripts/gen_mcp_plaintext_secret.py, which holds the credential regexes shared
    # by the mcp-config-plaintext-secret rules for JSON, Continue YAML, Codex TOML, VS Code
    # workspace files and Claude Code subagent front matter, and takes the file paths from
    # scripts/gen_mcp_unpinned.py. Edit the script and run scripts/build.py; build.py --check fails
    # if this file drifts.
    languages: [json]
    severity: ERROR
    message: >-
      This MCP server entry holds a literal credential (an API key, access token, password,
      Bearer header, or a secret in the server URL). Everyone and every tool that opens the
      project can read this file; it gets committed, copied, and pasted into issues, and it sits
      in the agent's workspace, where a prompt-injected agent can read the credential and send
      it out. Such tokens are usually long-lived and carry the developer's full access. Revoke
      and rotate this credential, then load it at run time instead:
      ${VAR} in Claude Code and Gemini CLI, ${env:VAR} in Cursor and Windsurf, an ${input:id}
      with "password": true and no default in VS Code, or the client's OAuth login.
    paths:
      include:
        # Claude Code project scope and plugins; also VS Code's portable workspace-root file.
        - ".mcp.json"
        # Cursor (.cursor/mcp.json, ~/.cursor/mcp.json), VS Code (.vscode/mcp.json and the user
        # profile's mcp.json), and other clients that use the same file name.
        - "mcp.json"
        # Claude Code user and local scope, and the administrator-managed file.
        - ".claude.json"
        - "managed-mcp.json"
        # Claude Code plugins can declare servers inline in the manifest or a marketplace entry.
        - ".claude-plugin/plugin.json"
        - ".claude-plugin/marketplace.json"
        - "claude_desktop_config.json"
        # Cline (VS Code extension global storage and ~/.cline/data/settings/).
        - "cline_mcp_settings.json"
        # Windsurf / Devin Desktop (~/.codeium/windsurf/, ~/.config/devin/).
        - "mcp_config.json"
        # GitHub Copilot CLI (~/.copilot/mcp-config.json), which VS Code also writes.
        - "mcp-config.json"
        # Gemini CLI settings and extension manifests.
        - ".gemini/settings.json"
        - "gemini-extension.json"
        # Zed: context_servers in project settings and the user's ~/.config/zed/settings.json
        # (Zed v1.25.2).
        - ".zed/settings.json"
        - ".config/zed/settings.json"
        # VS Code dev containers: customizations.vscode.mcp.servers.
        - ".devcontainer/devcontainer.json"
        - ".devcontainer.json"
        - ".devcontainer/*/devcontainer.json"
        # Continue reads any JSON file in .continue/mcpServers/ (Claude, Cursor or one-server
        # format), workspace or home, at any depth.
        - ".continue/mcpServers/**/*.json"
      exclude:
        # Continue skips these two names in .continue/mcpServers/.
        - ".continue/mcpServers/**/config.json"
        - ".continue/mcpServers/**/settings.json"
    patterns:
      - pattern-either:
          - patterns:
              # "mcpServers" in most clients, "servers" in VS Code, "context_servers" in Zed. Continue
              # also accepts a file holding one server at its root.
              - pattern-either:
                  - pattern-inside: '"mcpServers": {...}'
                  - pattern-inside: '"servers": {...}'
                  - pattern-inside: '"context_servers": {...}'
                  - patterns:
                      - pattern-inside: '{..., "command": $X, ...}'
                      - pattern-not-inside: '"$K": {..., "command": $Y, ...}'
                      - pattern-not-inside: '[..., {..., "command": $Y, ...}, ...]'
                  # ... and that server can be a remote one with a url instead of a command.
                  - patterns:
                      - pattern-inside: '{..., "url": $X, ...}'
                      - pattern-not-inside: '"$K": {..., "url": $Y, ...}'
                      - pattern-not-inside: '[..., {..., "url": $Y, ...}, ...]'
              - pattern-either:
                  # Any string in the entry (env, headers, args, url, auth, oauth).
                  - patterns:
                      - pattern: '"$V"'
                      - metavariable-regex:
                          metavariable: $V
                          regex: |-
                            (?x)
                            (?(DEFINE)
                              # Placeholder text that people paste instead of a value, and the marker words of a planted
                              # decoy (a leak probe's sk-bait-...-CANARY). Not "fake": the pack's own fixtures mark their
                              # positives with FAKE.
                              (?<ph> (?i: x{4} | your | placeholder | changeme | change[_-]me | replace[_-]?me | redacted
                                | dummy | example | canary | bait | decoy | honeytoken | \*{3} ) )
                              # An opaque literal: 16+ token characters with a letter and a digit, no placeholder text.
                              # Template syntax (${VAR}, ${env:VAR}, ${input:id}, ${{ secrets.X }}, $VAR, %VAR%) contains
                              # characters outside this set, so it never qualifies.
                              (?<oc> [A-Za-z0-9._~+/=-] )
                              (?<opq> (?=(?&oc)*[0-9]) (?=(?&oc)*[A-Za-z]) (?!(?&oc)*?(?&ph)) (?&oc){16,}+ (?!(?&oc)) )
                              # Credential formats with a fixed, documented prefix (sources in the rule's references).
                              (?<known> (?:
                                  gh[pousr]_[A-Za-z0-9_]{36,}                       # GitHub PAT, OAuth, app tokens
                                | github_pat_[A-Za-z0-9_]{50,}                      # GitHub fine-grained PAT
                                | A(?:KIA|SIA|BIA|CCA)(?!I(?:OSFODNN7|44QH8DHB)EXAMPLE)[A-Z0-9]{16} # AWS key ID, not the docs' examples
                                | xox[bpe]-[A-Za-z0-9-]{20,} | xoxe\.x(?:oxb|oxp|app)-[A-Za-z0-9-]{20,}
                                | xapp-[A-Za-z0-9-]{20,} | xwfp-[A-Za-z0-9-]{20,}  # Slack bot, user, refresh, app, workflow
                                | hooks\.slack\.com/services/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9]{16,} # Slack webhook
                                | sk-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}      # OpenAI, Anthropic, OpenRouter (sk-or-v1-)
                                | [rs]k_(?:live|test)_[A-Za-z0-9]{20,}              # Stripe secret and restricted (not pk_)
                                | AIza[0-9A-Za-z_-]{35}                             # Google API key
                                | gl(?:pat|oas|dt|rt|rtr|cbt|ptt|ft|imt|agent|wt|soat|ffct)-[A-Za-z0-9_.-]{20,} # GitLab
                                | hf_[A-Za-z0-9]{30,}                               # Hugging Face
                                | npm_[A-Za-z0-9]{36,}                              # npm
                                | ntn_[A-Za-z0-9]{40,} | secret_[A-Za-z0-9]{32,}    # Notion (current, legacy)
                                | lin_(?:api|oauth)_[A-Za-z0-9]{40,}                # Linear
                                | sbp_[A-Za-z0-9]{40,} | sb_secret_[A-Za-z0-9_-]{20,} # Supabase (not sb_publishable_)
                                | sntryu_[a-f0-9]{64} | sntrys_[A-Za-z0-9+/=_]{40,} # Sentry user, org (not DSNs)
                                | ATAT[A-Za-z0-9_=-]{40,}                           # Atlassian API token
                                | r8_[A-Za-z0-9]{37}                                # Replicate
                                | tvly-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}    # Tavily
                                | fc-[a-f0-9]{32}                                   # Firecrawl
                                | pplx-[A-Za-z0-9]{32,}                             # Perplexity (model names have hyphens)
                                | gsk_[A-Za-z0-9]{40,}                              # Groq
                                | do[opr]_v1_[A-Za-z0-9]{32,}                       # DigitalOcean
                                | shp(?:at|ca|pa|ss)_[A-Za-z0-9]{32,}               # Shopify tokens and app secret
                                | SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}        # SendGrid
                                | pypi-[A-Za-z0-9_-]{50,}                           # PyPI
                                | glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8} | glc_[A-Za-z0-9+/=_-]{32,} # Grafana
                                | vc[pirak]_[A-Za-z0-9]{24,}                        # Vercel
                                | cf(?:k|ut|at|ast)_[A-Za-z0-9]{40,}                # Cloudflare
                              ) (?![A-Za-z0-9_-]) )
                            )
                            ^ .*? (?:
                                # A known credential format, anywhere in the string (also inside a JSON-encoded header
                                # map or a bash -c line).
                                (?<![A-Za-z0-9_]) (?![A-Za-z0-9_.-]*?(?&ph)) (?&known)
                                # Authorization: Bearer / Basic with a literal credential.
                              | (?<![A-Za-z0-9_-]) (?i:bearer|basic) [ \t]+ (?&opq) (?=["'\\\s,;}]|$)
                                # https://host/mcp?api_key=... (Smithery, Tavily and others document this shape).
                              | (?i:https?|wss?):// [^\s"'?\#\\]* \? (?:[^\s"'\#\\]*&)?
                                (?:[\w.-]*?(?i:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key|auth)|(?i:key)) = (?&opq) (?=[&\#"'\\\s]|$)
                                # scheme://user:password@host, unless the host is this machine.
                              | (?<![A-Za-z0-9+.-]) [A-Za-z][A-Za-z0-9+.-]*:// [^\s"'/:@?\#\\]+ :
                                (?!(?i:password|passwd|pass|secret|pwd|changeme)@) (?![^\s"'/@?\#\\]*(?&ph))
                                [^\s"'/@?\#\\$%{}<>*]+ @
                                (?=[^\s"'/:?\#\\@]*\.) (?!(?i:localhost|127\.|0\.0\.0\.0|host\.docker\.internal)[:/?\#"'\\\s]?)
                                (?![^\s"'/:?\#\\@]*\.(?i:local|localhost)(?:[:/?\#"'\\\s]|$))
                                # --api-key=..., GITHUB_TOKEN=... (docker -e), X-API-Key: ... (mcp-remote --header).
                              | ^ ["']? (?: --?[\w-]*?(?i:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key)
                                  | (?:--?e(?:nv)?[= ])? [A-Za-z_][\w.-]*?(?i:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key) ) = (?&opq) ["']? $
                              | ^ ["']? [\w-]*?(?i:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key|authorization) [ \t]*:[ \t]* (?&opq) ["']? $
                            )
                  # A key that names a credential, with an opaque literal value.
                  - patterns:
                      - pattern: '"$K": "$V"'
                      - metavariable-regex:
                          metavariable: $K
                          regex: |-
                            (?i)^["']?[\w.-]*?(?:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key|authorization|(?<![a-z0-9])pat)["']?$
                      - metavariable-regex:
                          metavariable: $V
                          regex: |-
                            (?x)
                            (?(DEFINE)
                              # Placeholder text that people paste instead of a value, and the marker words of a planted
                              # decoy (a leak probe's sk-bait-...-CANARY). Not "fake": the pack's own fixtures mark their
                              # positives with FAKE.
                              (?<ph> (?i: x{4} | your | placeholder | changeme | change[_-]me | replace[_-]?me | redacted
                                | dummy | example | canary | bait | decoy | honeytoken | \*{3} ) )
                              # An opaque literal: 16+ token characters with a letter and a digit, no placeholder text.
                              # Template syntax (${VAR}, ${env:VAR}, ${input:id}, ${{ secrets.X }}, $VAR, %VAR%) contains
                              # characters outside this set, so it never qualifies.
                              (?<oc> [A-Za-z0-9._~+/=-] )
                              (?<opq> (?=(?&oc)*[0-9]) (?=(?&oc)*[A-Za-z]) (?!(?&oc)*?(?&ph)) (?&oc){16,}+ (?!(?&oc)) )
                              # Credential formats with a fixed, documented prefix (sources in the rule's references).
                              (?<known> (?:
                                  gh[pousr]_[A-Za-z0-9_]{36,}                       # GitHub PAT, OAuth, app tokens
                                | github_pat_[A-Za-z0-9_]{50,}                      # GitHub fine-grained PAT
                                | A(?:KIA|SIA|BIA|CCA)(?!I(?:OSFODNN7|44QH8DHB)EXAMPLE)[A-Z0-9]{16} # AWS key ID, not the docs' examples
                                | xox[bpe]-[A-Za-z0-9-]{20,} | xoxe\.x(?:oxb|oxp|app)-[A-Za-z0-9-]{20,}
                                | xapp-[A-Za-z0-9-]{20,} | xwfp-[A-Za-z0-9-]{20,}  # Slack bot, user, refresh, app, workflow
                                | hooks\.slack\.com/services/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9]{16,} # Slack webhook
                                | sk-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}      # OpenAI, Anthropic, OpenRouter (sk-or-v1-)
                                | [rs]k_(?:live|test)_[A-Za-z0-9]{20,}              # Stripe secret and restricted (not pk_)
                                | AIza[0-9A-Za-z_-]{35}                             # Google API key
                                | gl(?:pat|oas|dt|rt|rtr|cbt|ptt|ft|imt|agent|wt|soat|ffct)-[A-Za-z0-9_.-]{20,} # GitLab
                                | hf_[A-Za-z0-9]{30,}                               # Hugging Face
                                | npm_[A-Za-z0-9]{36,}                              # npm
                                | ntn_[A-Za-z0-9]{40,} | secret_[A-Za-z0-9]{32,}    # Notion (current, legacy)
                                | lin_(?:api|oauth)_[A-Za-z0-9]{40,}                # Linear
                                | sbp_[A-Za-z0-9]{40,} | sb_secret_[A-Za-z0-9_-]{20,} # Supabase (not sb_publishable_)
                                | sntryu_[a-f0-9]{64} | sntrys_[A-Za-z0-9+/=_]{40,} # Sentry user, org (not DSNs)
                                | ATAT[A-Za-z0-9_=-]{40,}                           # Atlassian API token
                                | r8_[A-Za-z0-9]{37}                                # Replicate
                                | tvly-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}    # Tavily
                                | fc-[a-f0-9]{32}                                   # Firecrawl
                                | pplx-[A-Za-z0-9]{32,}                             # Perplexity (model names have hyphens)
                                | gsk_[A-Za-z0-9]{40,}                              # Groq
                                | do[opr]_v1_[A-Za-z0-9]{32,}                       # DigitalOcean
                                | shp(?:at|ca|pa|ss)_[A-Za-z0-9]{32,}               # Shopify tokens and app secret
                                | SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}        # SendGrid
                                | pypi-[A-Za-z0-9_-]{50,}                           # PyPI
                                | glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8} | glc_[A-Za-z0-9+/=_-]{32,} # Grafana
                                | vc[pirak]_[A-Za-z0-9]{24,}                        # Vercel
                                | cf(?:k|ut|at|ast)_[A-Za-z0-9]{40,}                # Cloudflare
                              ) (?![A-Za-z0-9_-]) )
                            )
                            ^ ["']?
                            (?! [/~] | \.\.?/ )
                            (?! (?:[A-Z0-9]*_)+[A-Z0-9]* ["']? $ )
                            (?! .* \.(?i:json|pem|key|p12|pfx|crt|cer|txt|ya?ml|env|toml|cfg|ini|conf) ["']? $ )
                            (?&opq) ["']? $
                  # A credential flag and its value as two args: "--access-token", "...".
                  - patterns:
                      - pattern-inside: '"args": [..., "$F", "$V", ...]'
                      - pattern: '"$V"'
                      - metavariable-regex:
                          metavariable: $F
                          regex: |-
                            (?i)^["']?--?[\w-]*?(?:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key)["']?$
                      - metavariable-regex:
                          metavariable: $V
                          regex: |-
                            (?x)
                            (?(DEFINE)
                              # Placeholder text that people paste instead of a value, and the marker words of a planted
                              # decoy (a leak probe's sk-bait-...-CANARY). Not "fake": the pack's own fixtures mark their
                              # positives with FAKE.
                              (?<ph> (?i: x{4} | your | placeholder | changeme | change[_-]me | replace[_-]?me | redacted
                                | dummy | example | canary | bait | decoy | honeytoken | \*{3} ) )
                              # An opaque literal: 16+ token characters with a letter and a digit, no placeholder text.
                              # Template syntax (${VAR}, ${env:VAR}, ${input:id}, ${{ secrets.X }}, $VAR, %VAR%) contains
                              # characters outside this set, so it never qualifies.
                              (?<oc> [A-Za-z0-9._~+/=-] )
                              (?<opq> (?=(?&oc)*[0-9]) (?=(?&oc)*[A-Za-z]) (?!(?&oc)*?(?&ph)) (?&oc){16,}+ (?!(?&oc)) )
                              # Credential formats with a fixed, documented prefix (sources in the rule's references).
                              (?<known> (?:
                                  gh[pousr]_[A-Za-z0-9_]{36,}                       # GitHub PAT, OAuth, app tokens
                                | github_pat_[A-Za-z0-9_]{50,}                      # GitHub fine-grained PAT
                                | A(?:KIA|SIA|BIA|CCA)(?!I(?:OSFODNN7|44QH8DHB)EXAMPLE)[A-Z0-9]{16} # AWS key ID, not the docs' examples
                                | xox[bpe]-[A-Za-z0-9-]{20,} | xoxe\.x(?:oxb|oxp|app)-[A-Za-z0-9-]{20,}
                                | xapp-[A-Za-z0-9-]{20,} | xwfp-[A-Za-z0-9-]{20,}  # Slack bot, user, refresh, app, workflow
                                | hooks\.slack\.com/services/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9]{16,} # Slack webhook
                                | sk-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}      # OpenAI, Anthropic, OpenRouter (sk-or-v1-)
                                | [rs]k_(?:live|test)_[A-Za-z0-9]{20,}              # Stripe secret and restricted (not pk_)
                                | AIza[0-9A-Za-z_-]{35}                             # Google API key
                                | gl(?:pat|oas|dt|rt|rtr|cbt|ptt|ft|imt|agent|wt|soat|ffct)-[A-Za-z0-9_.-]{20,} # GitLab
                                | hf_[A-Za-z0-9]{30,}                               # Hugging Face
                                | npm_[A-Za-z0-9]{36,}                              # npm
                                | ntn_[A-Za-z0-9]{40,} | secret_[A-Za-z0-9]{32,}    # Notion (current, legacy)
                                | lin_(?:api|oauth)_[A-Za-z0-9]{40,}                # Linear
                                | sbp_[A-Za-z0-9]{40,} | sb_secret_[A-Za-z0-9_-]{20,} # Supabase (not sb_publishable_)
                                | sntryu_[a-f0-9]{64} | sntrys_[A-Za-z0-9+/=_]{40,} # Sentry user, org (not DSNs)
                                | ATAT[A-Za-z0-9_=-]{40,}                           # Atlassian API token
                                | r8_[A-Za-z0-9]{37}                                # Replicate
                                | tvly-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}    # Tavily
                                | fc-[a-f0-9]{32}                                   # Firecrawl
                                | pplx-[A-Za-z0-9]{32,}                             # Perplexity (model names have hyphens)
                                | gsk_[A-Za-z0-9]{40,}                              # Groq
                                | do[opr]_v1_[A-Za-z0-9]{32,}                       # DigitalOcean
                                | shp(?:at|ca|pa|ss)_[A-Za-z0-9]{32,}               # Shopify tokens and app secret
                                | SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}        # SendGrid
                                | pypi-[A-Za-z0-9_-]{50,}                           # PyPI
                                | glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8} | glc_[A-Za-z0-9+/=_-]{32,} # Grafana
                                | vc[pirak]_[A-Za-z0-9]{24,}                        # Vercel
                                | cf(?:k|ut|at|ast)_[A-Za-z0-9]{40,}                # Cloudflare
                              ) (?![A-Za-z0-9_-]) )
                            )
                            ^ ["']?
                            (?! [/~] | \.\.?/ )
                            (?! (?:[A-Z0-9]*_)+[A-Z0-9]* ["']? $ )
                            (?! .* \.(?i:json|pem|key|p12|pfx|crt|cer|txt|ya?ml|env|toml|cfg|ini|conf) ["']? $ )
                            (?&opq) ["']? $
          # VS Code inputs: a password input with a literal default, or any default that is a
          # known credential.
          - patterns:
              - pattern-inside: '"inputs": [...]'
              - pattern-either:
                  - patterns:
                      - pattern-inside: '{..., "password": true, ...}'
                      - pattern: '"default": "$V"'
                      - metavariable-regex:
                          metavariable: $V
                          regex: |-
                            (?x)
                            ^ ["']? (?! [^"']*? (?: \$\{ | (?i: x{4} | your | placeholder | changeme | redacted ) ) )
                            [^\s"'$]{8,} ["']? $
                  - patterns:
                      - pattern: '"default": "$V"'
                      - metavariable-regex:
                          metavariable: $V
                          regex: |-
                            (?x)
                            (?(DEFINE)
                              # Placeholder text that people paste instead of a value, and the marker words of a planted
                              # decoy (a leak probe's sk-bait-...-CANARY). Not "fake": the pack's own fixtures mark their
                              # positives with FAKE.
                              (?<ph> (?i: x{4} | your | placeholder | changeme | change[_-]me | replace[_-]?me | redacted
                                | dummy | example | canary | bait | decoy | honeytoken | \*{3} ) )
                              # An opaque literal: 16+ token characters with a letter and a digit, no placeholder text.
                              # Template syntax (${VAR}, ${env:VAR}, ${input:id}, ${{ secrets.X }}, $VAR, %VAR%) contains
                              # characters outside this set, so it never qualifies.
                              (?<oc> [A-Za-z0-9._~+/=-] )
                              (?<opq> (?=(?&oc)*[0-9]) (?=(?&oc)*[A-Za-z]) (?!(?&oc)*?(?&ph)) (?&oc){16,}+ (?!(?&oc)) )
