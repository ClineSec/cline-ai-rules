# Every credential here is fake: FAKE/TEST markers and layouts the providers never issue.
name: Helpdesk MCP servers
version: 0.3.0
schema: v1
mcpServers:
  - name: GitHub
    command: github-mcp-server
    args: [stdio]
    env:
      # ruleid: mcp-config-plaintext-secret-yaml
      GITHUB_PERSONAL_ACCESS_TOKEN: ghp_FAKE0helpdesk0fixture0TEST0000FAKE00
      # ok: mcp-config-plaintext-secret-yaml
      GITHUB_TOOLSETS: repos,issues
  - name: Search
    command: npx
    args:
      - -y
      - "@example-org/web-search-mcp@1.3.0"
      - --api-key
      # ruleid: mcp-config-plaintext-secret-yaml
      - FAKE0brave0TEST0key0helpdesk01
    env:
      # ruleid: mcp-config-plaintext-secret-yaml
      BRAVE_API_KEY: "FAKE0brave0TEST0key0helpdesk02"
      # ok: mcp-config-plaintext-secret-yaml
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # ok: mcp-config-plaintext-secret-yaml
      EXA_API_KEY: ${{ inputs.exa_api_key }}
      # ok: mcp-config-plaintext-secret-yaml
      SEARCH_TOKEN_URL: https://auth.example.invalid/oauth2/token
  - name: Billing
    command: uvx
    args: [example-org-billing-mcp==1.2.0]
    env:
      # ruleid: mcp-config-plaintext-secret-yaml
      STRIPE_SECRET_KEY: FAKE0stripe0TEST0secret0key0helpdesk
      # ruleid: mcp-config-plaintext-secret-yaml
      DJANGO_SECRET_KEY: "FAKE0django0TEST0secret0key0helpdesk"
      # ok: mcp-config-plaintext-secret-yaml
      DJANGO_SECRET_KEY_PATH: run0secrets0django0key02026
  - name: Status page
    type: streamable-http
    # ruleid: mcp-config-plaintext-secret-yaml
    url: https://status.example.invalid/mcp?api_key=FAKE0status0TEST0key0helpdesk03
    # ruleid: mcp-config-plaintext-secret-yaml
    apiKey: 'FAKE0status0TEST0key0helpdesk04'
    requestOptions:
      headers:
        # ruleid: mcp-config-plaintext-secret-yaml
        Authorization: Bearer FAKE0status0TEST0token0helpdesk05
        # ok: mcp-config-plaintext-secret-yaml
        X-Request-Source: helpdesk-continue-2026
  - name: Docs
    type: sse
    url: https://docs.example.invalid/mcp
    # ok: mcp-config-plaintext-secret-yaml
    apiKey: ${{ secrets.DOCS_MCP_KEY }}
    requestOptions:
      headers:
        # ok: mcp-config-plaintext-secret-yaml
        Authorization: Bearer ${{ secrets.DOCS_MCP_TOKEN }}
models:
  - name: Router
    provider: openai
    model: gpt-5.5
    # Model keys are outside mcpServers and outside this rule.
    # ok: mcp-config-plaintext-secret-yaml
    apiKey: FAKE0model0TEST0key0helpdesk06
