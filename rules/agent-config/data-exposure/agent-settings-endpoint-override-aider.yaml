                | openai\.com | chatgpt\.com
                | cloud\.databricks\.com | azuredatabricks\.net | gcp\.databricks\.com
                | continue\.dev
                | githubcopilot\.com | models\.github\.ai | openrouter\.ai | mistral\.ai | groq\.com | deepseek\.com | x\.ai | together\.xyz | together\.ai | fireworks\.ai | cerebras\.ai | perplexity\.ai | cohere\.com | cohere\.ai | huggingface\.co | api\.nvidia\.com | meta\.ai | ollama\.com | moonshot\.ai | moonshot\.cn | kimi\.com | z\.ai | bigmodel\.cn | minimax\.io | minimaxi\.com | minimax\.chat | xiaomimimo\.com | siliconflow\.cn | siliconflow\.com | longcat\.chat | dashscope(?:-intl|-us)?\.aliyuncs\.com | maas\.aliyuncs\.com | qwen\.ai | qwencloudapi\.com | replicate\.com | api\.cloudflare\.com | chutes\.ai | coralbricks\.ai | baseten\.co | venice\.ai | nebius\.com | synthetic\.new | scaleway\.ai | qnaigc\.com | pioneer\.ai | neuralwatt\.com | intelligence\.io\.solutions | cortecs\.ai | avian\.io | atlascloud\.ai | aihubmix\.com | ai-gateway\.vercel\.sh | opencode\.ai | kilo\.ai | kilocode\.ai | cline\.bot | charm\.land )
              | ark \. [\w-]+ \. volces\.com
              | (?: vpce-[\w-]+\. )? bedrock (?: -runtime | -mantle | -agent-runtime )? (?: -fips )?
                  \. (?&region) \. (?: vpce(?:-[\w-]+)?\. )? amazonaws\.com (?: \.cn )? ) )
          )
          # A NAME=value entry of set-env, in block or flow style, outside a # comment.
          ^ [^\n\#]*? (?<![\w-]) (?: OPENAI_BASE_URL | OPENAI_API_BASE | ANTHROPIC_BASE_URL | ANTHROPIC_API_BASE | AZURE_API_BASE | AZURE_AI_API_BASE | GEMINI_API_BASE | VERTEXAI_API_BASE | OPENROUTER_API_BASE | MISTRAL_API_BASE | GROQ_API_BASE | COHERE_API_BASE | DATABRICKS_API_BASE | NEBIUS_API_BASE | OLLAMA_API_BASE ) [ \t]*+ = [ \t]*+ \K (?i:https?|wss?) : (?: \\?+ / ){2} (?&userinfo)
          (?! (?&vendor) \.? (?&he) )
          (?: (?! (?:(?&lbl)\.)* (?&private) \.? (?&he) ) (?:(?&lbl)\.)+ [A-Za-z][A-Za-z0-9-]*+ \.?
            | (?&pubip4) | (?&pubip6) ) (?&he)
      # A model's extra_params, passed straight to LiteLLM.
      - pattern-regex: |-
          (?xm)
          (?(DEFINE)
            (?<oct> 25[0-5] | 2[0-4]\d | 1\d\d | [1-9]?\d )
            # Where a host ends: a port, path, query, fragment, quote, separator, or the end.
