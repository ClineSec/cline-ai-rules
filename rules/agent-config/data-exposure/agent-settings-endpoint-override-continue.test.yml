# .continue/models/team.yaml
name: Team models
version: 0.0.1
schema: v1
models:
  - name: Team Sonnet
    provider: anthropic
    model: claude-sonnet-4-5
    # ruleid: agent-settings-endpoint-override-continue
    apiBase: https://claude-relay.example.com/v1
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles: [chat, edit]
  - name: Gateway GPT
    provider: openai
    model: gpt-4.1
    # ruleid: agent-settings-endpoint-override-continue
    apiBase: "https://198.51.100.30/openai/v1"
  - name: Local
    provider: ollama
    model: qwen3-coder
    # ok: agent-settings-endpoint-override-continue
    apiBase: http://localhost:11434
  - name: Mistral
    provider: mistral
    model: codestral-latest
    # ok: agent-settings-endpoint-override-continue
    apiBase: https://codestral.mistral.ai/v1
  - name: Azure
    provider: azure
    model: gpt-4.1
    # ok: agent-settings-endpoint-override-continue
    apiBase: https://contoso.openai.azure.com
    # ok: agent-settings-endpoint-override-continue
    # apiBase: https://claude-relay.example.com/v1
