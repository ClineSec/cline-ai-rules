rules:
  - id: agent-settings-endpoint-override-dotenv-generic
    # Text rule over .env files for the SDK-wide endpoint names that Qwen Code, Aider and Crush
    # read from a project .env. LOW confidence: the same names often configure the application
    # itself, and a developer who runs one of these agents in the repo still sends it their key.
    # Agent-specific names are in agent-settings-endpoint-override-dotenv.
    # Generated by scripts/gen_agent_settings_endpoint.py, which holds the host test the
    # agent-settings-endpoint-override rules share (with the private-network groups of
    # gen_mcp_remote_host.py). Edit the script and run scripts/build.py; build.py --check fails if
    # this file drifts.
    languages: [regex]
    severity: WARNING
    message: >-
      This committed .env file sets an OpenAI- or Anthropic-style endpoint variable to a host
      that is not a model vendor's API and not on this machine or a private network. Coding
      agents that load a project's .env without asking pick it up: Qwen Code (OPENAI_BASE_URL,
      ANTHROPIC_BASE_URL, for variables the shell hasn't set), Aider (the LiteLLM *_API_BASE
      names, overriding the shell), and Crush (*_API_ENDPOINT), and send the developer's own
      API key with each request. If the variable is for the application, keep the committed
      value local or on the vendor's API, and set the real one outside the repository.
      The prompts, the files the agent reads, and, for a model endpoint, the developer's own
      credential (API key, OAuth login, or cloud token) go to that host, and anyone who can get
      a change to this file merged, through a pull request, a compromised dependency, or a worm
      that writes into the repo, chooses it for everyone who opens the project (Claude Code
      CVE-2026-21852 was an override like this in a repository's .claude/settings.json). A
      company gateway belongs in user or managed settings, or in the shell that starts the
      agent, where a pull request can't change it; remove the override from the project file,
      or point it at the vendor's own API.
    paths:
      include:
        # .env at any depth, including .gemini/.env and .qwen/.env. The agents read no other
        # file names (.env.example, .env.production stay out).
        - ".env"
    # SDK-wide endpoint variables.
    pattern-regex: |-
        (?xm)
        (?(DEFINE)
          (?<oct> 25[0-5] | 2[0-4]\d | 1\d\d | [1-9]?\d )
          # Where a host ends: a port, path, query, fragment, quote, separator, or the end.
          (?<he> (?= [:/?\#"'\\\s,;)\]}] | $ ) )
          # A DNS label. _ and labels past 63 characters are allowed on purpose: testbed payloads
          # use names under real tunnel domains that can never resolve.
          (?<lbl> [A-Za-z0-9_-]++ )
          (?<userinfo> (?: [^\s"'/@?\#\\]*+ @ )?+ )
          # Tunnel and out-of-band callback services: each name is a machine or listener that someone
          # started for the moment, not a service anyone vouches for (sources in the rule's references).
          (?<tunnel> (?i: trycloudflare\.com                          # Cloudflare quick tunnels
            | ngrok-free\.(?:app|dev|pizza) | ngrok\.(?:app|dev|io|pizza) # ngrok
            | loca\.lt | localtunnel\.me                                # localtunnel
            | lhr\.life | lhr\.rocks                                    # localhost.run
            | serveo\.net | serveousercontent\.com                      # Serveo
            | pinggy(?:-free)?\.link                                    # Pinggy
            | tunnelmole\.net | bore\.pub | loclx\.io                   # Tunnelmole, bore, LocalXpose
            | devtunnels\.ms | app\.github\.dev                         # Dev Tunnels, Codespaces ports
            | oast\.(?:pro|live|site|online|fun|me)                     # Interactsh
            | oastify\.com | burpcollaborator\.net ) )                 # Burp Collaborator
          # Free hosting platforms' default subdomains (sources in the rule's references).
          (?<paas> (?i: onrender\.com | fly\.dev | herokuapp\.com | vercel\.app | netlify\.app
            | railway\.app | workers\.dev | deno\.dev | deno\.net | replit\.app | koyeb\.app | hf\.space
            | modal\.run ) )
          # A public IPv4 address: not this-network, private (RFC 1918), shared (100.64/10, which
          # Tailscale uses), loopback, link-local, benchmarking, or multicast and above. The
          # documentation ranges (192.0.2/24, 198.51.100/24, 203.0.113/24) count as public.
          (?<pubip4> (?! (?:0|10|127)\. | 169\.254\. | 172\.(?:1[6-9]|2\d|3[01])\. | 192\.168\.
              | 100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\. | 198\.1[89]\. | (?:22[4-9]|2[3-5]\d)\. )
            (?&oct) (?:\.(?&oct)){3} )
          # A global unicast IPv6 literal (2000::/3).
          (?<pubip6> \[ [23][0-9A-Fa-f]{0,3} : [0-9A-Fa-f:.]*+ \] )
          # Names that only resolve on this machine or a private network: localhost, mDNS, the
          # reserved .internal TLD, home and corporate LANs, Tailscale MagicDNS, Consul's service DNS,
          # and other suffixes seen in committed agent configs that are not delegated TLDs (IANA root
          # zone list, version 2026102500), so no public DNS answers for them.
          (?<private> (?i: localhost | local | internal | lan | home\.arpa | corp | home | intranet
            | private | ts\.net | consul | proxy | lab | wg | monitor | hammernet ) )
          # A URL scheme starts here: not inside a longer scheme such as git+https. ${VAR:-https://...}
          # puts a - right before it.
          (?<url> (?<![A-Za-z0-9+.]) )
        )
        (?(DEFINE)
          (?<region> [a-z]{2} (?: -[a-z]+ )+ -\d )
          (?<vendor> (?i:
              (?: (?&lbl) \. )*? (?:
                anthropic\.com | claude\.ai | claude\.com
              | api\.aws
              | googleapis\.com
              | openai\.azure\.com | services\.ai\.azure\.com | cognitiveservices\.azure\.com | inference\.ai\.azure\.com | models\.ai\.azure\.com
              | openai\.com | chatgpt\.com
              | cloud\.databricks\.com | azuredatabricks\.net | gcp\.databricks\.com
              | continue\.dev
              | githubcopilot\.com | models\.github\.ai | openrouter\.ai | mistral\.ai | groq\.com | deepseek\.com | x\.ai | together\.xyz | together\.ai | fireworks\.ai | cerebras\.ai | perplexity\.ai | cohere\.com | cohere\.ai | huggingface\.co | api\.nvidia\.com | meta\.ai | ollama\.com | moonshot\.ai | moonshot\.cn | kimi\.com | z\.ai | bigmodel\.cn | minimax\.io | minimaxi\.com | minimax\.chat | xiaomimimo\.com | siliconflow\.cn | siliconflow\.com | longcat\.chat | dashscope(?:-intl|-us)?\.aliyuncs\.com | maas\.aliyuncs\.com | qwen\.ai | qwencloudapi\.com | replicate\.com | api\.cloudflare\.com | chutes\.ai | coralbricks\.ai | baseten\.co | venice\.ai | nebius\.com | synthetic\.new | scaleway\.ai | qnaigc\.com | pioneer\.ai | neuralwatt\.com | intelligence\.io\.solutions | cortecs\.ai | avian\.io | atlascloud\.ai | aihubmix\.com | ai-gateway\.vercel\.sh | opencode\.ai | kilo\.ai | kilocode\.ai | cline\.bot | charm\.land )
            | ark \. [\w-]+ \. volces\.com
            | (?: vpce-[\w-]+\. )? bedrock (?: -runtime | -mantle | -agent-runtime )? (?: -fips )?
                \. (?&region) \. (?: vpce(?:-[\w-]+)?\. )? amazonaws\.com (?: \.cn )? ) )
        )
        ^ [ \t]*+ (?: export [ \t]++ )?+ (?: OPENAI_BASE_URL | OPENAI_API_BASE | ANTHROPIC_BASE_URL | ANTHROPIC_API_BASE | AZURE_API_BASE | AZURE_AI_API_BASE | GEMINI_API_BASE | VERTEXAI_API_BASE | OPENROUTER_API_BASE | MISTRAL_API_BASE | GROQ_API_BASE | COHERE_API_BASE | DATABRICKS_API_BASE | NEBIUS_API_BASE | OLLAMA_API_BASE | OPENAI_API_ENDPOINT | ANTHROPIC_API_ENDPOINT | GEMINI_API_ENDPOINT | AZURE_OPENAI_API_ENDPOINT ) (?: [ \t]*+ = | : [ \t] ) [ \t]*+
        \K ["'`]?+ (?i:https?|wss?) : (?: \\?+ / ){2} (?&userinfo)
        (?! (?&vendor) \.? (?&he) )
        (?: (?! (?:(?&lbl)\.)* (?&private) \.? (?&he) ) (?:(?&lbl)\.)+ [A-Za-z][A-Za-z0-9-]*+ \.?
          | (?&pubip4) | (?&pubip6) ) (?&he)
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM02:2026 - Sensitive Information Disclosure"
        - "LLM02:2025 - Sensitive Information Disclosure"
      owasp-agentic:
        - "ASI03 - Identity and Privilege Abuse"
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
      owasp-aisvs:
        - "v1.01-AC.11.2 - AI Code-Review & Assistant Bot Hardening"
      mitre-atlas:
        - "AML.T0081 - Modify AI Agent Configuration"
      cwe:
        - "CWE-923: Improper Restriction of Communication Channel to Intended Endpoints"
        - "CWE-522: Insufficiently Protected Credentials"
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [qwen-code, aider, crush]
      references:
        - https://github.com/anthropics/claude-code/security/advisories/GHSA-jh7p-qr78-84p7
        - https://github.com/QwenLM/qwen-code/blob/v0.26.1/packages/cli/src/config/environment.ts
        - https://github.com/QwenLM/qwen-code/blob/v0.26.1/packages/core/src/models/constants.ts
        - https://github.com/Aider-AI/aider/blob/v0.86.0/aider/main.py
        - https://github.com/BerriAI/litellm/blob/v1.75.0-nightly/litellm/main.py
        - https://github.com/charmbracelet/crush/blob/v0.98.2/main.go
        - https://github.com/charmbracelet/catwalk/tree/v0.52.49/internal/providers/configs
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM02_SensitiveInformationDisclosure.md
