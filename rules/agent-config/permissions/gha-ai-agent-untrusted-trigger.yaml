rules:
  - id: gha-ai-agent-untrusted-trigger
    # A coding agent in a GitHub Actions workflow that other people can trigger (issues,
    # comments, pull_request_target, reviews, discussions, workflow_run), with text those
    # people wrote (an issue body, a PR title, a comment) in its prompt or its environment,
    # and with tools that act: shell commands or file edits. Covers the vendors' agent actions
    # (claude-code-action, claude-code-base-action, codex-action, run-gemini-cli) and agent
    # CLIs started in run: steps.
    #
    # claude-code-action (v1.0.258) and codex-action (v1.13) refuse to run unless the user who
    # triggered the event has write access. For them, only text written by someone else is
    # reported: the issue when a maintainer comments on it, the PR when a maintainer reviews
    # it, an issue or PR that a maintainer labels or assigns. The same applies to any agent
    # whose job or step has an if: on author_association or on head.repo (a same-repo guard).
    # The approval and sandbox switches themselves are ai-cli-bypass-flag-invocation(-gha);
    # this rule reports where the attacker's text enters.
    languages: [yaml]
    severity: ERROR
    message: >-
      This workflow gives a coding agent text that anyone can write (an issue, a pull request,
      a comment, a branch name) and lets the agent run shell commands or edit files, on a
      trigger that outsiders can start. A prompt injection in that text can make the agent run
      commands with the job's checkout, token, and secrets: leak them, push code, or edit
      issues and releases (PromptPwnd, December 2025). Keep untrusted text out of agents that
      can act: give the agent only read tools (claude-code-action without Bash/Edit in
      claude_args, run-gemini-cli with a settings "core" list of read tools, codex-action with
      permission-profile ":read-only"), pass the issue or PR number instead of its text, keep
      write tokens and deploy secrets out of the job, and require a maintainer to start the
      run (author_association check, workflow_dispatch).
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    patterns:
      # ---------------------------------------------------------------------------------------
      # 1. Where untrusted text reaches an agent that can act. Every branch matches a
      #    `KEY: $SRC` pair: an action's prompt input, an env entry, or a run: script.
      # ---------------------------------------------------------------------------------------
      - pattern-either:
          # anthropics/claude-code-action and claude-code-base-action v1.0.258. With a prompt
          # input the action runs in agent mode, where Claude Code gets no Bash and no edits
          # unless claude_args or settings allow them (tag mode adds acceptEdits, agent mode
          # does not).
          - patterns:
              - pattern-inside: |
                  uses: $A
                  ...
              - metavariable-regex:
                  metavariable: $A
                  regex: ^["']?anthropics/claude-code-(?:base-)?action@
              - pattern-either:
                  - pattern-inside: |
                      with:
                        ...
                        claude_args: $ACT
                        ...
                      ...
                  - pattern-inside: |
                      with:
                        ...
                        settings: $ACT
                        ...
                      ...
              # claude_args flags, or a settings JSON string with an allow list or default
              # mode. Bash counts when bare or with a wildcard, except read-only commands
              # (gh ... view/list, git diff/log/show); an exact command like
              # Bash(npm test) does not count.
              - metavariable-regex:
                  metavariable: $ACT
                  regex: |-
                    (?xs)
                    # --- claude-code-action acting test (begin): build.py keeps this block identical in
                    # gha-ai-agent-open-to-non-writers; edit both together. ---
                    (?(DEFINE)
                      (?<ro> (?: gh \s++ [\w-]++ \s++ (?:view|list|diff|status|checks)
                               | git \s++ (?:diff|log|show|status|blame)
                               | cat | ls | head | tail | wc | grep | rg | echo | pwd ) (?![\w-]) )
                      (?<tool> (?<![\w(]) (?: Bash (?![\w(])
                                            | Bash \( \s*+ (?: \*?+ \s*+ \) | (?! (?&ro) ) [^)]*? \* [^)]*+ \) )
                                            | (?:Multi)?Edit | Write | NotebookEdit ) (?!\w) )
                    )
                    .*? (?: (?<![\w-]) --dangerously-skip-permissions (?![\w-])
                          | (?<![\w-]) --permission-mode (?:=|\s++) \\?["']? (?:acceptEdits|auto|bypassPermissions) (?![\w-])
                          | (?<![\w-]) --allowed-?[Tt]ools (?:=|\s++) (?: (?!\s--) . )*? (?&tool)
                          | \\?"defaultMode\\?" \s*+ : \s*+ \\?" (?:acceptEdits|auto|bypassPermissions) \\?"
                          | \\?"allow\\?" \s*+ : \s*+ \[ [^\]]*? (?&tool) )
                    # --- claude-code-action acting test (end) ---
              - pattern-either:
                  - pattern: 'prompt: $SRC'
                  - patterns:
                      - pattern-inside: |
                          env:
                            ...
                            $NAME: $SRC
                            ...
                          ...
                      - pattern: '$NAME: $SRC'
              # claude-code-action (not the base action) stops with "Unsupported event type"
              # on discussion and discussion_comment, so its text must come from an event it
              # runs on. One comparison over $A, $SRC, and $ON, all bound at this level (a
              # separate pattern-either that re-binds them multiplied the matcher's work
              # roughly sixfold on large workflows). The regexes avoid backslashes.
              - pattern-inside: |
                  $ONKEY: $ON
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-comparison:
                  comparison: >-
                    not re.match("^.?anthropics/claude-code-action@", str($A))
                    or (re.match("(?s).*?[$][{][{](?:(?![}][}]).)*?(?<![A-Za-z0-9_.])(?:github[.]event[.](?:issue[.](?:title|body)|pull_request[.](?:title|body|head[.](?:ref|label))|(?:comment|review|review_comment)[.]body|workflow_run[.](?:head_branch|display_title|head_commit[.](?:message|author[.](?:name|email))))|github[.]head_ref|toJSON[(][ ]*github[.]event(?:[.](?:issue|pull_request|comment|review|review_comment|workflow_run))?[ ]*[)])(?![A-Za-z0-9_])", str($SRC))
                    and re.match("(?s).*?(?<![A-Za-z0-9_-])(?:issues|issue_comment|pull_request_target|pull_request_review|pull_request_review_comment|workflow_run)(?![A-Za-z0-9_-])", str($ON)))
          # openai/codex-action v1.13: codex exec runs shell commands in a workspace-write
          # sandbox by default. Read-only sandboxes are left out.
          - patterns:
              - pattern-inside: |
                  uses: $A
                  ...
              - metavariable-regex:
                  metavariable: $A
                  regex: ^["']?openai/codex-action@
              - pattern-not-inside: |
                  with:
                    ...
                    sandbox: read-only
                    ...
                  ...
              - pattern-not-inside: |
                  with:
                    ...
                    permission-profile: ":read-only"
                    ...
                  ...
              - pattern-not-inside: |
                  with:
                    ...
                    safety-strategy: read-only
                    ...
                  ...
              - pattern-either:
                  - pattern: 'prompt: $SRC'
                  - patterns:
                      - pattern-inside: |
                          env:
                            ...
                            $NAME: $SRC
                            ...
                          ...
                      - pattern: '$NAME: $SRC'
          # google-github-actions/run-gemini-cli v0.1.22: always runs gemini --yolo, so every
          # tool runs unless settings narrows the tools with a "core" (or legacy "coreTools")
          # allowlist. Read tools and read-only commands like run_shell_command(echo) are fine;
          # bare run_shell_command, other commands (gh issue edit), write_file, and replace
          # count.
          - patterns:
              - pattern-inside: |
                  uses: $A
                  ...
              - metavariable-regex:
                  metavariable: $A
                  regex: ^["']?google-github-actions/run-gemini-cli@
              - pattern-either:
                  - patterns:
                      - pattern-not-inside: |
                          with:
                            ...
                            settings: $S
                            ...
                          ...
                      - pattern-inside: |
                          with:
                            ...
                          ...
                  - patterns:
                      - pattern-inside: |
                          with:
                            ...
                            settings: $S
                            ...
                          ...
                      - metavariable-regex:
                          metavariable: $S
                          regex: |-
                            (?xs)
                            # --- run-gemini-cli acting test (begin): build.py keeps this block identical in
                            # gha-ai-agent-checkout-pr-head; edit both together. ---
                            (?(DEFINE)
                              (?<ro> (?: echo | cat | ls | head | tail | wc | grep | pwd
                                       | git \s++ (?:diff|log|show|status|blame)
                                       | gh \s++ [\w-]++ \s++ (?:view|list|diff|status|checks) ) (?![\w-]) )
                            )
                            ^ (?: (?! .*? \\?"(?:core|coreTools)\\?" \s*+ : )
                                | .*? \\?"(?:core|coreTools)\\?" \s*+ : \s*+ \[ [^\]]*? \\?"
                                  (?: run_shell_command (?: \\?" | \( \s*+ (?! (?&ro) ) )
                                    | ShellTool | write_file | replace | WriteFileTool | EditTool ) )
                            # --- run-gemini-cli acting test (end) ---
              - pattern-either:
                  - pattern: 'prompt: $SRC'
                  - patterns:
                      - pattern-inside: |
                          env:
                            ...
                            $NAME: $SRC
                            ...
                          ...
                      - pattern: '$NAME: $SRC'
          # Agent CLIs in run: steps, with a switch that lets them run shell commands or edit
          # files. The untrusted text is either in the script itself (${{ ... }}, which is also
          # a shell injection) or in an env entry the script uses; the env entry is then the
          # finding. An env entry at job or workflow level counts when its name appears in the
          # job's steps (or the workflow's jobs) and one of them starts such an agent. The name
          # must appear whole ($NAME, ${NAME...}, ${{ env.NAME }}, $env:NAME, printenv NAME):
          # each reference in the script is bound as $USE by the inner metavariable-pattern
          # and compared for equality outside it (the comparison only sees $USE through a
          # nested patterns: block), so ISSUE_BODY is not linked by $ISSUE_BODY_SUMMARY.
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern-inside: 'run: $CMD'
                      - pattern: 'run: $SRC'
                  - patterns:
                      - patterns:
                          - pattern-inside: |
                              env:
                                ...
                                $NAME: $SRC
                                ...
                              ...
                              run: $CMD
                          - pattern: '$NAME: $SRC'
                          - metavariable-pattern:
                              metavariable: $CMD
                              language: generic
                              pattern-regex: (?:\$\{?|\$env:|\benv\.|\bprintenv[ \t]+)(?<USE>[A-Za-z_][A-Za-z0-9_]*)
                      - metavariable-comparison:
                          comparison: str($USE) == str($NAME)
                  - patterns:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  env:
                                    ...
                                    $NAME: $SRC
                                    ...
                                  ...
                                  steps: $CMD
                              - pattern-inside: |
                                  env:
                                    ...
                                    $NAME: $SRC
                                    ...
                                  ...
                                  jobs: $CMD
                          - pattern: '$NAME: $SRC'
                          - metavariable-pattern:
                              metavariable: $CMD
                              language: generic
                              pattern-regex: (?:\$\{?|\$env:|\benv\.|\bprintenv[ \t]+)(?<USE>[A-Za-z_][A-Za-z0-9_]*)
                      - metavariable-comparison:
                          comparison: str($USE) == str($NAME)
              # A run: script (or a job's steps) that starts an agent CLI in command position
              # with a switch that lets it act. Quoted strings are skipped while looking for
              # the switch, so a prompt that mentions a flag doesn't count.
              - metavariable-regex:
                  metavariable: $CMD
                  regex: |-
                    (?xm)
                    # --- gha agent-CLI acting regex (begin): build.py keeps this block identical in
                    # gha-ai-agent-checkout-pr-head; edit both together. ---
                    (?(DEFINE)
                      (?<q> " (?:[^"\\\n] | \\.)*+ " | ' [^'\n]*+ ' )
                      # The rest of one command: words, quoted strings, \-newline continuations.
                      (?<g> (?: (?&q) | \\\r?\n | (?&fold) | \\[^\r\n] | [^\n"'\#;&|\\] )*? )
                      # A folded scalar (run: >-) or a multi-line quoted one continues a command
                      # on the next line; a line that starts with a flag or a quote can only be such
                      # a continuation, since it would not be a command of its own.
                      (?<fold> \r?\n [ \t]*+ (?= -{1,2}[A-Za-z] | ["'] ) )
                      (?<end> (?= \\?["'`)\s;&|] | $ ) )
                      (?<ws> [ \t]++ | [ \t]*+ \\\r?\n [ \t]*+ | [ \t]*+ (?&fold) )
                      (?<v> (?:=|(?&ws)) \\?["']? )
                      (?<pkgv> (?: @[\w.^~*-]+ )? )
                      (?<runner> (?: npx | bunx | pnpx | pnpm (?&ws) dlx | yarn (?&ws) dlx | npm (?&ws) exec )
                        (?: (?&ws) (?: -y | --yes | -- ) )*+ (?&ws) )
                      # Command position: line start (after a YAML "- " or "run:" when a job's
                      # steps are scanned), after ; & | ( `, or then/do/else; then NAME=value
                      # assignments, wrappers, and a path to the binary.
                      (?<pos> (?: ^ [ \t]*+ (?: - [ \t]++ )? (?: run [ \t]*+ : [ \t]*+ ["']? )?
                                | (?<=[;&|(`]) [ \t]*+
                                | (?<![\w-]) (?:then|do|else) [ \t]++ )
                              (?: [A-Za-z_]\w*+ = (?: (?&q) | [^\s"'\#;&|]*+ ) [ \t]++
                                | (?: sudo | env | exec | nohup | time | timeout )
                                  (?: [ \t]++ (?: -[^\s;&|]++ | \d+[smhd]? | [A-Za-z_]\w*=[^\s;&|]*+ ) )*+ [ \t]++ )*+
                              ["']?+ (?: [\w.~${}-]*+ / )*+ )
                      (?<ro> (?: gh \s++ [\w-]++ \s++ (?:view|list|diff|status|checks)
                               | git \s++ (?:diff|log|show|status|blame)
                               | cat | ls | head | tail | wc | grep | rg | echo | pwd ) (?![\w-]) )
                      # Claude Code tools that act: Bash bare or with a wildcard (not a
                      # read-only command), and the edit tools.
                      (?<cctool> (?<![\w(]) (?: Bash (?![\w(])
                                              | Bash \( \s*+ (?: \*?+ \s*+ \) | (?! (?&ro) ) [^)]*? \* [^)]*+ \) )
                                              | (?:Multi)?Edit | Write | NotebookEdit ) (?!\w) )
                      # The values after a list flag, up to the next --flag.
                      (?<list> (?: \\\r?\n | \r?\n [ \t]*+ (?=["']) | (?! [ \t]-- ) [^\n;&|] )*? )
                    )
                    \A (?s:.*?) (?&pos)
                    (?:
                      # Claude Code 2.1.308: allowed Bash or edit tools, an auto-approving
                      # permission mode, or the bypass flag.
                      (?: claude | (?&runner) @anthropic-ai/claude-code (?&pkgv) ) (?&end) (?&g) (?<=\s)
                      (?: --dangerously-skip-permissions (?&end)
                        | --permission-mode (?&v) (?:acceptEdits|auto|bypassPermissions) (?&end)
                        | --allowed-?[Tt]ools (?&v) (?&list) (?&cctool) )
                      # Codex 0.163: plain codex exec is read-only; these write or drop the sandbox.
                    | (?: codex | (?&runner) @openai/codex (?&pkgv) ) (?&end) (?&g) (?<=\s)
                      (?: --full-auto | --approve-for-me | --not-so-yolo | --yolo | --dangerously-bypass-approvals-and-sandbox
                        | (?:-s|--sandbox) (?&v) (?:workspace-write|danger-full-access)
                        | (?:-c|--config) (?&v) sandbox_mode [ \t]*=[ \t]* \\?["']? (?:workspace-write|danger-full-access) ) (?&end)
                      # Gemini CLI 0.65 and Qwen Code 0.26: yolo or auto_edit approval, or an
                      # allowed shell command that is not read-only, or the write tools.
                    | (?: gemini | qwen | (?&runner) (?:@google/gemini-cli|@qwen-code/qwen-code) (?&pkgv) ) (?&end) (?&g) (?<=\s)
                      (?: (?: --yolo (?:=true)? | -y | --approval-mode (?&v) (?:yolo|auto_edit) ) (?&end)
                        | --allowed-tools (?&v) (?&list) (?<![\w(])
                          (?: run_shell_command (?!\() | run_shell_command \( \s*+ (?! (?&ro) ) | write_file | replace ) )
                      # GitHub Copilot CLI 1.0.102.
                    | (?: copilot | gh (?&ws) copilot | (?&runner) @github/copilot (?&pkgv) ) (?&end) (?&g) (?<=\s)
                      (?: (?: --allow-all-tools | --allow-all | --yolo ) (?&end)
                        | --allow-tool (?&v) (?: shell (?!\() | shell \( \s*+ (?! (?&ro) ) | write ) )
                      # Cursor CLI: --force / -f / --yolo.
                    | cursor-agent (?&end) (?&g) (?<=\s) (?: --force | -f | --yolo ) (?&end)
                      # Cline CLI 3.0.73 auto-approves every tool for a task run (a quoted or
                      # $VAR prompt) unless --auto-approve false or plan mode is passed.
                    | (?: cline | (?&runner) (?:cline|@cline/cli) (?&pkgv) ) (?&end)
                      (?! (?&g) (?<=\s) (?: --plan | -p | --auto-approve (?&v) false | -i | --tui | --acp ) (?&end) )
                      (?= (?&g) (?<=\s) \\?+ (?: ["'] | \$ ) )
                      # Amp execute mode does not ask before running tools.
                    | amp (?&end) (?&g) (?<=\s) (?: -x | --execute ) (?&end)
                      # goose run: goose's default mode is autonomous.
                    | goose (?&ws) run (?&end)
                      # opencode 1.19 run (and github run): every tool is allowed unless config
                      # sets it to ask or deny, so a run acts with or without --auto.
                    | (?: opencode | (?&runner) opencode-ai (?&pkgv) ) (?: (?&ws) github )? (?&ws) run (?&end)
                      # Kiro CLI and Amazon Q Developer CLI.
                    | (?: kiro-cli | q (?&ws) chat ) (?&end) (?&g) (?<=\s) --trust-all-tools (?&end)
                    )
                    # --- gha agent-CLI acting regex (end) ---
          # Copilot CLI with COPILOT_ALLOW_ALL set in an env: block around the step (the same as
          # --allow-all; any truthy spelling approves every tool).
          - patterns:
              - pattern-inside: |
                  env:
                    ...
                    COPILOT_ALLOW_ALL: $ALLOW
                    ...
                  ...
              - metavariable-regex:
                  metavariable: $ALLOW
                  regex: ^["']?(?i:true|1|yes|on|y)["']?$
              - pattern-either:
                  - patterns:
                      - pattern-inside: 'run: $CMD'
                      - pattern: 'run: $SRC'
                  - patterns:
                      - patterns:
                          - pattern-inside: |
                              env:
                                ...
                                $NAME: $SRC
                                ...
                              ...
                              run: $CMD
                          - pattern: '$NAME: $SRC'
                          - metavariable-pattern:
                              metavariable: $CMD
                              language: generic
                              pattern-regex: (?:\$\{?|\$env:|\benv\.|\bprintenv[ \t]+)(?<USE>[A-Za-z_][A-Za-z0-9_]*)
                      - metavariable-comparison:
                          comparison: str($USE) == str($NAME)
                  - patterns:
                      - patterns:
                          - pattern-either:
                              - pattern-inside: |
                                  env:
                                    ...
                                    $NAME: $SRC
                                    ...
                                  ...
                                  steps: $CMD
                              - pattern-inside: |
                                  env:
                                    ...
                                    $NAME: $SRC
                                    ...
                                  ...
                                  jobs: $CMD
                          - pattern: '$NAME: $SRC'
                          - metavariable-pattern:
                              metavariable: $CMD
                              language: generic
                              pattern-regex: (?:\$\{?|\$env:|\benv\.|\bprintenv[ \t]+)(?<USE>[A-Za-z_][A-Za-z0-9_]*)
                      - metavariable-comparison:
                          comparison: str($USE) == str($NAME)
              - metavariable-regex:
                  metavariable: $CMD
                  regex: (?m)\A(?s:.*?)(?:^[ \t]*+(?:-[ \t]++)?(?:run[ \t]*+:[ \t]*+["']?)?|(?<=[;&|(`])[ \t]*+)(?:[A-Za-z_]\w*+=\S*+[ \t]++)*+(?:copilot|gh[ \t]++copilot|(?:npx|bunx)[ \t]++(?:-y[ \t]++)?@github/copilot\S*+)(?=[\s;&|]|$)
      # ---------------------------------------------------------------------------------------
      # 2. The text is untrusted for this trigger. Each branch re-binds the source with the
      #    same one-line pattern-either (an action's prompt, a run: script, or an env entry).
      #    A bare `$KEY: $SRC` would also work but binds every mapping in the file, which made
      #    an 800-line workflow take 30 seconds.
      # ---------------------------------------------------------------------------------------
      - pattern-either:
          # Text written by someone other than the user who started the run. Reported for
          # every agent, including the ones that check the actor's write access.
          # The issue's title or body, on a comment (by a maintainer, say) on that issue.
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.issue\.(?:title|body)|toJSON\(\s*github\.event(?:\.issue)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY: $ON
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $ON
                  regex: (?s).*?(?<![\w-])issue_comment(?![\w-])
          # The issue's text on an issues event other than opened or edited (labeled,
          # assigned, ...), where the actor is whoever labeled or assigned it. `on: issues`
          # with no types listed means every type.
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.issue\.(?:title|body)|toJSON\(\s*github\.event(?:\.issue)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY: $ON
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $ON
                  regex: (?s)^(?:["']?issues["']?\s*$|\[.*?(?<![\w-])issues(?![\w-])|-.*?(?<![\w-])issues(?![\w-]))
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.issue\.(?:title|body)|toJSON\(\s*github\.event(?:\.issue)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY:
                    ...
                    issues: $T
                    ...
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    (?xs) ^ (?: (?! .*? (?<![\w-])types[ \t]*+: )
                              | .*? (?<![\w-])types [ \t]*+ : [ \t]*+
                                (?: \[ (?: [\s,'"] | (?:opened|edited)(?![\w-]) )*+ [^\]\s,'"]
                                  | (?: \s*+ - [ \t]*+ ["']?(?:opened|edited)["']? [ \t]*+ (?:\#[^\n]*+)? (?=\n|$) )*+
                                    \s*+ - [ \t]*+ (?! ["']?(?:opened|edited)["']? [ \t]*+ (?:\#|\n|$) ) \S
                                  | ["']? (?! (?:opened|edited)["']? [ \t]*+ (?:\#|\n|$) ) [a-z] ) )
          # The pull request's title, body, or branch name, on a review or review comment.
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.pull_request\.(?:title|body|head\.(?:ref|label))|github\.head_ref|toJSON\(\s*github\.event(?:\.pull_request)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY: $ON
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $ON
                  regex: (?s).*?(?<![\w-])pull_request_review(?:_comment)?(?![\w-])
          # The pull request's text on pull_request_target types other than the author's own
          # (opened, edited, synchronize, reopened, ready_for_review). The default types are
          # the author's.
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.pull_request\.(?:title|body|head\.(?:ref|label))|github\.head_ref|toJSON\(\s*github\.event(?:\.pull_request)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY:
                    ...
                    pull_request_target: $T
                    ...
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    (?xs) ^ .*? (?<![\w-])types [ \t]*+ : [ \t]*+
                      (?: \[ (?: [\s,'"] | (?:opened|edited|synchronize|reopened|ready_for_review)(?![\w-]) )*+ [^\]\s,'"]
                        | (?: \s*+ - [ \t]*+ ["']?(?:opened|edited|synchronize|reopened|ready_for_review)["']? [ \t]*+ (?:\#[^\n]*+)? (?=\n|$) )*+
                          \s*+ - [ \t]*+ (?! ["']?(?:opened|edited|synchronize|reopened|ready_for_review)["']? [ \t]*+ (?:\#|\n|$) ) \S
                        | ["']? (?! (?:opened|edited|synchronize|reopened|ready_for_review)["']? [ \t]*+ (?:\#|\n|$) ) [a-z] )
          # The discussion's text, on a comment on it or a discussion event other than
          # created or edited.
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.discussion\.(?:title|body)|toJSON\(\s*github\.event(?:\.discussion)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY: $ON
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $ON
                  regex: (?s)(?:.*?(?<![\w-])discussion_comment(?![\w-])|^["']?discussion["']?\s*$|\[.*?(?<![\w-])discussion(?![\w-])|-.*?(?<![\w-])discussion(?![\w-]))
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.discussion\.(?:title|body)|toJSON\(\s*github\.event(?:\.discussion)?\s*\))(?!\w)
              - pattern-inside: |
                  $ONKEY:
                    ...
                    discussion: $T
                    ...
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    (?xs) ^ (?: (?! .*? (?<![\w-])types[ \t]*+: )
                              | .*? (?<![\w-])types [ \t]*+ : [ \t]*+
                                (?: \[ (?: [\s,'"] | (?:created|edited)(?![\w-]) )*+ [^\]\s,'"]
                                  | (?: \s*+ - [ \t]*+ ["']?(?:created|edited)["']? [ \t]*+ (?:\#[^\n]*+)? (?=\n|$) )*+
                                    \s*+ - [ \t]*+ (?! ["']?(?:created|edited)["']? [ \t]*+ (?:\#|\n|$) ) \S
                                  | ["']? (?! (?:created|edited)["']? [ \t]*+ (?:\#|\n|$) ) [a-z] ) )
          # Any untrusted text on any of these triggers, for agents with no write-access
          # check: run-gemini-cli, claude-code-base-action, CLIs, and claude-code-action or
          # codex-action with the check turned off for everyone.
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: |-
                    (?xs) .*? \$\{\{ (?:(?!\}\}).)*? (?<![\w.])
                    (?: github\.event\.
                        (?: issue\.(?:title|body)
                          | pull_request\.(?:title|body|head\.(?:ref|label))
                          | (?:comment|review|review_comment)\.body
                          | discussion\.(?:title|body)
                          | workflow_run\.(?:head_branch|display_title|head_commit\.(?:message|author\.(?:name|email))) )
                      | github\.head_ref
                      | toJSON\( \s* github\.event
                          (?: \.(?:issue|pull_request|comment|review|review_comment|discussion|workflow_run) )? \s* \) )
                    (?!\w)
              - pattern-inside: |
                  $ONKEY: $ON
                  ...
                  jobs: $_
              - metavariable-regex:
                  metavariable: $ONKEY
                  regex: ^["']?on["']?$
              - metavariable-regex:
                  metavariable: $ON
                  regex: (?s).*?(?<![\w-])(?:issues|issue_comment|discussion|discussion_comment|pull_request_target|pull_request_review|pull_request_review_comment|workflow_run)(?![\w-])
              # No if: in the step or job that checks the commenter's author_association.
              - pattern-either:
                  - patterns:
                      - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
                      - pattern-not-inside: |
                          if: $C
                          ...
                  - patterns:
                      - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
                      - pattern-inside: |
                          if: $C
                          ...
                      - metavariable-regex:
                          metavariable: $C
                          regex: (?s)^(?!.*author_association)
              # Not an action that checks the actor's write access, unless the check is off:
              # claude-code-action reads allowed_non_write_users only when github_token is also
              # passed, allowed_bots "*" lets any GitHub App start it, and codex-action takes
              # allow-users "*". One comparison over the action and its with: block (five
              # re-binding branches here cost about a second on a 2,400-line workflow). The
              # regexes avoid backslashes and double quotes; "." stands for the quote.
              - pattern-either:
                  - patterns:
                      - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
                      - pattern-not-inside: |
                          uses: $A
                          ...
                  - patterns:
                      - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
                      - pattern-inside: |
                          uses: $A
                          ...
                          with: $WITH
                          ...
                      - metavariable-comparison:
                          comparison: >-
                            not re.match("^.?(?:anthropics/claude-code-action|openai/codex-action)@", str($A))
                            or re.match("(?s)(?=.*(?<![A-Za-z0-9_-])allowed_non_write_users[ ]*:[ ]*.[*].)(?=.*(?<![A-Za-z0-9_-])github_token[ ]*:)", str($WITH))
                            or re.match("(?s).*(?<![A-Za-z0-9_-])(?:allowed_bots|allow-users)[ ]*:[ ]*.[*].", str($WITH))
      # ---------------------------------------------------------------------------------------
      # 3. A same-repository guard (if: on head.repo or workflow_run.head_repository) means
      #    the pull request's own text comes from someone with write access.
      # ---------------------------------------------------------------------------------------
      - pattern-either:
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - pattern-not-inside: |
                  if: $C
                  ...
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - pattern-inside: |
                  if: $C
                  ...
              - metavariable-regex:
                  metavariable: $C
                  regex: (?s)^(?!.*(?:head\.repo|head_repository)\.(?:full_name|fork))
          # Text that is not the pull request's own (an issue, a comment, a review).
          - patterns:
              - pattern-either: [{pattern: 'prompt: $SRC'}, {pattern: 'run: $SRC'}, {patterns: [{pattern-inside: "env:\n  ...\n  $KEY: $SRC\n  ...\n"}, {pattern: '$KEY: $SRC'}]}]
              - metavariable-regex:
                  metavariable: $SRC
                  regex: (?s).*?\$\{\{(?:(?!\}\}).)*?(?<![\w.])(?:github\.event\.(?:issue\.(?:title|body)|(?:comment|review|review_comment)\.body|discussion\.(?:title|body))|toJSON\(\s*github\.event(?:\.(?:issue|comment|review|review_comment|discussion))?\s*\))(?!\w)
      - focus-metavariable: $SRC
