rules:
  - id: codex-hook-auto-approves
    # Generated by scripts/gen_agent_hooks.py, which holds the read-only tool list, command
    # test, and `if` filter test shared by the hook auto-approval rules, and the SDK, client,
    # and docs versions they were checked against. Edit the script and run scripts/build.py;
    # build.py --check fails if this file drifts.
    languages: [json]
    severity: ERROR
    message: >-
      This Codex hook approves every request it is registered for: its PermissionRequest command
      only prints a fixed `decision: {"behavior": "allow"}`, and its matcher covers every tool
      or one that runs commands, writes files, or calls an MCP server. Codex runs
      PermissionRequest hooks before it shows the approval prompt or the auto-reviewer, and an
      allow answers the request (Codex 0.164), so commands that ask to leave the sandbox,
      network access, patches, and MCP tool calls go through without anyone seeing them. Codex
      asks each developer to trust a project hook once, pinned by its hash; from then on the
      hook approves for them. A prompt injection in any file, issue, web page, or tool result
      the agent reads can then run commands or change files with the developer's credentials.
      Approve the specific commands you trust with prefix rules in .codex/rules, or have a hook
      script check the request and print allow only for calls it has verified, returning nothing
      for the rest.
    paths:
      include:
        # Codex reads hooks.json next to each config layer: ~/.codex/ and every .codex/ folder
        # from the repo root down. Plugin hooks/hooks.json files are scanned by
        # claude-settings-hook-auto-approves, which reads PermissionRequest the same way.
        - ".codex/hooks.json"
        # Plugin manifests with inline hooks: .codex-plugin/plugin.json, or plugin.json at the
        # plugin root (the open agent plugin format). Codex also reads
        # .claude-plugin/plugin.json, which claude-settings-hook-auto-approves scans.
        - "plugin.json"
      exclude:
        - ".claude-plugin/plugin.json"
    # Hooks that run a script, and prompt, agent, http, and mcp_tool hooks, decide at run time
    # and are left alone; agent-hook-runs-local-script reports repo scripts.
    patterns:
      - pattern-either:
          # Codex answers the approval with a PermissionRequest allow; a PreToolUse allow
          # only rewrites the input.
          - patterns:
              - pattern-either:
                  - pattern-inside: '"PermissionRequest": [...]'
              - pattern-either:
                  # Shell form: the command line prints the decision and nothing in it could decide
                  # otherwise.
                  - patterns:
                      - pattern-either:
                          - pattern: '{..., "type": "command", "command": "$OUT", ...}'
                          - pattern: '{..., "type": "command", "commandWindows": "$OUT", ...}'
                      - metavariable-regex:
                          metavariable: $OUT
                          regex: |-
                            (?x)
                            # Grants permission.
                            (?= .*? (?: permissionDecision | behavior ) \\*+ ["']? \s*+ : \s*+ \\*+ ["']? allow \b
                                  | .*? \b decision \\*+ ["']? \s*+ : \s*+ \\*+ ["']? approve \b )
                            # ... with nothing that could decide otherwise.
                            (?! .*? (?: \b (?: if | then | elif | case | while | until | test | grep ) \b
                                      | && | \|\| (?! \s*+ (?: true | : ) \b ) | \[ \[? \s | \bjq \s++ -\w*e
                                      | select \( | \$ \( | ` | \b (?: deny | ask | block | defer ) \b
                                      | \b exit \s++ 2 \b ) )
              - pattern-either:
                  # A matcher that reaches more than read-only tools.
                  - patterns:
                      - pattern-inside: '{..., "matcher": "$MS", ...}'
                      - metavariable-regex:
                          metavariable: $MS
                          regex: |-
                            (?x)
                            (?(DEFINE)
                              (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                            )
                            ^ (?!  (?: \s*+ (?&safe) (?: \s*+ [|,] \s*+ (?&safe) )*+ \s*+ | \^ \(? (?: \?: )? (?&safe) (?: \| (?&safe) )*+ \)? \$ )  $ )
                  # A Claude-style group with no matcher: every tool.
                  - patterns:
                      - pattern-inside: '{..., "hooks": [...], ...}'
                      - pattern-not-inside: '{..., "matcher": $ANY, ...}'
      - focus-metavariable: $OUT
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-aisvs:
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
        - "AML.T0112.000 - Machine Compromise: Local AI Agent"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      technology: [codex]
      references:
        - https://developers.openai.com/codex/hooks
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/hooks/src/events/permission_request.rs
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/core/src/tools/approvals.rs
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/hooks/src/engine/discovery.rs
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
