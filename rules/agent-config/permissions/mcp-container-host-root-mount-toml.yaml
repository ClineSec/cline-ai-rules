rules:
  - id: mcp-container-host-root-mount-toml
    # Regex, not a parser: OpenGrep has no TOML support.
    # Generated by scripts/gen_mcp_filesystem_root.py, which holds the root and docker mount
    # regexes shared by the mcp-filesystem-root-too-broad and mcp-container-host-root-mount rules,
    # and takes the file paths from scripts/gen_mcp_unpinned.py. Edit the script and run
    # scripts/build.py; build.py --check fails if this file drifts.
    languages: [regex]
    severity: WARNING
    message: >-
      This MCP server runs in a container with the host's whole disk or a whole home directory
      bind-mounted into it (/, a drive such as C:\, /Users or /home, or one user's home: the
      HOME or USERPROFILE variable, /Users/<name>, /home/<name>). Every tool the server has
      that reads files, follows a path, or runs a command then reaches the host's SSH keys,
      cloud and registry credentials, shell profiles and other projects, and, since a
      container runs as root unless told otherwise, files only root can read. A prompt
      injection in anything the agent reads can steer those tools there. Read-only still
      exposes every secret; a writable mount also lets the container plant a command in a
      shell profile or cron file and so escape to the host. Mount only the folders the server
      needs (the project folder, a data folder), read-only where it only reads.
    paths:
      include:
        # Codex: ~/.codex/config.toml, and .codex/config.toml in a trusted project.
        - ".codex/config.toml"
    patterns:
      # $SRV is one server's keys.
      - pattern-either:
          # [mcp_servers.<name>]: its keys up to the next table header. Sub-tables such as
          # [mcp_servers.<name>.env] start their own header and are not matched.
          - pattern-regex: (?m)^[ \t]*\[[ \t]*mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<SRV>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          # Servers inside the [mcp_servers] table ...
          - patterns:
              - pattern-regex: (?m)^[ \t]*\[[ \t]*mcp_servers[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
              - metavariable-pattern:
                  metavariable: $TABLE
                  language: regex
                  pattern-either:
                    # Inline tables: <name> = { ... }.
                    - pattern-regex: (?m)^[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*=[ \t]*(?<SRV>\{[^\n]*\})
                    # Dotted keys: <name>.command = ... $SRV starts at each command or args
                    # line and runs to the next header; the server match ties both keys to
                    # the same name.
                    - pattern-regex: (?m)^[ \t]*(?=(?<SRV>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?:command|args)[ \t]*=(?s:.*)))[^\n]*
          # ... and before the first table header: mcp_servers.<name> = { ... } or
          # mcp_servers.<name>.command = ...
          - patterns:
              - pattern-regex: \A(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
              - metavariable-pattern:
                  metavariable: $TABLE
                  language: regex
                  pattern-either:
                    - pattern-regex: (?m)^[ \t]*mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*=[ \t]*(?<SRV>\{[^\n]*\})
                    - pattern-regex: (?m)^[ \t]*(?=(?<SRV>mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?:command|args)[ \t]*=(?s:.*)))[^\n]*
      # Drops candidate matches that bound no server; without it the metavariable-pattern
      # below reports "$SRV is not in scope" as an engine error.
      - metavariable-regex:
          metavariable: $SRV
          regex: (?s).
      # enabled = false: Codex skips the server (for dotted keys, only that server's key counts).
      - metavariable-regex:
          metavariable: $SRV
          regex: (?s)\A(?=[ \t]*(?<p>(?:(?:mcp_servers[ \t]*\.[ \t]*)?(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?=(?:command|args)[ \t]*=))?))(?!.*?(?:\A|[\n{,])[ \t]*\k<p>enabled[ \t]*=[ \t]*false\b)
      - metavariable-pattern:
          metavariable: $SRV
          language: regex
          patterns:
            - pattern-either:
                # docker run (or podman) with a host folder bind-mounted among the options before the
                # image: -v <host>:<path>, --volume, or --mount type=bind,src=<host>,dst=<path>.
                - patterns:
                    - pattern-regex: (?ms)\A(?=[ \t]*(?<P>(?:(?:mcp_servers[ \t]*\.[ \t]*)?(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?=(?:command|args)[ \t]*=))?))(?=.*?(?:^|[{,])[ \t]*\k<P>command[ \t]*=[ \t]*["'](?<CMD>[^"'\n]*)["']).*?(?:^|[{,])[ \t]*\k<P>args[ \t]*=[ \t]*(?<ARGS>\[(?:"(?:[^"\\\n]|\\.)*"|'[^'\n]*'|\#[^\n]*|[^\]"'\#])*\])
                    - metavariable-regex:
                        metavariable: $CMD
                        regex: |-
                          (?i)^["']?(?:[^"']*[/\\])?(?:docker|podman)(?:\.exe)?["']?$
                    - metavariable-regex:
                        metavariable: $ARGS
                        regex: |-
                          (?sx)
                          (?(DEFINE)
                            # Shared tokens. An element is a "double", 'single' or plain (YAML) scalar; elements are
                            # separated by , or a YAML "- " bullet, with //, /* */ or # comments in between.
                            (?<sep> (?: \s | //[^\n]* | /\*(?:(?!\*/).)*\*/ | \#[^\n]* )*+ )
                            (?<nx> (?&sep) (?: , | -(?=\s) ) (?&sep) )
                            (?<o> ["']?+ )
                            (?<c> ["'] | (?= [ \t]*+ (?:[,\]\r\n]|\z) | [ \t]+\# ) )
                            (?<el> "(?:[^"\\]|\\.)*+" | '(?:[^']|'')*+'
                              | (?!["'\[\]{},\#\s]) [^\r\n,\]]*? (?= [ \t]*+ (?:[,\]\r\n]|\z) | [ \t]+\# ) )

                            # A path separator: / or \, which JSON, TOML basic strings and YAML double-quoted strings
                            # write doubled. A single backslash before " escapes the quote (src=\"$PWD\" in a shell line).
                            (?<ps> / | \\\\ | \\(?!") )
                            # One user's folder name. Shared folders (/Users/Shared, C:\Users\Public) aren't a home.
                            (?<uname> (?! (?i: Shared | Public | Default | Default\x20User | All\x20Users ) (?! [\w.-] ) )
                              (?: (?!) | [^/\\"'\s,\[\]:\#$]++ (?: [ \t]++ [^/\\"'\s,\[\]:\#]++ )*+ ) )
                            # The user's whole home directory, however the config spells it.
                            (?<home> ~ |  (?i: %USERPROFILE% | %HOMEDRIVE%%HOMEPATH% )
                              | (?: /mnt/[A-Za-z] | [A-Za-z]: )?+ (?&ps) (?i: users | home ) (?&ps) (?&uname)
                              | /root | /var/root )
                            # An allowed directory that is a home, every user's home (/Users, /home), a drive (C:, C:\,
                            # WSL's /mnt/c), or the root (/), with or without a trailing separator.
                            (?<root> (?: (?&home) | (?: /mnt/[A-Za-z] | [A-Za-z]: )?+ (?&ps) (?i: users | home )
                                | /mnt/[A-Za-z] | [A-Za-z]: ) (?&ps)?+
                              | (?&ps)++ )
                            # The filesystem server named in a runner's arguments: the npm package (or its npm: spec for
                            # deno), a bin name (also an older npm copy published as mcp-server-filesystem; a scoped name
                            # such as @other/mcp-server-filesystem is another package), the Go module, or a local
                            # build's dist/index.js.
                            (?<fspkg> (?:npm:)?+ @modelcontextprotocol/server-filesystem (?: @[^"'\s,\]]*+ )?+
                              | github\.com/mark3labs/mcp-filesystem-server (?: @[^"'\s,\]]*+ )?+
                              | (?: (?!@) [^"'\r\n,\]]* (?&ps) )? (?: mcp-server-filesystem | mcp-filesystem-server | rust-mcp-filesystem )
                                (?: @[^"'\s,\]]*+ | \.cmd | \.exe )?+
                              | [^"'\r\n,\]]*? (?&ps) (?: @modelcontextprotocol (?&ps) server-filesystem
                                | servers (?&ps) src (?&ps) filesystem ) (?&ps) dist (?&ps) index\.js )
                            # The filesystem server's container image, with an optional tag or digest.
                            (?<image> (?: (?: (?:docker\.io|index\.docker\.io)/ )?+ mcp/filesystem
                              | ghcr\.io/mark3labs/mcp-filesystem-server ) (?: :[\w.-]++ )?+ (?: @sha256:[0-9a-fA-F]++ )?+ )
                            # docker run's boolean long options (Docker 28.3); every other long option takes a value,
                            # and so do the short options -a -c -e -h -l -m -p -u -v -w.
                            (?<boolopt> (?: --rm|--init|--interactive|--tty|--privileged|--read-only|--detach
                              |--publish-all|--no-healthcheck|--oom-kill-disable|--disable-content-trust|--quiet
                              |--sig-proxy|--help|--use-api-socket ) (?![\w-]) )
                            (?<opt> (?=(?&o)(?&boolopt)(?&c)) (?&el)
                              | (?=(?&o)--[\w-]+=) (?&el)
                              | (?!(?&o)(?&boolopt)(?&c)) (?=(?&o)--[\w-]+(?&c)) (?&el) (?&nx) (?&el)
                              | (?=(?&o)-[dPiqt]*[acehlmpuvw](?&c)) (?&el) (?&nx) (?&el)
                              | (?!(?&o)-[dPiqt]*[acehlmpuvw](?&c)) (?=(?&o)-[^-"'\s]) (?&el) )
                          )
                          ^ (?: \[ (?&sep) | -(?=\s) (?&sep) )
                          (?: (?=(?&o)container(?&c)) (?&el) (?&nx) )?
                          (?=(?&o)run(?&c)) (?&el) (?&nx)
                          (?: (?&opt) (?&nx) )*?
                          (?| (?: (?=(?&o)(?:-v|--volume)(?&c)) (?&el) (?&nx) (?&o) | (?&o)--volume= )
                              (?!~) (?<ROOT>(?&root)) (?=:)
                            | (?: (?=(?&o)--mount(?&c)) (?&el) (?&nx) (?&o) | (?&o)--mount= )
                              (?: [^"'\s\]\#]*? , )?? (?i:src|source)= (?!~) (?<ROOT>(?&root)) (?= [,"'\s\]] | \z ) )
                          # A filesystem server image: mcp-filesystem-root-too-broad reports it.
                          (?! (?s:.*?) (?&nx) (?&o) (?&image) (?&c) )
                # A shell given the whole command line: "bash", ["-c", "docker run -v $HOME:/h ..."].
                # The shell expands $HOME itself.
                - patterns:
                    - pattern-regex: (?ms)\A(?=[ \t]*(?<P>(?:(?:mcp_servers[ \t]*\.[ \t]*)?(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?=(?:command|args)[ \t]*=))?))(?=.*?(?:^|[{,])[ \t]*\k<P>command[ \t]*=[ \t]*["'](?<CMD>[^"'\n]*)["']).*?(?:^|[{,])[ \t]*\k<P>args[ \t]*=[ \t]*(?<ARGS>\[(?:"(?:[^"\\\n]|\\.)*"|'[^'\n]*'|\#[^\n]*|[^\]"'\#])*\])
                    - metavariable-regex:
                        metavariable: $CMD
                        regex: |-
                          (?i)^["']?(?:[^"']*[/\\])?(?:(?:ba|z|da|k)?sh|cmd|pwsh|powershell)(?:\.exe)?["']?$
                    - metavariable-pattern:
                        metavariable: $ARGS
                        language: regex
                        patterns:
                          - pattern-either:
                              - pattern-regex: |-
                                  "(?<S>(?:[^"\\\n]|\\.)*)"
                              - pattern-regex: |-
                                  '(?<S>[^'\n]*)'
                          - metavariable-regex:
                              metavariable: $S
                              regex: |-
                                (?x)
                                (?(DEFINE)

                                  # A path separator: / or \, which JSON, TOML basic strings and YAML double-quoted strings
                                  # write doubled. A single backslash before " escapes the quote (src=\"$PWD\" in a shell line).
                                  (?<ps> / | \\\\ | \\(?!") )
                                  # One user's folder name. Shared folders (/Users/Shared, C:\Users\Public) aren't a home.
                                  (?<uname> (?! (?i: Shared | Public | Default | Default\x20User | All\x20Users ) (?! [\w.-] ) )
                                    (?: \$ (?:USER|USERNAME) \b | \$\{ (?:USER|USERNAME) \} | \$env: (?:USER|USERNAME) \b
                                    | \$\{env: (?:USER|USERNAME) \} | (?!) | [^/\\"'\s,\[\]:\#;&|`$]++ ) )
                                  # The user's whole home directory, however the config spells it.
                                  (?<home> ~ | \$HOME\b | \$\{ (?:HOME|USERPROFILE) \} | \$env: (?:HOME|USERPROFILE) \b
                                    | \$\{env: (?:HOME|USERPROFILE) \} | (?i: %USERPROFILE% | %HOMEDRIVE%%HOMEPATH% )
                                    | (?: /mnt/[A-Za-z] | [A-Za-z]: )?+ (?&ps) (?i: users | home ) (?&ps) (?&uname)
                                    | /root | /var/root )
                                  # An allowed directory that is a home, every user's home (/Users, /home), a drive (C:, C:\,
                                  # WSL's /mnt/c), or the root (/), with or without a trailing separator.
                                  (?<root> (?: (?&home) | (?: /mnt/[A-Za-z] | [A-Za-z]: )?+ (?&ps) (?i: users | home )
                                      | /mnt/[A-Za-z] | [A-Za-z]: ) (?&ps)?+
                                    | (?&ps)++ )
                                  # The filesystem server named in a runner's arguments: the npm package (or its npm: spec for
                                  # deno), a bin name (also an older npm copy published as mcp-server-filesystem; a scoped name
                                  # such as @other/mcp-server-filesystem is another package), the Go module, or a local
                                  # build's dist/index.js.
                                  (?<fspkg> (?:npm:)?+ @modelcontextprotocol/server-filesystem (?: @[^"'\s,\]]*+ )?+
                                    | github\.com/mark3labs/mcp-filesystem-server (?: @[^"'\s,\]]*+ )?+
                                    | (?: (?!@) [^"'\r\n,\]]* (?&ps) )? (?: mcp-server-filesystem | mcp-filesystem-server | rust-mcp-filesystem )
                                      (?: @[^"'\s,\]]*+ | \.cmd | \.exe )?+
                                    | [^"'\r\n,\]]*? (?&ps) (?: @modelcontextprotocol (?&ps) server-filesystem
                                      | servers (?&ps) src (?&ps) filesystem ) (?&ps) dist (?&ps) index\.js )
                                  # The filesystem server's container image, with an optional tag or digest.
                                  (?<image> (?: (?: (?:docker\.io|index\.docker\.io)/ )?+ mcp/filesystem
                                    | ghcr\.io/mark3labs/mcp-filesystem-server ) (?: :[\w.-]++ )?+ (?: @sha256:[0-9a-fA-F]++ )?+ )
                                  # One shell word, with any quoted parts (JSON text escapes a quote as \").
                                  (?<w> (?: \\?+["'] [^"'\r\n\\]*+ \\?+["'] | [^\s;&|`()<>"'\\] )++ )
                                  (?<we> (?= [\s;&|)`] | \\?+["'] | $ ) )
                                  (?<docker> (?<! [\w.-] ) (?:docker|podman) (?:\.exe)?+ [ \t]++ (?:container [ \t]++)?+ run (?&we)
                                    (?: [ \t]++ (?&w) )*? [ \t]++ )
                                  # The rest of a mount word, then the filesystem image as a later word.
                                  (?<imagelater> [^\s;&|]*+ (?: [ \t]++ (?&w) )*? [ \t]++ (?:\\?+["'])?+ (?&image) (?&we) )
                                )
                                .*?
                                (?| (?&docker) (?:-v|--volume) (?: [ \t]++ | = ) (?:\\?+["'])?+ (?<ROOT>(?&root)) (?=:) (?!(?&imagelater))
                                  | (?&docker) --mount (?: [ \t]++ | = ) (?:\\?+["'])?+ (?: [^\s"',;&|\\]*? , )??
                                    (?i:src|source)= (?<ROOT>(?&root)) (?= [,\s;&|"'\\] | $ ) (?!(?&imagelater)) )
      - focus-metavariable: $ROOT
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-mcp:
        - "MCP02:2025 - Privilege Escalation via Scope Creep"
      owasp-aisvs:
        - "v1.01-C9.3.1 - Component Isolation and Tool Authorization"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
        - "AML.T0037 - Data from Local System"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      # A match always gives the container the whole disk or a whole home; whether the agent
      # can reach it depends on the server's tools, which config doesn't show.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, docker, codex]
      references:
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP02-2025%E2%80%93Privilege-Escalation-via-Scope-Creep.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
        - https://docs.docker.com/engine/storage/bind-mounts/
        - https://docs.docker.com/reference/cli/docker/container/run/
        - https://learn.chatgpt.com/docs/extend/mcp?surface=cli
        - https://github.com/openai/codex/blob/342ed69a174c206c1de52a59491b131e0753cfa5/codex-rs/config/src/mcp_types.rs
