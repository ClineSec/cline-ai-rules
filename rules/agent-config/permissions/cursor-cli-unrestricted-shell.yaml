rules:
  - id: cursor-cli-unrestricted-shell
    languages: [json]
    severity: ERROR
    message: >-
      This Cursor CLI permission lets the agent run any shell command without asking:
      Shell(...) entries in "permissions.allow" match the command's first word with globs, so
      Shell(*) matches every command. A prompt injection in a file, rule, issue, web page, or
      tool result the agent reads can then execute arbitrary commands with the developer's
      credentials. Cursor CLI up to 2025.08.09 applied a project's .cursor/cli.json allowlist
      automatically (CVE-2025-61592), and Cursor's current docs again list permissions as the
      setting a project can configure. Allow specific commands instead, such as Shell(git) or
      Shell(npm:test), and keep broad allows out of committed config.
    paths:
      include:
        - ".cursor/cli.json"
        # The global file, in dotfiles repos or when CURSOR_CONFIG_DIR points at a repo folder.
        - ".cursor/cli-config.json"
        - "cursor/cli-config.json"
    patterns:
      - pattern-inside: '"permissions": {...}'
      - pattern-inside: '"allow": [...]'
      - pattern: '"$ENTRY"'
      # Shell(*), Shell(**), and the command:args form with a wildcard command (Shell(*:*)).
      # Named commands are left alone, including shells, because how Cursor treats the command
      # inside `bash -c "..."` is not documented.
      - metavariable-regex:
          metavariable: $ENTRY
          regex: ^\s*Shell\(\s*\*{1,2}\s*(:\s*\*{0,2}\s*)?\)\s*$
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-aisvs:
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
        - "AML.T0112.000 - Machine Compromise: Local AI Agent"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      # MEDIUM: the 2025 fix notes say project allowlists were removed, while the current docs
      # list permissions as the project-level setting; old CLIs honour them either way.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [cursor]
      references:
        - https://cursor.com/docs/cli/reference/permissions
        - https://cursor.com/docs/cli/reference/configuration
        - https://github.com/cursor/cursor/security/advisories/GHSA-v64q-396f-7m79
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
