rules:
  - id: mcp-config-auto-approve-toml
    # Regex, not a parser: OpenGrep has no TOML support.
    # Generated by scripts/gen_mcp_auto_approve.py, which holds the tool-name test shared by the
    # MCP auto-approval rules. Edit the script and run scripts/build.py; build.py --check fails if
    # this file drifts.
    languages: [regex]
    severity: WARNING
    message: >-
      This Codex config lets the agent call MCP tools without asking. default_tools_approval_mode
      = "approve" approves every tool of the server, and approval_mode = "approve" on a tool
      whose name says it writes, deletes, sends, merges, or runs something approves that
      action (Codex rust-v0.164.0, in a trusted project's .codex/config.toml). Codex writes
      approval_mode = "approve" back into the project file when someone picks "always allow",
      so these lines reach the repository without anyone deciding to share them.
      A prompt injection in a file, issue, web page, or tool result the agent reads can then
      make it use those tools (push code, post messages, change records, run commands) with
      the developer's credentials, for everyone who opens the project. Use "auto" (asks
      unless the tool says it is read-only and harmless) or "writes", approve only read-only
      tools, and keep personal approvals in ~/.codex/config.toml.
    paths:
      include:
        # Codex: ~/.codex/config.toml, and .codex/config.toml in a trusted project.
        - ".codex/config.toml"
    pattern-either:
      # default_tools_approval_mode = "approve": every tool of the server.
      # In an [mcp_servers...] table.
      - patterns:
          - pattern-regex: |-
              (?m)^[ \t]*\[[ \t]*mcp_servers(?:(?:[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))*)[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          - metavariable-pattern:
              metavariable: $TABLE
              language: regex
              patterns:
                - pattern-regex: |-
                    (?m)(?:^|\G)(?:[^"'\#\n]|"(?:[^"\\\n]|\\.)*+"|'[^'\n]*+')*?(?<![\w-])(?<A>default_tools_approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
          - focus-metavariable: $A
      # Before the first table: mcp_servers.<name>... keys.
      - patterns:
          - pattern-regex: |-
              \A(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          - metavariable-pattern:
              metavariable: $TABLE
              language: regex
              patterns:
                - pattern-regex: |-
                    (?m)^[ \t]*mcp_servers[ \t]*\.[ \t]*[^\n]*?(?<![\w-])(?<A>default_tools_approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
          - focus-metavariable: $A
      # approval_mode = "approve" on a tool whose name is an action.
      # [mcp_servers.<server>.tools.<tool>] names the tool in the header.
      - patterns:
          - pattern-regex: |-
              (?m)^[ \t]*\[[ \t]*mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*tools[ \t]*\.[ \t]*(?<T>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          - metavariable-regex:
              metavariable: $T
              regex: |-
                (?x)
                (?(DEFINE)
                  (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                  (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                  (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                  (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                )
                ^ ["']?+ (?: (?! (?&read) ) [^*?"'] )*? (?: [*?] | (?&act) )
          - metavariable-pattern:
              metavariable: $TABLE
              language: regex
              patterns:
                - pattern-regex: |-
                    (?m)^[ \t]*(?<A>approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
          - focus-metavariable: $A
      # Dotted or inline tool keys in an [mcp_servers...] table.
      - patterns:
          - pattern-regex: |-
              (?m)^[ \t]*\[[ \t]*mcp_servers(?:(?:[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))*)[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          - metavariable-pattern:
              metavariable: $TABLE
              language: regex
              patterns:
                - pattern-either:
                    - pattern-regex: |-
                        (?m)(?:^|\G)(?:[^"'\#\n]|"(?:[^"\\\n]|\\.)*+"|'[^'\n]*+')*?(?<![\w"'-])(?<A>(?<T>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))[ \t]*\.[ \t]*approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
                    - pattern-regex: |-
                        (?m)(?:^|\G)(?:[^"'\#\n]|"(?:[^"\\\n]|\\.)*+"|'[^'\n]*+')*?(?<![\w"'-])(?<A>(?<T>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))[ \t]*=[ \t]*\{[^{}\n]*?(?<![\w-])approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
                - metavariable-regex:
                    metavariable: $T
                    regex: |-
                      (?x)
                      (?(DEFINE)
                        (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                        (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                        (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                        (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                      )
                      ^ ["']?+ (?: (?! (?&read) ) [^*?"'] )*? (?: [*?] | (?&act) )
          - focus-metavariable: $A
      # ... or before the first table, on mcp_servers.<name> lines.
      - patterns:
          - pattern-regex: |-
              \A(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          - metavariable-pattern:
              metavariable: $TABLE
              language: regex
              patterns:
                - pattern-either:
                    - pattern-regex: |-
                        (?m)(?=^[ \t]*mcp_servers[ \t]*\.[ \t]*)(?:^|\G)(?:[^"'\#\n]|"(?:[^"\\\n]|\\.)*+"|'[^'\n]*+')*?(?<![\w"'-])(?<A>(?<T>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))[ \t]*\.[ \t]*approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
                    - pattern-regex: |-
                        (?m)(?=^[ \t]*mcp_servers[ \t]*\.[ \t]*)(?:^|\G)(?:[^"'\#\n]|"(?:[^"\\\n]|\\.)*+"|'[^'\n]*+')*?(?<![\w"'-])(?<A>(?<T>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+))[ \t]*=[ \t]*\{[^{}\n]*?(?<![\w-])approval_mode[ \t]*=[ \t]*(?:"approve"|'approve'))
                - metavariable-regex:
                    metavariable: $T
                    regex: |-
                      (?x)
                      (?(DEFINE)
                        (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                        (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                        (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                        (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                      )
                      ^ ["']?+ (?: (?! (?&read) ) [^*?"'] )*? (?: [*?] | (?&act) )
          - focus-metavariable: $A
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-mcp:
        - "MCP02:2025 - Privilege Escalation via Scope Creep"
      owasp-aisvs:
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      # Whole-server approvals are certain; a named tool is judged by the words in its name,
      # which can't see what a server's tool really does.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, codex]
      references:
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP02-2025%E2%80%93Privilege-Escalation-via-Scope-Creep.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/config/src/mcp_types.rs
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/core/src/mcp_tool_call.rs
        - https://learn.chatgpt.com/docs/extend/mcp?surface=cli
