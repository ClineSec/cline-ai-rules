rules:
  - id: mcp-config-auto-approve
    # Generated by scripts/gen_mcp_auto_approve.py, which holds the tool-name test shared by the
    # MCP auto-approval rules. Edit the script and run scripts/build.py; build.py --check fails if
    # this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This MCP config lets the agent call a server's tools without asking. "*" in Roo Code's
      alwaysAllow or Kiro's autoApprove approves every tool of the server, and a listed tool
      whose name says it writes, deletes, sends, merges, or runs something approves that
      action. In Gemini CLI, "trust": true skips every confirmation for the server, and so do
      tools.allowed entries such as "mcp_github_*" (or "mcp_*" for all servers), any
      mcp.allowed entry (which also approves the server's tools, not only its connection), and
      mcp.autoAllowInHeadless in non-interactive runs. Roo Code applies alwaysAllow once the
      user turns on auto-approval for MCP, and Gemini CLI applies a project's settings once
      the folder is trusted.
      A prompt injection in a file, issue, web page, or tool result the agent reads can then
      make it use those tools (push code, post messages, change records, run commands) with
      the developer's credentials, for everyone who opens the project. Leave approval on for
      tools that change things, and pre-approve only named read-only tools (read_file,
      list_issues) or keep approvals in your own user settings.
    paths:
      include:
        # Claude Code project scope and plugins; also VS Code's portable workspace-root file.
        - ".mcp.json"
        # Cursor (.cursor/mcp.json, ~/.cursor/mcp.json), VS Code (.vscode/mcp.json and the user
        # profile's mcp.json), and other clients that use the same file name.
        - "mcp.json"
        # Claude Code user and local scope, and the administrator-managed file.
        - ".claude.json"
        - "managed-mcp.json"
        # Claude Code plugins can declare servers inline in the manifest or a marketplace entry.
        - ".claude-plugin/plugin.json"
        - ".claude-plugin/marketplace.json"
        - "claude_desktop_config.json"
        # Cline (VS Code extension global storage and ~/.cline/data/settings/).
        - "cline_mcp_settings.json"
        # Windsurf / Devin Desktop (~/.codeium/windsurf/, ~/.config/devin/).
        - "mcp_config.json"
        # GitHub Copilot CLI (~/.copilot/mcp-config.json), which VS Code also writes.
        - "mcp-config.json"
        # Gemini CLI settings and extension manifests.
        - ".gemini/settings.json"
        - "gemini-extension.json"
        # Zed: context_servers in project settings and the user's ~/.config/zed/settings.json
        # (Zed v1.25.2).
        - ".zed/settings.json"
        - ".config/zed/settings.json"
        # VS Code dev containers: customizations.vscode.mcp.servers.
        - ".devcontainer/devcontainer.json"
        - ".devcontainer.json"
        - ".devcontainer/*/devcontainer.json"
        # Continue reads any JSON file in .continue/mcpServers/ (Claude, Cursor or one-server
        # format), workspace or home, at any depth.
        - ".continue/mcpServers/**/*.json"
      exclude:
        # Continue skips these two names in .continue/mcpServers/.
        - ".continue/mcpServers/**/config.json"
        - ".continue/mcpServers/**/settings.json"
    pattern-either:
      # Per-server keys: an alwaysAllow / autoApprove entry, or Gemini CLI's trust.
      - patterns:
          # "mcpServers" in most clients, "servers" in VS Code, "context_servers" in Zed. Continue
          # also accepts a file holding one server at its root.
          - pattern-either:
              - pattern-inside: '"mcpServers": {...}'
              - pattern-inside: '"servers": {...}'
              - pattern-inside: '"context_servers": {...}'
              - patterns:
                  - pattern-inside: '{..., "command": $X, ...}'
                  - pattern-not-inside: '"$K": {..., "command": $Y, ...}'
                  - pattern-not-inside: '[..., {..., "command": $Y, ...}, ...]'
          - pattern-either:
              - patterns:
                  - pattern: '"$K": [..., "$V", ...]'
                  - metavariable-regex:
                      metavariable: $K
                      regex: ^"(?:alwaysAllow|autoApprove)"$
                  - metavariable-regex:
                      metavariable: $V
                      regex: |-
                        (?x)
                        (?(DEFINE)
                          (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                          (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                          (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                          (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                        )
                        ^ \s*+ (?: (?! (?&read) ) [^*?"] )*? (?: [*?] | (?&act) )
                  - focus-metavariable: $V
              # Gemini CLI drops trust from extension manifests (gemini-extension.json, which
              # has a top-level "version"; settings files don't).
              - patterns:
                  - pattern: '"trust": true'
                  - pattern-not-inside: '{..., "version": $VER, ...}'
      # Gemini CLI settings outside the servers.
      # tools.allowed: a whole server, every MCP tool, or a named action tool. "*" is
      # gemini-settings-unrestricted-shell's.
      - patterns:
          - pattern-inside: '"tools": {...}'
          - pattern: '"allowed": [..., "$V", ...]'
          - metavariable-regex:
              metavariable: $V
              regex: |-
                (?x)
                (?(DEFINE)
                  (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                  (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                  (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                  (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                )
                ^ \s*+ mcp_ (?!_) (?: (?! (?&read) ) [^*?"] )*? (?: [*?] | (?&act) )
          - focus-metavariable: $V
      # The settings v1 name, which Gemini CLI 0.23 and earlier read.
      - patterns:
          - pattern: '"allowedTools": [..., "$V", ...]'
          - metavariable-regex:
              metavariable: $V
              regex: |-
                (?x)
                (?(DEFINE)
                  (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                  (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                  (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                  (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                )
                ^ \s*+ mcp_ (?!_) (?: (?! (?&read) ) [^*?"] )*? (?: [*?] | (?&act) )
          - focus-metavariable: $V
      # mcp.allowed: each entry approves that server's tools ("*": every server's).
      - patterns:
          - pattern-inside: '"mcp": {...}'
          - pattern: '"allowed": [..., "$V", ...]'
          - focus-metavariable: $V
      - patterns:
          - pattern-inside: '"mcp": {...}'
          - pattern: '"autoAllowInHeadless": true'
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-mcp:
        - "MCP02:2025 - Privilege Escalation via Scope Creep"
      owasp-aisvs:
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      # Whole-server approvals are certain; a named tool is judged by the words in its name,
      # which can't see what a server's tool really does.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, roo-code, kiro, gemini-cli]
      references:
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP02-2025%E2%80%93Privilege-Escalation-via-Scope-Creep.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
        - https://github.com/RooCodeInc/Roo-Code/blob/v3.54.0/src/services/mcp/McpHub.ts
        - https://github.com/RooCodeInc/Roo-Code/blob/v3.54.0/src/core/auto-approval/index.ts
        - https://kiro.dev/docs/mcp/configuration/
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/policy/config.ts
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/docs/tools/mcp-server.md
