                (?<o> \{ (?: [^{}\[\]"/]++ | (?&s) | //[^\n]*+ | /\*(?s:.*?)\*/ | / | (?&o) | (?&a) )*+ \} )
                (?<a> \[ (?: [^{}\[\]"/]++ | (?&s) | //[^\n]*+ | /\*(?s:.*?)\*/ | / | (?&o) | (?&a) )*+ \] )
                (?<k> (?&s) )
                (?<m> (?&k) (?&c) : (?&c) (?: (?&s) | (?&o) | (?&a) | [\w.+-]++ ) )
              )
