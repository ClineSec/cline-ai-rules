rules:
  - id: kilo-opencode-permission-allow-env
    # Text rule over CI files, Dockerfiles, compose files, .env files, and shell scripts that set
    # OPENCODE_PERMISSION, KILO_PERMISSION, OPENCODE_CONFIG_CONTENT, or KILO_CONFIG_CONTENT.
    # Generated by scripts/gen_kilo_opencode_permission.py, which holds the key and pattern tests
    # both rules share (and the MCP tool-name test from gen_mcp_auto_approve.py). Edit the script
    # and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [regex]
    severity: ERROR
    message: >-
      This environment variable gives opencode / Kilo Code permission rules that let the
      agent act without asking. OPENCODE_PERMISSION and KILO_PERMISSION are merged over the
      permission settings of every config file, and OPENCODE_CONFIG_CONTENT and
      KILO_CONFIG_CONTENT are loaded after the project's config.
      "permission": "allow" or a "*" key set to "allow" approves every tool (shell
      commands, file edits, web fetches, MCP tools), "bash" set to "allow" or given a "*"
      pattern (or a shell or runner followed by one, such as "bash *" or "sudo *") approves
      every shell command, "edit" approves every file write, "external_directory" set to
      "allow" (or "~/**") lets every tool read and write anywhere on the machine, and a glob
      key such as "github_*" approves all of an MCP server's tools. The deprecated "tools"
      map turns true into the same allow rules. A project's config is loaded without a
      prompt and overrides the developer's own global settings, and Kilo Code otherwise asks
      before shell commands (Kilo Code 7.8, opencode 1.19).
      A prompt injection in a file, issue, web page, or tool result the agent reads can then
      run arbitrary commands, rewrite files, or use the MCP servers with the developer's
      credentials. Keep "*" (or bash) at "ask" and allow only specific command prefixes
      ("git status *", "npm test"), paths, and named read-only MCP tools.
    paths:
      include:
        # CI and other YAML (GitHub Actions and GitLab env:, compose environment:, Kubernetes
        # env), container files, .env files, shell scripts and profiles, and make/just files.
        - "*.yml"
        - "*.yaml"
        - "Jenkinsfile"
        - "Dockerfile"
        - "Dockerfile.*"
        - "*.Dockerfile"
        - "*.dockerfile"
        - "Containerfile"
        - "devcontainer.json"
        - ".env"
        - ".env.*"
        - "*.env"
        - "*.sh"
        - "*.bash"
        - "*.zsh"
        - ".bashrc"
        - ".bash_profile"
        - ".zshrc"
        - ".zshenv"
        - ".profile"
        - ".envrc"
        - "Makefile"
        - "GNUmakefile"
        - "*.mk"
        - "justfile"
        - "Justfile"
    pattern-either:
      # OPENCODE_PERMISSION / KILO_PERMISSION (JSON).
      - patterns:
          - pattern-regex: |-
              (?x)(?m)
              (?(DEFINE)
                (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
              )
              (?(DEFINE)
                (?<c> (?: \s++ | //[^\n]*+ | /\*(?s:.*?)\*/ )*+ )
                (?<s> "(?:[^"\\\n]|\\.)*+" )
                (?<o> \{ (?: [^{}\[\]"/]++ | (?&s) | //[^\n]*+ | /\*(?s:.*?)\*/ | / | (?&o) | (?&a) )*+ \} )
                (?<a> \[ (?: [^{}\[\]"/]++ | (?&s) | //[^\n]*+ | /\*(?s:.*?)\*/ | / | (?&o) | (?&a) )*+ \] )
                (?<k> (?&s) )
                (?<m> (?&k) (?&c) : (?&c) (?: (?&s) | (?&o) | (?&a) | [\w.+-]++ ) )
              )
              (?: ^ (?: [^\#\n] | (?<=\S)\# )*? (?<![\w$-]) (?: (?: OPENCODE | KILO )_PERMISSION ) ["']? (?: [ \t]* (?: :- | := | : | = ) [ \t]* | [ \t]+ (?= ["']? \{ ) ) (?: \$\{ \w+ :?[-=] )? (?: ' | [|>] [-+]? \d? [-+]? [ \t]*+ (?: \#[^\n]*+ )? \r?\n (?: [ \t]*+ \r?\n )*+ [ \t]*+ )? (?= \{ (?&c) \" ) \{ (?&c) | \G (?&c) , (?&c) )
              (?: (?&m) (?&c) , (?&c) )*?
              (?: (?= "(?: [*/\x20]*\*[*/\x20]* | bash | edit | external_directory | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )" (?&c) : (?&c) (?: "allow" | 'allow' | allow (?![^\s,}\]\#/]) ) )
                | (?<inmap>) (?: "bash" (?<p0>) | "edit" (?<p1>) | "external_directory" (?<p2>) | "(?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )" (?<p3>) ) (?&c) : (?&c) \{ (?&c)
                  (?: (?&m) (?&c) , (?&c) )*?
                  (?= (?(<p0>) "(?: [*/\x20]*\*[*/\x20]* | (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) \x20+ (?: -[\w-]+ \x20+ )*? )*? (?: [\w.~$:-]*+ [/\\]{1,2} )*+ (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) (?: \.exe )? (?: \x20+ (?! -n \x20 | --noexec \x20 ) (?: --?[\w-]+ | /[cCkK] ) )* | (?: (?: python | py | pypy ) [\d.]* | node | nodejs | bun | bunx | deno | ruby | perl | php | lua | luajit | Rscript | tsx | ts-node | npx | pnpx | uvx | (?: npm | pnpm | yarn ) \x20+ (?: exec | dlx ) | bun \x20+ x | uv \x20+ (?: tool \x20+ )? run | pipx \x20+ run | poetry \x20+ run | bundle \x20+ exec ) (?: \.exe )? (?: \x20+ (?: -[A-Za-z]{1,3} | --eval | --print | --yes ) )* ) \x20* \* )" | (?(<p1>) "(?: (?: \./ )? [*/\x20]*\*[*/\x20]* )" | (?(<p2>) "(?: (?: ~ | \$HOME | [A-Za-z]: )? [*/\\\x20]* \* [*/\\\x20]* )" | "[*/\x20]*\*[*/\x20]*" ) ) ) (?&c) : (?&c) (?: "allow" | 'allow' | allow (?![^\s,}\]\#/]) ) )
              )
              (?<HIT> (?&k) (?&c) : (?&c) (?: "allow" | 'allow' | allow (?![^\s,}\]\#/]) ) )
              (?(<inmap>) (?: (?&c) , (?&c) (?: (?! "[*/\x20]*\*[*/\x20]*" (?&c) : ) (?&m) | "[*/\x20]*\*[*/\x20]*" (?&c) : (?&c) (?: "allow" | 'allow' | allow (?![^\s,}\]\#/]) ) ) )*+ (?&c) ,? (?&c) \} )
              (?= (?: (?&c) , (?&c) (?: (?! "[*/\x20]*\*[*/\x20]*" (?&c) : ) (?&m) | "[*/\x20]*\*[*/\x20]*" (?&c) : (?&c) (?: "allow" | 'allow' | allow (?![^\s,}\]\#/]) ) ) )*+ (?&c) ,? (?&c) \} )
          - focus-metavariable: $HIT
