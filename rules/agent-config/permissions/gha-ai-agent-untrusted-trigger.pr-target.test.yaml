# Fixture for gha-ai-agent-untrusted-trigger: pull_request_target and reviews.
name: pr-helper
"on":
  pull_request_target:
    types: [opened, synchronize, labeled]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # codex-action checks the actor's write access; the PR author may differ from whoever
      # labeled the PR or left the review comment.
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # ruleid: gha-ai-agent-untrusted-trigger
          prompt: |
            Update the changelog for this pull request.
            Title: ${{ github.event.pull_request.title }}
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # ok: gha-ai-agent-untrusted-trigger
          prompt: "Review branch ${{ github.event.pull_request.head.ref }}"
          permission-profile: ":read-only"
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # ok: gha-ai-agent-untrusted-trigger
          prompt: "Apply the reviewer's suggestion: ${{ github.event.comment.body }}"
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-users: "*"
          # ruleid: gha-ai-agent-untrusted-trigger
          prompt: "Apply the reviewer's suggestion: ${{ github.event.comment.body }}"
      # ok: gha-ai-agent-untrusted-trigger
      - uses: actions/github-script@v7
        with:
          script: console.log(${{ toJSON(github.event.pull_request.title) }})
  same-repo-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # ok: gha-ai-agent-untrusted-trigger
      - run: copilot -p "Describe ${{ github.head_ref }}" --allow-all-tools
      # ruleid: gha-ai-agent-untrusted-trigger
      - run: copilot -p "Apply ${{ github.event.comment.body }}" --allow-all-tools
  forks:
    runs-on: ubuntu-latest
    steps:
      # ruleid: gha-ai-agent-untrusted-trigger
      - run: copilot -p "Describe ${{ github.head_ref }}" --allow-tool 'shell(git push)'
      # ruleid: gha-ai-agent-untrusted-trigger
      - run: npx -y @google/gemini-cli@0.65.0 --approval-mode auto_edit -p "${{ github.event.pull_request.body }}"
      # ok: gha-ai-agent-untrusted-trigger
      - run: copilot -p "Describe ${{ github.head_ref }}" --allow-tool 'shell(git diff:*)'
