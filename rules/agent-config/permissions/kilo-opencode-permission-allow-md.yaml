                | (?<inf>) (?: (?: "bash" | 'bash' | bash (?=[ \t]*:) ) (?<f0>) | (?: "edit" | 'edit' | edit (?=[ \t]*:) ) (?<f1>) | (?: "external_directory" | 'external_directory' | external_directory (?=[ \t]*:) ) (?<f2>) | (?: "(?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )" | '(?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )' | (?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ ) (?=[ \t]*:) ) (?<f3>) ) [ \t]*: [ \t]* \{ (?&c)
