rules:
  - id: kilo-opencode-permission-allow-md
    # Text rule: the YAML front matter of agent and mode Markdown files.
    # Generated by scripts/gen_kilo_opencode_permission.py, which holds the key and pattern tests
    # both rules share (and the MCP tool-name test from gen_mcp_auto_approve.py). Edit the script
    # and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [regex]
    severity: ERROR
    message: >-
      This opencode / Kilo Code agent file's permission front matter lets the agent act
      without asking while it runs.
      "permission": "allow" or a "*" key set to "allow" approves every tool (shell
      commands, file edits, web fetches, MCP tools), "bash" set to "allow" or given a "*"
      pattern (or a shell or runner followed by one, such as "bash *" or "sudo *") approves
      every shell command, "edit" approves every file write, "external_directory" set to
      "allow" (or "~/**") lets every tool read and write anywhere on the machine, and a glob
      key such as "github_*" approves all of an MCP server's tools. The deprecated "tools"
      map turns true into the same allow rules. A project's config is loaded without a
      prompt and overrides the developer's own global settings, and Kilo Code otherwise asks
      before shell commands (Kilo Code 7.8, opencode 1.19).
      A prompt injection in a file, issue, web page, or tool result the agent reads can then
      run arbitrary commands, rewrite files, or use the MCP servers with the developer's
      credentials. Keep "*" (or bash) at "ask" and allow only specific command prefixes
      ("git status *", "npm test"), paths, and named read-only MCP tools.
    paths:
      include:
        # Agents ({agent,agents}/**/*.md) and modes ({mode,modes}/*.md) in every config folder:
        # project .opencode/ (opencode), .kilo/ and the older .kilocode/ (Kilo), and the user's
        # ~/.config/opencode/ and ~/.config/kilo/ (opencode v1.19.4 config/agent.ts and
        # paths.ts, Kilo v7.8.17).
        - ".opencode/agent/**/*.md"
        - ".opencode/agents/**/*.md"
        - ".opencode/mode/*.md"
        - ".opencode/modes/*.md"
        - ".kilo/agent/**/*.md"
        - ".kilo/agents/**/*.md"
        - ".kilo/mode/*.md"
        - ".kilo/modes/*.md"
        - ".kilocode/agent/**/*.md"
        - ".kilocode/agents/**/*.md"
        - ".kilocode/mode/*.md"
        - ".kilocode/modes/*.md"
        - ".config/opencode/agent/**/*.md"
        - ".config/opencode/agents/**/*.md"
        - ".config/opencode/mode/*.md"
        - ".config/opencode/modes/*.md"
        - ".config/kilo/agent/**/*.md"
        - ".config/kilo/agents/**/*.md"
        - ".config/kilo/mode/*.md"
        - ".config/kilo/modes/*.md"
    pattern-either:
      # permission: allow sets every permission at once.
      - patterns:
          - pattern-regex: |-
              (?x)(?m)
              \A (?:\x{FEFF})? ---[ \t]*\r?\n (?: (?! ---[ \t]*\r?$ ) [^\n]*+ \n )*?
              (?<HIT> (?: permission | \"permission\" | 'permission' ) [ \t]*: [ \t]* (?: \"allow\" | 'allow' | allow ) ) [ \t]*+ (?: \#[^\n]*+ )? \r?$
          - focus-metavariable: $HIT
      # A member of the permission block.
      - patterns:
          - pattern-regex: |-
              (?x)(?m)
              (?(DEFINE)
                (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
              )
              (?(DEFINE)
                (?<nl> \r?\n | \z )
                (?<bl> [ \t]*+ (?: \#[^\n]*+ )? \r?\n )
                (?<ky> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\n]|'')*+' | [^\s"'\#:] (?: [^\n:] | :(?![\s]) )*? (?=[ \t]*:) )
                (?<mem> \k<I> (?![ \t]) [^\n]*+ (?&nl) (?: \k<I> [ \t]++ [^\s\#] [^\n]*+ (?&nl) | (?&bl) )*+ )
              )
              (?(DEFINE)
                (?<c> (?: \s++ | \#[^\n]*+ )*+ )
                (?<s> "(?:[^"\\\n]|\\.)*+" | '(?:[^'\n]|'')*+' )
                (?<b> [^\s"'{}\[\],:\#] (?: [^\n{}\[\],:\#] | :(?!\s) )*+ )
                (?<o> \{ (?: [^{}\[\]"'\#]++ | (?&s) | \#[^\n]*+ | (?&o) | (?&a) )*+ \} )
                (?<a> \[ (?: [^{}\[\]"'\#]++ | (?&s) | \#[^\n]*+ | (?&o) | (?&a) )*+ \] )
                (?<k> (?&s) | (?&b) )
                (?<m> (?&k) (?&c) : (?&c) (?: (?&s) | (?&o) | (?&a) | (?&b) ) )
              )
              (?: \A (?:\x{FEFF})? ---[ \t]*\r?\n (?: (?! ---[ \t]*\r?$ ) [^\n]*+ \n )*? (?: "permission" | 'permission' | permission (?=[ \t]*:) ) [ \t]*: [ \t]*+ (?: \#[^\n]*+ )? (?&nl) | \G )
              (?&bl)*+ (?= (?<I>[ \t]++) [^\s\#] )
              (?&mem)*?
              \k<I>
              (?: (?= (?: "(?: [*/\x20]*\*[*/\x20]* | bash | edit | external_directory | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )" | '(?: [*/\x20]*\*[*/\x20]* | bash | edit | external_directory | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )' | (?: [*/\x20]*\*[*/\x20]* | bash | edit | external_directory | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ ) (?=[ \t]*:) ) [ \t]*: [ \t]* (?: "allow" | 'allow' | allow ) [ \t]*+ (?: \#[^\n]*+ )? (?&nl) )
                | (?<inb>) (?: (?: "bash" | 'bash' | bash (?=[ \t]*:) ) (?<p0>) | (?: "edit" | 'edit' | edit (?=[ \t]*:) ) (?<p1>) | (?: "external_directory" | 'external_directory' | external_directory (?=[ \t]*:) ) (?<p2>) | (?: "(?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )" | '(?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ )' | (?: [*/\x20]*\*[*/\x20]* | (?! [*/\x20]*\*[*/\x20]* (?:[\"':\s\\]|$) ) (?: (?! (?&read) ) [^*?\"'\s:{},\\] )*? [*?] [^\"'\s:{},\\]*+ ) (?=[ \t]*:) ) (?<p3>) ) [ \t]*: [ \t]*+ (?: \#[^\n]*+ )? (?&nl)
                  (?&bl)*+ (?= (?<J> \k<I> [ \t]++ ) [^\s\#] )
                  (?: \k<J> (?![ \t]) [^\n]*+ (?&nl) (?&bl)*+ )*?
                  \k<J> (?= (?(<p0>) (?: "(?: [*/\x20]*\*[*/\x20]* | (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) \x20+ (?: -[\w-]+ \x20+ )*? )*? (?: [\w.~$:-]*+ [/\\]{1,2} )*+ (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) (?: \.exe )? (?: \x20+ (?! -n \x20 | --noexec \x20 ) (?: --?[\w-]+ | /[cCkK] ) )* | (?: (?: python | py | pypy ) [\d.]* | node | nodejs | bun | bunx | deno | ruby | perl | php | lua | luajit | Rscript | tsx | ts-node | npx | pnpx | uvx | (?: npm | pnpm | yarn ) \x20+ (?: exec | dlx ) | bun \x20+ x | uv \x20+ (?: tool \x20+ )? run | pipx \x20+ run | poetry \x20+ run | bundle \x20+ exec ) (?: \.exe )? (?: \x20+ (?: -[A-Za-z]{1,3} | --eval | --print | --yes ) )* ) \x20* \* )" | '(?: [*/\x20]*\*[*/\x20]* | (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) \x20+ (?: -[\w-]+ \x20+ )*? )*? (?: [\w.~$:-]*+ [/\\]{1,2} )*+ (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) (?: \.exe )? (?: \x20+ (?! -n \x20 | --noexec \x20 ) (?: --?[\w-]+ | /[cCkK] ) )* | (?: (?: python | py | pypy ) [\d.]* | node | nodejs | bun | bunx | deno | ruby | perl | php | lua | luajit | Rscript | tsx | ts-node | npx | pnpx | uvx | (?: npm | pnpm | yarn ) \x20+ (?: exec | dlx ) | bun \x20+ x | uv \x20+ (?: tool \x20+ )? run | pipx \x20+ run | poetry \x20+ run | bundle \x20+ exec ) (?: \.exe )? (?: \x20+ (?: -[A-Za-z]{1,3} | --eval | --print | --yes ) )* ) \x20* \* )' | (?: [*/\x20]*\*[*/\x20]* | (?: (?: bash | sh | zsh | dash | ksh | mksh | fish | pwsh | powershell | cmd | eval | exec | sudo | doas | env | xargs | nohup | command ) \x20+ (?: -[\w-]+ \x20+ )*? )*? (?: [\w.~$:-]*+ [/\\]{1,2} )*+ (?: (?: bash | sh | zsh | dash |