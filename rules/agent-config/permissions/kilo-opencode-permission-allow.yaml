              (?= (?: (?&c) , (?&c) (?: (?! "[*/\x20]*\*[*/\x20]*" (?&c) : ) (?&m) | "[*/\x20]*\*[*/\x20]*" (?&c) : (?&c) (?: true | True | TRUE ) (?![^\s,}\]\#/]) ) )*+ (?&c) ,? (?&c) \} )
          - focus-metavariable: $HIT
