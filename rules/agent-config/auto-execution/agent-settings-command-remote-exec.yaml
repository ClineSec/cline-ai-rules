rules:
  - id: agent-settings-command-remote-exec
    languages: [json]
    severity: ERROR
    message: >-
      This agent setting downloads code from the network and runs it whenever the agent runs the
      command on its own: in Claude Code, a status line or file-suggestion command on every
      refresh or keystroke, a credential or telemetry helper at startup or when a token expires, a
      headersHelper on every MCP connection or marketplace fetch; in Gemini CLI,
      tools.discoveryCommand and mcp.serverCommand at every startup and tools.shell.pager whenever
      an allowed shell command pages its output; in Cursor, worktrees.json setup in every new agent
      worktree. Nothing asks before each run, and nothing checks what was downloaded. Whoever
      controls that URL, its DNS, or the git repository it names, and any worm that writes this
      line into the repo, runs code with the developer's credentials on every machine that opens
      the project. Install the tool outside the repo at a pinned version with a verified checksum
      and point the setting at it, or vendor the script into the repo and review it like other
      code that runs on checkout.
    paths:
      include:
        - ".claude/settings.json"
        - ".claude/settings.local.json"
        # Gemini CLI's .gemini/settings.json, and a Claude Code plugin's root settings.json (only
        # subagentStatusLine and agent take effect there). The keys matched below are Claude
        # Code's and Gemini CLI's own, so other tools' settings.json files stay quiet.
        - "settings.json"
        # Project and plugin MCP configs (a plugin's .mcp.json may drop the mcpServers wrapper).
        - ".mcp.json"
        # Plugin manifests: settings.subagentStatusLine and inline mcpServers.
        - ".claude-plugin/plugin.json"
        - ".claude-plugin/marketplace.json"
        # Cursor agent worktree setup.
        - ".cursor/worktrees.json"
    # Keys, scopes, and trust behavior checked against the Claude Code docs (settings
    # reference, permissions, mcp, plugins/host-marketplace) and changelog for v2.1.309,
    # 2026-10-22. Left out: policyHelper (managed settings only), a marketplace plugin entry's
    # headersHelper and the command plugin source (shown and accepted on each install or
    # update), and hooks (agent-hook-* rules). Gemini CLI keys checked against its source at
    # v0.65.0 (settingsSchema.ts, tool-registry.ts, utils/trust.ts), 2026-10-23: workspace
    # settings load only in a trusted folder (folder trust is on by default). Left out:
    # tools.callCommand (each discovered-tool call asks first, policies/discovered.toml),
    # experimental.gemmaModelRouter.binaryPath (read from user settings only), the
    # tools.sandbox command (a fixed list), and the v1 top-level toolDiscoveryCommand keys (no
    # longer read). Cursor worktrees.json checked against its docs, 2026-10-23. Left out:
    # .cursor/environment.json (cloud agent VMs, and only when an environment points at it).
    patterns:
      - pattern-either:
          # Credential and telemetry helpers: a shell command line as the value. All are honored
          # from project settings ("Any file" scope).
          - patterns:
              - pattern: '"$KEY": "$CMD"'
              # A JSON key metavariable binds with its quotes.
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^"(apiKeyHelper|awsAuthRefresh|awsCredentialExport|gcpAuthRefresh|otelHeadersHelper)"$
          # Status line, subagent status line, and @ file suggestion: {"type": "command",
          # "command": ...}, here or in a plugin manifest's "settings".
          - patterns:
              - pattern-either:
                  - pattern-inside: '"statusLine": {...}'
                  - pattern-inside: '"subagentStatusLine": {...}'
                  - pattern-inside: '"fileSuggestion": {...}'
              - pattern: '"command": "$CMD"'
          # MCP server headersHelper, including servers declared inline in a plugin manifest or
          # a marketplace entry.
          - patterns:
              - pattern-inside: '"mcpServers": {...}'
              - pattern: '"headersHelper": "$CMD"'
          # headersHelper on a marketplace url source in settings (extraKnownMarketplaces or its
          # additionalMarketplaces alias), and on a .mcp.json without the mcpServers wrapper. A
          # plugin entry's own headersHelper (in a "plugins" list) is left out: Claude Code shows
          # that command and asks before each install or update.
          - patterns:
              - pattern: '"headersHelper": "$CMD"'
              - pattern-not-inside: '"plugins": [...]'
          # Gemini CLI (.gemini/settings.json), honored from workspace settings once the folder
          # is trusted: the tool discovery command and the MCP server command run at every
          # startup, and the shell pager runs whenever an approved or allowlisted shell command
          # (git diff, git log) pages its output. The first two are split into argv without a
          # shell, so a download runs through a shell or package runner the command names; a
          # bare pipe there is still reported as written.
          - patterns:
              - pattern-inside: '"tools": {...}'
              - pattern: '"discoveryCommand": "$CMD"'
          - patterns:
              - pattern-inside: '"mcp": {...}'
              - pattern: '"serverCommand": "$CMD"'
          - patterns:
              - pattern-inside: '"tools": {...}'
              - pattern-inside: '"shell": {...}'
              - pattern: '"pager": "$CMD"'
          # Cursor (.cursor/worktrees.json): each setup command runs in every new agent
          # worktree.
          - patterns:
              - pattern: '"$WK": [..., "$CMD", ...]'
              - metavariable-regex:
                  metavariable: $WK
                  regex: ^"setup-worktree(?:-unix|-windows)?"$
              - focus-metavariable: $CMD
      - metavariable-regex:
          metavariable: $CMD
          # Verbose mode: whitespace is ignored and # starts a comment, so literal spaces
          # are \s and a literal # is \#. Matched text keeps JSON escapes (\" for a quote).
          regex: |-
            (?ix)
            # --- remote download-and-run test (begin): build.py keeps this block identical in
            # agent-hook-remote-exec; edit both together. ---
            # (?&at): a command position, so text inside an echo string doesn't count: the
            # start, after ; & | ( or a backtick, a quoted -c / -Command argument, or a prefix
            # such as sudo or env VAR=1.
            (?(DEFINE) (?<at> ^\s*\\?["']? | [;&|(`]\s* | \s-\w*c\s+\\?["'] | \s-command\s+\\?["']
              | \bsudo(?:\s+-\S+)*\s+ | \b(?:env|exec|nohup|time)\s+(?:\w+=\S*\s+)* )
              # (?&w): one piece of a command, so ; & | inside quotes or after a backslash don't
              # end it (curl "https://example.com/i.sh?a=1&b=2" | sh). A quoted string may keep
              # its JSON escapes (\"...\"). An unquoted & still ends the command: the shell runs
              # the download in the background and pipes nothing into the shell after it.
              (?<w> (?> \\" (?:[^"\\]|\\[^"])*+ \\" | " (?:[^"\\]|\\.)*+ " | '[^']*+' | \\{1,2}[;&|]
                | [^;&|"'\\\s]++ | [^;&|] ) ) )
            # Download piped into a shell or interpreter that reads its program from stdin,
            # possibly through filters (curl ... | base64 -d | sh). An interpreter given
            # -c, -e, -m, or a script reads stdin as data (curl ... | python3 -m json.tool).
              .*? (?&at) (?:curl|wget|iwr|irm|invoke-webrequest|invoke-restmethod)(?:\.exe)? \b (?&w)*+
              (?: \|(?!\|) (?&w)*+ )*?
              (?<!\|) \|(?!\|) \s* (?:sudo (?:\s+-\S+)* \s+)? (?:env (?:\s+-\S+)* (?:\s+\w+=\S*)* \s+)?
              (?: (?:ba|z|da|k)?sh (?:\s+-[abd-z]+)* (?:\s+(?:-s|--?)(?:\s.*)?)?
                | (?:python[0-9.]*|node|perl|ruby|php) (?:\s+-u)? (?:\s+-)?
                | iex | invoke-expression )
              \s* (?:$|[;&|)`<>]|\\?["']|\d>)
            # Download substituted into a shell's or interpreter's program:
            # bash -c "$(curl ...)", bash <(curl ...), eval "$(wget -qO- ...)", source <(...).
            | .*? (?&at)
              (?: (?:ba|z|da|k)?sh (?:\s+-\S+)* | python[0-9.]* \s+ -\w*c | (?:node|perl|ruby) \s+ -\w*e
                | eval | source | \. )
              \s+ \\?["']? (?:\$\(|<\(|`) \s* (?:curl|wget)(?:\.exe)? \b
            # PowerShell: iex (irm ...), iex ((New-Object Net.WebClient).DownloadString(...)).
            | .*? (?&at) (?:iex|invoke-expression) \b .*?
              (?:\b(?:iwr|irm|invoke-webrequest|invoke-restmethod|curl|wget)\b|\.downloadstring\b)
            | .*? \.downloadstring \s* \( .*? \| \s* (?:iex|invoke-expression) \b
            # A package runner given a URL, a git URL, or a GitHub repo (npm reads a bare
            # user/repo with one slash as GitHub). A spec pinned to a commit SHA is left out.
            | .*? (?&at) (?:npx|bunx|pnpm\s+dlx|yarn\s+dlx|npm\s+exec)
              (?:\s+-(?!-package=)\S+)* \s+ (?:--package=)? \\?["']?
              (?! \S*? [\#@] [0-9a-f]{7,40} (?![\w.-]) )
              (?: (?:https?|git(?:\+\w+)?)://\S+ | git@\S+ | (?:github|gitlab|bitbucket): \S+
                | [a-z0-9][\w.-]*/[\w.-]+ (?:\#\S*)? (?=\s|$|\\?["']) )
            # uvx and pipx run take the source from --from / --spec or as the first argument;
            # later URLs are arguments to the tool (uvx ruff check --config https://...).
            | .*? (?&at) (?:uvx|uv\s+tool\s+run|pipx\s+run)
              (?: (?&w)*? \s--(?:from|spec)[\s=] | (?:\s+-\S+)* \s ) \s* \\?["']?
              (?! \S*? @ [0-9a-f]{7,40} (?![\w.-]) )
              (?:git\+\w+://|https?://)
            # Download to a file, then run or chmod that same file, with no checksum or
            # signature check anywhere in the command.
            | (?! .* (?:sha(?:1|256|512)?sum|shasum|get-filehash|gpg\s+--verify|cosign\s+verify|minisign) )
              .*? (?&at) (?:curl|wget|iwr|invoke-webrequest)(?:\.exe)? \b (?&w)*? \s
              (?:-\w*o|--output(?:-document)?|-outfile) [\s=] \s* \\?["']? (?<file>[^\s"'\\;&|]+)
              .*? (?:&&|;) \s*
              (?: chmod \s+ \S+ \s+
                | (?:sudo\s+)? (?:(?:ba|z|da|k)?sh|python[0-9.]*|node|perl|ruby|pwsh|powershell) (?:\s+-\S+)* \s+
                | (?:sudo\s+|&\s*)? )
              \\?["']? (?:\.[\\/])? \k<file> (?=\s|$|[;&|)]|\\?["'])
            # --- remote download-and-run test (end) ---
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI05 - Unexpected Code Execution (RCE)"
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
      mitre-atlas:
        - "AML.T0081 - Modify AI Agent Configuration"
        - "AML.T0050 - Command and Scripting Interpreter"
      cwe:
        - "CWE-494: Download of Code Without Integrity Check"
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [claude-code, gemini-cli, cursor]
      references:
        - https://code.claude.com/docs/en/settings-reference
        - https://code.claude.com/docs/en/permissions#what-runs-before-you-trust-a-folder
        - https://code.claude.com/docs/en/statusline#workspace-trust-required
        - https://code.claude.com/docs/en/mcp#trust-a-folder-before-its-headershelper-runs
        - https://code.claude.com/docs/en/plugins/host-marketplace#when-a-marketplace-url-sources-command-runs
        - https://docs.npmjs.com/cli/v11/using-npm/package-spec
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/cli/src/config/settingsSchema.ts
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/tools/tool-registry.ts
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/utils/trust.ts
        - https://cursor.com/docs/configuration/worktrees
        - https://www.sonarsource.com/blog/mini-shai-hulud-targets-ai-coding-agents/
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
