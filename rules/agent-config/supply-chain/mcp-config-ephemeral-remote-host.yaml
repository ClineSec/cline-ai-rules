                      | (?<![A-Za-z0-9_.@/-]) (?:(?&lbl)\.)* (?&tunnel) \.? (?&he)
                    )
      - focus-metavariable: $V
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
      owasp-mcp:
        - "MCP09:2025 - Shadow MCP Servers"
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
      owasp-aisvs:
        - "v1.01-C10.1.1 - Component Integrity"
        - "v1.01-C10.3.1 - Secure Transport"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      # Tunnel and callback hosts and raw public IPs are almost never a vetted server; plain
      # http to a public name is cleartext whatever the network.
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, claude-code, claude-desktop, cursor, vscode, cline, windsurf, gemini-cli, continue]
      references:
