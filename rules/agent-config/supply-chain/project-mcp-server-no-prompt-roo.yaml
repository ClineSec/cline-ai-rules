rules:
  - id: project-mcp-server-no-prompt-roo
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Roo Code or Kilo
      Code starts it without asking. Roo Code starts the servers in .roo/mcp.json as soon as the
      extension loads, and Kilo Code those in .kilocode/mcp.json and .kilo/mcp.json, with no
      per-server prompt, and both restart a server when its entry changes. The VS Code
      extensions only wait for Workspace Trust, which most people give a repository they clone;
      the Kilo CLI doesn't check trust at all. A pull request that adds a server or edits a
      command therefore runs that program on every teammate's machine, with their credentials
      and the agent's tool access. Keep personal servers in user-level config, run shared ones
      from a pinned package (npx "pkg@1.2.3"), and review this file like code that runs on
      checkout (a CODEOWNERS entry).
    # Roo Code v3.54.0 (archived 2026-05-15): McpHub reads <workspace>/.roo/mcp.json at startup
    # and on every change and connects each server unless "disabled": true; package.json declares
    # no untrustedWorkspaces support, so VS Code 1.143.1 (extensionManifestPropertiesService.ts)
    # keeps the extension off until Workspace Trust. Kilo Code v7.8.17: McpMigrator reads
    # .kilocode/mcp.json and .kilo/mcp.json from the project into the opencode-style config (a
    # disabled server becomes enabled: false), for the CLI and the extension alike. Remote servers
    # (url, no command) run nothing locally and are left out.
    paths:
      include:
        - ".roo/mcp.json"
        - ".kilocode/mcp.json"
        - ".kilo/mcp.json"
    patterns:
      - pattern-inside: '"mcpServers": {...}'
      - pattern-inside: '"$NAME": {..., "command": $C, ...}'
      # Roo and Kilo skip a server marked "disabled": true.
      - pattern-not-inside: '"$NAME": {..., "disabled": true, ...}'
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, roo-code, kilo-code]
      references:
        - https://github.com/RooCodeInc/Roo-Code/blob/v3.54.0/src/services/mcp/McpHub.ts
        - https://github.com/microsoft/vscode/blob/1.143.1/src/vs/workbench/services/extensions/common/extensionManifestPropertiesService.ts
        - https://github.com/Kilo-Org/kilocode/blob/v7.8.17/packages/opencode/src/kilocode/mcp-migrator.ts
        - https://github.com/Kilo-Org/kilocode/blob/v7.8.17/packages/opencode/src/kilocode/config/config.ts
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
