rules:
  - id: project-mcp-server-no-prompt-kiro
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Kiro starts it
      without asking. Kiro loads .kiro/settings/mcp.json once the workspace is trusted, as most
      people do for a repository they clone, starts its servers with no per-server prompt, and
      restarts a server when its entry changes; Kiro CLI runs with --no-interactive load it
      without asking at all. A pull request that adds a server or edits a command therefore runs
      that program on every teammate's machine, with their credentials and the agent's tool
      access. Keep personal servers in user-level config, run shared ones from a pinned package
      (npx "pkg@1.2.3"), and review this file like code that runs on checkout (a CODEOWNERS
      entry).
    # Kiro docs, read 2026-10-25 (Kiro is closed source). Permissions (updated 2026-10-24):
    # "Until you trust a workspace, Kiro: Does not load the workspace's custom agents, Steering
    # files, MCP server configuration, or Skills"; the CLI's "Trust this workspace?" screen comes
    # "before it loads the folder's hooks, agents, MCP servers, ..."; once trusted, "the session
    # starts with the folder's configuration loaded"; "Non-interactive runs ( --no-interactive ) and
    # V1 and V2 sessions are not gated: they load workspace configuration without asking". MCP
    # configuration (updated 2026-10-23): "if you add, remove, or edit a server entry, only the
    # affected servers are stopped or started", and "disabled" is "Whether the server is disabled
    # (default: false)". Servers in a .kiro/agents/ profile start only for that agent and are left
    # out. Remote servers (url, no command) run nothing locally and are left out.
    paths:
      include:
        - ".kiro/settings/mcp.json"
    patterns:
      - pattern-inside: '"mcpServers": {...}'
      - pattern-inside: '"$NAME": {..., "command": $C, ...}'
      # Kiro skips a server marked "disabled": true.
      - pattern-not-inside: '"$NAME": {..., "disabled": true, ...}'
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, kiro]
      references:
        - https://kiro.dev/docs/permissions/
        - https://kiro.dev/docs/mcp/configuration/
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
