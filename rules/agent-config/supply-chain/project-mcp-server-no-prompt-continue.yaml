rules:
  - id: project-mcp-server-no-prompt-continue
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Continue starts
      it without asking. Continue reads every JSON file in a workspace's .continue/mcpServers/
      folder (Claude or Cursor format, or one server per file) and starts its servers with no
      per-server prompt, also after a command changes; the VS Code extension only waits for
      Workspace Trust, which most people give a repository they clone. A pull request that adds
      a server or edits a command therefore runs that program on every teammate's machine, with
      their credentials and the agent's tool access. Keep personal servers in user-level config,
      run shared ones from a pinned package (npx "pkg@1.2.3"), and review this file like code
      that runs on checkout (a CODEOWNERS entry).
    # Continue 5522c6f (VS Code extension 1.3.40): loadJsonMcpConfigs reads .continue/mcpServers/
    # under every workspace folder, skipping config.json and settings.json, and
    # MCPManagerSingleton.setConnections connects each server and reconnects one whose transport
    # changed; the extension declares no untrustedWorkspaces support, so VS Code keeps it off until
    # Workspace Trust. Remote servers (url, no command) run nothing locally and are left out.
    paths:
      include:
        - ".continue/mcpServers/**/*.json"
      exclude:
        - ".continue/mcpServers/**/config.json"
        - ".continue/mcpServers/**/settings.json"
    patterns:
      # A named server under "mcpServers" (Claude or Cursor format), or one server at the
      # file's root.
      - pattern-either:
          - patterns:
              - pattern-inside: '"mcpServers": {...}'
              - pattern-inside: '"$NAME": {..., "command": $C, ...}'
          - patterns:
              - pattern-inside: '{..., "command": $C, ...}'
              - pattern-not-inside: '"$K": {..., "command": $Y, ...}'
              - pattern-not-inside: '[..., {..., "command": $Y, ...}, ...]'
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, continue]
      references:
        - https://github.com/continuedev/continue/blob/5522c6f44ca0ac3528b37244818fbfa39b5af470/core/context/mcp/json/loadJsonMcpConfigs.ts
        - https://github.com/continuedev/continue/blob/5522c6f44ca0ac3528b37244818fbfa39b5af470/core/context/mcp/MCPManagerSingleton.ts
        - https://docs.continue.dev/customize/deep-dives/mcp
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
