rules:
  - id: project-mcp-server-no-prompt-copilot-cli
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and GitHub Copilot
      CLI starts it without asking. Copilot CLI loads .github/mcp.json and .mcp.json from the
      working directory up to the repository root once the folder is trusted, as most people do
      for a repository they clone, and starts their servers with no per-server prompt; copilot
      -p loads them without asking in a folder trusted earlier. A pull request that adds a
      server or edits a command therefore runs that program on every teammate's machine, with
      their credentials and the agent's tool access. Keep personal servers in user-level config,
      run shared ones from a pinned package (npx "pkg@1.2.3"), and review this file like code
      that runs on checkout (a CODEOWNERS entry).
    # GitHub Docs, read 2026-10-25 (Copilot CLI is closed source). "Adding MCP servers": "Project-
    # level MCP servers are loaded only after you confirm folder trust on first launch", and "In
    # prompt mode (copilot -p), project-level MCP servers are loaded automatically if the current
    # directory is already trusted." CLI command reference, GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP:
    # "Disabled by default to prevent starting repository-controlled MCP servers without interactive
    # trust"; its trust-level table lists "Review required: Recommended" for .github/mcp.json (and
    # "Always" only for remote servers). Project files take the mcpServers object or servers at the
    # root. .mcp.json is project-mcp-server-no-prompt's. Remote servers (url, no command) run nothing
    # locally and are left out.
    paths:
      include:
        - ".github/mcp.json"
    patterns:
      - pattern-inside: '"$NAME": {..., "command": $C, ...}'
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, copilot-cli]
      references:
        - https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/add-mcp-servers
        - https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference#mcp-server-trust-levels
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
