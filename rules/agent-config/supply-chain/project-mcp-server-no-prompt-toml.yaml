rules:
  - id: project-mcp-server-no-prompt-toml
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    # Regex, not a parser: OpenGrep has no TOML support.
    languages: [regex]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Codex starts it
      without asking. Codex applies .codex/config.toml from a trusted project, and from every
      folder between the working directory and the repository root, and starts its mcp_servers
      at session start with no per-server prompt, also after a command changes. Trusting a
      project is a one-time choice most people make for a repository they clone. A pull request
      that adds a server or edits a command therefore runs that program on every teammate's
      machine, with their credentials and the agent's tool access. Keep personal servers in
      user-level config, run shared ones from a pinned package (npx "pkg@1.2.3"), and review
      this file like code that runs on checkout (a CODEOWNERS entry).
    # Codex rust-v0.164.0: config/src/loader/mod.rs loads .codex/config.toml from each folder
    # between the working directory and the repository root, enabled only for a trusted project, and
    # sanitize_project_config keeps mcp_servers; codex-mcp catalog.rs disables a configured server
    # only for enabled = false or an administrator requirement. Remote servers (url) run nothing
    # locally and are left out.
    paths:
      include:
        # Codex: ~/.codex/config.toml, and .codex/config.toml in a trusted project.
        - ".codex/config.toml"
    patterns:
      # $SRV is one server's keys.
      - pattern-either:
          # [mcp_servers.<name>]: its keys up to the next table header. Sub-tables such as
          # [mcp_servers.<name>.env] start their own header and are not matched.
          - pattern-regex: (?m)^[ \t]*\[[ \t]*mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<SRV>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
          # Servers inside the [mcp_servers] table ...
          - patterns:
              - pattern-regex: (?m)^[ \t]*\[[ \t]*mcp_servers[ \t]*\][ \t]*(?:\#[^\n]*)?\n(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
              - metavariable-pattern:
                  metavariable: $TABLE
                  language: regex
                  pattern-either:
                    # Inline tables: <name> = { ... }.
                    - pattern-regex: (?m)^[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*=[ \t]*(?<SRV>\{[^\n]*\})
                    # Dotted keys: <name>.command = ... $SRV starts at each command or args
                    # line and runs to the next header; the server match ties both keys to
                    # the same name.
                    - pattern-regex: (?m)^[ \t]*(?=(?<SRV>(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?:command|args)[ \t]*=(?s:.*)))[^\n]*
          # ... and before the first table header: mcp_servers.<name> = { ... } or
          # mcp_servers.<name>.command = ...
          - patterns:
              - pattern-regex: \A(?<TABLE>(?:(?![ \t]*\[)[^\n]*(?:\n|\z))*)
              - metavariable-pattern:
                  metavariable: $TABLE
                  language: regex
                  pattern-either:
                    - pattern-regex: (?m)^[ \t]*mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*=[ \t]*(?<SRV>\{[^\n]*\})
                    - pattern-regex: (?m)^[ \t]*(?=(?<SRV>mcp_servers[ \t]*\.[ \t]*(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?:command|args)[ \t]*=(?s:.*)))[^\n]*
      # Drops candidate matches that bound no server; without it the metavariable-pattern
      # below reports "$SRV is not in scope" as an engine error.
      - metavariable-regex:
          metavariable: $SRV
          regex: (?s).
      # enabled = false: Codex skips the server (for dotted keys, only that server's key counts).
      - metavariable-regex:
          metavariable: $SRV
          regex: (?s)\A(?=[ \t]*(?<p>(?:(?:mcp_servers[ \t]*\.[ \t]*)?(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?=(?:command|args)[ \t]*=))?))(?!.*?(?:\A|[\n{,])[ \t]*\k<p>enabled[ \t]*=[ \t]*false\b)
      - metavariable-pattern:
          metavariable: $SRV
          language: regex
          patterns:
            - pattern-regex: |-
                (?ms)\A(?=[ \t]*(?<P>(?:(?:mcp_servers[ \t]*\.[ \t]*)?(?:"[^"\n]*"|'[^'\n]*'|[\w-]+)[ \t]*\.[ \t]*(?=(?:command|args)[ \t]*=))?)).*?(?:^|[{,])[ \t]*\k<P>command[ \t]*=[ \t]*(?<Q>["'])(?<V>(?:(?!\k<Q>)[^\\\n]|\\.)*+)\k<Q>
            - metavariable-regex:
                metavariable: $V
                regex: |-
                  ^[ \t]*+\S
      - focus-metavariable: $V
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, codex]
      references:
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/config/src/loader/mod.rs
        - https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/codex-mcp/src/catalog.rs
        - https://learn.chatgpt.com/docs/extend/mcp?surface=cli
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
