rules:
  - id: mcp-config-ephemeral-remote-host-subagent
    # Generic, not YAML: OpenGrep can't parse a Markdown file's front matter, so a regex finds
    # the front matter's top-level mcpServers: block and the YAML checks run on that block.
    # Generated by scripts/gen_mcp_remote_host.py, which holds the host regexes shared with
    # mcp-config-ephemeral-remote-host.yaml, mcp-config-ephemeral-remote-host-yaml.yaml,
    # mcp-config-ephemeral-remote-host-toml.yaml and
    # mcp-config-ephemeral-remote-host-workspace.yaml, and takes the file paths from
    # scripts/gen_mcp_unpinned.py. Edit the script and run scripts/build.py; build.py --check
    # fails if this file drifts.
    languages: [generic]
    severity: WARNING
    message: >-
      This subagent's inline MCP server talks to a host that identifies no one: a tunnel or
      out-of-band callback service (trycloudflare.com, ngrok, localtunnel, localhost.run,
      Serveo, Interactsh, ...), a raw public IP address, or a public host over plain http://. A
      tunnel name is whatever machine started the tunnel, for as long as it runs, and whoever
      holds it serves the tool list, tool descriptions and results that the agent trusts and
      acts on. In August 2026 the Deadbugz campaign opened pull requests adding remote MCP
      servers on throwaway hosts (first a trycloudflare.com quick tunnel) that turned malicious
      after a few calls. Plain http lets anyone on the network path read the request headers and
      rewrite tool descriptions. Point the client at the vendor's own https endpoint or a server
      on a domain your team owns, and keep personal tunnels in user-level config, not the
      project. Claude Code starts a subagent's inline MCP servers without the per-server prompt
      that a project .mcp.json server gets: once the folder is trusted for a project's
      .claude/agents/ file, and with no check at all for one in ~/.claude/agents/, whenever the
      subagent runs, including when Claude delegates to it on its own.
    paths:
      include:
        # Project (.claude/agents/) and user (~/.claude/agents/) subagents.
        - ".claude/agents/**"
    patterns:
      # The front matter: from a leading --- line to the next --- line.
      - pattern-regex: \A(?:\x{FEFF})?---[ \t]*\r?\n(?s:.*?)\r?\n---[ \t]*(?:\r?\n|\z)
      # Its top-level mcpServers: block, parsed alone so that another key a YAML
      # parser rejects (a description with ": " in it) doesn't hide the servers.
      - pattern-regex: (?m)^(?<MS>mcpServers[ \t]*:[^\r\n]*\r?\n(?:(?:[ \t]+[^\r\n]*|-[ \t][^\r\n]*|\#[^\r\n]*|[ \t]*)\r?\n)*)
      - metavariable-pattern:
          metavariable: $MS
          language: yaml
          patterns:
            - pattern-inside: 'mcpServers: [...]'
            - pattern-either:
                # Any scalar in the entry: url, args, env, requestOptions.headers.
                - patterns:
                    - pattern: $V
                    - metavariable-regex:
                        metavariable: $V
                        regex: |-
                          ^(?:"[^\n]*"|'[^\n]*'|(?![-?:]\s|[\[{|>&*!%@`])(?:(?!:(?:\s|$)|\s\#)[^\n])*)$
                    - metavariable-regex:
                        metavariable: $V
                        regex: |-
                          (?x)
                          (?(DEFINE)
                            (?<oct> 25[0-5] | 2[0-4]\d | 1\d\d | [1-9]?\d )
                            # Where a host ends: a port, path, query, fragment, quote, separator, or the end.
                            (?<he> (?= [:/?\#"'\\\s,;)\]}] | $ ) )
                            # A DNS label. _ and labels past 63 characters are allowed on purpose: testbed payloads
                            # use names under real tunnel domains that can never resolve.
                            (?<lbl> [A-Za-z0-9_-]++ )
                            (?<userinfo> (?: [^\s"'/@?\#\\]*+ @ )?+ )
                            # Tunnel and out-of-band callback services: each name is a machine or listener that someone
                            # started for the moment, not a service anyone vouches for (sources in the rule's references).
                            (?<tunnel> (?i: trycloudflare\.com                          # Cloudflare quick tunnels
                              | ngrok-free\.(?:app|dev|pizza) | ngrok\.(?:app|dev|io|pizza) # ngrok
                              | loca\.lt | localtunnel\.me                                # localtunnel
                              | lhr\.life | lhr\.rocks                                    # localhost.run
                              | serveo\.net | serveousercontent\.com                      # Serveo
                              | pinggy(?:-free)?\.link                                    # Pinggy
                              | tunnelmole\.net | bore\.pub | loclx\.io                   # Tunnelmole, bore, LocalXpose
                              | devtunnels\.ms | app\.github\.dev                         # Dev Tunnels, Codespaces ports
                              | oast\.(?:pro|live|site|online|fun|me)                     # Interactsh
                              | oastify\.com | burpcollaborator\.net ) )                 # Burp Collaborator
                            # Free hosting platforms' default subdomains (sources in the rule's references).
                            (?<paas> (?i: onrender\.com | fly\.dev | herokuapp\.com | vercel\.app | netlify\.app
                              | railway\.app | workers\.dev | deno\.dev | deno\.net | replit\.app | koyeb\.app | hf\.space
                              | modal\.run ) )
                            # A public IPv4 address: not this-network, private (RFC 1918), shared (100.64/10, which
                            # Tailscale uses), loopback, link-local, benchmarking, or multicast and above. The
                            # documentation ranges (192.0.2/24, 198.51.100/24, 203.0.113/24) count as public.
                            (?<pubip4> (?! (?:0|10|127)\. | 169\.254\. | 172\.(?:1[6-9]|2\d|3[01])\. | 192\.168\.
                                | 100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\. | 198\.1[89]\. | (?:22[4-9]|2[3-5]\d)\. )
                              (?&oct) (?:\.(?&oct)){3} )
                            # A global unicast IPv6 literal (2000::/3).
                            (?<pubip6> \[ [23][0-9A-Fa-f]{0,3} : [0-9A-Fa-f:.]*+ \] )
                            # Names that only resolve on this machine or a private network: localhost, mDNS, the
                            # reserved .internal TLD, home and corporate LANs, Tailscale MagicDNS, Consul's service DNS,
                            # and other suffixes seen in committed agent configs that are not delegated TLDs (IANA root
                            # zone list, version 2026102500), so no public DNS answers for them.
                            (?<private> (?i: localhost | local | internal | lan | home\.arpa | corp | home | intranet
                              | private | ts\.net | consul | proxy | lab | wg | monitor | hammernet ) )
                            # A URL scheme starts here: not inside a longer scheme such as git+https. ${VAR:-https://...}
                            # puts a - right before it.
                            (?<url> (?<![A-Za-z0-9+.]) )
                          )
                          ^ .*? (?:
                              # A URL whose host is a tunnel or callback service, or a raw public IP address.
                              (?&url) (?i:https?|wss?) :// (?&userinfo)
                              (?: (?:(?&lbl)\.)* (?&tunnel) \.? | (?&pubip4) | (?&pubip6) ) (?&he)
                              # A bare tunnel host name, as in --host <name>.trycloudflare.com.
                            | (?<![A-Za-z0-9_.@/-]) (?:(?&lbl)\.)* (?&tunnel) \.? (?&he)
                          )
                # The server's endpoint.
                - patterns:
                    - pattern: 'url: $V'
                    - metavariable-regex:
                        metavariable: $V
                        regex: |-
                          ^(?:"[^\n]*"|'[^\n]*'|(?![-?:]\s|[\[{|>&*!%@`])(?:(?!:(?:\s|$)|\s\#)[^\n])*)$
                    - metavariable-regex:
                        metavariable: $V
                        regex: |-
                          (?x)
                          (?(DEFINE)
                            (?<oct> 25[0-5] | 2[0-4]\d | 1\d\d | [1-9]?\d )
                            # Where a host ends: a port, path, query, fragment, quote, separator, or the end.
                            (?<he> (?= [:/?\#"'\\\s,;)\]}] | $ ) )
                            # A DNS label. _ and labels past 63 characters are allowed on purpose: testbed payloads
                            # use names under real tunnel domains that can never resolve.
                            (?<lbl> [A-Za-z0-9_-]++ )
                            (?<userinfo> (?: [^\s"'/@?\#\\]*+ @ )?+ )
                            # Tunnel and out-of-band callback services: each name is a machine or listener that someone
                            # started for the moment, not a service anyone vouches for (sources in the rule's references).
                            (?<tunnel> (?i: trycloudflare\.com                          # Cloudflare quick tunnels
                              | ngrok-free\.(?:app|dev|pizza) | ngrok\.(?:app|dev|io|pizza) # ngrok
                              | loca\.lt | localtunnel\.me                                # localtunnel
                              | lhr\.life | lhr\.rocks                                    # localhost.run
                              | serveo\.net | serveousercontent\.com                      # Serveo
                              | pinggy(?:-free)?\.link                                    # Pinggy
                              | tunnelmole\.net | bore\.pub | loclx\.io                   # Tunnelmole, bore, LocalXpose
                              | devtunnels\.ms | app\.github\.dev                         # Dev Tunnels, Codespaces ports
                              | oast\.(?:pro|live|site|online|fun|me)                     # Interactsh
                              | oastify\.com | burpcollaborator\.net ) )                 # Burp Collaborator
                            # Free hosting platforms' default subdomains (sources in the rule's references).
                            (?<paas> (?i: onrender\.com | fly\.dev | herokuapp\.com | vercel\.app | netlify\.app
                              | railway\.app | workers\.dev | deno\.dev | deno\.net | replit\.app | koyeb\.app | hf\.space
                              | modal\.run ) )
                            # A public IPv4 address: not this-network, private (RFC 1918), shared (100.64/10, which
                            # Tailscale uses), loopback, link-local, benchmarking, or multicast and above. The
                            # documentation ranges (192.0.2/24, 198.51.100/24, 203.0.113/24) count as public.
                            (?<pubip4> (?! (?:0|10|127)\. | 169\.254\. | 172\.(?:1[6-9]|2\d|3[01])\. | 192\.168\.
                                | 100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\. | 198\.1[89]\. | (?:22[4-9]|2[3-5]\d)\. )
                              (?&oct) (?:\.(?&oct)){3} )
                            # A global unicast IPv6 literal (2000::/3).
                            (?<pubip6> \[ [23][0-9A-Fa-f]{0,3} : [0-9A-Fa-f:.]*+ \] )
                            # Names that only resolve on this machine or a private network: localhost, mDNS, the
                            # reserved .internal TLD, home and corporate LANs, Tailscale MagicDNS, Consul's service DNS,
                            # and other suffixes seen in committed agent configs that are not delegated TLDs (IANA root
                            # zone list, version 2026102500), so no public DNS answers for them.
                            (?<private> (?i: localhost | local | internal | lan | home\.arpa | corp | home | intranet
                              | private | ts\.net | consul | proxy | lab | wg | monitor | hammernet ) )
                            # A URL scheme starts here: not inside a longer scheme such as git+https. ${VAR:-https://...}
                            # puts a - right before it.
                            (?<url> (?<![A-Za-z0-9+.]) )
                          )
                          # Plain http:// or ws:// to a public host name or IP. Single-label names (docker compose and
                          # Kubernetes services), private names, and private or loopback addresses are left alone.
                          ^ .*? (?&url) (?i:http|ws) :// (?&userinfo)
                          (?: (?! (?:(?&lbl)\.)* (?&private) \.? (?&he) ) (?:(?&lbl)\.)+ [A-Za-z][A-Za-z0-9-]*+ \.?
                            | (?&pubip4) | (?&pubip6) ) (?&he)
                # A stdio bridge to a remote server: the endpoint is one of its arguments.
                - patterns:
                    - pattern-either:
                        - pattern-inside: |
                            command: $B
                            ...
                        - pattern-inside: 'args: [..., $B, ...]'
                    - metavariable-regex:
                        metavariable: $B
                        regex: |-
                          (?i)^["']?(?:[^"'\s]*[/\\])?(?:mcp-remote|mcp-proxy|supergateway)(?:[@:=][^"'\s/\\]*)?(?:\.cmd|\.exe)?["']?$
                    - pattern-inside: 'args: [...]'
                    - pattern: $V
                    - metavariable-regex:
                        metavariable: $V
                        regex: |-
                          ^(?:"[^\n]*"|'[^\n]*'|(?![-?:]\s|[\[{|>&*!%@`])(?:(?!:(?:\s|$)|\s\#)[^\n])*)$
                    - metavariable-regex:
                        metavariable: $V
                        regex: |-
                          (?x)
                          (?(DEFINE)
                            (?<oct> 25[0-5] | 2[0-4]\d | 1\d\d | [1-9]?\d )
                            # Where a host ends: a port, path, query, fragment, quote, separator, or the end.
                            (?<he> (?= [:/?\#"'\\\s,;)\]}] | $ ) )
                            # A DNS label. _ and labels past 63 characters are allowed on purpose: testbed payloads
                            # use names under real tunnel domains that can never resolve.
                            (?<lbl> [A-Za-z0-9_-]++ )
                            (?<userinfo> (?: [^\s"'/@?\#\\]*+ @ )?+ )
                            # Tunnel and out-of-band callback services: each name is a machine or listener that someone
                            # started for the moment, not a service anyone vouches for (sources in the rule's references).
                            (?<tunnel> (?i: trycloudflare\.com                          # Cloudflare quick tunnels
                              | ngrok-free\.(?:app|dev|pizza) | ngrok\.(?:app|dev|io|pizza) # ngrok
                              | loca\.lt | localtunnel\.me                                # localtunnel
                              | lhr\.life | lhr\.rocks                                    # localhost.run
                              | serveo\.net | serveousercontent\.com                      # Serveo
                              | pinggy(?:-free)?\.link                                    # Pinggy
                              | tunnelmole\.net | bore\.pub | loclx\.io                   # Tunnelmole, bore, LocalXpose
                              | devtunnels\.ms | app\.github\.dev                         # Dev Tunnels, Codespaces ports
                              | oast\.(?:pro|live|site|online|fun|me)                     # Interactsh
                              | oastify\.com | burpcollaborator\.net ) )                 # Burp Collaborator
                            # Free hosting platforms' default subdomains (sources in the rule's references).
                            (?<paas> (?i: onrender\.com | fly\.dev | herokuapp\.com | vercel\.app | netlify\.app
                              | railway\.app | workers\.dev | deno\.dev | deno\.net | replit\.app | koyeb\.app | hf\.space
                              | modal\.run ) )
                            # A public IPv4 address: not this-network, private (RFC 1918), shared (100.64/10, which
                            # Tailscale uses), loopback, link-local, benchmarking, or multicast and above. The
                            # documentation ranges (192.0.2/24, 198.51.100/24, 203.0.113/24) count as public.
                            (?<pubip4> (?! (?:0|10|127)\. | 169\.254\. | 172\.(?:1[6-9]|2\d|3[01])\. | 192\.168\.
                                | 100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\. | 198\.1[89]\. | (?:22[4-9]|2[3-5]\d)\. )
                              (?&oct) (?:\.(?&oct)){3} )
                            # A global unicast IPv6 literal (2000::/3).
                            (?<pubip6> \[ [23][0-9A-Fa-f]{0,3} : [0-9A-Fa-f:.]*+ \] )
                            # Names that only resolve on this machine or a private network: localhost, mDNS, the
                            # reserved .internal TLD, home and corporate LANs, Tailscale MagicDNS, Consul's service DNS,
                            # and other suffixes seen in committed agent configs that are not delegated TLDs (IANA root
                            # zone list, version 2026102500), so no public DNS answers for them.
                            (?<private> (?i: localhost | local | internal | lan | home\.arpa | corp | home | intranet
                              | private | ts\.net | consul | proxy | lab | wg | monitor | hammernet ) )
                            # A URL scheme starts here: not inside a longer scheme such as git+https. ${VAR:-https://...}
                            # puts a - right before it.
                            (?<url> (?<![A-Za-z0-9+.]) )
                          )
                          # Plain http:// or ws:// to a public host name or IP. Single-label names (docker compose and
                          # Kubernetes services), private names, and private or loopback addresses are left alone.
                          ^ .*? (?&url) (?i:http|ws) :// (?&userinfo)
                          (?: (?! (?:(?&lbl)\.)* (?&private) \.? (?&he) ) (?:(?&lbl)\.)+ [A-Za-z][A-Za-z0-9-]*+ \.?
                            | (?&pubip4) | (?&pubip6) ) (?&he)
      - focus-metavariable: $V
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
      owasp-mcp:
        - "MCP09:2025 - Shadow MCP Servers"
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
      owasp-aisvs:
        - "v1.01-C10.1.1 - Component Integrity"
        - "v1.01-C10.3.1 - Secure Transport"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      # Tunnel and callback hosts and raw public IPs are almost never a vetted server; plain
      # http to a public name is cleartext whatever the network.
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, claude-code]
      references:
        - https://www.pillar.security/blog/deadbugz-currently-active-mcp-supply-chain-campaign
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP04-2025%E2%80%93Software-Supply-Chain-Attacks%26Dependency-Tampering.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
        - https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/do-more-with-tunnels/trycloudflare/
        - https://ngrok.com/docs/universal-gateway/domains
        - https://github.com/localtunnel/localtunnel/blob/master/README.md
        - https://localhost.run/docs/custom-domains
        - https://serveo.net/docs
        - https://pinggy.io/docs/http_tunnels/
        - https://github.com/robbie-cahill/tunnelmole-client/blob/main/README.md
        - https://github.com/ekzhang/bore/blob/main/README.md
        - https://localxpose.io/docs/tunnels/http
        - https://learn.microsoft.com/en-us/azure/developer/dev-tunnels/security
        - https://docs.github.com/en/codespaces/developing-in-a-codespace/forwarding-ports-in-your-codespace
        - https://github.com/projectdiscovery/interactsh/blob/main/README.md
        - https://portswigger.net/burp/documentation/desktop/settings/project/collaborator
        - https://code.claude.com/docs/en/sub-agents#scope-mcp-servers-to-a-subagent
        - https://code.claude.com/docs/en/sub-agents#inline-server-trust
        - https://code.claude.com/docs/en/mcp
        - https://github.com/geelen/mcp-remote/blob/373f7320f6afd1fdb00e0168826a3cea99102241/README.md
        - https://github.com/sparfenyuk/mcp-proxy/blob/701a0453487d1b28c8f9806ee4863674c70210dd/README.md
        - https://github.com/supercorp-ai/supergateway/blob/0797a8192f3712d572c740724c70cc01ae67f0a1/README.md
