rules:
  - id: project-mcp-server-no-prompt-devcontainer
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and VS Code starts it
      without asking. When VS Code creates the dev container it copies customizations.vscode.mcp
      into the container's user mcp.json, and servers there count as already trusted: they start
      inside the container, with the mounted workspace and any forwarded credentials, with no
      MCP trust prompt, and by default at the next chat message. Reopening the repository in its
      container is the only consent. A pull request that adds a server or edits a command
      therefore runs that program on every teammate's machine, with their credentials and the
      agent's tool access. Keep personal servers in user-level config, run shared ones from a
      pinned package (npx "pkg@1.2.3"), and review this file like code that runs on checkout (a
      CODEOWNERS entry).
    # VS Code docs (manage-mcp-servers, "Dev Container", read 2026-10-25): customizations.vscode.mcp
    # is written to the remote mcp.json when the container is created. VS Code 1.143.1: that file is
    # the remote-user scope (mcpWorkbenchService.getRemoteMcpConfigPath, StorageScope.PROFILE), which
    # InstalledMcpServersDiscovery registers as McpServerTrust.Kind.Trusted, and McpRegistry asks for
    # Workspace Trust only for workspace-scoped collections. Servers under customizations.vscode.settings
    # are not covered (not verified that VS Code migrates machine settings). Remote servers (url, no
    # command) run nothing locally and are left out.
    paths:
      include:
        - ".devcontainer/devcontainer.json"
        - ".devcontainer.json"
        - ".devcontainer/*/devcontainer.json"
    patterns:
      - pattern-inside: '"customizations": {...}'
      - pattern-inside: '"vscode": {...}'
      - pattern-not-inside: '"settings": {...}'
      - pattern-inside: '"mcp": {...}'
      - pattern-inside: '"servers": {...}'
      - pattern-inside: '"$NAME": {..., "command": $C, ...}'
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, vscode, devcontainers]
      references:
        - https://code.visualstudio.com/docs/agents/run/manage-mcp-servers#_mcp-server-trust
        - https://github.com/microsoft/vscode/blob/1.143.1/src/vs/workbench/contrib/mcp/browser/mcpWorkbenchService.ts
        - https://github.com/microsoft/vscode/blob/1.143.1/src/vs/workbench/contrib/mcp/common/discovery/installedMcpServersDiscovery.ts
        - https://github.com/microsoft/vscode/blob/1.143.1/src/vs/workbench/contrib/mcp/common/mcpRegistry.ts
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
