rules:
  - id: project-mcp-server-no-prompt-zed
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Zed starts it
      without asking. Zed applies a project's .zed/settings.json once the worktree is trusted,
      as most people do for a repository they clone, and then starts every enabled server in
      context_servers with no per-server prompt, also after a command changes. A pull request
      that adds a server or edits a command therefore runs that program on every teammate's
      machine, with their credentials and the agent's tool access. Keep personal servers in
      user-level config, run shared ones from a pinned package (npx "pkg@1.2.3"), and review
      this file like code that runs on checkout (a CODEOWNERS entry).
    # Zed v1.25.3: SettingsObserver.update_settings applies worktree settings only after
    # TrustedWorktrees.can_trust (project_settings.rs); ContextServerStore.maintain_servers then
    # starts every server whose "enabled" isn't false (the default is true) and restarts one whose
    # configuration changed (context_server_store.rs). Project settings go through the settings
    # migrator, so the older "command": {"path": ...} form still runs. Remote servers (url) run
    # nothing locally and are left out, as are agent_servers (external agents, not MCP servers).
    paths:
      include:
        - ".zed/settings.json"
    patterns:
      - pattern-inside: '"context_servers": {...}'
      - pattern-inside: '"$NAME": {..., "command": $C, ...}'
      # "enabled": false keeps the server stopped.
      - pattern-not-inside: '"$NAME": {..., "enabled": false, ...}'
      # "command": "npx", or the older "command": {"path": "npx", "args": [...]}.
      - pattern-either:
          - pattern: '"command": "$CMD"'
          - patterns:
              - pattern-inside: '"command": {...}'
              - pattern: '"path": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, zed]
      references:
        - https://github.com/zed-industries/zed/blob/v1.25.3/crates/project/src/project_settings.rs
        - https://github.com/zed-industries/zed/blob/v1.25.3/crates/project/src/context_server_store.rs
        - https://github.com/zed-industries/zed/blob/v1.25.3/crates/settings_content/src/project.rs
        - https://github.com/zed-industries/zed/blob/v1.25.3/crates/migrator/src/migrations/m_2025_06_27/settings.rs
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
