name: Repo MCP servers
version: 0.1.0
schema: v1
mcpServers:
  - name: Repo tools
    # ruleid: project-mcp-server-no-prompt-yaml
    command: node
    args: [scripts/repo-mcp.mjs]
  - name: Status
    # ruleid: project-mcp-server-no-prompt-yaml
    command: "uvx"
    args:
      - example-org-status-mcp==1.0.3
  - name: Docs
    type: streamable-http
    # ok: project-mcp-server-no-prompt-yaml
    url: https://mcp.example.com/docs
  - name: Unset
    # ok: project-mcp-server-no-prompt-yaml
    command: ""
prompts:
  - name: release
    # ok: project-mcp-server-no-prompt-yaml
    prompt: Draft the release notes.
