                          | \$HOME\b | \$\{HOME\} | \$\{env:(?:HOME|USERPROFILE)\} | \$env:(?:HOME|USERPROFILE)\b
                          | \$\{userHome\} | (?i:%HOMEDRIVE%)?+(?i:%HOMEPATH%)
                          | (?i:%(?:USERPROFILE|APPDATA|LOCALAPPDATA)%)
                          | (?:/mnt/[A-Za-z]|[A-Za-z]:)?+ (?&sep) (?:Users|home) (?&sep) [^/\\"'\n;&|`]++
                          | /root | /var/root )
                        (?=(?&sep)|["']?+$) )
                      # A script or program file name ending.
