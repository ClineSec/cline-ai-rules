                        | psm?1 | bat | cmd | vbs | exe | com | scr | rb | pl | php | lua | jar | wasm | so | dylib
                        | dll | bin | run | appimage | command ) )
                      # Where a script name ends inside a longer string.
                      (?<end> (?= [\s"'\\,;)&|`\]] | $ ) )
                      # A path starts the string, or follows a space, quote, = ( , ; & | ` or [.
