                    )
                    ^ .*? (?&start) (?&home) (?&sep) (?: (?&seg) (?&sep) )*?
                    (?: # A dot folder directly inside another dot folder (not one of those), then the script.
                        (?&hid) (?&sep) (?! (?&usual) (?&sep) ) (?&hid) (?&sep) (?: (?&seg) (?&sep) )*+
