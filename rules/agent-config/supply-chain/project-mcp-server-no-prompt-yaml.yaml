rules:
  - id: project-mcp-server-no-prompt-yaml
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [yaml]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Continue starts
      it without asking. Continue adds the mcpServers in a workspace's .continue/mcpServers/
      YAML blocks to every assistant, and starts a workspace agent or assistant file's servers
      once it's selected, with no per-server prompt, also after a command changes; the VS Code
      extension only waits for Workspace Trust, which most people give a repository they clone.
      A pull request that adds a server or edits a command therefore runs that program on every
      teammate's machine, with their credentials and the agent's tool access. Keep personal
      servers in user-level config, run shared ones from a pinned package (npx "pkg@1.2.3"), and
      review this file like code that runs on checkout (a CODEOWNERS entry).
    # Continue 5522c6f (VS Code extension 1.3.40): loadYaml injects the YAML blocks in every
    # workspace .continue/mcpServers/ folder into the selected assistant (injectBlocks), workspace
    # .continue/agents|assistants|configs files are assistants a user picks, and
    # MCPManagerSingleton.setConnections connects each server; the extension declares no
    # untrustedWorkspaces support, so VS Code keeps it off until Workspace Trust. Remote servers
    # (url, no command) run nothing locally and are left out.
    paths:
      include:
        # Continue (continue 5522c6f): ~/.continue/config.yaml, and block and agent files under
        # a workspace or home .continue/ folder (mcpServers/, agents/, assistants/, configs/).
        - ".continue/**/*.yaml"
        - ".continue/**/*.yml"
    patterns:
      - pattern-inside: 'mcpServers: [...]'
      - pattern: 'command: $CMD'
      # A scalar (not a nested mapping), and not blank.
      - metavariable-regex:
          metavariable: $CMD
          regex: |-
            ^(?:"[^\n]*"|'[^\n]*'|(?![-?:]\s|[\[{|>&*!%@`])(?:(?!:(?:\s|$)|\s\#)[^\n])*)$
      - metavariable-regex:
          metavariable: $CMD
          regex: ^["']?[ \t]*[^\s"']
      - focus-metavariable: $CMD
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, continue]
      references:
        - https://github.com/continuedev/continue/blob/5522c6f44ca0ac3528b37244818fbfa39b5af470/core/config/yaml/loadYaml.ts
        - https://github.com/continuedev/continue/blob/5522c6f44ca0ac3528b37244818fbfa39b5af470/core/config/loadLocalAssistants.ts
        - https://github.com/continuedev/continue/blob/5522c6f44ca0ac3528b37244818fbfa39b5af470/core/context/mcp/MCPManagerSingleton.ts
        - https://docs.continue.dev/customize/deep-dives/mcp
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
