rules:
  - id: project-mcp-server-no-prompt-gemini
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [json]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and Gemini CLI starts
      it without asking. Gemini CLI applies a workspace's .gemini/settings.json once the folder
      is trusted, as most people do for a repository they clone, and then connects to every
      server in mcpServers at startup with no per-server prompt, also after a command changes.
      The trust dialog lists server names, not what they run, and a run with
      GEMINI_CLI_TRUST_WORKSPACE=true, as in CI, skips it. A pull request that adds a server or
      edits a command therefore runs that program on every teammate's machine, with their
      credentials and the agent's tool access. Keep personal servers in user-level config, run
      shared ones from a pinned package (npx "pkg@1.2.3"), and review this file like code that
      runs on checkout (a CODEOWNERS entry).
    # Gemini CLI v0.65.0: settings.ts drops workspace settings unless the folder is trusted
    # (folder trust is on by default, utils/trust.ts); McpClientManager.maybeDiscoverMcpServer then
    # checks only the mcp.allowed / mcp.excluded lists (any settings scope, the workspace's
    # included), the user's own disable list and folder trust before it connects. FolderTrustDialog
    # lists the server names. A server this file excludes is left out; an allowlist that omits it
    # is not checked. Remote servers (url, httpUrl) run nothing locally and are left out.
    paths:
      include:
        - ".gemini/settings.json"
    patterns:
      - pattern-inside: '"mcpServers": {...}'
      - pattern-inside: '"$NAME": {..., "command": $C, ...}'
      # A server named in the same file's mcp.excluded list is never started.
      - pattern-not-inside: '{..., "mcp": {..., "excluded": [..., $NAME, ...], ...}, ...}'
      - pattern: '"command": "$CMD"'
      - metavariable-regex:
          metavariable: $CMD
          regex: \S
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, gemini-cli]
      references:
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/tools/mcp-client-manager.ts
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/cli/src/config/settings.ts
        - https://github.com/google-gemini/gemini-cli/blob/v0.65.0/packages/core/src/utils/trust.ts
        - https://geminicli.com/docs/tools/mcp-server/
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
