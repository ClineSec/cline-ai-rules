rules:
  - id: project-mcp-server-no-prompt-opencode
    # Generated by scripts/gen_project_mcp_no_prompt.py, which writes the
    # project-mcp-server-no-prompt rules for clients other than VS Code and Claude Code. Edit the
    # script and run scripts/build.py; build.py --check fails if this file drifts.
    languages: [regex]
    severity: WARNING
    message: >-
      This committed MCP server runs a program on the developer's machine, and opencode or Kilo
      Code starts it without asking. opencode and the Kilo CLI read this file from the working
      directory up to the repository root (opencode.json(c) and .opencode/ for opencode;
      kilo.json(c), opencode.json(c), .kilo/ and .kilocode/ for Kilo) with no trust check at
      all, and start every local server in mcp that isn't "enabled": false at startup, with no
      per-server prompt. Kilo's VS Code extension does the same once the workspace is trusted. A
      pull request that adds a server or edits a command therefore runs that program on every
      teammate's machine, with their credentials and the agent's tool access. Keep personal
      servers in user-level config, run shared ones from a pinned package (npx "pkg@1.2.3"), and
      review this file like code that runs on checkout (a CODEOWNERS entry).
    # opencode v1.19.4 (packages/opencode/src/config/config.ts, config/paths.ts): project
    # opencode.json(c) files and .opencode/ folders are found from the working directory up to the
    # worktree root and merged, unless OPENCODE_DISABLE_PROJECT_CONFIG is set; nothing checks trust,
    # and MCP.create (mcp/index.ts) starts every local server unless "enabled": false. Kilo v7.8.17
    # adds kilo.json(c) and the .kilo/ and .kilocode/ folders and treats project config as untrusted
    # only for {env:} / {file:} substitution and MCP headers. Regex, not JSON: these files are
    # often .jsonc, which OpenGrep's JSON parser skips. Remote servers (type remote, url) run
    # nothing locally and are left out.
    paths:
      include:
        - "opencode.json"
        - "opencode.jsonc"
        - "kilo.json"
        - "kilo.jsonc"
    patterns:
      # $MCP is the "mcp" object, found by a line walker that skips comments and strings.
      - pattern-regex: |-
          (?m)(?:^|\G)(?:[^"/\n]|/(?![/*])|/\*(?:(?!\*/)[^\n])*+\*/|"(?:[^"\\\n]|\\.)*+")*?"mcp"\s*+:\s*+(?<MCP>\{(?:[^{}"/]++|"(?:[^"\\]|\\.)*+"|//[^\n]*+|/\*(?s:.*?)\*/|/|(?&MCP))*+\})
      - metavariable-pattern:
          metavariable: $MCP
          language: regex
          patterns:
            # $SRV is one server object, a direct member of "mcp".
            - pattern-regex: |-
                (?m)(?:^|\G)(?:[^"/\n]|/(?![/*])|/\*(?:(?!\*/)[^\n])*+\*/|"(?:[^"\\\n]|\\.)*+")*?"(?!servers")[^"\\\n]*+"\s*+:\s*+(?<SRV>\{(?:[^{}"/]++|"(?:[^"\\]|\\.)*+"|//[^\n]*+|/\*(?s:.*?)\*/|/|(?&SRV))*+\})
            - metavariable-regex:
                metavariable: $SRV
                regex: (?s).
            - metavariable-pattern:
                metavariable: $SRV
                language: regex
                patterns:
                  - pattern-regex: |-
                      (?x)
                      (?(DEFINE)
                        (?<ws> (?: \s++ | //[^\n]*+ | /\*(?s:.*?)\*/ )*+ )
                        (?<str> "(?:[^"\\]|\\.)*+" )
                        (?<obj> \{ (?: [^{}"/]++ | (?&str) | //[^\n]*+ | /\*(?s:.*?)\*/ | / | (?&obj) )*+ \} )
                        (?<arr> \[ (?: [^\[\]"/]++ | (?&str) | //[^\n]*+ | /\*(?s:.*?)\*/ | / | (?&arr) )*+ \] )
                        (?<val> (?&str) | (?&obj) | (?&arr) | [^,{}\[\]"/\s]++ )
                        (?<mem> (?&ws) (?&str) (?&ws) : (?&ws) (?&val) (?&ws) , )
                      )
                      \A \{
                      (?! (?&mem)*? (?&ws) "enabled" (?&ws) : (?&ws) false \b )
                      (?&mem)*? (?&ws)
                      (?<CMD> "command" (?&ws) : (?&ws) \[ (?&ws) " [ \t]*+ [^"\s] )
      - focus-metavariable: $CMD
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
      owasp-agentic:
        - "ASI04 - Agentic Supply Chain Vulnerabilities"
        - "ASI05 - Unexpected Code Execution (RCE)"
      owasp-mcp:
        - "MCP04:2025 - Software Supply Chain Attacks & Dependency Tampering"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.1.2 - Component Integrity"
      mitre-atlas:
        - "AML.T0010.005 - AI Supply Chain Compromise: AI Agent Tool"
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      # Committing a team's MCP servers is common and usually intended; the finding marks a
      # file whose changes run code on checkout, not a mistake.
      confidence: LOW
      likelihood: LOW
      impact: HIGH
      technology: [mcp, opencode, kilo-code]
      references:
        - https://github.com/sst/opencode/blob/v1.19.4/packages/opencode/src/config/config.ts
        - https://github.com/sst/opencode/blob/v1.19.4/packages/opencode/src/config/paths.ts
        - https://github.com/sst/opencode/blob/v1.19.4/packages/opencode/src/mcp/index.ts
        - https://github.com/Kilo-Org/kilocode/blob/v7.8.17/packages/opencode/src/config/config.ts
        - https://opencode.ai/docs/mcp-servers/
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
