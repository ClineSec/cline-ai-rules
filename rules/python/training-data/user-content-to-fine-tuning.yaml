rules:
  - id: user-content-to-fine-tuning
    # Generated by scripts/gen_user_content_to_fine_tuning.py. The pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt's request-data sources and
    # lookup sanitizers, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # SDKs checked 2026-10-24: openai 3.37.0 (resources/files.py, resources/uploads/,
    # types/file_purpose.py), mistralai 3.4.0 (client/files.py), together 3.0.0
    # (resources/files.py), transformers 5.20.2 (trainer.py), trl 1.16.0
    # (trainer/*_trainer.py), datasets 5.1.0.
    languages: [python]
    severity: WARNING
    paths:
      exclude:
        - admin.py
        - "*/admin/*.py"
        - "*/admin/**/*.py"
    message: >-
      Request data (an uploaded file, a feedback form, a conversation the client sends back)
      goes straight into fine-tuning or training data:
      a file uploaded with `purpose="fine-tune"`, a trainer's `train_dataset`, or a
      file named like training data. Anyone who can call this endpoint writes training examples, so they can plant a
      trigger phrase that unlocks a behavior, teach wrong answers, or forge the assistant's side
      of a conversation, and the next fine-tune passes that on to every user of the model
      (OWASP LLM05, scenario 3). Store submissions for review and build training files only
      from records a person approved, using transcripts the server kept rather than turns the
      client sent back. If each customer fine-tunes a model only they use, this is the
      intended flow.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Flask (Werkzeug), Django, Django REST
      # framework, and Starlette / FastAPI. request.args, request.get_json(), request.POST,
      # request.data, await request.json(), request.query_params, self.request.GET.
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:self\.|flask\.)?(?:\w+_)?(?:request|req)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:args|form|values|json|get_json|data|get_data|files|cookies|headers|view_args|url|full_path|path|path_info|query_string|GET|POST|COOKIES|META|FILES|body|query_params|path_params)$
      # Messages read from a FastAPI / Starlette WebSocket.
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: |-
                ^(?:self\.)?(?:\w+_)?(?:websocket|ws)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:receive_text|receive_json|receive_bytes|iter_text|iter_json|iter_bytes)$
      # Route handler parameters (FastAPI path, query, and body parameters; Flask URL
      # variables). Skipped: parameters typed int, float, bool, UUID, a date, Literal[...], or an
      # Enum defined in the file, which FastAPI validates before the call; dependencies
      # (Depends(...), Security(...), a *Dep alias); and the Request, WebSocket, Response,
      # BackgroundTasks, and SecurityScopes objects FastAPI injects. Request data read from those
      # is covered above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P = $DEFAULT, ...): ...
              - patterns:
                  - pattern: |
                      def $F(..., $P = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - patterns:
                          - pattern: |
                              def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                          - metavariable-regex:
                              metavariable: $DEFAULT
                              regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: >-
                        ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float|bool|(?:uuid\.)?UUID|(?:datetime\.)?(?:date|datetime|time|timedelta)|(?:decimal\.)?Decimal|(?:typing\.)?Literal\[|(?:fastapi\.|starlette\.\w+\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)\b)|.*\b(?:Depends|Security)\(|[\w.]*Deps?$)
                  - pattern-not-inside: |
                      class $TYPE(..., enum.Enum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.StrEnum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.IntEnum, ...):
                        ...
                      ...
          - focus-metavariable: $P
    pattern-propagators:
      # Rows collected into a list taint the list: rows.append({...}), then Dataset.from_list(rows).
      - pattern: $L.append($X)
        from: $X
        to: $L
      - pattern: $L.extend($X)
        from: $X
        to: $L
      # A dataset mapped or filtered stays tainted: ds.map(tokenize, batched=True). With
      # --taint-intrafile, OpenGrep models map / filter as calls of the callback and drops the
      # receiver's taint when there are other arguments; propagating to the call itself keeps
      # `return ds.map(...)` and `ds = ds.map(...)` tainted.
      - patterns:
          - pattern: $DS.$DSM(...)
          - metavariable-regex:
              metavariable: $DSM
              regex: ^(?:map|filter)$
          - pattern: $DSCALL
          # $DSCALL also binds every expression inside the call (a tokenizer the callback
          # uses); keep only the call itself.
          - metavariable-regex:
              metavariable: $DSCALL
              regex: |-
                (?s)^.+\.(?:map|filter)\(.*\)$
        from: $DS
        to: $DSCALL
      # A saved upload puts the caller's bytes at a path (Werkzeug FileStorage.save), so a
      # later open(path, "rb") counts.
      - pattern: $UP.save($P, ...)
        from: $UP
        to: $P
      # Text written to a scratch file taints its path, so uploading that file later counts:
      # with open(tmp, "w") as f: f.write(jsonl). A training-data path is a sink of its own.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  with open($P, ...) as $F:
                    ...
              - pattern-inside: |
                  with $P.open(...) as $F:
                    ...
          - pattern-either:
              - pattern: $F.write($X)
              - pattern: $F.writelines($X)
              - pattern: json.dump($X, $F, ...)
          - metavariable-regex:
              metavariable: $P
              regex: |-
                ^(?!(?s).*(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z]))
        from: $X
        to: $P
      - patterns:
          - pattern-either:
              - pattern: $P.write_text($X, ...)
              - pattern: $P.write_bytes($X, ...)
          - metavariable-regex:
              metavariable: $P
              regex: |-
                ^(?!(?s).*(?<![a-zA-Z])(?:[tT][rR][aA][iI][nN](?:[iI][nN][gG]|[sS][eE][tT])?|[fF][iI][nN][eE][-_ ]?[tT][uU][nN](?:[eE]|[iI][nN][gG])|[sS][fF][tT]|[dD][pP][oO]|[rR][lL][hH][fF])(?![a-zA-Z]))
        from: $X
        to: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone, TONES["formal"]). The table is
      # the application's own text, whatever key the caller sends.
      # The default must be constant too: TONES.get(tone, tone) hands the caller's text back.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
              - patterns:
                  - pattern: $D.get($K, $DEF)
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: |-
                        ^(?:[rRbBuU]*[\"']|None$|-?\d|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*(?:\[|\.get\(|$))
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if tone not in ALLOWED_TONES: raise HTTPException(...)`.
      # Only the left operand, and not a blocklist (`if persona in BLOCKED: ...`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $ALLOWED
              - pattern: $X not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check before use, anchored at both ends: re.fullmatch(r"[a-z]{2}(-[A-Z]{2})?", locale).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($PAT, $X, ...)
              - pattern: $RE.fullmatch($X, ...)
              - patterns:
                  - pattern: re.match($PAT, $X, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^[rRbB]*["'].*(?:\$|\\Z)["']$
          - focus-metavariable: $X
      # Fields of a pydantic model in this file that are validated to a fixed set or a number
      # (`tone: Literal["formal", "casual"]`, `max_words: int`, or `tone: Tone` for an Enum),
      # read from a route parameter typed with that model.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $FT
              regex: |-
                ^(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:(?:typing\.)?Literal\[|int\b|float\b|bool\b|(?:uuid\.)?UUID\b)
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $FT(..., enum.Enum, ...):
                    ...
                  ...
              - pattern-inside: |
                  class $FT(..., enum.StrEnum, ...):
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - exact: true
        pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: uuid.UUID(...)
      # A lookup keyed by request data returns stored data, not the caller's text: an ORM or
      # SQL query, a vector-store or retriever search, an HTTP fetch, a get_/fetch_/find_ helper.
      # (What a lookup returns is fetched-content-in-system-prompt's, an indirect injection.)
      # `exact` keeps a sink inside the call's own arguments, and calls that are themselves a
      # system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w.]*\.)?(?:get_object_or_404|get_list_or_404|a?(?:get|fetch|find|load|lookup|search|retrieve|query|select)_\w+)$
                  # Not the request's own readers: request.get_json(), request.get_data().
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents|execute|scalars?|scalar_one\w*|first|one|one_or_none|fetchone|fetchall|fetchmany|filter|filter_by|get_or_none|get_or_create)$
              - pattern: $MODEL.objects.$M(...)
              - patterns:
                  - pattern: $S.get($MODEL, ...)
                  - metavariable-regex:
                      metavariable: $MODEL
                      regex: ^(?:[\w.]*\.)?[A-Z][a-z]\w*$
              - patterns:
                  - pattern-either:
                      - pattern: $O.invoke(...)
                      - pattern: $O.ainvoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?\w*(?:retriever|vector_?store|vectordb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.asearch(...)
                      - pattern: $O.retrieve(...)
                      - pattern: $O.aretrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?(?:\w*retriever|(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus|\w*tavily\w*))$
              - pattern: requests.$M(...)
              - pattern: httpx.$M(...)
              - pattern: urlopen(...)
              - pattern: urllib.request.urlopen(...)
          - pattern-not: $G(..., system_prompt=$X, ...)
          - pattern-not: $G(..., system_instruction=$X, ...)
          - pattern-not: $G(..., system_message=$X, ...)
          - pattern-not: $G(..., instructions=$X, ...)
          - pattern-not: $G(..., system=$X, ...)
          - pattern-not: $G(..., role=$X, ...)
    pattern-sinks:
      # A file uploaded for fine-tuning: OpenAI (and Azure OpenAI) files.create(file=...,
      # purpose="fine-tune"), uploads.upload_file_chunked(...), and the parts of an upload
      # created for fine-tuning; Mistral files.upload(file={...}, purpose="fine-tune"); Together
      # files.upload(file), whose purpose defaults to "fine-tune". The purpose may be a module
      # constant. Fine-tuning jobs take a file ID, which this reports where the file is made.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $C.files.$M(..., purpose="fine-tune", ...)
                  - pattern: $C.files.$M(..., file=$X, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:create|upload)$
              - patterns:
                  - pattern-inside: $C.uploads.upload_file_chunked(..., purpose="fine-tune", ...)
                  - pattern: $C.uploads.upload_file_chunked(..., file=$X, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $U = $C.uploads.create(..., purpose="fine-tune", ...)
                          ...
                      - pattern-inside: |
                          $U = await $C.uploads.create(..., purpose="fine-tune", ...)
                          ...
                  - pattern: $C2.uploads.parts.create(..., data=$X, ...)
              - patterns:
                  - pattern-regex: |-
                      (?sm)\A(?=.*?^[ \t]*+(?:from[ \t]++together\b|import[ \t]++together\b)).*
                  - pattern-either:
                      - pattern: $C.files.upload($X, ...)
                      - pattern: $C.files.upload(..., file=$X, ...)
                  - pattern-not: $C.files.upload(..., purpose=$P, ...)
          - focus-metavariable: $X
          # Handlers only an administrator can call: that is how vetted datasets get in.
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMDEC
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC(...)
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC(...)
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMDEC
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMARG, ...)
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMARG, ...)
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMKW=$ADMARG, ...)
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMKW=$ADMARG, ...)
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        def $ADMFN(..., $ADMP = $ADMDEP, ...): ...
                    - pattern-inside: |
                        async def $ADMFN(..., $ADMP = $ADMDEP, ...): ...
                    - pattern-inside: |
                        def $ADMFN(..., $ADMP: $ADMDEP, ...): ...
                    - pattern-inside: |
                        async def $ADMFN(..., $ADMP: $ADMDEP, ...): ...
                    - pattern-inside: |
                        def $ADMFN(..., $ADMP: $ADMT = $ADMDEP, ...): ...
                    - pattern-inside: |
                        async def $ADMFN(..., $ADMP: $ADMT = $ADMDEP, ...): ...
                - metavariable-regex:
                    metavariable: $ADMDEP
                    regex: |-
                      (?s).*\b(?:Depends|Security)\(\s*[\w.]*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    if not $ADMU.$ADMA:
                      ...
                    ...
                - metavariable-regex:
                    metavariable: $ADMA
                    regex: ^(?:is_admin|is_staff|is_superuser|admin|is_org_admin)$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $ADMCHK(...)
                        ...
                    - pattern-inside: |
                        await $ADMCHK(...)
                        ...
                - metavariable-regex:
                    metavariable: $ADMCHK
                    regex: ^(?:[\w.]*\.)?(?:require|ensure|assert|check|verify)_?(?:admin|staff|superuser)\w*$
          # A client built with the caller's own provider key fine-tunes the caller's own model.
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    $KC = $KCLS(..., api_key=$KEY, ...)
                    ...
                - pattern-either:
                    - pattern-inside: $KC.$KR.$KM(...)
                    - pattern-inside: $KC.$KR.$KS.$KM(...)
                - metavariable-regex:
                    metavariable: $KEY
                    regex: |-
                      (?is)^(?!.*(?:environ|getenv|settings|config)).*(?:^|[._\[\"'])(?:user|tenant|customer|account|org|organization|workspace|profile|request|req|body|payload|form)(?:$|[._\]\"'(])
      # The training set of a Hugging Face trainer: transformers Trainer, TRL SFTTrainer,
      # DPOTrainer, KTOTrainer, RewardTrainer, GRPOTrainer, sentence-transformers trainers.
      - patterns:
          - pattern: $TR(..., train_dataset=$X, ...)
          - metavariable-regex:
              metavariable: $TR
              regex: ^(?:[\w.]*\.)?(?:[A-Z]\w*)?Trainer$
          - focus-metavariable: $X
          # Handlers only an administrator can call: that is how vetted datasets get in.
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMDEC
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC(...)
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC(...)
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMDEC
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMARG, ...)
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMARG, ...)
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMKW=$ADMARG, ...)
                        def $ADMFN(...): ...
                    - pattern-inside: |
                        @$ADMDEC(..., $ADMKW=$ADMARG, ...)
                        async def $ADMFN(...): ...
                - metavariable-regex:
                    metavariable: $ADMARG
                    regex: |-
                      (?s).*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        def $ADMFN(..., $ADMP = $ADMDEP, ...): ...
                    - pattern-inside: |
                        async def $ADMFN(..., $ADMP = $ADMDEP, ...): ...
                    - pattern-inside: |
                        def $ADMFN(..., $ADMP: $ADMDEP, ...): ...
                    - pattern-inside: |
                        async def $ADMFN(..., $ADMP: $ADMDEP, ...): ...
                    - pattern-inside: |
                        def $ADMFN(..., $ADMP: $ADMT = $ADMDEP, ...): ...
                    - pattern-inside: |
                        async def $ADMFN(..., $ADMP: $ADMT = $ADMDEP, ...): ...
                - metavariable-regex:
                    metavariable: $ADMDEP
                    regex: |-
                      (?s).*\b(?:Depends|Security)\(\s*[\w.]*(?:[aA]dmin|ADMIN|[sS]taff|STAFF|[sS]uperuser|SUPERUSER)
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    if not $ADMU.$ADMA:
                      ...
                    ...
                - metavariable-regex:
                    metavariable: $ADMA
                    regex: ^(?:is_admin|is_staff|is_superuser|admin|is_org_admin)$
