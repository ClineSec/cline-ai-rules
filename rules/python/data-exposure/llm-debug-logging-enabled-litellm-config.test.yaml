model_list:
  - model_name: support-default
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
      # ok: llm-debug-logging-enabled-litellm-config
      set_verbose: true

litellm_settings:
  drop_params: true
  # ruleid: llm-debug-logging-enabled-litellm-config
  set_verbose: True
  request_timeout: 60

router_settings:
  routing_strategy: simple-shuffle
