# Generated by scripts/gen_tool_returns_environment.py from agent-tool-arg-to-shell (the tool handler
# shapes) and gen_secret_in_system_prompt.py (secret names). Edit those, or the script, not this file.
rules:
  - id: agent-tool-returns-environment
    # Agent-framework sibling of mcp-tool-returns-environment: the same sources, propagators, and
    # sanitizers, with agent-tool-arg-to-shell's tool shapes (langchain-core 1.6.13 @tool and
    # BaseTool._run, openai-agents 0.24.0 @function_tool, pydantic-ai 2.59.0 @agent.tool /
    # tool_plain, crewai 1.15.28 @tool), whose return value becomes the tool message the model reads.
    languages: [python]
    severity: ERROR
    message: >-
      An agent tool returns the process environment to the model: the whole environment (os.environ, a dotenv file, `env` or `printenv` output) or
      a variable named like a secret. What it returns goes into the model's context and the
      run's transcript, so every API key, token, and connection string the agent was started with can be
      repeated in a reply, written into another tool call, or sent somewhere by a prompt
      injection in anything the model reads, and it stays in provider and tracing logs. Return
      only the non-secret settings the tool needs, read by name (`{"tz": os.environ.get("TZ")}`), or say whether a
      secret is set rather than what it is.
    mode: taint
    options:
      # Only the propagators below carry the environment through a call: subprocess.run(env=env),
      # a client built from it, len(env), and bool(token) return clean values.
      taint_assume_safe_functions: true
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # The tool's arguments, unlabeled (__SOURCE__): only an environment lookup they name
      # (below) is reported, not an argument the tool echoes back. Copied from agent-tool-arg-to-shell, with
      # its allowlist sanitizers.
      # A tool function's parameters, which the model fills in. Parameters typed int, float,
      # bool, Literal[...] (or an alias of one assigned earlier in the file), a framework
      # context (RunContext, RunContextWrapper, ToolContext,
      # ToolRuntime, RunnableConfig), an Injected* argument the application supplies, or a
      # string constrained by an anchored pattern (Field(pattern=r"^...$")) are skipped: the
      # frameworks validate arguments against the annotation with pydantic before the call.
      - patterns:
          - pattern-either:
              # LangChain @tool (langchain_core.tools, re-exported by langchain.tools and,
              # before 1.0, langchain.agents), CrewAI @tool, OpenAI Agents SDK @function_tool.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          @$DEC
                          def $F(...): ...
                      - pattern-inside: |
                          @$DEC(...)
                          def $F(...): ...
                  - metavariable-pattern:
                      metavariable: $DEC
                      pattern-either:
                        - pattern: langchain_core.tools.tool
                        - pattern: langchain.tools.tool
                        - pattern: langchain.agents.tool
                        - pattern: crewai.tools.tool
                        - pattern: agents.function_tool
              # pydantic-ai: @agent.tool takes a RunContext first (pydantic-ai rejects a
              # context tool without one, and no MCP server SDK uses RunContext), and
              # @agent.tool_plain. mcp-tool-arg-to-shell skips the RunContext form.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          @$AGENT.tool
                          def $F(...): ...
                      - pattern-inside: |
                          @$AGENT.tool(...)
                          def $F(...): ...
                  - pattern-either:
                      - pattern-inside: |
                          def $F($CTX: pydantic_ai.RunContext, ...): ...
                      - pattern-inside: |
                          def $F($CTX: pydantic_ai.RunContext[...], ...): ...
              - pattern-inside: |
                  @$AGENT.tool_plain
                  def $F(...): ...
              - pattern-inside: |
                  @$AGENT.tool_plain(...)
                  def $F(...): ...
              # A plain function registered later in the file: StructuredTool.from_function(f),
              # Tool.from_function(func=f), function_tool(f), pydantic_ai.Tool(f),
              # Agent(tools=[f]), create_agent(model, tools=[f]), ToolNode([f]),
              # llm.bind_tools([f]), in a file that imports an agent framework. The regex covers
              # the def (decorators, signature, and indented body) and looks ahead for a call to
              # one of those names with F among its top-level arguments (bare, in a list, or as a
              # keyword's value); its F group must name the def below. A statement region from
              # each def to a later registration took 257 s on a 4,000-function file (OpenGrep
              # 1.30.2); the regex scans the rest of the file once per def, 5 s there. A paren
              # not preceded by e, l, n, s, or t can't end a registration callee, so the scan steps
              # over it before trying the callee names (20 s without that). The callee is matched
              # by name, so the import region stands in for resolving it; an MCP
              # add_tool(Tool.from_function(f)) is mcp-tool-arg-to-shell's.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          import $MOD
                          ...
                      - pattern-inside: |
                          from $MOD import $NAME
                          ...
                  - metavariable-regex:
                      metavariable: $MOD
                      regex: ^(?:langchain\w*|langgraph|agents|crewai|pydantic_ai)(?:\.|$)
                  - pattern-regex: >-
                      (?m)^(?<IND>[ \t]*+)(?:@[^\n]*+\n\k<IND>)*+(?:async[ \t]++)?def[ \t]++(?<F>\w++)\b[^\n]*+(?:\n(?:\k<IND>[ \t)\]][^\n]*+|[ \t]*+(?:\#[^\n]*+)?(?=\n|\z)))*+(?=(?:[^(]++|(?<![elnst])\(|(?<=add_tool|add_prompt|add_template)\(\s*+[\w.]*\.from_function\(|(?<!\.from_function|\bfunction_tool|\btool|\bTool|\bAgent|\bcreate_agent|\bcreate_react_agent|\bToolNode|\.bind_tools)\(|\((?!(?:[^()"'\w]++|(?:"(?:[^"\\\n]|\\.)*+"|'(?:[^'\\\n]|\\.)*+'|["'])|(?&pa)|(?!\k<F>\b(?!\s*+[(=]))\w++)*+\k<F>\b(?!\s*+[(=])))*+(?<=\.from_function|\bfunction_tool|\btool|\bTool|\bAgent|\bcreate_agent|\bcreate_react_agent|\bToolNode|\.bind_tools)\((?:[^()"'\w]++|(?:"(?:[^"\\\n]|\\.)*+"|'(?:[^'\\\n]|\\.)*+'|["'])|(?&pa)|(?!\k<F>\b(?!\s*+[(=]))\w++)*+\k<F>\b(?!\s*+[(=]))(?(DEFINE)(?<pa>\((?:[^()"']++|(?:"(?:[^"\\\n]|\\.)*+"|'(?:[^'\\\n]|\\.)*+'|["'])|(?&pa))*+\)))
              # LangChain and CrewAI BaseTool subclasses: _run / _arun get the arguments.
              - patterns:
                  - pattern-inside: |
                      class $C(..., $BASE, ...):
                          ...
                  - metavariable-pattern:
                      metavariable: $BASE
                      pattern-either:
                        - pattern: langchain_core.tools.BaseTool
                        - pattern: langchain.tools.BaseTool
                        - pattern: crewai.tools.BaseTool
                  - pattern-inside: |
                      def $F(...): ...
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^_a?run$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - pattern: |
                          def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:int|float|bool|(?:typing\.)?Literal\[|[\w.]*(?:Context|ContextWrapper|ToolRuntime|RunnableConfig)\b|(?:typing\.)?Optional\[[\w.]*CallbackManager)|.*\bInjected\w*|.*\bpattern\s*=\s*r?["']\^.*\$["'])
                  # A Literal alias assigned earlier in the block (Service = Literal["web", "db"],
                  # or Service: TypeAlias = ...) is as safe as the Literal written inline.
                  - pattern-not-inside: |
                      $TYPE = typing.Literal[...]
                      ...
                  - pattern-not-inside: |
                      $TYPE: $ALIAS_KIND = typing.Literal[...]
                      ...
                  - pattern-not-inside: |
                      $TYPE = typing_extensions.Literal[...]
                      ...
                  - pattern-not-inside: |
                      $TYPE: $ALIAS_KIND = typing_extensions.Literal[...]
                      ...
          - metavariable-regex:
              metavariable: $P
              regex: ^(?!(?:self|cls|run_manager)$)
          - focus-metavariable: $P
      # The whole environment as a value: os.environ returned, copied (dict(os.environ),
      # {**os.environ}, os.environ.copy()), serialized, or iterated for its items. A lookup, a
      # membership test, its length, and its keys alone are not its values.
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: os.environ
              - pattern: os.environb
          - pattern-not-inside: os.$ENV.$ATTR
          - pattern-not-inside: os.$ENV[$KEY]
          - pattern-not-inside: $KEY in os.$ENV
          - pattern-not-inside: $KEY not in os.$ENV
          - pattern-not-inside: len(os.$ENV)
          - pattern-not-inside: sorted(os.$ENV, ...)
          - pattern-not-inside: list(os.$ENV)
          - pattern-not-inside: set(os.$ENV)
          - pattern-not-inside: tuple(os.$ENV)
          - pattern-not-inside: |
              for $KEY in os.$ENV:
                ...
          - pattern-not-inside: '[$X for $KEY in os.$ENV]'
          - pattern-not-inside: '($X for $KEY in os.$ENV)'
      - label: ENV
        patterns:
          - pattern: os.$ENV.$METHOD()
          - metavariable-regex:
              metavariable: $ENV
              regex: ^environb?$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:copy|items|values)$
      # Every variable read back by name while iterating the names: {k: os.environ[k] for k in
      # sorted(os.environ)}, [f"{k}={os.getenv(k)}" for k in os.environ.keys()], filtered or not
      # (the filter sanitizers below decide whether a filter is enough).
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: '{$K: $V for $K in $XS}'
              - pattern: '[$V for $K in $XS]'
              - pattern: '($V for $K in $XS)'
              - pattern: '{$K: $V for $K in $XS if $C}'
              - pattern: '[$V for $K in $XS if $C]'
              - pattern: '($V for $K in $XS if $C)'
          - metavariable-regex:
              metavariable: $XS
              regex: |-
                ^(?!(?:\(\s*)*(?<p>\((?:[^()"'`]++|"(?:[^"\\]|\\.)*+"|'(?:[^'\\]|\\.)*+'|`(?:[^`\\]|\\.)*+`|(?&p))*+\))\s*+(?!=>|:|$|\)))
          - metavariable-pattern:
              metavariable: $XS
              patterns:
                - pattern-either:
                    - pattern: os.$ENV
                    - pattern: $FN(os.$ENV, ...)
                    - pattern: os.$ENV.keys()
                    - pattern: $FN(os.$ENV.keys(), ...)
                - metavariable-regex:
                    metavariable: $ENV
                    regex: ^environb?$
          - metavariable-pattern:
              metavariable: $V
              pattern-either:
                - pattern: os.environ[$K]
                - pattern: os.environ.get($K, ...)
                - pattern: os.getenv($K, ...)
      # A parsed .env file (python-dotenv), or another process's environment (psutil).
      - label: ENV
        pattern: dotenv.dotenv_values(...)
      - label: ENV
        pattern: dotenv.main.dotenv_values(...)
      - label: ENV
        pattern: psutil.Process(...).environ()
      - label: ENV
        patterns:
          - pattern-inside: |
              $PROC = psutil.Process(...)
              ...
          - pattern: $PROC.environ()
      # A command that prints the whole environment: subprocess.run(["env"]),
      # check_output("printenv"), os.popen("env"), create_subprocess_exec("printenv", ...).
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: $RUN([$CMD], ...)
              - pattern: $RUN($CMD, ...)
          - pattern-not: $RUN($CMD, $OPERAND, ...)
          - metavariable-regex:
              metavariable: $RUN
              regex: ^(?:subprocess\.(?:run|check_output|getoutput|getstatusoutput|Popen|call)|os\.popen|(?:asyncio\.)?create_subprocess_(?:exec|shell)|anyio\.(?:run_process|open_process))$
          - metavariable-regex:
              metavariable: $CMD
              regex: |-
                ^["'](?:/usr)?(?:/bin/)?(?:env|printenv)(?:\s+(?:-0|--null))?(?:\s*\|\s*sort)?["']$
      # The environment file of a process: open("/proc/self/environ"), Path(f"/proc/{pid}/environ").
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: pathlib.Path($PATH)
          - metavariable-regex:
              metavariable: $PATH
              regex: |-
                ^[fF]?["'`]/proc/(?:self|\d+|[$]?\{[^}"'`]+\})/environ["'`]$
      # One variable named like a secret: os.environ["GITHUB_TOKEN"], os.getenv("DB_PASSWORD").
      # The names are the ones secret-in-system-prompt treats as secrets.
      - label: ENV
        patterns:
          - pattern-either:
              - pattern: os.environ[$NAME]
              - pattern: os.environ.get($NAME, ...)
              - pattern: os.getenv($NAME, ...)
              - pattern: decouple.config($NAME, ...)
          - metavariable-regex:
              metavariable: $NAME
              regex: |-
                (?x)
                ^ ["'`] (?=[\w$.-]+ ["'`] $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) ["'`] $ )
                (?! (?i:pwd|dsn) ["'`] $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) ["'`] $
      # A variable the model names: os.environ.get(name), os.environ[name], os.getenv(name) with
      # a tool argument as the name, so a prompt injection can ask for AWS_SECRET_ACCESS_KEY.
      - label: ENV
        requires: __SOURCE__
        pattern-either:
          - pattern: os.environ.get($KEY, ...)
          - pattern: os.environ[$KEY]
          - pattern: os.getenv($KEY, ...)
          - pattern: decouple.config($KEY, ...)
      # A module-level snapshot (STARTUP_ENV = dict(os.environ)) used in a function or class
      # defined after it. With --taint-intrafile, OpenGrep drops module-level taint inside a
      # function the file never calls, so the name's later uses are sources too. The region
      # starts at the snapshot itself and runs to the end of its block: a region from any
      # assignment to each later def took 25 s on a module of 4,000 constants (OpenGrep 1.30.2).
      - label: ENV
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $G = dict(os.environ, ...)
                  ...
              - pattern-inside: |
                  $G = dict(os.environb, ...)
                  ...
              - pattern-inside: |
                  $G = os.environ
                  ...
              - pattern-inside: |
                  $G = os.environb
                  ...
              - pattern-inside: |
                  $G = os.environ.copy()
                  ...
              - pattern-inside: |
                  $G = os.environb.copy()
                  ...
              - pattern-inside: |
                  $G = {**os.environ, ...}
                  ...
              - pattern-inside: |
                  $G = {**os.environb, ...}
                  ...
              - pattern-inside: |
                  $G = dotenv_values(...)
                  ...
              - pattern-inside: |
                  $G = dotenv.dotenv_values(...)
                  ...
          - pattern-either:
              - pattern-inside: |
                  def $FN(...):
                    ...
              - pattern-inside: |
                  async def $FN(...):
                    ...
              - pattern-inside: |
                  class $CLS:
                    ...
          - metavariable-regex:
              metavariable: $G
              regex: ^[A-Z][A-Z0-9_]*$
          - pattern: $G
          - pattern-not-inside: $G[$KEY]
          - pattern-not-inside: $G.get(...)
          - pattern-not-inside: $G.keys()
          - pattern-not-inside: $KEY in $G
          - pattern-not-inside: $KEY not in $G
          - pattern-not-inside: len($G)
          - pattern-not-inside: sorted($G, ...)
          - pattern-not-inside: list($G)
          - pattern-not-inside: $G = $VALUE
    pattern-propagators:
      # Copies, serializations, and text built from a value carry it: dict(env),
      # json.dumps(env), sorted(env.items()), "\n".join(lines), out.decode(), pformat(env).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $FN($X, ...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: ^(?:dict|list|tuple|sorted|reversed|filter|str|repr|ascii|bytes|json\.dumps|pprint\.pformat|yaml\.(?:safe_)?dump|toml\.dumps|tomli_w\.dumps|orjson\.dumps|ujson\.dumps|dataclasses\.asdict|shlex\.join|shlex\.quote|base64\.(?:b64encode|urlsafe_b64encode|standard_b64encode|b32encode|b16encode|b85encode|encodebytes)|binascii\.(?:hexlify|b2a_hex|b2a_base64)|codecs\.encode|urllib\.parse\.(?:quote|quote_plus|urlencode)|html\.escape|zlib\.compress|gzip\.compress)$
              - patterns:
                  - pattern: $X.$METHOD(...)
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(?:copy|items|values|decode|encode|strip|rstrip|lstrip|read|read_text|read_bytes|readlines|splitlines|split|replace|communicate|getvalue|model_dump|model_dump_json|to_dict|upper|lower|casefold|title|swapcase|removeprefix|removesuffix|hex|ljust|rjust|zfill)$
              - pattern: filter($F, $X)
              - pattern: $SEP.join($X)
              - pattern: $FMT.format(..., $X, ...)
              - pattern: $FMT.format(..., $KW=$X, ...)
              - pattern: $FMT.format_map($X)
              - patterns:
                  - pattern-either:
                      - pattern: $CTOR(..., $X, ...)
                      - patterns:
                          - pattern: $CTOR(..., $KW=$X, ...)
                          - metavariable-regex:
                              metavariable: $KW
                              regex: ^(?!(?i:env|environ|environment|extra_env|.*(?:api_?key|token|secret|password|credentials?|headers|auth)\w*)$)
                  - metavariable-regex:
                      metavariable: $CTOR
                      regex: ^(?:[\w.]*\.)?[A-Z]\w*$
                  - metavariable-comparison:
                      comparison: not re.match("^(?:[a-zA-Z0-9_.]*[.])?(?:Popen|Process|Thread|Timer|[A-Z][a-zA-Z0-9_]*(?:Client|Session|Connection|Engine|Pool|Executor|Runner))$", str($CTOR))
          - pattern: $CALL
          - metavariable-regex:
              metavariable: $CALL
              regex: (?s)^.+\)$
        from: $X
        to: $CALL
      # A lookup keyed by a tool argument carries the argument to the lookup's value, where the
      # labeled source above turns it into the environment.
      - patterns:
          - pattern-either:
              - pattern: os.environ.get($X, ...)
              - pattern: os.getenv($X, ...)
              - pattern: decouple.config($X, ...)
          - pattern: $CALL
          - metavariable-regex:
              metavariable: $CALL
              regex: (?s)^.+\)$
        from: $X
        to: $CALL
      # A mapping filled from it: report.update(os.environ), and env.get("GITHUB_TOKEN").
      - pattern: $DICT.update($X)
        from: $X
        to: $DICT
      - patterns:
          - pattern: $X.get($NAME, ...)
          - pattern: $CALL
          - metavariable-regex:
              metavariable: $NAME
              regex: |-
                (?x)
                ^ ["'`] (?=[\w$.-]+ ["'`] $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) ["'`] $ )
                (?! (?i:pwd|dsn) ["'`] $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
