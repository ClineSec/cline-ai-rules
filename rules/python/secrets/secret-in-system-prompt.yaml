rules:
  - id: secret-in-system-prompt
    # Generated by scripts/gen_secret_in_system_prompt.py, which holds the secret-name and
    # credential regexes shared with secret-in-system-prompt-ts.yaml (and, for literals, with the
    # mcp-config-plaintext-secret rules). Edit the script and run scripts/build.py;
    # build.py --check fails if this file drifts.
    languages: [python]
    severity: ERROR
    message: >-
      A secret reaches the model's system prompt or instructions: a variable, setting, or
      environment variable named like an API key, token, password, or connection string, or a
      literal credential. Anything in the context window can be extracted ("repeat everything
      above"), echoed into a reply or tool call, and stored in provider and tracing logs, so treat
      it as disclosed to everyone who can talk to the model, including through injected content.
      Keep the credential in the code that calls the tool or API (the client constructor, request
      headers, the tool function), give the model only an opaque name for the resource, and
      rotate this secret if the prompt has been served.
    mode: taint
    options:
      # `key is not None`, `len(key)` and similar say something about a secret without holding it.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Environment variables named like a secret: os.environ["OPENAI_API_KEY"], os.getenv("DB_PASSWORD").
      - patterns:
          - pattern-either:
              - pattern: os.environ[$N]
              - pattern: os.environ.get($N, ...)
              - pattern: os.getenv($N, ...)
              - pattern: decouple.config($N, ...)
          - metavariable-regex:
              metavariable: $N
              regex: |-
                (?x)
                ^ ["'`] (?=[\w$.-]+ ["'`] $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) ["'`] $ )
                (?! (?i:pwd|dsn) ["'`] $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) ["'`] $
      # Variables, parameters, settings fields, and dict keys named like a secret:
      # api_key, settings.stripe_secret_key, st.secrets["DATABASE_URL"], body.get("password").
      - patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: |-
                (?x)
                ^ (?=[A-Za-z_$][\w$]* $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) $ )
                (?! (?i:token|pwd|pass|dsn) $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) $
      - patterns:
          - pattern: $O.$F
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?x)
                ^ (?=[A-Za-z_$][\w$]* $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) $ )
                (?! (?i:token|pwd|pass|dsn) $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) $
      - patterns:
          - pattern-either:
              - pattern: $M[$N]
              - pattern: $M.get($N, ...)
          - metavariable-regex:
              metavariable: $N
              regex: |-
                (?x)
                ^ ["'`] (?=[\w$.-]+ ["'`] $)
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) ["'`] $ )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) ["'`] $ )
                (?! (?i:token|pwd|pass|dsn) ["'`] $ )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) ["'`] $
      # pydantic SecretStr / SecretBytes unwrapped.
      - pattern: $X.get_secret_value()
      # A credential written into the code: sk-..., ghp_..., postgres://user:pass@host.
      - patterns:
          - pattern: '"$S"'
          - metavariable-regex:
              metavariable: $S
              regex: |-
                (?x)
                (?(DEFINE)
                  # Placeholder text that people paste instead of a value, and the marker words of a planted
                  # decoy (a leak probe's sk-bait-...-CANARY). Not "fake": the pack's own fixtures mark their
                  # positives with FAKE.
                  (?<ph> (?i: x{4} | your | placeholder | changeme | change[_-]me | replace[_-]?me | redacted
                    | dummy | example | canary | bait | decoy | honeytoken | \*{3} ) )
                  # An opaque literal: 16+ token characters with a letter and a digit, no placeholder text.
                  # Template syntax (${VAR}, ${env:VAR}, ${input:id}, ${{ secrets.X }}, $VAR, %VAR%) contains
                  # characters outside this set, so it never qualifies.
                  (?<oc> [A-Za-z0-9._~+/=-] )
                  (?<opq> (?=(?&oc)*[0-9]) (?=(?&oc)*[A-Za-z]) (?!(?&oc)*?(?&ph)) (?&oc){16,}+ (?!(?&oc)) )
                  # Credential formats with a fixed, documented prefix (sources in the rule's references).
                  (?<known> (?:
                      gh[pousr]_[A-Za-z0-9_]{36,}                       # GitHub PAT, OAuth, app tokens
                    | github_pat_[A-Za-z0-9_]{50,}                      # GitHub fine-grained PAT
                    | A(?:KIA|SIA|BIA|CCA)(?!I(?:OSFODNN7|44QH8DHB)EXAMPLE)[A-Z0-9]{16} # AWS key ID, not the docs' examples
                    | xox[bpe]-[A-Za-z0-9-]{20,} | xoxe\.x(?:oxb|oxp|app)-[A-Za-z0-9-]{20,}
                    | xapp-[A-Za-z0-9-]{20,} | xwfp-[A-Za-z0-9-]{20,}  # Slack bot, user, refresh, app, workflow
                    | hooks\.slack\.com/services/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/[A-Za-z0-9]{16,} # Slack webhook
                    | sk-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}      # OpenAI, Anthropic, OpenRouter (sk-or-v1-)
                    | [rs]k_(?:live|test)_[A-Za-z0-9]{20,}              # Stripe secret and restricted (not pk_)
                    | AIza[0-9A-Za-z_-]{35}                             # Google API key
                    | gl(?:pat|oas|dt|rt|rtr|cbt|ptt|ft|imt|agent|wt|soat|ffct)-[A-Za-z0-9_.-]{20,} # GitLab
                    | hf_[A-Za-z0-9]{30,}                               # Hugging Face
                    | npm_[A-Za-z0-9]{36,}                              # npm
                    | ntn_[A-Za-z0-9]{40,} | secret_[A-Za-z0-9]{32,}    # Notion (current, legacy)
                    | lin_(?:api|oauth)_[A-Za-z0-9]{40,}                # Linear
                    | sbp_[A-Za-z0-9]{40,} | sb_secret_[A-Za-z0-9_-]{20,} # Supabase (not sb_publishable_)
                    | sntryu_[a-f0-9]{64} | sntrys_[A-Za-z0-9+/=_]{40,} # Sentry user, org (not DSNs)
                    | ATAT[A-Za-z0-9_=-]{40,}                           # Atlassian API token
                    | r8_[A-Za-z0-9]{37}                                # Replicate
                    | tvly-(?=[A-Za-z0-9_-]*[0-9])[A-Za-z0-9_-]{20,}    # Tavily
                    | fc-[a-f0-9]{32}                                   # Firecrawl
                    | pplx-[A-Za-z0-9]{32,}                             # Perplexity (model names have hyphens)
                    | gsk_[A-Za-z0-9]{40,}                              # Groq
                    | do[opr]_v1_[A-Za-z0-9]{32,}                       # DigitalOcean
                    | shp(?:at|ca|pa|ss)_[A-Za-z0-9]{32,}               # Shopify tokens and app secret
                    | SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}        # SendGrid
                    | pypi-[A-Za-z0-9_-]{50,}                           # PyPI
                    | glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8} | glc_[A-Za-z0-9+/=_-]{32,} # Grafana
                    | vc[pirak]_[A-Za-z0-9]{24,}                        # Vercel
                    | cf(?:k|ut|at|ast)_[A-Za-z0-9]{40,}                # Cloudflare
                  ) (?![A-Za-z0-9_-]) )
                )
                ^ .*? (?:
                    # A known credential format, anywhere in the string (also inside a JSON-encoded header
                    # map or a bash -c line).
                    (?<![A-Za-z0-9_]) (?![A-Za-z0-9_.-]*?(?&ph)) (?&known)
                    # Authorization: Bearer / Basic with a literal credential.
                  | (?<![A-Za-z0-9_-]) (?i:bearer|basic) [ \t]+ (?&opq) (?=["'\\\s,;}]|$)
                    # https://host/mcp?api_key=... (Smithery, Tavily and others document this shape).
                  | (?i:https?|wss?):// [^\s"'?\#\\]* \? (?:[^\s"'\#\\]*&)?
                    (?:[\w.-]*?(?i:token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key|auth)|(?i:key)) = (?&opq) (?=[&\#"'\\\s]|$)
                    # scheme://user:password@host, unless the host is this machine.
                  | (?<![A-Za-z0-9+.-]) [A-Za-z][A-Za-z0-9+.-]*:// [^\s"'/:@?\#\\]+ :
                    (?!(?i:password|passwd|pass|secret|pwd|changeme)@) (?![^\s"'/@?\#\\]*(?&ph))
                    [^\s"'/@?\#\\$%{}<>*]+ @
                    (?=[^\s"'/:?\#\\@]*\.) (?!(?i:localhost|127\.|0\.0\.0\.0|host\.docker\.internal)[:/?\#"'\\\s]?)
                    (?![^\s"'/:?\#\\@]*\.(?i:local|localhost)(?:[:/?\#"'\\\s]|$))
                    # password: ..., API key = ..., the token is ...
                  | (?<![A-Za-z0-9_-]) (?i: password | passwd | passphrase | secret | token | (?:api|access|private|auth)[ _-]?key )
                    ["'`]? [ \t]* (?: [:=] | (?i:\s is) ) [ \t]* ["'`]? (?&opq)
                )
      # A template that will be filled with a secret: ("system", "... {db_password} ...").
      - patterns:
          - pattern: '"$S"'
          - metavariable-regex:
              metavariable: $S
              regex: |-
                (?x)
                ^ .*? \{ \{? [ \t]* (?=[A-Za-z_$][\w$]* [ \t]* \})
                (?! [\w$.-]*? (?i:public|publishable) )
                (?! (?i:is|has|use|uses|enable|enabled|disable|disabled|require|requires|required|should|allow|needs?|show|check|verify|validate|reset|set|change|forgot|confirm|hashed|hash|mask|masked|redact|redacted|min|max|num|count|total|len|length|missing|no) (?: [_.-] | (?<=[a-z])(?=[A-Z]) ) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:max|min|num|total|prompt|completion|input|output|context|reasoning|thinking|cached|cache|eos|bos|pad|padding|sep|separator|unk|unknown|cls|mask|start|end|special|stop|next|prev|previous|page|pagination|continuation|cursor|sync|first|last|new|seq|sequence|chat|tool|bot|eot|im|split|default|progress|cancel|cancellation|abort|idempotency|resume|lock) [_-]? (?i:token) (?=[ \t]*\}) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i:first|second|third|final|last|next|prev|previous|single|multi|one|two|three|forward|backward|reverse|initial|full|dry|render|review|refine|rerank|cleanup|lint) [_-]? (?i:pass) (?=[ \t]*\}) )
                (?! (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                    (?i: sentry[_-]?dsn | application[_-]?credentials ) (?=[ \t]*\}) )
                (?! (?i:token|pwd|pass|dsn) (?=[ \t]*\}) )
                (?: [\w$.-]*? (?: [_.-] | (?<=[a-z0-9])(?=[A-Z]) ) )?
                (?i:
                      token|secret|secret[_-]?key|password|passwd|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?key|service[_-]?role[_-]?key
                    | passwort | pwd | pass | passphrase
                    | (?:signing|encryption|master|account|subscription|admin) [_-]?key
                    | credentials? | creds
                      # <provider>_KEY, a common short form for a provider API key.
                    | (?:openai|anthropic|claude|gemini|google|groq|mistral|cohere|together|fireworks|deepseek
                        |xai|perplexity|openrouter|replicate|hf|huggingface|pinecone|tavily|serper|serpapi
                        |stripe|sendgrid|twilio|mailgun|slack|github|gitlab|aws|azure|elevenlabs|voyage|jina
                        |firecrawl|langsmith|wandb) [_-]?key
                      # Connection strings, which carry the database password.
                    | (?:database|db|postgres(?:ql)?|pg|psql|mysql|mariadb|mssql|sql|mongo(?:db)?|redis|amqp
                        |rabbitmq|broker|cosmos(?:db)?) [_-]?(?:url|uri|dsn)
                    | dsn | conn(?:ection)?[_-]?str(?:ing)? | connstr
                      # Chat webhooks embed their secret in the URL.
                    | (?:slack|discord|teams) [_-]?webhook(?:[_-]?url)?
                ) (?=[ \t]*\})
      # A module-level variable holding one of the above, used in a function or class defined
      # after it. With --taint-intrafile, OpenGrep drops module-level taint inside a function the
      # file never calls, so the variable's later uses are sources too. The region starts at an
      # assignment whose value contains one of the shapes above and runs to the end of its block;
      # the use must sit in a definition inside it, and a function that assigns the name itself
