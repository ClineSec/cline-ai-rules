                | \[\s*[\w.\[\]"']*\.function\.name\s*\]
                | \[\s*(?:\w+\.)*\w*(?:call|use|block)\.name\s*\]
                | ^[ \t]*(?:async\s+)?for\s+\w+\s+in\s+[\w.\[\]"']*\.tool_calls\b
                | (?<=\w)(?<!\bprint|\bdebug|\binfo|\bwarning|\berror|\bexception|\bdumps|\bjsonify|\bappend|\bextend|\blen|\bbool|\bif|\bwhile)
                  \(\s*(?:await\s+)?[\w.\[\]"']*\.tool_calls\b
              )).*
          - pattern: $BODY
          - metavariable-regex:
              metavariable: $BODY
              regex: |-
                ^(?:(?:self\.)?(?:\w+_)?(?:request|req)\.(?:json|data)|body|payload|data|params|kwargs)$
      # The whole request built as one dict in this file, with the client's messages and a tools
      # key, then spread into the call: req = {**BASE, "toolConfig": ..., "messages": msgs};
      # converse_stream(**req). A common boto3 style (found by the 2026-10-23 batch refactor).
      - requires: MSGS or ONE
        patterns:
          - pattern-inside: $CALL(..., **$REQ, ...)
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                ^(?:(?:\w+\.)*(?:chat\.completions|beta\.chat\.completions)\.(?:create|stream|parse)|(?:\w+\.)*responses\.(?:create|stream|parse)|(?:\w+\.)*(?:beta\.)?messages\.(?:create|stream|parse|tool_runner)|(?:\w+\.)*a?completion|(?:litellm\.)?a?responses|(?:\w+\.)*converse(?:_stream)?)$
          - pattern-either:
              - pattern-inside: |
                  $REQ = {..., "$TK": $T, ...}
                  ...
              - pattern-inside: |
                  $REQ = {**$BASE, ..., "$TK": $T, ...}
                  ...
          - metavariable-regex:
              metavariable: $TK
              regex: |-
                ^(?:tools|functions|toolConfig)$
          - metavariable-regex:
              metavariable: $T
              regex: |-
                ^(?!\[\s*\]$|None$|NOT_GIVEN$|omit$)
          - pattern-not-regex: |-
              (?msx)\A(?!.*?(?:
                  ["']role["']\s*:\s*["'](?:tool|function)["']
                | \brole\s*=\s*["'](?:tool|function)["']
                | ["']type["']\s*:\s*["'](?:tool_result|function_call_output|mcp)["']
                | ["']toolResult["']\s*:
                | \bmcp_servers\s*=
                | \bToolMessage\s*\(
                | \bToolNode\s*\(
                | \bfrom_function_response\s*\(
                | \.(?:tool_runner|run_tools)\s*\(
                | \.function\.arguments\b
                | \[\s*[\w.\[\]"']*\.function\.name\s*\]
                | \[\s*(?:\w+\.)*\w*(?:call|use|block)\.name\s*\]
                | ^[ \t]*(?:async\s+)?for\s+\w+\s+in\s+[\w.\[\]"']*\.tool_calls\b
                | (?<=\w)(?<!\bprint|\bdebug|\binfo|\bwarning|\berror|\bexception|\bdumps|\bjsonify|\bappend|\bextend|\blen|\bbool|\bif|\bwhile)
                  \(\s*(?:await\s+)?[\w.\[\]"']*\.tool_calls\b
              )).*
          - pattern: $REQ
