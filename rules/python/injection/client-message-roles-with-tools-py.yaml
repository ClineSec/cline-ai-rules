rules:
  - id: client-message-roles-with-tools-py
    # Generated by scripts/gen_client_message_roles.py. The first pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt's request-data sources and
    # lookup sanitizers, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # SDKs checked 2026-10-23: openai 3.37.0, anthropic 2.2.0 (types/message_param.py),
    # litellm 1.106.2 (main.py), langchain-core 1.7.0 (messages/utils.py),
    # langchain 1.4.7 (agents/factory.py), langgraph 1.2.16, google-genai 2.33.0
    # (types.py Content.role), openai-agents 0.24.0 (run.py), botocore 1.43.118
    # (bedrock-runtime Converse), pydantic-ai-slim 2.60.0.
    languages: [python]
    severity: WARNING
    message: >-
      The request's own message list reaches a model call whose tools this server runs, and
      nothing on the way in limits which roles it holds. Whoever sends the request writes the whole
      conversation: a system or developer turn with new rules, an assistant turn that already
      called a tool, or a tool result the server never produced (a `tool` message, an Anthropic
      `tool_result` or Bedrock `toolResult` block after a forged tool use, or a Gemini
      `functionResponse` part after a forged `model` turn's `functionCall`). The model treats
      that history as its own, so forged turns steer which tools it calls and with what
      arguments. Keep the
      conversation on the server (load it by chat ID) and accept only the new user turn, or keep
      only user turns from the client: `[m for m in messages if m["role"] == "user"]`, or a
      pydantic model with `role: Literal["user"]`.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Flask (Werkzeug), Django, Django REST
      # framework, and Starlette / FastAPI. request.args, request.get_json(), request.POST,
      # request.data, await request.json(), request.query_params, self.request.GET.
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:self\.|flask\.)?(?:\w+_)?(?:request|req)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:args|form|values|json|get_json|data|get_data|files|cookies|headers|view_args|url|full_path|path|path_info|query_string|GET|POST|COOKIES|META|FILES|body|query_params|path_params)$
      # Messages read from a FastAPI / Starlette WebSocket.
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: |-
                ^(?:self\.)?(?:\w+_)?(?:websocket|ws)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:receive_text|receive_json|receive_bytes|iter_text|iter_json|iter_bytes)$
      # Route handler parameters (FastAPI path, query, and body parameters; Flask URL
      # variables). Skipped: parameters typed int, float, bool, UUID, a date, Literal[...], or an
      # Enum defined in the file, which FastAPI validates before the call; dependencies
      # (Depends(...), Security(...), a *Dep alias); and the Request, WebSocket, Response,
      # BackgroundTasks, and SecurityScopes objects FastAPI injects. Request data read from those
      # is covered above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P = $DEFAULT, ...): ...
              - patterns:
                  - pattern: |
                      def $F(..., $P = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - patterns:
                          - pattern: |
                              def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                          - metavariable-regex:
                              metavariable: $DEFAULT
                              regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: >-
                        ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float|bool|(?:uuid\.)?UUID|(?:datetime\.)?(?:date|datetime|time|timedelta)|(?:decimal\.)?Decimal|(?:typing\.)?Literal\[|(?:fastapi\.|starlette\.\w+\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)\b)|.*\b(?:Depends|Security)\(|[\w.]*Deps?$)
                  - pattern-not-inside: |
                      class $TYPE(..., enum.Enum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.StrEnum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.IntEnum, ...):
                        ...
                      ...
          - focus-metavariable: $P
      # The part of the request that is a message list (label MSGS): body.messages,
      # data["messages"], payload.get("history"). Only request data counts (requires), and only
      # a field with a list's name, so request text that a helper turns into server-built
      # messages doesn't.
      - label: MSGS
        requires: __SOURCE__
        patterns:
          - pattern-either:
              - pattern: $O.$F
              - pattern: $O[$F]
              - pattern: $O.get($F, ...)
              # A FastAPI route parameter: messages: list[dict] = Body(...).
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          @$APP.$VERB(...)
                          def $FN(...): ...
                      - pattern-inside: |
                          @$APP.$VERB(...)
                          async def $FN(...): ...
                  - pattern: |
                      def $FN(..., $F, ...): ...
                  - focus-metavariable: $F
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?i)^["'`]?\w*(?:messages|msgs|history|conversation|turns|transcript)["'`]?$
      # One message object from the request placed in a list (label ONE):
      # [*load_history(chat_id), body.message]. Its role is still the client's. Not for
      # LangChain, which reads a bare string there as a user turn.
      - label: ONE
        requires: __SOURCE__
        patterns:
          - pattern-inside: '[..., $X, ...]'
          - pattern: $X
          - metavariable-regex:
              metavariable: $X
              regex: |-
                ^(?:\w+\.)*\w*[mM]essage$
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone, TONES["formal"]). The table is
      # the application's own text, whatever key the caller sends.
      # The default must be constant too: TONES.get(tone, tone) hands the caller's text back.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
              - patterns:
                  - pattern: $D.get($K, $DEF)
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: |-
                        ^(?:[rRbBuU]*[\"']|None$|-?\d|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*(?:\[|\.get\(|$))
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if tone not in ALLOWED_TONES: raise HTTPException(...)`.
      # Only the left operand, and not a blocklist (`if persona in BLOCKED: ...`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $ALLOWED
              - pattern: $X not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check before use, anchored at both ends: re.fullmatch(r"[a-z]{2}(-[A-Z]{2})?", locale).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($PAT, $X, ...)
              - pattern: $RE.fullmatch($X, ...)
              - patterns:
                  - pattern: re.match($PAT, $X, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^[rRbB]*["'].*(?:\$|\\Z)["']$
          - focus-metavariable: $X
      # Fields of a pydantic model in this file that are validated to a fixed set or a number
      # (`tone: Literal["formal", "casual"]`, `max_words: int`, or `tone: Tone` for an Enum),
      # read from a route parameter typed with that model.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $FT
              regex: |-
                ^(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:(?:typing\.)?Literal\[|int\b|float\b|bool\b|(?:uuid\.)?UUID\b)
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $FT(..., enum.Enum, ...):
                    ...
                  ...
              - pattern-inside: |
                  class $FT(..., enum.StrEnum, ...):
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - exact: true
        pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: uuid.UUID(...)
      # A lookup keyed by request data returns stored data, not the caller's text: an ORM or
      # SQL query, a vector-store or retriever search, an HTTP fetch, a get_/fetch_/find_ helper.
      # (What a lookup returns is fetched-content-in-system-prompt's, an indirect injection.)
      # `exact` keeps a sink inside the call's own arguments, and calls that are themselves a
      # system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w.]*\.)?(?:get_object_or_404|get_list_or_404|a?(?:get|fetch|find|load|lookup|search|retrieve|query|select)_\w+)$
                  # Not the request's own readers: request.get_json(), request.get_data().
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents|execute|scalars?|scalar_one\w*|first|one|one_or_none|fetchone|fetchall|fetchmany|filter|filter_by|get_or_none|get_or_create)$
              - pattern: $MODEL.objects.$M(...)
              - patterns:
                  - pattern: $S.get($MODEL, ...)
                  - metavariable-regex:
                      metavariable: $MODEL
                      regex: ^(?:[\w.]*\.)?[A-Z][a-z]\w*$
              - patterns:
                  - pattern-either:
                      - pattern: $O.invoke(...)
                      - pattern: $O.ainvoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?\w*(?:retriever|vector_?store|vectordb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.asearch(...)
                      - pattern: $O.retrieve(...)
                      - pattern: $O.aretrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?(?:\w*retriever|(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus|\w*tavily\w*))$
              - pattern: requests.$M(...)
              - pattern: httpx.$M(...)
              - pattern: urlopen(...)
              - pattern: urllib.request.urlopen(...)
          - pattern-not: $G(..., system_prompt=$X, ...)
          - pattern-not: $G(..., system_instruction=$X, ...)
          - pattern-not: $G(..., system_message=$X, ...)
          - pattern-not: $G(..., instructions=$X, ...)
          - pattern-not: $G(..., system=$X, ...)
          - pattern-not: $G(..., role=$X, ...)
      # A message the server builds with a role it chose: {"role": "user", "content": text},
      # dict(role="user", ...), HumanMessage(...), ("human", text). Not when a ** spread after
      # the role puts the client's role back.
      - patterns:
          - pattern-either:
              - pattern: '{..., "role": $R, ...}'
              - pattern: dict(..., role=$R, ...)
              - pattern: ($R, $C)
          - pattern-not: '{..., "role": $R, ..., **$S}'
          - metavariable-regex:
              metavariable: $R
              regex: |-
                (?x)^(?:
                    [rRuU]?["'](?:user|assistant|system|developer|human|ai)["']
                    # role="assistant" if m["role"] == "assistant" else "user"
                  | ["'](?:user|assistant)["']\s+if\s.+\selse\s+["'](?:user|assistant)["']
                    # role=m["role"] if m["role"] in ("user", "assistant") else "user"
                  | \S+\s+if\s+\S+\s+in\s+[(\[{]\s*["'](?:user|assistant)["']\s*(?:,\s*["'](?:user|assistant)["']\s*)?,?\s*[)\]}]
                    \s+else\s+["'](?:user|assistant)["']
                )$
      - pattern-either:
          - pattern: HumanMessage(...)
          - pattern: AIMessage(...)
      # Only the client's user turns: [m for m in messages if m["role"] == "user"],
      # filter(lambda m: m.role == "user", messages).
      - patterns:
          - pattern-either:
              - pattern: '[$E for $M in $XS if $COND]'
              - pattern: 'filter(lambda $M: $COND, $XS)'
          - metavariable-regex:
              metavariable: $COND
              regex: |-
                (?s)^(?!.*\bor\b)(?!.*!=)(?!.*\bnot\b)(?=.*(?:\brole\b["']?\]?|\.get\(\s*["']role["']\s*\))\s*==\s*["']user["']|.*["']user["']\s*==)
      # A check before use that every turn is a user turn:
      # if not all(m["role"] == "user" for m in messages): raise HTTPException(400). Only a
      # check on a variable counts: each later read of body.messages is a new source.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: all($COND for $M in $XS)
                  - metavariable-regex:
                      metavariable: $COND
                      regex: |-
                        (?s)^(?!.*\bor\b)(?!.*!=)(?!.*\bnot\b)(?=.*(?:\brole\b["']?\]?|\.get\(\s*["']role["']\s*\))\s*==\s*["']user["']|.*["']user["']\s*==)
              - patterns:
                  - pattern: any($COND for $M in $XS)
                  - metavariable-regex:
                      metavariable: $COND
                      regex: |-
                        (?s)^(?!.*\b(?:or|and)\b)(?=.*(?:\brole\b["']?\]?|\.get\(\s*["']role["']\s*\))\s*!=\s*["']user["']|.*["']user["']\s*!=)
          - focus-metavariable: $XS
      # Every turn rebuilt with a role the server chose:
      # [{"role": "user", "content": str(m["content"])} for m in messages], [("human", t) ...].
      - patterns:
          - pattern-either:
              - pattern: '[{..., "role": $R, ...} for $M in $XS]'
              - pattern: '[{..., "role": $R, ...} for $M in $XS if $COND]'
              - pattern: '[dict(..., role=$R, ...) for $M in $XS]'
              - pattern: '[($R, $C) for $M in $XS]'
          - metavariable-regex:
              metavariable: $R
              regex: |-
                (?x)^(?:
                    [rRuU]?["'](?:user|assistant|system|developer|human|ai)["']
                    # role="assistant" if m["role"] == "assistant" else "user"
                  | ["'](?:user|assistant)["']\s+if\s.+\selse\s+["'](?:user|assistant)["']
                    # role=m["role"] if m["role"] in ("user", "assistant") else "user"
                  | \S+\s+if\s+\S+\s+in\s+[(\[{]\s*["'](?:user|assistant)["']\s*(?:,\s*["'](?:user|assistant)["']\s*)?,?\s*[)\]}]
                    \s+else\s+["'](?:user|assistant)["']
                )$
      # ... or as LangChain messages of a class the server chose:
      # [AIMessage(t["content"]) if t["role"] == "assistant" else HumanMessage(t["content"]) for t in history].
      - patterns:
          - pattern-either:
              - pattern: '[$BODY for $M in $XS]'
              - pattern: '[$BODY for $M in $XS if $COND]'
          - metavariable-regex:
              metavariable: $BODY
              regex: |-
                (?x)^(?:
                    (?:HumanMessage|AIMessage)\((?:[^()]|\([^()]*\))*\)
                    (?:\s+if\s.+\selse\s+(?:HumanMessage|AIMessage)\((?:[^()]|\([^()]*\))*\))?
                )$
      # A pydantic model in this file that fixes each message's role to "user" (or to user and
      # assistant), read from a route parameter typed with the request model:
      # class Turn(BaseModel): role: Literal["user"]; class ChatIn(BaseModel): messages: list[Turn].
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $MSG(...):
                    ...
                    role: $RT
                    ...
                  ...
              - pattern-inside: |
                  class $MSG(...):
                    ...
                    role: $RT = $RD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $RT
              regex: |-
                ^(?:typing\.)?Literal\[\s*["'](?:user|assistant)["'](?:\s*,\s*["'](?:user|assistant)["'])?\s*\]$
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $FT
              regex: ^(?:typing\.)?(?:list|List|Sequence|tuple|Tuple)\[
          - metavariable-comparison:
              comparison: str($MSG) in str($FT)
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      # Tools the request supplies itself: create(messages=body.messages, tools=body.tools), or
      # tools = data.get("tools") or []. The sender already picks every tool and MCP server, so
      # forged turns add nothing: the call's values are clean (2026-10-28 corpus run). Server
      # tools picked by client-sent names still count.
      - patterns:
          - pattern-either:
              - pattern-inside: $CALL(..., tools=$O.$TF, ...)
              - pattern-inside: $CALL(..., tools=$O.$TF or $D, ...)
              - pattern-inside: $CALL(..., tools=[$X for $Y in <... $O.$TF ...>], ...)
              - pattern-inside: $CALL(..., tools=[$X for $Y in <... $O.$TF ...> if $C], ...)
              - pattern-inside: $CALL(..., tools=$O[$TF], ...)
              - pattern-inside: $CALL(..., tools=$O[$TF] or $D, ...)
              - pattern-inside: $CALL(..., tools=[$X for $Y in <... $O[$TF] ...>], ...)
              - pattern-inside: $CALL(..., tools=[$X for $Y in <... $O[$TF] ...> if $C], ...)
              - pattern-inside: $CALL(..., tools=$O.get($TF, ...), ...)
              - pattern-inside: $CALL(..., tools=$O.get($TF, ...) or $D, ...)
              - pattern-inside: $CALL(..., tools=[$X for $Y in <... $O.get($TF, ...) ...>], ...)
              - pattern-inside: $CALL(..., tools=[$X for $Y in <... $O.get($TF, ...) ...> if $C], ...)
              - patterns:
                  - pattern-inside: $CALL(..., tools=$T, ...)
                  - pattern-either:
                      - pattern-inside: |
                          $T = $O.$TF
                          ...
                      - pattern-inside: |
                          $T = $O.$TF or $D
                          ...
                      - pattern-inside: |
                          $T = [$X for $Y in <... $O.$TF ...>]
                          ...
                      - pattern-inside: |
                          $T = [$X for $Y in <... $O.$TF ...> if $C]
                          ...
                      - pattern-inside: |
                          $T = $O[$TF]
                          ...
                      - pattern-inside: |
                          $T = $O[$TF] or $D
                          ...
                      - pattern-inside: |
                          $T = [$X for $Y in <... $O[$TF] ...>]
                          ...
                      - pattern-inside: |
                          $T = [$X for $Y in <... $O[$TF] ...> if $C]
                          ...
                      - pattern-inside: |
                          $T = $O.get($TF, ...)
                          ...
                      - pattern-inside: |
                          $T = $O.get($TF, ...) or $D
                          ...
                      - pattern-inside: |
                          $T = [$X for $Y in <... $O.get($TF, ...) ...>]
                          ...
                      - pattern-inside: |
                          $T = [$X for $Y in <... $O.get($TF, ...) ...> if $C]
                          ...
          - metavariable-regex:
              metavariable: $TF
              regex: |-
                (?i)^["'`]?\w*tools["'`]?$
          - metavariable-regex:
              metavariable: $O
              regex: |-
                ^(?:(?:\w+_)?(?:body|payload|data|req|request|chat|params|args|input|json)|(?:request|req)\.(?:json|get_json\(\)))$
          - pattern-inside: $CALL(..., $K=$M, ...)
          - focus-metavariable: $M
    pattern-sinks:
      # OpenAI Chat Completions (openai 3.37.0): system, developer, assistant tool_calls, and tool
      # messages are all client-writable. This and the other raw provider calls below only
      # return the model's tool calls, so they report only where the file runs them.
      - requires: MSGS or ONE
        patterns:
          - pattern-inside: $CALL(..., messages=$M, ...)
          - metavariable-regex:
              metavariable: $CALL
              regex: |-
                ^(?:\w+\.)*(?:chat\.completions|beta\.chat\.completions)\.(?:create|stream|parse)$
          - pattern-either:
              - pattern-inside: $CALL(..., tools=$T, ...)
              - pattern-inside: $CALL(..., functions=$T, ...)
              - patterns:
                  - pattern-inside: $CALL(..., **$CFG, ...)
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              $CFG = {..., "$TK": $T, ...}
                              ...
                          - metavariable-regex:
                              metavariable: $TK
                              regex: ^(?:tools|functions)$
                      - patterns:
                          - pattern-inside: |
                              $CFG = dict(..., $TK=$T, ...)
                              ...
                          - metavariable-regex:
                              metavariable: $TK
                              regex: ^(?:tools|functions)$
          # An empty tool list, or tool use switched off for this call.
          - pattern-not-inside: $CALL(..., tools=[], ...)
          - pattern-not-inside: $CALL(..., tools=None, ...)
          - pattern-not-inside: $CALL(..., tools=NOT_GIVEN, ...)
          - pattern-not-inside: $CALL(..., tools=omit, ...)
          - pattern-not-inside: $CALL(..., tool_choice="none", ...)
          - pattern-not-regex: |-
              (?msx)\A(?!.*?(?:
                  ["']role["']\s*:\s*["'](?:tool|function)["']
