                  ...
              - pattern-inside: |
                  $M = AsyncMemoryClient(...)
                  ...
              - pattern-inside: |
                  $M = AsyncMemoryClient.from_config(...)
                  ...
              - pattern-inside: |
                  $M = mem0.AsyncMemoryClient(...)
                  ...
              - pattern-inside: |
                  $M = mem0.AsyncMemoryClient.from_config(...)
                  ...
              - pattern-inside: |
                  with Memory(...) as $M:
                    ...
              - pattern-inside: |
                  with AsyncMemory(...) as $M:
                    ...
              - pattern-inside: |
                  with MemoryClient(...) as $M:
                    ...
              - pattern-inside: |
                  with AsyncMemoryClient(...) as $M:
                    ...
          - pattern: $X
      # ...or named like one (memory, self.mem0), with the scope ids mem0 requires, so a set's
      # add(x) or SQLAlchemy's session.add(row) doesn't count.
      - patterns:
          - pattern-either:
              - pattern-inside: $M.add($X, ...)
              - pattern-inside: $M.add(..., messages=$X, ...)
          - pattern-either:
              - patterns:
                  - pattern-inside: $M.add(..., $K=$ID, ...)
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:user_id|agent_id|run_id|app_id)$
              - pattern-inside: $M.add(..., **$KW)
              - pattern-inside: $M.add(..., options=$OPTS, ...)
              - pattern-inside: $M.add($X, AddMemoryOptions(...), ...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:[\w.]*[._])?(?i:\w*mem0\w*|(?:\w+_)?mem(?:ory|ories)?(?:_?client)?)$
          - pattern: $X
      # mem0 update(memory_id, text) (data= is the deprecated name) and MemoryClient.batch_update.
      - patterns:
          - pattern-either:
              - pattern-inside: $M.update($ID, $X, ...)
              - pattern-inside: $M.update(..., text=$X, ...)
              - pattern-inside: $M.update(..., data=$X, ...)
              - pattern-inside: $M.batch_update($X, ...)
          - pattern-either:
              - pattern-inside: |
                  $M = Memory(...)
                  ...
              - pattern-inside: |
                  $M = Memory.from_config(...)
                  ...
              - pattern-inside: |
                  $M = mem0.Memory(...)
                  ...
              - pattern-inside: |
                  $M = mem0.Memory.from_config(...)
                  ...
              - pattern-inside: |
                  $M = AsyncMemory(...)
                  ...
              - pattern-inside: |
                  $M = AsyncMemory.from_config(...)
                  ...
              - pattern-inside: |
                  $M = mem0.AsyncMemory(...)
                  ...
              - pattern-inside: |
                  $M = mem0.AsyncMemory.from_config(...)
                  ...
              - pattern-inside: |
                  $M = MemoryClient(...)
                  ...
              - pattern-inside: |
                  $M = MemoryClient.from_config(...)
                  ...
              - pattern-inside: |
                  $M = mem0.MemoryClient(...)
                  ...
              - pattern-inside: |
                  $M = mem0.MemoryClient.from_config(...)
                  ...
              - pattern-inside: |
                  $M = AsyncMemoryClient(...)
                  ...
              - pattern-inside: |
                  $M = AsyncMemoryClient.from_config(...)
                  ...
              - pattern-inside: |
                  $M = mem0.AsyncMemoryClient(...)
                  ...
              - pattern-inside: |
                  $M = mem0.AsyncMemoryClient.from_config(...)
                  ...
              - pattern-inside: |
                  with Memory(...) as $M:
                    ...
              - pattern-inside: |
                  with AsyncMemory(...) as $M:
                    ...
              - pattern-inside: |
                  with MemoryClient(...) as $M:
                    ...
              - pattern-inside: |
                  with AsyncMemoryClient(...) as $M:
                    ...
          - pattern: $X
      - patterns:
          - pattern-either:
              - pattern-inside: $M.update($ID, $X, ...)
              - pattern-inside: $M.update(..., text=$X, ...)
              - pattern-inside: $M.update(..., data=$X, ...)
              - pattern-inside: $M.batch_update($X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:[\w.]*[._])?(?i:\w*mem0\w*|(?:\w+_)?mem(?:ory|ories)?(?:_?client)?)$
          - pattern: $X
      # LangGraph long-term memory (langgraph-checkpoint 4.3.0 BaseStore, langgraph 1.2.17):
      # store.put(namespace, key, value) / aput, and PutOp(...) in store.batch([...]). The store
      # is named like one (store, runtime.store, get_store()), and the call has a tuple
      # namespace or sits in a file that imports LangGraph, so a queue's put(item) or another
      # key-value store doesn't count.
      - patterns:
          - pattern-either:
              - pattern-inside: $S.put($NS, $KEY, $V, ...)
              - pattern-inside: $S.aput($NS, $KEY, $V, ...)
              - pattern-inside: $S.put(..., value=$V, ...)
              - pattern-inside: $S.aput(..., value=$V, ...)
          - metavariable-regex:
              metavariable: $S
              regex: |-
                (?i)^(?:(?:[\w.]*[._])?\w*store|(?:[\w.]*\.)?get_store\(\))$
          - pattern-either:
              - pattern-inside: $S.$PUT((..., $NSA, ...), ...)
              - pattern-inside: |
                  import langgraph
                  ...
          - pattern: $V
      - patterns:
          - pattern-either:
              - pattern-inside: PutOp($NS, $KEY, $V, ...)
              - pattern-inside: PutOp(..., value=$V, ...)
          - pattern: $V
      # Letta (letta-client 1.12.1; 0.1.324 called update modify): core memory blocks, which
      # sit in the agent's context on every turn (agents.blocks.update(label, agent_id=...,
      # value=...), blocks.create(label=..., value=...), blocks.update(block_id, value=...), or
      # agents.create(memory_blocks=[...])), and archival passages the agent searches
      # (agents.passages.create(agent_id, text=...), archives.passages.create / create_many).
      - patterns:
          - pattern-either:
              - pattern-inside: $C.agents.blocks.$M(..., value=$X, ...)
              - pattern-inside: $C.blocks.$M(..., value=$X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:update|modify)$
          - pattern: $X
      - patterns:
          - pattern-either:
              - pattern-inside: $C.blocks.create(..., value=$X, ...)
              - pattern-inside: $C.agents.create(..., memory_blocks=$X, ...)
              - pattern-inside: $C.agents.passages.create(..., text=$X, ...)
              - pattern-inside: $C.archives.passages.create(..., text=$X, ...)
              - pattern-inside: $C.archives.passages.create_many(..., passages=$X, ...)
          - pattern: $X
      # Zep (zep-cloud 4.0.1, 3.30.0, 2.22.1): graph episodes (graph.add(data=...) in 2.x and
      # 3.x, graph.episode.add(graph_uuid, data=...) in 4.x, add_batch(episodes=...),
      # add_fact_triple(fact=...)) and thread messages (thread.add_messages(thread_id,
      # messages=...), memory.add(session_id, messages=...) in 2.x), which Zep turns into the
      # facts its context block returns.
      - patterns:
          - pattern-either:
              - pattern-inside: $C.graph.add(..., data=$X, ...)
              - pattern-inside: $C.graph.episode.add(..., data=$X, ...)
              - pattern-inside: $C.graph.add_batch(..., episodes=$X, ...)
              - pattern-inside: $C.graph.add_fact_triple(..., fact=$X, ...)
              - pattern-inside: $C.thread.add_messages(..., messages=$X, ...)
              - pattern-inside: $C.memory.add(..., messages=$X, ...)
          - pattern: $X
