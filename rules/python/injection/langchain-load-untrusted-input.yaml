rules:
  - id: langchain-load-untrusted-input
    # Generated by scripts/gen_langchain_load_untrusted_input.py. The pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt's request-data sources and
    # lookup sanitizers, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # Load APIs checked 2026-10-25: langchain-core 1.7.0, 1.3.3, 1.2.5, 0.3.86, 0.3.81, 0.3.80
    # (langchain_core/load/load.py), langchain-classic 1.0.8 (load/).
    languages: [python]
    severity: WARNING
    message: >-
      Request data (a JSON body, form field, query parameter, or WebSocket message) is handed to
      LangChain's `load` / `loads`, which builds Python objects from it. A request is not a
      trusted manifest: the caller can describe any class the allowlist admits, with their own
      constructor arguments. With langchain-core 1.x defaults (`allowed_objects="core"`) that
      means LangChain's prompt, message, document, and runnable classes, so the caller writes
      the prompts and chat history this app then runs. On the 0.3.x line, where
      `secrets_from_env` still defaults to True, an entry like
      `{"lc": 1, "type": "secret", "id": ["OPENAI_API_KEY"]}` comes back as the key itself.
      Before 0.3.81 and 1.2.5 there was no allowlist, and the payload could build a chat model
      whose base URL is the caller's own host. Parse the request into plain fields or message
      dicts you validate, and build LangChain objects from them in code. If you must revive a
      client's messages, pass `allowed_objects="messages"` (0.3.85 / 1.3.3 or later) and
      `secrets_from_env=False`.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Flask (Werkzeug), Django, Django REST
      # framework, and Starlette / FastAPI. request.args, request.get_json(), request.POST,
      # request.data, await request.json(), request.query_params, self.request.GET.
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:self\.|flask\.)?(?:\w+_)?(?:request|req)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:args|form|values|json|get_json|data|get_data|files|cookies|headers|view_args|url|full_path|path|path_info|query_string|GET|POST|COOKIES|META|FILES|body|query_params|path_params)$
      # Messages read from a FastAPI / Starlette WebSocket.
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: |-
                ^(?:self\.)?(?:\w+_)?(?:websocket|ws)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:receive_text|receive_json|receive_bytes|iter_text|iter_json|iter_bytes)$
      # Route handler parameters (FastAPI path, query, and body parameters; Flask URL
      # variables). Skipped: parameters typed int, float, bool, UUID, a date, Literal[...], or an
      # Enum defined in the file, which FastAPI validates before the call; dependencies
      # (Depends(...), Security(...), a *Dep alias); and the Request, WebSocket, Response,
      # BackgroundTasks, and SecurityScopes objects FastAPI injects. Request data read from those
      # is covered above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P = $DEFAULT, ...): ...
              - patterns:
                  - pattern: |
                      def $F(..., $P = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - patterns:
                          - pattern: |
                              def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                          - metavariable-regex:
                              metavariable: $DEFAULT
                              regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: >-
                        ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float|bool|(?:uuid\.)?UUID|(?:datetime\.)?(?:date|datetime|time|timedelta)|(?:decimal\.)?Decimal|(?:typing\.)?Literal\[|(?:fastapi\.|starlette\.\w+\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)\b)|.*\b(?:Depends|Security)\(|[\w.]*Deps?$)
                  - pattern-not-inside: |
                      class $TYPE(..., enum.Enum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.StrEnum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.IntEnum, ...):
                        ...
                      ...
          - focus-metavariable: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone, TONES["formal"]). The table is
      # the application's own text, whatever key the caller sends.
      # The default must be constant too: TONES.get(tone, tone) hands the caller's text back.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
              - patterns:
                  - pattern: $D.get($K, $DEF)
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: |-
                        ^(?:[rRbBuU]*[\"']|None$|-?\d|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*(?:\[|\.get\(|$))
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if tone not in ALLOWED_TONES: raise HTTPException(...)`.
      # Only the left operand, and not a blocklist (`if persona in BLOCKED: ...`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $ALLOWED
              - pattern: $X not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check before use, anchored at both ends: re.fullmatch(r"[a-z]{2}(-[A-Z]{2})?", locale).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($PAT, $X, ...)
              - pattern: $RE.fullmatch($X, ...)
              - patterns:
                  - pattern: re.match($PAT, $X, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^[rRbB]*["'].*(?:\$|\\Z)["']$
          - focus-metavariable: $X
      # Fields of a pydantic model in this file that are validated to a fixed set or a number
      # (`tone: Literal["formal", "casual"]`, `max_words: int`, or `tone: Tone` for an Enum),
      # read from a route parameter typed with that model.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $FT
              regex: |-
                ^(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:(?:typing\.)?Literal\[|int\b|float\b|bool\b|(?:uuid\.)?UUID\b)
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $FT(..., enum.Enum, ...):
                    ...
                  ...
              - pattern-inside: |
                  class $FT(..., enum.StrEnum, ...):
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - exact: true
        pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: uuid.UUID(...)
      # A lookup keyed by request data returns stored data, not the caller's text: an ORM or
      # SQL query, a vector-store or retriever search, an HTTP fetch, a get_/fetch_/find_ helper.
      # (What a lookup returns is fetched-content-in-system-prompt's, an indirect injection.)
      # `exact` keeps a sink inside the call's own arguments, and calls that are themselves a
      # system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w.]*\.)?(?:get_object_or_404|get_list_or_404|a?(?:get|fetch|find|load|lookup|search|retrieve|query|select)_\w+)$
                  # Not the request's own readers: request.get_json(), request.get_data().
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents|execute|scalars?|scalar_one\w*|first|one|one_or_none|fetchone|fetchall|fetchmany|filter|filter_by|get_or_none|get_or_create)$
              - pattern: $MODEL.objects.$M(...)
              - patterns:
                  - pattern: $S.get($MODEL, ...)
                  - metavariable-regex:
                      metavariable: $MODEL
                      regex: ^(?:[\w.]*\.)?[A-Z][a-z]\w*$
              - patterns:
                  - pattern-either:
                      - pattern: $O.invoke(...)
                      - pattern: $O.ainvoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?\w*(?:retriever|vector_?store|vectordb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.asearch(...)
                      - pattern: $O.retrieve(...)
                      - pattern: $O.aretrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?(?:\w*retriever|(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus|\w*tavily\w*))$
              - pattern: requests.$M(...)
              - pattern: httpx.$M(...)
              - pattern: urlopen(...)
              - pattern: urllib.request.urlopen(...)
          - pattern-not: $G(..., system_prompt=$X, ...)
          - pattern-not: $G(..., system_instruction=$X, ...)
          - pattern-not: $G(..., system_message=$X, ...)
          - pattern-not: $G(..., instructions=$X, ...)
          - pattern-not: $G(..., system=$X, ...)
          - pattern-not: $G(..., role=$X, ...)
    pattern-sinks:
      # The payload: load(obj) / loads(text), first argument or keyword, and the text json.loads
      # parses with a LangChain Reviver as its object_hook.
      - patterns:
          - pattern-either:
              - pattern: langchain_core.load.load($X, ...)
              - pattern: langchain_core.load.load(..., obj=$X, ...)
              - pattern: langchain_core.load.loads($X, ...)
              - pattern: langchain_core.load.loads(..., text=$X, ...)
              - pattern: langchain_core.load.load.load($X, ...)
              - pattern: langchain_core.load.load.load(..., obj=$X, ...)
              - pattern: langchain_core.load.load.loads($X, ...)
              - pattern: langchain_core.load.load.loads(..., text=$X, ...)
              - pattern: langchain.load.load($X, ...)
              - pattern: langchain.load.load(..., obj=$X, ...)
              - pattern: langchain.load.loads($X, ...)
              - pattern: langchain.load.loads(..., text=$X, ...)
              - pattern: langchain.load.load.load($X, ...)
              - pattern: langchain.load.load.load(..., obj=$X, ...)
              - pattern: langchain.load.load.loads($X, ...)
              - pattern: langchain.load.load.loads(..., text=$X, ...)
              - pattern: langchain_classic.load.load($X, ...)
              - pattern: langchain_classic.load.load(..., obj=$X, ...)
              - pattern: langchain_classic.load.loads($X, ...)
              - pattern: langchain_classic.load.loads(..., text=$X, ...)
              - pattern: langchain_classic.load.load.load($X, ...)
              - pattern: langchain_classic.load.load.load(..., obj=$X, ...)
              - pattern: langchain_classic.load.load.loads($X, ...)
              - pattern: langchain_classic.load.load.loads(..., text=$X, ...)
              - pattern: json.loads($X, ..., object_hook=langchain_core.load.load.Reviver(...), ...)
              - pattern: json.loads($X, ..., object_hook=langchain.load.load.Reviver(...), ...)
              - pattern: json.loads($X, ..., object_hook=langchain_classic.load.load.Reviver(...), ...)
          # Narrow allowlists stand down: allowed_objects="messages", a list of message and
          # document classes, or a value the rule can't see into. (On 0.3.x, secret references
          # are still read from the environment unless secrets_from_env=False; the message
          # says so, but the rule can't tell the installed version.)
          - pattern-not-inside:
              patterns:
                - pattern: $G(..., allowed_objects=$AO, ...)
                - metavariable-regex:
                    metavariable: $AO
                    regex: |-
                      ^(?![\[(]|[rRuU]?["'](?:core|all)["']$)
          - pattern-not-inside:
              patterns:
                - pattern: $G(..., allowed_objects=$AO, ...)
                - metavariable-regex:
                    metavariable: $AO
                    regex: |-
                      ^[\[(]\s*(?:[\w.]*(?:Message|MessageChunk|Document)\s*,\s*)*[\w.]*(?:Message|MessageChunk|Document)\s*,?\s*[\])]$
          - pattern-not-inside: $G(..., object_hook=$R("messages", ...), ...)
          - pattern-not-inside: $G(..., object_hook=$R([...], ...), ...)
          - pattern-not-inside: $G(..., object_hook=$R(..., allowed_objects=$AO, ...), ...)
          # Calls langchain-load-unsafe-objects reports.
          - pattern-not-inside: $G(..., allowed_objects="all", ...)
          - pattern-not-inside: $G(..., secrets_from_env=True, ...)
          - pattern-not-inside: $G(..., init_validator=None, ...)
          - pattern-not-inside: $G(..., object_hook=$R("all", ...), ...)
          - pattern-not-inside: $G(..., object_hook=$R(..., secrets_from_env=True, ...), ...)
          - pattern-not-inside:
              patterns:
                - pattern: $G(..., secrets_map=$SM, ...)
                - metavariable-regex:
                    metavariable: $SM
                    regex: |-
                      (?s)^(?:(?:os\.)?environ(?:\.copy\(\))?|dict\(\s*(?:os\.)?environ\s*[,)].*|\{\s*\*\*(?:os\.)?environ\s*[,}].*)$
          - focus-metavariable: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM04:2026 - Supply Chain"
        - "LLM03:2025 - Supply Chain"
        - "LLM02:2026 - Sensitive Information Disclosure"
        - "LLM02:2025 - Sensitive Information Disclosure"
      owasp-aisvs:
        - "v1.01-C4.1.2 - AI Workload Sandboxing & Validation"
      mitre-atlas:
        - "AML.T0011.000 - User Execution: Unsafe AI Artifacts"
        - "AML.T0055 - Unsecured Credentials"
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      # LangChain's own guidance is never to load() request data, so a match is almost always
      # real; how much the caller can build depends on the installed version (see the message).
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [flask, django, fastapi, starlette, langchain]
      references:
        - https://github.com/advisories/GHSA-c67j-w6g6-q2cm
        - https://github.com/advisories/GHSA-pjwx-r37v-7724
        - https://github.com/advisories/GHSA-r399-636x-v7f6
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md
        - https://cwe.mitre.org/data/definitions/502.html
        - https://github.com/langchain-ai/langchain/blob/langchain-core%3D%3D1.7.0/libs/core/langchain_core/load/load.py
