rules:
  - id: fetched-content-in-system-prompt
    # Generated by scripts/gen_fetched_content_in_system_prompt.py. The pattern-sinks up to
    # the LangChain template block are secret-in-system-prompt's (imported from
    # gen_secret_in_system_prompt.py), and the template block is user-input-in-system-prompt's
    # (build.py SHARED_BLOCKS checks both copies). Edit the scripts and run scripts/build.py;
    # build.py --check fails if this file drifts.
    # Sources checked 2026-10-23: langchain-core 1.7.0 (vectorstores/base.py, retrievers.py,
    # document_loaders/base.py), langchain 1.4.7 (agents/middleware/types.py
    # dynamic_prompt), langchain-classic 1.0.8 (combine_documents/stuff.py),
    # llama-index-core 0.14.25, tavily-python 0.8.5, requests 2.34.2, httpx 0.28.1,
    # aiohttp 3.14.5, SQLAlchemy 2.1.6, Django 6.1.2, exa-py 2.26.0, firecrawl-py 4.54.0,
    # chromadb 1.5.9, pinecone 10.2.0, qdrant-client 1.20.0, weaviate-client 4.24.0,
    # langchain-community 0.4.2, langchain-google-community 5.1.1, langchain-tavily 0.2.18,
    # serpapi 1.1.2, google-search-results 2.4.2, ddgs 9.16.1, duckduckgo-search 8.1.1,
    # google-api-python-client 2.201.0 (customsearch v1), playwright 1.64.1; 2026-10-24:
    # mcp 2.3.0 (client/session.py call_tool).
    languages: [python]
    severity: WARNING
    message: >-
      Content the application fetched or looked up (a retrieved document, a web page or HTTP
      response body, a search result, an MCP server's tool result, or the text of a stored
      ticket, message, or comment) reaches the model's system prompt or developer instructions.
      Whoever wrote that content (a page's author, anyone who can add a document to the index,
      the server's operator, the customer who filed the ticket) can plant instructions in it,
      and in the system slot those instructions carry the application's own authority: they
      can switch off guardrails, unlock tools, and steer what the agent does with its
      permissions (indirect prompt injection). Keep the system prompt fixed or chosen on the
      server, and pass fetched content in a user message or tool result, delimited and labeled
      as data to use, not instructions to follow.
    mode: taint
    options:
      # A count or a comparison says something about the content without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Retrieved documents. LangChain vector stores (similarity_search*, max_marginal_relevance_search*,
      # and the pre-1.0 get_relevant_documents), retrievers (invoke / batch on an object named like
      # a retriever, or anything as_retriever() returns, which also covers LCEL chains), and
      # LlamaIndex retrievers (retrieve / aretrieve); search() on a store or index named like one.
      - exact: true
        pattern-either:
          - patterns:
              - pattern: $O.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents)$
          - pattern: $X.as_retriever(...)
          - patterns:
              - pattern-either:
                  - pattern: $O.invoke(...)
                  - pattern: $O.ainvoke(...)
                  - pattern: $O.batch(...)
                  - pattern: $O.abatch(...)
                  - pattern: $O.retrieve(...)
                  - pattern: $O.aretrieve(...)
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    (?i)^(?:[\w.]*[._])?\w*retriever$
          - patterns:
              - pattern-either:
                  - pattern: $O.search(...)
                  - pattern: $O.asearch(...)
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    (?i)^(?:[\w.]*[._])?(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus)$
      # Document loaders and readers (LangChain BaseLoader.load / lazy_load / aload, LlamaIndex
      # BaseReader.load_data): web pages, uploaded files, and synced workspaces.
      - exact: true
        patterns:
          - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:a?load|a?lazy_load|load_and_split|a?load_data|lazy_load_data)$
          - pattern-either:
              - pattern: $CLS(...).$M(...)
              - patterns:
                  - pattern-inside: |
                      $L = $CLS(...)
                      ...
                  - pattern: $L.$M(...)
          - metavariable-regex:
              metavariable: $CLS
              regex: |-
                ^(?:[\w.]*\.)?(?!(?:FileSystem|Package|Dict|Choice|Prefix|Function|Module|Data|Base)(?:Loader|Reader)$)(?!DictReader$)[A-Z]\w*(?:Loader|Reader)$
      # Web search, scraping, and vector database results. The clients of Tavily (search,
      # extract, crawl, get_search_context, qna_search), Exa (search_and_contents,
      # get_contents, answer), Firecrawl (scrape, crawl, search, extract), SerpAPI
      # (serpapi.Client / serpapi.search, google-search-results' GoogleSearch), and DuckDuckGo
      # (ddgs and duckduckgo_search DDGS: text, news, extract); LangChain's search wrappers and
      # tools (SerpAPI, Serper, SearchApi, Brave, DuckDuckGo, Google, Bing, Jina, SearxNG,
      # Tavily); a Google Programmable Search service (build("customsearch", ...)); or a client
      # named like one of these; Chroma collection.query(query_texts=...), Pinecone
      # index.query(..., include_metadata=True), Qdrant query_points, and Weaviate
      # collection.query.near_text / hybrid / bm25 / near_vector / fetch_objects.
      - exact: true
        pattern-either:
          - pattern: tavily.TavilyClient(...)
          - pattern: TavilyClient(...)
          - pattern: tavily.AsyncTavilyClient(...)
          - pattern: AsyncTavilyClient(...)
          - pattern: exa_py.Exa(...)
          - pattern: Exa(...)
          - pattern: AsyncExa(...)
          - pattern: firecrawl.Firecrawl(...)
          - pattern: Firecrawl(...)
          - pattern: AsyncFirecrawl(...)
          - pattern: FirecrawlApp(...)
          - pattern: AsyncFirecrawlApp(...)
          - pattern: serpapi.Client(...)
          - pattern: serpapi.search(...)
          - pattern: build("customsearch", ...)
          - pattern: googleapiclient.discovery.build("customsearch", ...)
          - patterns:
              - pattern-either:
                  - pattern: $CLS(...)
                  - pattern: $CLS.from_api_key(...)
              - metavariable-regex:
                  metavariable: $CLS
                  regex: |-
                    ^(?:[\w.]*\.)?(?:SerpAPIWrapper|GoogleSerper(?:APIWrapper|Run|Results)|SearchApiAPIWrapper|SearchAPI(?:Run|Results)|BraveSearch(?:Wrapper)?|DuckDuckGoSearch(?:APIWrapper|Run|Results)|GoogleSearch(?:APIWrapper|Run|Results)?|BingSearch(?:APIWrapper|Run|Results)|JinaSearch(?:APIWrapper)?|SearxSearch(?:Wrapper|Run|Results)|Tavily(?:Search|Extract|Crawl|Research|GetResearch)(?:APIWrapper)?|A?DDGS|(?:AppleAppStore|Baidu|Bing|DuckDuckGo|Ebay|GoogleScholar|HomeDepot|Naver|Walmart|Yahoo|Yandex|Youtube)Search)$
          - patterns:
              - pattern: $T.$M(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: |-
                    ^(?:[\w.]*[._])?(?:(?i:\w*tavily\w*|\w*firecrawl\w*|\w*duckduckgo\w*)|exa(?:_\w+)?|\w+_exa|serp\w*|\w+_serp\w*|ddgs?(?:_\w+)?|\w+_ddgs?|brave(?:_\w+)?|\w+_brave|bing(?:_\w+)?|\w+_bing|(?:\w+_)?web_search(?:_\w+)?|(?:\w+_)?search_tool)$
              - metavariable-regex:
                  metavariable: $M
                  regex: |-
                    ^(?:search|extract|crawl|get_search_context|qna_search|search_and_contents|get_contents|find_similar_and_contents|answer|scrape|scrape_url|batch_scrape|crawl_url|a?run|a?results|a?invoke|text|news|get_dict|get_json|download_documents)$
          - pattern: $C.query(..., query_texts=$Q, ...)
          - pattern: $C.query(..., query_embeddings=$Q, ...)
          - pattern: $I.query(..., include_metadata=True, ...)
          - pattern: $C.query_points(...)
          - patterns:
              - pattern: $C.query.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:near_text|near_vector|near_object|hybrid|bm25|fetch_objects)$
      # A helper that fetches a page or retrieves documents by its name: fetch_page(url),
      # scrape_url(...), retrieve_context(question), search_docs(query).
      - exact: true
        patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?:[\w.]*\.)?_?a?(?:(?:fetch|scrape|crawl|download|browse)_(?:\w+_)?(?:page|webpage|html|url|website|site|link|web)s?(?:_\w+)?|(?:get|find|search|retrieve|query|fetch|lookup)_(?:\w+_)?(?:docs|documents|chunks|passages|articles|snippets|nodes|knowledge|kb|search_results|relevant_content|(?:relevant|retrieved|kb|rag)_context))$
      # An MCP server's tool result, read through an MCP client: ClientSession.call_tool and
      # Client.call_tool (mcp 2.3.0; also 1.x and fastmcp's Client), ClientSessionGroup.call_tool.
      # The tool name is required, so the low-level server's @server.call_tool() decorator
      # (mcp 1.x) is not a source.
      - exact: true
        pattern-either:
          - pattern: $S.call_tool($NAME, ...)
          - pattern: $S.call_tool(..., name=$NAME, ...)
      # Records (label RECORD), which count only through a field named like people's text below.
      # HTTP responses: requests and httpx (module calls, a client or session made here, a
      # client call whose first argument looks like a URL, or a call on a client named like
      # one, such as self.http made in __init__), urllib's urlopen, and aiohttp sessions.
      - label: RECORD
        exact: true
        pattern-either:
          - pattern: httpx.Client(...)
          - pattern: httpx.AsyncClient(...)
          - pattern: requests.Session(...)
          - pattern: aiohttp.ClientSession(...)
          - patterns:
              - pattern-either:
                  - pattern: requests.$M(...)
                  - pattern: httpx.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(?:get|post|put|patch|request|stream)$
          - pattern: urllib.request.urlopen(...)
          - pattern: urlopen(...)
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern: $S.$VERB($URL, ...)
                      - metavariable-regex:
                          metavariable: $URL
                          regex: |-
                            (?i)^(?:(?:f|rf|fr)?[\"'](?:https?://|/)|[\w.]*(?:url|uri|endpoint|link|href)s?(?:\[.*\])?$)
                  - pattern: $S.$VERB(..., url=$URL, ...)
                  - patterns:
                      - pattern: $S.$VERB(...)
                      - metavariable-regex:
                          metavariable: $S
                          regex: |-
                            (?i)^(?:[\w.]*[._])?(?:https?|\w*_https?|https?_\w*|\w*session|httpx?_?client|web_?client)$
              - metavariable-regex:
                  metavariable: $VERB
                  regex: ^(?:get|post|put|patch|request|stream|fetch)$
              - metavariable-regex:
                  metavariable: $S
                  regex: |-
                    ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\b)(?!os\.environ$)
      # Database reads: SQLAlchemy (execute, scalars, get, query), Django (Model.objects,
      # get_object_or_404), DB-API cursors, asyncpg, pymongo, pandas.read_sql, and helpers named
      # like a lookup (get_ticket, fetch_thread). Models and helpers named like configuration
      # (TenantSettings, get_persona) are the operators' own text and don't count.
      - label: RECORD
        exact: true
        pattern-either:
          - patterns:
              - pattern: $F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: |-
                    ^(?!(?:[\w.]*\.)?\w*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?(?:get_object_or_404|get_list_or_404|_?a?(?:get|fetch|find|load|lookup|query|select)_\w+)$
          - patterns:
              - pattern: $O.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: |-
                    ^(?:execute|exec|scalars?|scalar_one\w*|first|one|one_or_none|fetchone|fetchall|fetchmany|fetchrow|fetchval|fetch|filter|filter_by|get_or_none|get_or_create|find_one|find|aggregate)$
              - metavariable-regex:
                  metavariable: $O
                  regex: |-
                    ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\b)(?!os\.environ$)
          - patterns:
              - pattern-either:
                  - pattern: $MODEL.objects.$M(...)
                  - pattern: $S.get($MODEL, ...)
                  - pattern: $S.query($MODEL, ...)
              - metavariable-regex:
                  metavariable: $MODEL
                  regex: |-
                    ^(?!(?:[\w.]*\.)?\w*(?i:config|setting|persona|prompt|template|tenant|organization|workspace|brand|polic(?:y|ies)|preference|instruction|feature_?flag))(?:[\w.]*\.)?[A-Z][a-z]\w*$
          - pattern: pd.read_sql(...)
          - pattern: pd.read_sql_query(...)
      # A browser page (Playwright's new_page, in a browser or a context): page.content(),
      # page.inner_text("main"), locator.all_inner_texts().
      - label: RECORD
        exact: true
        pattern: $B.new_page(...)
      # The text in a record: a field, key, or variable named like something a person writes
      # (ticket.body, row["comment"], last_message = ...), or the decoded body of an HTTP
      # response or page (resp.text, resp.content, await resp.read(), soup.get_text(),
      # page.inner_text("main")).
      - requires: RECORD
        patterns:
          - pattern: $O.$F
          - metavariable-regex:
              metavariable: $F
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)$
      - requires: RECORD
        patterns:
          - pattern-either:
              - pattern: $O[$K]
              - pattern: $O.get($K, ...)
          - metavariable-regex:
              metavariable: $K
              regex: |-
                ^["'`](?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme|message|comment|review|reply|note|question|chunk|passage)["'`]$
      - requires: RECORD
        patterns:
          - pattern: $V
          - metavariable-regex:
              metavariable: $V
              regex: |-
                ^(?![\w$]*?(?i:prompt|persona|instruction|template|policy|guideline|greeting|config|setting|signature|preset|boilerplate|disclaimer))(?:[\w$]*?(?:_|(?<=[a-z0-9])(?=[A-Z])))?(?i:body|bodies|content|contents|text|texts|html|markdown|page_content|description|desc|notes|subject|title|transcript|feedback|bio|about|snippet|snippets|excerpt|summary|textContent|innerText|innerHTML|outerHTML|readme)$
      - requires: RECORD
        patterns:
          - pattern: $O.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:read|aread|get_text|getText|iter_text|aiter_text)$
      # What a page script returns, when the script reads the page's text: Playwright's
      # page.evaluate("() => document.body.innerText"), eval_on_selector(sel, "e => e.textContent").
      - requires: RECORD
        patterns:
          - pattern-either:
              - pattern: $P.evaluate($JS, ...)
              - pattern: $P.evaluate_all($JS, ...)
              - pattern: $P.eval_on_selector($SEL, $JS, ...)
              - pattern: $P.eval_on_selector_all($SEL, $JS, ...)
          - metavariable-regex:
              metavariable: $JS
              regex: |-
                (?is).*(?:\b(?:inner|outer)(?:text|html)\b|\btextcontent\b|document\.(?:body|documentelement)\b|getselection)
      # OpenGrep 1.30.2 loses taint at a Python slice (text[:8000], docs[:3]), so a slice of
      # something that visibly came from a source is a source itself: a document or page
      # inline (store.similarity_search(q)[:3], d.page_content[:500]) or one assignment back
      # (docs = retriever.invoke(q) ... docs[:3]); a record's text field (resp.text[:4000],
      # ticket.body[:500]) on a record assigned one step back or read in a loop over records; a
      # variable named like text assigned from a record (body = await conn.fetchval(...)); or a
      # variable assigned from a record's text field (page_text = clean(resp.text)).
      - patterns:
          - pattern-either:
              - pattern: $X[$LO:$HI]
              - pattern: $X[:$HI]
              - pattern: $X[$LO:]
          - metavariable-regex:
              metavariable: $X
              regex: |-
                ^(?!(?:\(\s*)*(?<p>\((?:[^()"'`]++|"(?:[^"\\]|\\.)*+"|'(?:[^'\\]|\\.)*+'|`(?:[^`\\]|\\.)*+`|(?&p))*+\))\s*+(?!=>|:|$|\)))
          - metavariable-pattern:
              metavariable: $X
              pattern-either:
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents|load_and_split|a?load_data|lazy_load_data|get_content|get_text|getText)$
                - pattern: $Q.page_content
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:a?invoke|a?batch|a?retrieve)$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          (?i)^(?:[\w.]*[._])?\w*retriever$
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^a?search$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          (?i)^(?:[\w.]*[._])?(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus)$
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:search|extract|crawl|get_search_context|qna_search|search_and_contents|get_contents|find_similar_and_contents|answer|scrape|scrape_url|batch_scrape|crawl_url|a?run|a?results|a?invoke|text|news|get_dict|get_json|download_documents)$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          ^(?:[\w.]*[._])?(?:(?i:\w*tavily\w*|\w*firecrawl\w*|\w*duckduckgo\w*)|exa(?:_\w+)?|\w+_exa|serp\w*|\w+_serp\w*|ddgs?(?:_\w+)?|\w+_ddgs?|brave(?:_\w+)?|\w+_brave|bing(?:_\w+)?|\w+_bing|(?:\w+_)?web_search(?:_\w+)?|(?:\w+_)?search_tool)$
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:content|inner_text|text_content|inner_html|all_inner_texts|all_text_contents)$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          (?i)^(?:[\w.]*[._])?(?:\w*_)?(?:page|tab|frame|locator)$
                - patterns:
                    - pattern: $Q.$M($JS, ...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:evaluate|evaluate_all)$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          (?i)^(?:[\w.]*[._])?(?:\w*_)?(?:page|tab|frame|locator)$
                    - metavariable-regex:
                        metavariable: $JS
                        regex: |-
                          (?is).*(?:\b(?:inner|outer)(?:text|html)\b|\btextcontent\b|document\.(?:body|documentelement)\b|getselection)
                - patterns:
                    - pattern: $CLS(...).$M(...)
                    - metavariable-regex:
                        metavariable: $CLS
                        regex: |-
                          ^(?:[\w.]*\.)?(?!(?:FileSystem|Package|Dict|Choice|Prefix|Function|Module|Data|Base)(?:Loader|Reader)$)(?!DictReader$)[A-Z]\w*(?:Loader|Reader)$
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:a?load|a?lazy_load|load_and_split|a?load_data|lazy_load_data)$
                - patterns:
                    - pattern: $F(...)
                    - metavariable-regex:
                        metavariable: $F
                        regex: |-
                          ^(?:[\w.]*\.)?_?a?(?:(?:fetch|scrape|crawl|download|browse)_(?:\w+_)?(?:page|webpage|html|url|website|site|link|web)s?(?:_\w+)?|(?:get|find|search|retrieve|query|fetch|lookup)_(?:\w+_)?(?:docs|documents|chunks|passages|articles|snippets|nodes|knowledge|kb|search_results|relevant_content|(?:relevant|retrieved|kb|rag)_context))$
                - patterns:
                    - pattern: requests.$M(...).$A
                    - metavariable-regex:
                        metavariable: $A
                        regex: |-
                          ^(?:text|content)$
                - patterns:
                    - pattern: httpx.$M(...).$A
                    - metavariable-regex:
                        metavariable: $A
                        regex: |-
                          ^(?:text|content)$
                - pattern: urlopen(...).read(...)
                - pattern: urllib.request.urlopen(...).read(...)
      - patterns:
          - pattern-either:
              - pattern: $X[$LO:$HI]
              - pattern: $X[:$HI]
              - pattern: $X[$LO:]
          - pattern-either:
              - pattern-inside: |
                  $X = $E
                  ...
              - pattern-inside: |
                  with $E as $X:
                    ...
              - pattern-inside: |
                  async with $E as $X:
                    ...
              - pattern-inside: |
                  with $CTX:
                    ...
                    $X = $E
                    ...
                  ...
              - pattern-inside: |
                  with $CTX as $CV:
                    ...
                    $X = $E
                    ...
                  ...
              - pattern-inside: |
                  async with $CTX:
                    ...
                    $X = $E
                    ...
                  ...
              - pattern-inside: |
                  async with $CTX as $CV:
                    ...
                    $X = $E
                    ...
                  ...
          - metavariable-regex:
              metavariable: $X
              regex: |-
                ^[A-Za-z_]\w*$
          - metavariable-regex:
              metavariable: $E
              regex: |-
                ^(?!(?:\(\s*)*(?<p>\((?:[^()"'`]++|"(?:[^"\\]|\\.)*+"|'(?:[^'\\]|\\.)*+'|`(?:[^`\\]|\\.)*+`|(?&p))*+\))\s*+(?!=>|:|$|\)))
          - metavariable-pattern:
              metavariable: $E
              pattern-either:
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents|load_and_split|a?load_data|lazy_load_data|get_content|get_text|getText)$
                - pattern: $Q.page_content
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^(?:a?invoke|a?batch|a?retrieve)$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          (?i)^(?:[\w.]*[._])?\w*retriever$
                - patterns:
                    - pattern: $Q.$M(...)
                    - metavariable-regex:
                        metavariable: $M
                        regex: |-
                          ^a?search$
                    - metavariable-regex:
                        metavariable: $Q
                        regex: |-
                          (?i)^(?:[\w.]*[._])?(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus)$
                - patterns:
