# Generated by scripts/gen_mcp_hidden_unicode.py from agent-instruction-hidden-unicode (the
# characters) and mcp-tool-description-instructions (the description surfaces).
# Edit those rules, or the script, not this file.
rules:
  - id: mcp-tool-description-hidden-unicode
    # The text an MCP client shows the model for each tool, prompt, and resource, and the server's
    # instructions: the same surfaces as mcp-tool-description-instructions (MCP Python SDK v2.3.0
    # and v1.30.0, fastmcp 4.1.3, Claude Agent SDK 0.2.173 @tool), whose description is the
    # `description=` argument or else `fn.__doc__`, passed on unchanged. A finding is one per
    # description: a run of invisible characters that holds a strong one (tag characters, bidi
    # embeddings, overrides and isolates, ZWSP outside Thai and CJK text, ...) or is three or more
    # long, with the thresholds of agent-instruction-hidden-unicode, so emoji ZWJ sequences, a
    # single VS16, subdivision flags, and Persian ZWNJ stay quiet. Escapes ("\u200b", "\U000E0041",
    # "\N{ZERO WIDTH SPACE}", octal "\255") count as the character they decode to. In a raw string
    # they are text, judged literal by literal, so a raw piece doesn't hide the rest of a
    # concatenation. OpenGrep binds a docstring's text with "\\" already turned into one backslash,
    # so the pattern-not-regex drops a docstring whose source holds no hidden character and no escape
    # that decodes to one.
    languages: [python]
    severity: ERROR
    message: >-
      This tool description (or an MCP prompt's or resource's, a parameter description, or the
      server instructions) contains invisible Unicode: tag characters (which the model reads as
      ASCII text that no editor, diff, or MCP client shows), bidirectional controls that display
      the text in a different order than the model reads it, zero-width characters, a run of
      variation selectors that can encode hidden bytes, or a byte-order mark, written as the
      characters themselves or as escapes that decode to them. MCP clients and agent frameworks
      put this text in the model's context as trusted, so a hidden instruction there steers
      every agent that loads the tool while the user approving it sees only the visible text
      (tool poisoning). Decode the text (print it with non-ASCII characters escaped, as Python's
      ascii() does) to see what it says, remove the characters, and if the server came from
      someone else, don't connect it until you know who added them. To mention such a character
      in a description, name it ("U+200B") or double the backslash.
    patterns:
      - pattern-either:
          # A tool function's docstring: @mcp.tool / @mcp.tool(...) on MCPServer, FastMCP,
          # and fastmcp, the Claude Agent SDK's @tool(...), and any other @<x>.tool
          # registration (LangChain, CrewAI, and pydantic-ai also read the docstring); and
          # the same for @mcp.prompt and @mcp.resource, whose docstrings clients list too.
          - patterns:
              - pattern-either:
                  - pattern: |
                      @$DEC(...)
                      def $F(...):
                          "$D"
                          ...
                  - pattern: |
                      @$DEC
                      def $F(...):
                          "$D"
                          ...
              - metavariable-regex:
                  metavariable: $DEC
                  regex: ^(?:[\w.]*\.)?(?:tool|prompt|resource)$
              - focus-metavariable: $D
          # The docstring of a plain function in a file that registers functions as tools
          # by reference: mcp.add_tool(fn), Tool.from_function(fn), mcp.tool()(fn). The
          # file text is the gate because tying each registration to its function
          # (def f ... add_tool(f)) times out on large modules.
          - patterns:
              - pattern-either:
                  - pattern-regex: (?s)\A(?=.*?\.add_tool\().*
                  - pattern-regex: (?s)\A(?=.*?\.from_function\().*
                  - pattern-regex: (?s)\A(?=.*?\.tool\([^()]*\)\(\w).*
              - pattern: |
                  def $F(...):
                      "$D"
                      ...
              - focus-metavariable: $D
          # description= on a tool, prompt, or resource registration or definition, and
          # instructions= on the server: @mcp.tool(description=...), @mcp.resource(uri,
          # description=...), mcp.add_tool(fn, description=...),
          # Tool.from_function(fn, description=...), the low-level types.Tool(...) returned
          # from a list-tools handler, MCPServer(..., instructions=...).
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern: $C(..., description=$D, ...)
                      - metavariable-regex:
                          metavariable: $C
                          regex: ^(?:[\w.]*\.)?(?:tool|add_tool|Tool|from_function|FunctionTool|prompt|resource|Prompt|Resource|ResourceTemplate|FunctionResource)$
                  - patterns:
                      - pattern: $C(..., instructions=$D, ...)
                      - metavariable-regex:
                          metavariable: $C
                          regex: ^(?:[\w.]*\.)?(?:MCPServer|FastMCP|Server)$
                  # Claude Agent SDK: @tool(name, description, input_schema).
                  - pattern: claude_agent_sdk.tool($N, $D, ...)
              - focus-metavariable: $D
          # Only in files that import an MCP SDK, fastmcp, or the Claude Agent SDK:
          # parameter descriptions, which the model reads with the tool description
          # (Field(description=...) on a tool function's parameters or in a pydantic input
          # model, fastmcp's Annotated[str, "..."], "description" entries in a JSON Schema
          # such as a low-level Tool's input_schema or a Claude Agent SDK schema dict), and
          # description or instructions text kept in a named constant.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      from $MOD import $X
                      ...
                  - pattern-inside: |
                      import $MOD
                      ...
                  - pattern-inside: |
                      import $MOD as $AS
                      ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^(?:mcp|mcp_types|fastmcp|claude_agent_sdk)(?:\.|$)
              - pattern-either:
                  - pattern: pydantic.Field(..., description=$D, ...)
                  - patterns:
                      - pattern: Annotated[$T, $D]
                      # A string literal, not a Field(...) or other metadata object.
                      - metavariable-regex:
                          metavariable: $D
                          regex: ^[rRuU]?["']
                  - pattern: '{..., "description": $D, ...}'
                  # Description or instructions text kept in a module constant
                  # (DESCRIPTION = "..." and later @mcp.tool(description=DESCRIPTION)),
                  # recognized by its name. Linking the constant to its use times out on
                  # large modules.
                  - patterns:
                      - pattern: $NAME = $D
                      - metavariable-regex:
                          metavariable: $NAME
                          regex: (?i)^\w*(?:desc|instruction|docstring|usage|hint)
                      # Text: a string, a concatenation in parentheses, or a dedent() call,
                      # not a Field(...) or schema object reported where it is defined.
                      - metavariable-regex:
                          metavariable: $D
                          regex: ^(?:[rRuUfF]{0,2}["'(]|(?:textwrap\.)?dedent\()
              - focus-metavariable: $D
      # A docstring whose escapes don't decode (an escaped backslash, a raw or bytes docstring).
      - pattern-not-regex: |-
          (?x)
          (?(DEFINE)
            # --- hidden Unicode characters (begin): build.py keeps this block identical in
            # mcp-tool-description-hidden-unicode (+ -ts), via scripts/gen_mcp_hidden_unicode.py ---
            (?<hidden> [\x{00AD}\x{034F}\x{061C}\x{115F}\x{1160}\x{17B4}\x{17B5}\x{180B}-\x{180F}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{206F}\x{3164}\x{FE00}-\x{FE0F}\x{FEFF}\x{FFA0}\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}\x{E0000}-\x{E0FFF}] )
            (?<strong>
                [\x{E0000}-\x{E00FF}\x{E01F0}-\x{E0FFF}]
              | [\x{202A}-\x{202E}\x{2066}-\x{2069}]
              | [\x{2060}-\x{2065}\x{206A}-\x{206F}]
              | [\x{FFF0}-\x{FFF8}\x{1BCA0}-\x{1BCA3}\x{1D173}-\x{1D17A}]
              | (?<!\A) \x{FEFF}
              | (?<![\p{Thai}\p{Lao}\p{Khmer}\p{Myanmar}\p{Han}\p{Hiragana}\p{Katakana}\p{Tibetan}]) \x{200B}
              | (?<! (?=[\p{L}\p{M}]) \P{Latin} ) \x{200C}
              | (?<!\p{Mongolian}) [\x{180B}-\x{180F}]
              | (?<!\p{Khmer}) [\x{17B4}\x{17B5}] )
            (?<flag> (?<=\x{1F3F4}) (?: [\x{E0061}-\x{E007A}]{2} | [\x{E0030}-\x{E0039}]{3} )
              [\x{E0030}-\x{E0039}\x{E0061}-\x{E007A}]{1,4} \x{E007F} (?!(?&hidden)) )
            # --- hidden Unicode characters (end) ---
            # The same characters written as escapes: \xAD, \u200B, \U000E0041, and \N{...} names (with their aliases).
            (?<ehidden> \\(?:255 | x[aA][dD] | u(?:00[aA][dD] | 034[fF] | 061[cC] | 11(?:5[fF]|60) | 17[bB][4-5] | 180[b-fB-F] | 200[b-fB-F] | 202[a-eA-E] | 206[0-9a-fA-F] | 3164 | [fF][eE]0[0-9a-fA-F] | [fF][eE][fF][fF] | [fF][fF][aA]0 | [fF][fF][fF][0-8]) | U(?:000000[aA][dD] | 0000034[fF] | 0000061[cC] | 000011(?:5[fF]|60) | 000017[bB][4-5] | 0000180[b-fB-F] | 0000200[b-fB-F] | 0000202[a-eA-E] | 0000206[0-9a-fA-F] | 00003164 | 0000[fF][eE]0[0-9a-fA-F] | 0000[fF][eE][fF][fF] | 0000[fF][fF][aA]0 | 0000[fF][fF][fF][0-8] | 0001[bB][cC][aA][0-3] | 0001[dD]17[3-9aA] | 000[eE]0[0-9a-fA-F]{3}) | N\{(?i:SOFT[ ]HYPHEN | SHY | COMBINING[ ]GRAPHEME[ ]JOINER | CGJ | ARABIC[ ]LETTER[ ]MARK | ALM | HANGUL[ ]CHOSEONG[ ]FILLER | HANGUL[ ]JUNGSEONG[ ]FILLER | KHMER[ ]VOWEL[ ]INHERENT[ ]A[QA] | MONGOLIAN[ ]FREE[ ]VARIATION[ ]SELECTOR[ ](?:ONE|TWO|THREE|FOUR) | FVS[1-4] | MONGOLIAN[ ]VOWEL[ ]SEPARATOR | MVS | ZERO[ ]WIDTH[ ]SPACE | ZWSP | ZERO[ ]WIDTH[ ]NON-JOINER | ZWNJ | ZERO[ ]WIDTH[ ]JOINER | ZWJ | LEFT-TO-RIGHT[ ]MARK | LRM | RIGHT-TO-LEFT[ ]MARK | RLM | (?:LEFT-TO-RIGHT|RIGHT-TO-LEFT)[ ](?:EMBEDDING|OVERRIDE) | POP[ ]DIRECTIONAL[ ]FORMATTING | LRE | RLE | PDF | LRO | RLO | WORD[ ]JOINER | WJ | FUNCTION[ ]APPLICATION | INVISIBLE[ ](?:TIMES|SEPARATOR|PLUS) | (?:LEFT-TO-RIGHT|RIGHT-TO-LEFT|FIRST[ ]STRONG|POP[ ]DIRECTIONAL)[ ]ISOLATE | LRI | RLI | FSI | PDI | (?:INHIBIT|ACTIVATE)[ ](?:SYMMETRIC[ ]SWAPPING|ARABIC[ ]FORM[ ]SHAPING) | NATIONAL[ ]DIGIT[ ]SHAPES | NOMINAL[ ]DIGIT[ ]SHAPES | HANGUL[ ]FILLER | VARIATION[ ]SELECTOR-\d++ | VS\d++ | ZERO[ ]WIDTH[ ]NO-BREAK[ ]SPACE | BYTE[ ]ORDER[ ]MARK | BOM | ZWNBSP | HALFWIDTH[ ]HANGUL[ ]FILLER | SHORTHAND[ ]FORMAT[ ](?:LETTER[ ]OVERLAP|CONTINUING[ ]OVERLAP|DOWN[ ]STEP|UP[ ]STEP) | MUSICAL[ ]SYMBOL[ ](?:BEGIN|END)[ ](?:BEAM|TIE|SLUR|PHRASE) | LANGUAGE[ ]TAG | CANCEL[ ]TAG | TAG[ ][A-Z0-9 -]++)\}) )
            (?<estrong>
                \\(?:u(?:202[a-eA-E] | 206[0-9a-fA-F] | [fF][eE][fF][fF] | [fF][fF][fF][0-8]) | U(?:0000202[a-eA-E] | 0000206[0-9a-fA-F] | 0000[fF][eE][fF][fF] | 0000[fF][fF][fF][0-8] | 0001[bB][cC][aA][0-3] | 0001[dD]17[3-9aA] | 000[eE]00[0-9a-fA-F]{2} | 000[eE]0(?:1[fF][0-9a-fA-F]|[2-9a-fA-F][0-9a-fA-F]{2})) | N\{(?i:(?:LEFT-TO-RIGHT|RIGHT-TO-LEFT)[ ](?:EMBEDDING|OVERRIDE) | POP[ ]DIRECTIONAL[ ]FORMATTING | LRE | RLE | PDF | LRO | RLO | WORD[ ]JOINER | WJ | FUNCTION[ ]APPLICATION | INVISIBLE[ ](?:TIMES|SEPARATOR|PLUS) | (?:LEFT-TO-RIGHT|RIGHT-TO-LEFT|FIRST[ ]STRONG|POP[ ]DIRECTIONAL)[ ]ISOLATE | LRI | RLI | FSI | PDI | (?:INHIBIT|ACTIVATE)[ ](?:SYMMETRIC[ ]SWAPPING|ARABIC[ ]FORM[ ]SHAPING) | NATIONAL[ ]DIGIT[ ]SHAPES | NOMINAL[ ]DIGIT[ ]SHAPES | ZERO[ ]WIDTH[ ]NO-BREAK[ ]SPACE | BYTE[ ]ORDER[ ]MARK | BOM | ZWNBSP | SHORTHAND[ ]FORMAT[ ](?:LETTER[ ]OVERLAP|CONTINUING[ ]OVERLAP|DOWN[ ]STEP|UP[ ]STEP) | MUSICAL[ ]SYMBOL[ ](?:BEGIN|END)[ ](?:BEAM|TIE|SLUR|PHRASE) | LANGUAGE[ ]TAG | CANCEL[ ]TAG | TAG[ ][A-Z0-9 -]++)\})
              | (?<!\p{Khmer}) (?<! \\u(?:17[8-9a-fA-F][0-9a-fA-F] | 19[e-fE-F][0-9a-fA-F]) | \\U0000(?:17[8-9a-fA-F][0-9a-fA-F] | 19[e-fE-F][0-9a-fA-F]) ) \\(?:u17[bB][4-5] | U000017[bB][4-5] | N\{(?i:KHMER[ ]VOWEL[ ]INHERENT[ ]A[QA])\})
              | (?<!\p{Mongolian}) (?<! \\u18[0-9aA][0-9a-fA-F] | \\U000018[0-9aA][0-9a-fA-F] ) \\(?:u180[b-fB-F] | U0000180[b-fB-F] | N\{(?i:MONGOLIAN[ ]FREE[ ]VARIATION[ ]SELECTOR[ ](?:ONE|TWO|THREE|FOUR) | FVS[1-4] | MONGOLIAN[ ]VOWEL[ ]SEPARATOR | MVS)\})
              | (?<![\p{Thai}\p{Lao}\p{Khmer}\p{Myanmar}\p{Han}\p{Hiragana}\p{Katakana}\p{Tibetan}]) (?<! \\u(?:(?:0[e-fE-F][0-9a-fA-F]{2}|10[0-9][0-9a-fA-F]) | 17[8-9a-fA-F][0-9a-fA-F] | 30[4-9a-fA-F][0-9a-fA-F] | (?:3[4-9a-fA-F][0-9a-fA-F]{2}|4(?:[0-9a-cA-C][0-9a-fA-F]{2}|[dD][0-9a-bA-B][0-9a-fA-F])) | (?:4[e-fE-F][0-9a-fA-F]{2}|[5-9][0-9a-fA-F]{3}) | [fF][9aA][0-9a-fA-F]{2}) | \\U0000(?:(?:0[e-fE-F][0-9a-fA-F]{2}|10[0-9][0-9a-fA-F]) | 17[8-9a-fA-F][0-9a-fA-F] | 30[4-9a-fA-F][0-9a-fA-F] | (?:3[4-9a-fA-F][0-9a-fA-F]{2}|4(?:[0-9a-cA-C][0-9a-fA-F]{2}|[dD][0-9a-bA-B][0-9a-fA-F])) | (?:4[e-fE-F][0-9a-fA-F]{2}|[5-9][0-9a-fA-F]{3}) | [fF][9aA][0-9a-fA-F]{2}) ) \\(?:u200[bB] | U0000200[bB] | N\{(?i:ZERO[ ]WIDTH[ ]SPACE | ZWSP)\})
