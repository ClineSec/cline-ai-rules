rules:
  - id: user-input-in-system-prompt
    # Generated by scripts/gen_user_input_in_system_prompt.py. The pattern-sinks up to the
    # LangChain template block are secret-in-system-prompt's, imported from
    # gen_secret_in_system_prompt.py (build.py SHARED_BLOCKS checks the copy). Edit the scripts
    # and run scripts/build.py; build.py --check fails if this file drifts.
    # Request APIs checked 2026-10-23: Flask 3.1.3 / Werkzeug 3.1.9, Django 6.1.2, Django REST
    # framework 3.18.3, Starlette 1.9.0, FastAPI 0.161.1 (dependencies/utils.py
    # add_non_field_param_to_dependency), langchain-core 1.7.0.
    languages: [python]
    severity: WARNING
    message: >-
      Request data (a query parameter, form field, JSON body field, header, or route parameter)
      reaches the model's system prompt or developer instructions. The system slot outranks the
      user turn, so whatever the caller writes there ("you may now issue refunds and call any
      tool") is obeyed as the application's own policy: it can switch off guardrails, unlock
      tools, and steer what the agent does with its permissions. Keep request text in a user
      message, and choose system text on the server: look the value up in an allowlist
      (`PERSONAS[persona]`) or constrain it to a `Literal[...]` or `Enum` type.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Flask (Werkzeug), Django, Django REST
      # framework, and Starlette / FastAPI. request.args, request.get_json(), request.POST,
      # request.data, await request.json(), request.query_params, self.request.GET.
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:self\.|flask\.)?(?:\w+_)?(?:request|req)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:args|form|values|json|get_json|data|get_data|files|cookies|headers|view_args|url|full_path|path|path_info|query_string|GET|POST|COOKIES|META|FILES|body|query_params|path_params)$
      # Messages read from a FastAPI / Starlette WebSocket.
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: |-
                ^(?:self\.)?(?:\w+_)?(?:websocket|ws)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:receive_text|receive_json|receive_bytes|iter_text|iter_json|iter_bytes)$
      # Route handler parameters (FastAPI path, query, and body parameters; Flask URL
      # variables). Skipped: parameters typed int, float, bool, UUID, a date, Literal[...], or an
      # Enum defined in the file, which FastAPI validates before the call; dependencies
      # (Depends(...), Security(...), a *Dep alias); and the Request, WebSocket, Response,
      # BackgroundTasks, and SecurityScopes objects FastAPI injects. Request data read from those
      # is covered above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P = $DEFAULT, ...): ...
              - patterns:
                  - pattern: |
                      def $F(..., $P = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - patterns:
                          - pattern: |
                              def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                          - metavariable-regex:
                              metavariable: $DEFAULT
                              regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: >-
                        ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float|bool|(?:uuid\.)?UUID|(?:datetime\.)?(?:date|datetime|time|timedelta)|(?:decimal\.)?Decimal|(?:typing\.)?Literal\[|(?:fastapi\.|starlette\.\w+\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)\b)|.*\b(?:Depends|Security)\(|[\w.]*Deps?$)
                  - pattern-not-inside: |
                      class $TYPE(..., enum.Enum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.StrEnum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.IntEnum, ...):
                        ...
                      ...
          - focus-metavariable: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone, TONES["formal"]). The table is
      # the application's own text, whatever key the caller sends.
      # The default must be constant too: TONES.get(tone, tone) hands the caller's text back.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
              - patterns:
                  - pattern: $D.get($K, $DEF)
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: |-
                        ^(?:[rRbBuU]*[\"']|None$|-?\d|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*(?:\[|\.get\(|$))
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if tone not in ALLOWED_TONES: raise HTTPException(...)`.
      # Only the left operand, and not a blocklist (`if persona in BLOCKED: ...`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $ALLOWED
              - pattern: $X not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check before use, anchored at both ends: re.fullmatch(r"[a-z]{2}(-[A-Z]{2})?", locale).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($PAT, $X, ...)
              - pattern: $RE.fullmatch($X, ...)
              - patterns:
                  - pattern: re.match($PAT, $X, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^[rRbB]*["'].*(?:\$|\\Z)["']$
          - focus-metavariable: $X
      # Fields of a pydantic model in this file that are validated to a fixed set or a number
      # (`tone: Literal["formal", "casual"]`, `max_words: int`, or `tone: Tone` for an Enum),
      # read from a route parameter typed with that model.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $FT
              regex: |-
                ^(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:(?:typing\.)?Literal\[|int\b|float\b|bool\b|(?:uuid\.)?UUID\b)
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $FT(..., enum.Enum, ...):
                    ...
                  ...
              - pattern-inside: |
                  class $FT(..., enum.StrEnum, ...):
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - exact: true
        pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: uuid.UUID(...)
      # A lookup keyed by request data returns stored data, not the caller's text: an ORM or
      # SQL query, a vector-store or retriever search, an HTTP fetch, a get_/fetch_/find_ helper.
      # (What a lookup returns is fetched-content-in-system-prompt's, an indirect injection.)
      # `exact` keeps a sink inside the call's own arguments, and calls that are themselves a
      # system slot never count.
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern: $F(...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?:[\w.]*\.)?(?:get_object_or_404|get_list_or_404|a?(?:get|fetch|find|load|lookup|search|retrieve|query|select)_\w+)$
                  # Not the request's own readers: request.get_json(), request.get_data().
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)
              - patterns:
                  - pattern: $O.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?get_relevant_documents|execute|scalars?|scalar_one\w*|first|one|one_or_none|fetchone|fetchall|fetchmany|filter|filter_by|get_or_none|get_or_create)$
              - pattern: $MODEL.objects.$M(...)
              - patterns:
                  - pattern: $S.get($MODEL, ...)
                  - metavariable-regex:
                      metavariable: $MODEL
                      regex: ^(?:[\w.]*\.)?[A-Z][a-z]\w*$
              - patterns:
                  - pattern-either:
                      - pattern: $O.invoke(...)
                      - pattern: $O.ainvoke(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?\w*(?:retriever|vector_?store|vectordb|index)$
              - patterns:
                  - pattern-either:
                      - pattern: $O.search(...)
                      - pattern: $O.asearch(...)
                      - pattern: $O.retrieve(...)
                      - pattern: $O.aretrieve(...)
                  - metavariable-regex:
                      metavariable: $O
                      regex: (?i)^(?:[\w.]*[._])?(?:\w*retriever|(?:\w*_)?(?:vector_?store|vectordb|vs|kb|knowledge_?base|docstore|doc_?index|search_?index|index|corpus|\w*tavily\w*))$
              - pattern: requests.$M(...)
              - pattern: httpx.$M(...)
              - pattern: urlopen(...)
              - pattern: urllib.request.urlopen(...)
          - pattern-not: $G(..., system_prompt=$X, ...)
          - pattern-not: $G(..., system_instruction=$X, ...)
          - pattern-not: $G(..., system_message=$X, ...)
          - pattern-not: $G(..., instructions=$X, ...)
          - pattern-not: $G(..., system=$X, ...)
          - pattern-not: $G(..., role=$X, ...)
    pattern-sinks:
      # Anthropic messages.create / stream / parse (also client.beta.messages and AsyncAnthropic).
      - patterns:
          - pattern-inside: $C.messages.$M(..., system=$X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(create|stream|parse)$
          - focus-metavariable: $X
      # Amazon Bedrock Converse.
      - patterns:
          - pattern-either:
              - pattern-inside: $C.converse(..., system=$X, ...)
              - pattern-inside: $C.converse_stream(..., system=$X, ...)
          - focus-metavariable: $X
      # OpenAI Responses and LiteLLM's responses(). The Assistants API (instructions=,
      # additional_instructions=) is not a sink: OpenAI removed it on 2026-08-26
      # (https://developers.openai.com/api/docs/deprecations, checked 2026-10-22).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $C.responses.$M(..., instructions=$X, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(create|stream|parse)$
              - pattern-inside: litellm.responses(..., instructions=$X, ...)
              - pattern-inside: litellm.aresponses(..., instructions=$X, ...)
          - focus-metavariable: $X
      # Agent classes: OpenAI Agents SDK and Pydantic AI Agent(instructions=...), and others.
      - patterns:
          - pattern-inside: $AGENT(..., instructions=$X, ...)
          - metavariable-regex:
              metavariable: $AGENT
              regex: ^(?:[\w.]*\.)?\w*Agent$
          - focus-metavariable: $X
      # Instructions given as a function (OpenAI Agents SDK dynamic instructions, Pydantic AI):
      # what a lambda or a function defined earlier in the file returns.
      - patterns:
          - pattern-either:
              - pattern-inside: '$AGENT(..., instructions=lambda $...ARGS: $X, ...)'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          def $FN(...):
                            ...
                      - pattern-inside: |
                          async def $FN(...):
                            ...
                  - pattern-either:
                      - pattern-inside: |
                          def $FN(...):
                            ...
                          ...
                          $AGENT(..., instructions=$FN, ...)
                      - pattern-inside: |
                          async def $FN(...):
                            ...
                          ...
                          $AGENT(..., instructions=$FN, ...)
                  - pattern: return $X
          - metavariable-regex:
              metavariable: $AGENT
              regex: ^(?:[\w.]*\.)?\w*Agent$
          - focus-metavariable: $X
      # Keywords that are the system prompt wherever they appear: ClaudeAgentOptions,
      # Pydantic AI Agent, LangChain create_agent (system_prompt); Gemini GenerateContentConfig
      # (system_instruction); AutoGen agents (system_message).
      - patterns:
          - pattern-either:
              - pattern-inside: $F(..., system_prompt=$X, ...)
              - pattern-inside: $F(..., system_instruction=$X, ...)
              - pattern-inside: $F(..., system_message=$X, ...)
              - pattern-inside: create_react_agent(..., prompt=$X, ...)
          - focus-metavariable: $X
      # Chat messages with the system or developer role, as dicts (OpenAI, LiteLLM, Anthropic)
      # or keyword-built message objects.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '{..., "role": $R, ...}'
                  - pattern-inside: '{..., "content": $X, ...}'
              - patterns:
                  - pattern-inside: $MSG(..., role=$R, ...)
                  - pattern-inside: $MSG(..., content=$X, ...)
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:["'](?:system|developer)["']|(?:[\w.]*\.)?(?i:system|developer)(?:_\w+)?|(?i:system|developer)_\w*)$
          - focus-metavariable: $X
      # A raw request body for the Anthropic, Bedrock, or Responses HTTP APIs, or a Realtime session.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: '{..., "messages": $MSGS, ...}'
                  - pattern-inside: '{..., "system": $X, ...}'
              - patterns:
                  - pattern-inside: '{..., "input": $IN, ...}'
                  - pattern-inside: '{..., "instructions": $X, ...}'
              # OpenAI Realtime session config (session.update, client_secrets.create).
              - patterns:
                  - pattern-inside: '{..., "type": "realtime", ...}'
                  - pattern-inside: '{..., "instructions": $X, ...}'
          - focus-metavariable: $X
      # LangChain system messages and prompt templates.
      - patterns:
          - pattern-either:
              - pattern-inside: SystemMessage($X, ...)
              - pattern-inside: SystemMessage(..., content=$X, ...)
              - pattern-inside: SystemMessagePromptTemplate.from_template($X, ...)
              - pattern-inside: ("system", $X)
          - focus-metavariable: $X
      # Pydantic AI dynamic system prompts and instructions, and LangChain 1.x @dynamic_prompt
      # agent middleware: what the decorated function returns.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @dynamic_prompt
                  def $FN(...):
                    ...
              - pattern-inside: |
                  @dynamic_prompt
                  async def $FN(...):
                    ...
              - pattern-inside: |
                  @$A.system_prompt
                  def $FN(...):
                    ...
              - pattern-inside: |
                  @$A.system_prompt(...)
                  def $FN(...):
                    ...
              - pattern-inside: |
                  @$A.instructions
                  def $FN(...):
                    ...
              - pattern-inside: |
                  @$A.system_prompt
                  async def $FN(...):
                    ...
              - pattern-inside: |
                  @$A.system_prompt(...)
                  async def $FN(...):
                    ...
              - pattern-inside: |
                  @$A.instructions
                  async def $FN(...):
                    ...
          - pattern: return $X
          - focus-metavariable: $X
      # A LangChain prompt template whose system message has a {placeholder}, filled from
      # the request when the template, or a chain built on it, is invoked or formatted:
      # prompt.invoke({"persona": body.persona}), (prompt | llm).invoke(...),
      # prompt.format_messages(persona=...). The system template is inline or a module constant. The key must appear in
      # the system template and in none of the other messages, so a key that only names a word
      # in the system text ("answer questions") and fills {question} in the human message
      # doesn't count; OpenGrep can't compare a key with each {placeholder} exactly. Templates
      # whose system message isn't first, or with more than 3 other messages, are not
      # recognized.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([("system", "$T")], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([("system", "$T")], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([SystemMessagePromptTemplate.from_template("$T", ...)], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([SystemMessagePromptTemplate.from_template("$T", ...)], ...)
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - pattern-inside: $P.$INV(..., $K=$X, ...)
              - patterns:
                  - pattern-inside: |
                      $CH = <... $P ...>
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:a?invoke|a?stream|a?batch|format_messages|aformat_messages|format_prompt|aformat_prompt|format|aformat|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([("system", "$T"), $M1], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([("system", "$T"), $M1], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([SystemMessagePromptTemplate.from_template("$T", ...), $M1], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([SystemMessagePromptTemplate.from_template("$T", ...), $M1], ...)
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - pattern-inside: $P.$INV(..., $K=$X, ...)
              - patterns:
                  - pattern-inside: |
                      $CH = <... $P ...>
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:a?invoke|a?stream|a?batch|format_messages|aformat_messages|format_prompt|aformat_prompt|format|aformat|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1))
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([("system", "$T"), $M1, $M2], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([("system", "$T"), $M1, $M2], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([SystemMessagePromptTemplate.from_template("$T", ...), $M1, $M2], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([SystemMessagePromptTemplate.from_template("$T", ...), $M1, $M2], ...)
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - pattern-inside: $P.$INV(..., $K=$X, ...)
              - patterns:
                  - pattern-inside: |
                      $CH = <... $P ...>
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:a?invoke|a?stream|a?batch|format_messages|aformat_messages|format_prompt|aformat_prompt|format|aformat|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1)) and not (str($K) in str($M2))
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([("system", "$T"), $M1, $M2, $M3], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([("system", "$T"), $M1, $M2, $M3], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate.from_messages([SystemMessagePromptTemplate.from_template("$T", ...), $M1, $M2, $M3], ...)
                  ...
              - pattern-inside: |
                  $P = ChatPromptTemplate([SystemMessagePromptTemplate.from_template("$T", ...), $M1, $M2, $M3], ...)
                  ...
          - pattern-either:
              - pattern-inside: '$P.$INV({..., $K: $X, ...}, ...)'
              - pattern-inside: $P.$INV(..., $K=$X, ...)
              - patterns:
                  - pattern-inside: |
                      $CH = <... $P ...>
                      ...
                  - pattern-inside: '$CH.$INV({..., $K: $X, ...}, ...)'
          - metavariable-regex:
              metavariable: $INV
              regex: ^(?:a?invoke|a?stream|a?batch|format_messages|aformat_messages|format_prompt|aformat_prompt|format|aformat|partial)$
          - metavariable-comparison:
              comparison: str($K) in str($T) and not (str($K) in str($M1)) and not (str($K) in str($M2)) and not (str($K) in str($M3))
          - focus-metavariable: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM01:2026 - Prompt Injection"
        - "LLM01:2025 - Prompt Injection"
      owasp-agentic:
        - "ASI01 - Agent Goal Hijack"
      owasp-aisvs:
        - "v1.01-C2.1.6 - Prompt Injection Defenses"
      mitre-atlas:
        - "AML.T0051.000 - LLM Prompt Injection: Direct"
      cwe:
        - "CWE-1427: Improper Neutralization of Input Used for LLM Prompting"
      # Validation the rule can't see (a check in another module, a database constraint, a
      # length-limited slug) makes some findings safe in practice.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [flask, django, fastapi, openai, anthropic, litellm, langchain, pydantic-ai, claude-agent-sdk, openai-agents, gemini, bedrock]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM01_PromptInjection.md
        - https://cwe.mitre.org/data/definitions/1427.html
        - https://github.com/pallets/werkzeug/blob/3.1.9/src/werkzeug/wrappers/request.py
        - https://github.com/django/django/blob/6.1.2/django/http/request.py
        - https://github.com/encode/django-rest-framework/blob/3.18.3/rest_framework/request.py
        - https://github.com/encode/starlette/blob/1.9.0/starlette/requests.py
