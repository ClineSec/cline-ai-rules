rules:
  - id: llm-max-tokens-from-user-input
    # Generated by scripts/gen_llm_max_tokens_from_user_input.py. The first pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt's request-data sources and
    # allowlist checks, imported from gen_user_input_in_system_prompt.py (build.py
    # SHARED_BLOCKS checks the copy). Edit the scripts and run scripts/build.py; build.py
    # --check fails if this file drifts.
    # SDKs checked 2026-10-25 from package source: openai 3.37.0, anthropic 2.3.0, litellm
    # 1.106.4, langchain-openai 1.7.2, langchain-anthropic 1.7.6, langchain-google-genai
    # 4.4.2, google-genai 2.33.0; agent step caps as in agent-loop-unbounded-iterations.
    languages: [python]
    severity: WARNING
    message: >-
      A request value decides how much work a model call does: its output-token cap
      (`max_tokens`, `max_completion_tokens`, `max_output_tokens`), how many completions it returns (`n`), how many steps an agent run may take,
      or how many times a loop calls the model. Nothing caps it on the way, so any caller can
      ask for the model's longest output, many choices, or thousands of calls in one request,
      and a script that repeats it runs up the provider bill or uses up the rate limit that
      every other user shares (denial of wallet). Choose the limit on the server, or cap the
      request value before use: `min(body.max_tokens, 1024)`, a schema bound (`Field(512, ge=1, le=1024)`, `Query(le=1024)`), or a per-plan table. If this endpoint is itself a metered model gateway that
      bills each caller for the tokens they ask for, this may be by design.
    mode: taint
    options:
      # A comparison says something about the request without carrying its value. Numbers
      # stay tainted: here the number is the risk.
      taint_assume_safe_booleans: true
    pattern-sources:
      # Request data read from the request object: Flask (Werkzeug), Django, Django REST
      # framework, and Starlette / FastAPI. request.args, request.get_json(), request.POST,
      # request.data, await request.json(), request.query_params, self.request.GET.
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:self\.|flask\.)?(?:\w+_)?(?:request|req)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:args|form|values|json|get_json|data|get_data|files|cookies|headers|view_args|url|full_path|path|path_info|query_string|GET|POST|COOKIES|META|FILES|body|query_params|path_params)$
      # Messages read from a FastAPI / Starlette WebSocket.
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: |-
                ^(?:self\.)?(?:\w+_)?(?:websocket|ws)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:receive_text|receive_json|receive_bytes|iter_text|iter_json|iter_bytes)$
      # Route handler parameters (FastAPI path, query, and body parameters; Flask URL
      # variables). Skipped: parameters typed int, float, bool, UUID, a date, Literal[...], or an
      # Enum defined in the file, which FastAPI validates before the call; dependencies
      # (Depends(...), Security(...), a *Dep alias); and the Request, WebSocket, Response,
      # BackgroundTasks, and SecurityScopes objects FastAPI injects. Request data read from those
      # is covered above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P = $DEFAULT, ...): ...
              - patterns:
                  - pattern: |
                      def $F(..., $P = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - patterns:
                          - pattern: |
                              def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                          - metavariable-regex:
                              metavariable: $DEFAULT
                              regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: >-
                        ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float|bool|(?:uuid\.)?UUID|(?:datetime\.)?(?:date|datetime|time|timedelta)|(?:decimal\.)?Decimal|(?:typing\.)?Literal\[|(?:fastapi\.|starlette\.\w+\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)\b)|.*\b(?:Depends|Security)\(|[\w.]*Deps?$)
                  - pattern-not-inside: |
                      class $TYPE(..., enum.Enum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.StrEnum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.IntEnum, ...):
                        ...
                      ...
          - focus-metavariable: $P
      # Route handler parameters typed as numbers (max_tokens: int = 512, Optional[int],
      # Annotated[int, Query()]), which user-input-in-system-prompt skips. A bound on the
      # parameter (Query(le=...)) is cleared by a sanitizer below.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - pattern: |
                  def $F(..., $P: $TYPE, ...): ...
              - pattern: |
                  def $F(..., $P: $TYPE = $DEFAULT, ...): ...
          - metavariable-regex:
              metavariable: $TYPE
              regex: |-
                ^(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float)\b|^(?:int|float)\s*\|\s*None\b|^None\s*\|\s*(?:int|float)\b
          - focus-metavariable: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone, TONES["formal"]). The table is
      # the application's own text, whatever key the caller sends.
      # The default must be constant too: TONES.get(tone, tone) hands the caller's text back.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
              - patterns:
                  - pattern: $D.get($K, $DEF)
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: |-
                        ^(?:[rRbBuU]*[\"']|None$|-?\d|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*(?:\[|\.get\(|$))
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if tone not in ALLOWED_TONES: raise HTTPException(...)`.
      # Only the left operand, and not a blocklist (`if persona in BLOCKED: ...`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $ALLOWED
              - pattern: $X not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check before use, anchored at both ends: re.fullmatch(r"[a-z]{2}(-[A-Z]{2})?", locale).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($PAT, $X, ...)
              - pattern: $RE.fullmatch($X, ...)
              - patterns:
                  - pattern: re.match($PAT, $X, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^[rRbB]*["'].*(?:\$|\\Z)["']$
          - focus-metavariable: $X
      # A cap applied on the server: min(body.max_tokens, 4096), numpy.clip, a clamp helper.
      - exact: true
        pattern-either:
          - pattern: min(...)
          - pattern: numpy.clip(...)
          - pattern: numpy.minimum(...)
      - exact: true
        patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?i)^(?:[\w.]*\.)?_?(?:\w*?(?:clamp|clip)\w*|(?:cap|bound|limit)(?:_\w+)?)$
      # A conditional that compares first: n if n <= MAX_TOKENS else MAX_TOKENS.
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $A if $L < $R else $B
              - pattern: $A if $L <= $R else $B
              - pattern: $A if $L > $R else $B
              - pattern: $A if $L >= $R else $B
          - metavariable-regex:
              metavariable: $L
              regex: |-
                ^(?!-?[01](?:\.0)?$|None$)
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?!-?[01](?:\.0)?$|None$)
      # A comparison before use: `if body.max_tokens > 4096: raise HTTPException(...)`, an
      # assert, or a chained range check (`if not 1 <= n <= MAX_TOKENS`). Either operand is
      # cleared from then on when the other is a real bound (not 0, 1, or None). Not a while
      # loop's own condition (attempts < body.max_attempts), which is the count, not a check. A
      # side-effect sanitizer instead of an `if ...: ...` region, which cost several times more.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $L < $R
              - pattern: $L <= $R
              - pattern: $L > $R
              - pattern: $L >= $R
          - pattern-not-inside: |
              while $L < $R:
                  ...
          - pattern-not-inside: |
              while $L <= $R:
                  ...
          - pattern-not-inside: |
              while $L > $R:
                  ...
          - pattern-not-inside: |
              while $L >= $R:
                  ...
          - focus-metavariable: $L
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?!-?[01](?:\.0)?$|None$)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $L < $R
              - pattern: $L <= $R
              - pattern: $L > $R
              - pattern: $L >= $R
          - pattern-not-inside: |
              while $L < $R:
                  ...
          - pattern-not-inside: |
              while $L <= $R:
                  ...
          - pattern-not-inside: |
              while $L > $R:
                  ...
          - pattern-not-inside: |
              while $L >= $R:
                  ...
          - focus-metavariable: $R
          - metavariable-regex:
              metavariable: $L
              regex: |-
                ^(?!-?[01](?:\.0)?$|None$)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $LO < $L < $R
              - pattern: $LO < $L <= $R
              - pattern: $LO <= $L < $R
              - pattern: $LO <= $L <= $R
          - focus-metavariable: $L
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?!-?[01](?:\.0)?$|None$)
      # A route parameter declared with a bound: max_tokens: int = Query(512, le=4096),
      # Annotated[int, Query(le=4096)], conint(le=4096).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $FN(..., $P = $D, ...): ...
                  - metavariable-regex:
                      metavariable: $D
                      regex: |-
                        (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
              - patterns:
                  - pattern-inside: |
                      def $FN(..., $P: $T, ...): ...
                  - metavariable-regex:
                      metavariable: $T
                      regex: |-
                        (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
              - patterns:
                  - pattern-inside: |
                      def $FN(..., $P: $T = $D, ...): ...
                  - pattern-either:
                      - patterns:
                          - pattern: $P
                          - metavariable-regex:
                              metavariable: $D
                              regex: |-
                                (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
                      - patterns:
                          - pattern: $P
                          - metavariable-regex:
                              metavariable: $T
                              regex: |-
                                (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
          - pattern: $P
      # A field of a pydantic model in this file declared with a bound (max_tokens: int =
      # Field(512, le=4096), conint(le=...), Annotated[int, Le(...)]) or checked by a field
      # validator, read from a value of that model: a route parameter typed with it, or one
      # built with Model(...) / Model.model_validate(...).
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $M(...):
                        ...
                        $FIELD: $FT = $FD
                        ...
                      ...
                  - metavariable-regex:
                      metavariable: $FD
                      regex: |-
                        (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
              - patterns:
                  - pattern-inside: |
                      class $M(...):
                        ...
                        $FIELD: $FT
                        ...
                      ...
                  - metavariable-regex:
                      metavariable: $FT
                      regex: |-
                        (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
              - patterns:
                  - pattern-inside: |
                      class $M(...):
                        ...
                        $FIELD: $FT = $FD
                        ...
                      ...
                  - metavariable-regex:
                      metavariable: $FT
                      regex: |-
                        (?s).*(?:\b(?:le|lt)\s*=|\b(?:Le|Lt|Interval)\()
              - patterns:
                  - pattern-inside: |
                      class $M(...):
                        ...
                        @$VALIDATOR(..., "$FV", ...)
                        def $VF(...): ...
                        ...
                      ...
                  - metavariable-regex:
                      metavariable: $VALIDATOR
                      regex: ^(?:[\w.]*\.)?(?:field_)?validator$
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
              - pattern-inside: |
                  $B = $M(**$KW)
                  ...
              - pattern-inside: |
                  $B = $M.$PARSE(...)
                  ...
          - pattern: $B.$FIELD
          - metavariable-comparison:
              comparison: not re.match("^[(]", str($FIELD))
      - patterns:
          - pattern-inside: |
              class $M(...):
                ...
                @$VALIDATOR(..., "$FV", ...)
                def $VF(...): ...
                ...
              ...
          - metavariable-regex:
              metavariable: $VALIDATOR
              regex: ^(?:[\w.]*\.)?(?:field_)?validator$
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  $B = $M(**$KW)
                  ...
              - pattern-inside: |
                  $B = $M.$PARSE(...)
                  ...
          - pattern: $B.$FIELD
          - metavariable-comparison:
              comparison: str($FIELD) == str($FV)
      # A request model declared in another module (body: schemas.DraftRequest, or
      # DraftRequest.model_validate(...)) may bound its fields where the rule can't see, so a
      # value of it is left alone. Models declared in this file are judged by the field
      # sanitizers above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?!(?:[\w.]*\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)$)(?:[\w.]*\.)?[A-Z]\w*$
          - pattern: $B.$ATTR
          - pattern-not-inside: |
              class $M(...):
                ...
              ...
      - exact: true
        patterns:
          - pattern: $M.$PARSE(...)
          - metavariable-regex:
              metavariable: $PARSE
              regex: ^(?:model_validate|model_validate_json|parse_obj|parse_raw)$
          - pattern-not-inside: |
              class $M(...):
                ...
              ...
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?!(?:[\w.]*\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)$)(?:[\w.]*\.)?[A-Z]\w*$
      # A Django REST framework serializer or Django form field with max_value, read back from
      # validated_data / cleaned_data under its own name.
      - patterns:
          - pattern-inside: |
              class $S(...):
                ...
                $FIELD = $T(..., max_value=$MAX, ...)
                ...
              ...
          - pattern-either:
              - pattern: $V.validated_data["$K"]
              - pattern: $V.cleaned_data["$K"]
              - pattern: $V.validated_data.get("$K", ...)
              - pattern: $V.cleaned_data.get("$K", ...)
          - metavariable-comparison:
              comparison: str($FIELD) == str($K)
    pattern-sinks:
      # A model call's output-token cap, choice count, tool-call cap, or an agent run's
      # step cap, as a keyword argument.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: '$C.chat.completions.$M(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:create|parse|stream)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|max_completion_tokens|n)$
              - patterns:
                  - pattern: '$C.completions.create(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|n|best_of)$
              - patterns:
                  - pattern: '$C.responses.$M(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:create|parse|stream)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_output_tokens|max_tool_calls)$
              - patterns:
                  - pattern: '$C.messages.$M(..., max_tokens=$X, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:create|stream|parse)$
              - patterns:
                  - pattern: '$F(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?a?(?:completion|text_completion|responses)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|max_completion_tokens|max_output_tokens|n)$
              - patterns:
                  - pattern: '$F(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?(?:(?:Azure)?Chat[A-Z]\w*|init_chat_model)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|max_completion_tokens|max_tokens_to_sample|max_output_tokens|n|candidate_count)$
              - patterns:
                  - pattern: '$LLM.bind(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_tokens|max_completion_tokens|max_output_tokens|n)$
              - patterns:
                  - pattern: '$F(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?GenerateContentConfig$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_output_tokens|candidate_count)$
              - patterns:
                  - pattern: 'agents.Runner.$M(..., max_turns=$X, ...)'
                  - metavariable-regex:
                      metavariable: $M
                      regex: |-
                        ^(?:run|run_sync|run_streamed)$
              - patterns:
                  - pattern: '$F(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?(?:ClaudeAgentOptions|RoundRobinGroupChat|SelectorGroupChat|Swarm|MagenticOneGroupChat)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^max_turns$
              - pattern: '$C.beta.messages.tool_runner(..., max_iterations=$X, ...)'
              - patterns:
                  - pattern: '$F(..., max_iterations=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?(?:AgentExecutor(?:\.from_agent_and_tools)?|initialize_agent|create_\w+_agent)$
              - patterns:
                  - pattern: '$F(..., max_iter=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?\w*(?:Agent|Crew)$
              - patterns:
                  - pattern: '$F(..., max_steps=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?(?:CodeAgent|ToolCallingAgent|MultiStepAgent|\w*agent\w*\.run)$
              - patterns:
                  - pattern: '$F(..., $K=$X, ...)'
                  - metavariable-regex:
                      metavariable: $F
                      regex: |-
                        ^(?:[\w.]*\.)?(?:GroupChat|\w*Agent)$
                  - metavariable-regex:
                      metavariable: $K
                      regex: |-
                        ^(?:max_round|max_consecutive_auto_reply)$
              - pattern: '$F(..., recursion_limit=$X, ...)'
          - focus-metavariable: $X
      # The same keys in a dict that reaches a call: splatted (create(**params)), or passed as
      # a JSON body or config (httpx.post(url, json={...}), config={"max_output_tokens": n},
      # inferenceConfig={"maxTokens": n}), inline or through a variable, or a LangGraph run
      # config ({"recursion_limit": n}) given to any call.
      - patterns:
          - pattern-either:
              - pattern: |
                  $D = {..., "max_tokens": $X, ...}
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D["max_tokens"] = $X
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  if $COND:
                      ...
                      $D["max_tokens"] = $X
                      ...
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D = {..., "max_completion_tokens": $X, ...}
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D["max_completion_tokens"] = $X
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  if $COND:
                      ...
                      $D["max_completion_tokens"] = $X
                      ...
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D = {..., "max_output_tokens": $X, ...}
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D["max_output_tokens"] = $X
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  if $COND:
                      ...
                      $D["max_output_tokens"] = $X
                      ...
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D = {..., "max_tokens_to_sample": $X, ...}
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D["max_tokens_to_sample"] = $X
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  if $COND:
                      ...
                      $D["max_tokens_to_sample"] = $X
                      ...
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D = {..., "maxTokens": $X, ...}
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  $D["maxTokens"] = $X
                  ...
                  $CALL(..., **$D, ...)
              - pattern: |
                  if $COND:
                      ...
                      $D["maxTokens"] = $X
                      ...
                  ...
                  $CALL(..., **$D, ...)
              - pattern: '$CALL(..., {..., "recursion_limit": $X, ...}, ...)'
              - patterns:
                  - pattern-either:
                      - pattern: |
                          $D = {..., "max_tokens": $X, ...}
                          ...
                          $CALL(..., $KW=$D, ...)
                      - pattern: '$CALL(..., $KW={..., "max_tokens": $X, ...}, ...)'
                      - pattern: '$CALL(..., $KW={..., $OUTER: {..., "max_tokens": $X, ...}, ...}, ...)'
                      - pattern: |
                          $D = {..., "max_completion_tokens": $X, ...}
                          ...
                          $CALL(..., $KW=$D, ...)
                      - pattern: '$CALL(..., $KW={..., "max_completion_tokens": $X, ...}, ...)'
                      - pattern: '$CALL(..., $KW={..., $OUTER: {..., "max_completion_tokens": $X, ...}, ...}, ...)'
                      - pattern: |
                          $D = {..., "max_output_tokens": $X, ...}
                          ...
                          $CALL(..., $KW=$D, ...)
                      - pattern: '$CALL(..., $KW={..., "max_output_tokens": $X, ...}, ...)'
                      - pattern: '$CALL(..., $KW={..., $OUTER: {..., "max_output_tokens": $X, ...}, ...}, ...)'
                      - pattern: |
                          $D = {..., "max_tokens_to_sample": $X, ...}
                          ...
                          $CALL(..., $KW=$D, ...)
                      - pattern: '$CALL(..., $KW={..., "max_tokens_to_sample": $X, ...}, ...)'
                      - pattern: '$CALL(..., $KW={..., $OUTER: {..., "max_tokens_to_sample": $X, ...}, ...}, ...)'
                      - pattern: |
                          $D = {..., "maxTokens": $X, ...}
                          ...
                          $CALL(..., $KW=$D, ...)
                      - pattern: '$CALL(..., $KW={..., "maxTokens": $X, ...}, ...)'
                      - pattern: '$CALL(..., $KW={..., $OUTER: {..., "maxTokens": $X, ...}, ...}, ...)'
                  - metavariable-regex:
                      metavariable: $KW
                      regex: |-
                        ^(?:json|config|model_kwargs|extra_body|inferenceConfig|inference_config|generation_config|options|model_settings|llm_config|params)$
          - focus-metavariable: $X
      # A loop or comprehension that calls the model once per step, its count from the
      # request: for _ in range(body.variants), [draft() for _ in range(n)], a retry loop.
      - patterns:
          - pattern-either:
              - pattern: |
                  for $I in range($X):
                      $...BODY
              - pattern: |
                  for $I in range($LO, $X, ...):
                      $...BODY
              - pattern: |
                  async for $I in range($X):
                      $...BODY
          - metavariable-pattern:
              metavariable: $...BODY
              pattern-either:
                - pattern: $O.chat.completions.$MC(...)
                - pattern: $O.responses.$MC(...)
                - pattern: $O.messages.$MC(...)
                - pattern: $O.models.generate_content(...)
                - pattern: litellm.$MC(...)
                - pattern: agents.Runner.$MC(...)
                - pattern: $O.invoke(...)
                - pattern: $O.ainvoke(...)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: '[$E for $I in range($X)]'
              - pattern: '($E for $I in range($X))'
              - pattern: '[$E for $I in range($LO, $X)]'
              - pattern: '($E for $I in range($LO, $X))'
          - metavariable-pattern:
              metavariable: $E
              pattern-either:
                - pattern: $O.chat.completions.$MC(...)
                - pattern: $O.responses.$MC(...)
                - pattern: $O.messages.$MC(...)
                - pattern: $O.models.generate_content(...)
                - pattern: litellm.$MC(...)
                - pattern: agents.Runner.$MC(...)
                - pattern: $O.invoke(...)
                - pattern: $O.ainvoke(...)
          - focus-metavariable: $X
      # A while loop that counts up to a request value: while attempts < body.max_attempts,
      # while len(drafts) < body.count. `while True:` with a break on a constant, and a
      # condition joined with `and`, aren't matched.
      - patterns:
          - pattern-either:
              - pattern: |
                  while $C < $X:
                      $...BODY
              - pattern: |
                  while $C <= $X:
                      $...BODY
              - pattern: |
                  while $X > $C:
                      $...BODY
              - pattern: |
                  while $X >= $C:
                      $...BODY
          - metavariable-pattern:
              metavariable: $...BODY
              pattern-either:
                - pattern: $O.chat.completions.$MC(...)
                - pattern: $O.responses.$MC(...)
                - pattern: $O.messages.$MC(...)
                - pattern: $O.models.generate_content(...)
                - pattern: litellm.$MC(...)
                - pattern: agents.Runner.$MC(...)
                - pattern: $O.invoke(...)
                - pattern: $O.ainvoke(...)
          - focus-metavariable: $X
