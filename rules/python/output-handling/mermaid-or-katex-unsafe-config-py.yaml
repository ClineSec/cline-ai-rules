rules:
  - id: mermaid-or-katex-unsafe-config-py
    languages: [python]
    severity: WARNING
    message: >-
      This Mermaid or KaTeX setting lets the diagram or formula source put script in the page
      that renders it. Chat UIs and preview pages render Mermaid and math straight from model
      answers, so anyone who can steer the model (through a web page, document, ticket, or
      tool result it reads) writes that source. Mermaid's `securityLevel: "loose"` skips the
      DOMPurify pass over the finished SVG and leaves `click` links and callbacks unchecked,
      so `click A href "javascript:..."` runs script when a user clicks the node; a `secure`
      list without `securityLevel` lets a `%%{init: ...}%%` directive inside the diagram
      switch to loose on its own. KaTeX's `trust: true`, or a trust function that allows
      `\href`, `\url`, or `\includegraphics` without checking the URL, renders
      `\href{javascript:...}` links, `\htmlStyle` overlays, and remote images that load as
      soon as the answer appears. Keep Mermaid at its default `strict` (or `sandbox`), and use
      the renderer's own click handling (NiceGUI's `on_node_click`) instead of loose mode; keep
      `securityLevel` in any `secure` list you set. Leave KaTeX's `trust` off, or allow only
      the commands you need and check `context.protocol` against `https` and `_relative`. If
      this page only ever shows text your team wrote, the risk is low.
    pattern-either:
      # Mermaid config as a dict: NiceGUI `ui.mermaid(content, config=...)` passes it to
      # mermaid.initialize(), and apps json.dumps a dict into the page they serve. A string
      # constant matches too.
      - patterns:
          - pattern-either:
              - pattern: '{..., "securityLevel": $V, ...}'
              # A dict with `**base` unpacking needs its own pattern.
              - pattern: '{**$BASE, ..., "securityLevel": $V, ...}'
              - pattern: dict(..., securityLevel=$V, ...)
              - pattern: $D["securityLevel"] = $V
          - metavariable-pattern:
              metavariable: $V
              patterns:
                - pattern: '"loose"'
                - pattern-not-inside: $F(...)
                - pattern-not-inside: '[...]'
                - pattern-not-inside: $A == $B
                - pattern-not-inside: $A != $B
          - focus-metavariable: $V
      # A `secure` list without securityLevel lets `%%{init}%%` directives in the diagram
      # text set it. A list built from another list may include it, so it is left alone.
      - patterns:
          - pattern-regex: (?s)\A(?=.*?(?:\bui\.mermaid\b|["'/@]mermaid\b|\bmermaid\.)).*
          - pattern-either:
              - pattern: '{..., "secure": $ARR, ...}'
              - pattern: '{**$BASE, ..., "secure": $ARR, ...}'
          - metavariable-regex:
              metavariable: $ARR
              regex: ^\[(?![\s\S]*(?:securityLevel|\*))
          - focus-metavariable: $ARR
      # JavaScript inside a string (an HTML page or snippet the app serves, f-strings and
      # implicitly concatenated literals included).
      - patterns:
          - pattern-either:
              - pattern-inside: '"$S"'
              - pattern-inside: 'f"..."'
          - pattern-regex: |-
              (?xm)
              # --- mermaid/katex config text (begin): build.py keeps this block identical in
              # mermaid-or-katex-unsafe-config-markup; edit both together. ---
              (?(DEFINE)
                # From the start of a line that isn't a // or /* comment line or an HTML comment,
                # up to (not past) a Mermaid %%{init}%% directive: directives can't set
                # securityLevel (it is one of Mermaid's secure keys).
                (?<line> ^[\x20\t]*+ (?!//|/\*|\*|<!--) (?:(?!%%\{)[^\n])*? )
                # A key in an object literal or dict starts after { or , (and any comments between
                # keys), so prose and docstrings don't count. Keys may be quoted, with escaped
                # quotes inside a host string.
                (?<open> [{,] (?: \s++ | //[^\n]*+ | /\*(?s:.*?)\*/ | <!--(?s:.*?)--> )*+ )
                (?<q> \\?["'] )
                (?<colon> (?&q)? \s* : \s* )
                # A function that always returns true.
                (?<always_true> (?:\([^)\n]*\)|[\w$]+) \s* => \s* (?: true\b | \{ \s* return \s+ true \s* ;? \s* \} )
                  | function \s* [\w$]* \s* \( [^)\n]* \) \s* \{ \s* return \s+ true \s* ;? \s* \} )
                # A one-line arrow function that never reads the URL or its protocol and either
                # names \href, \url, or \includegraphics (allowing them) or is a blocklist written
                # as one negated expression.
                (?<open_trust> (?:\([^)\n]*\)|[\w$]+) \s* => (?![^\n]*protocol) (?![^\n]*(?<!\\)\burl\b)
                  (?: [^\n]* \\ (?:href|url|includegraphics) \b | \s* (?!\{) [^\n]*? (?: !==? | (?<![!=]) ! (?![!=]) ) ) )
              )
              # --- mermaid/katex config text (end) ---
              # Mermaid securityLevel "loose".
              (?&line) (?&open) \K (?&q)? securityLevel (?&colon) \\?["'`] loose \\?["'`]
      # KaTeX trust, in a file that loads KaTeX (a katex script or stylesheet path, an import,
      # katex.render, or renderMathInElement).
      - patterns:
          - pattern-regex: (?s)\A(?=.*?(?:["'/@]katex\b|\bkatex\.|renderMathInElement)).*
          - pattern-either:
              - pattern-inside: '"$S"'
              - pattern-inside: 'f"..."'
          - pattern-regex: |-
              (?xm)
              # --- mermaid/katex config text (begin): build.py keeps this block identical in
              # mermaid-or-katex-unsafe-config-markup; edit both together. ---
              (?(DEFINE)
                # From the start of a line that isn't a // or /* comment line or an HTML comment,
                # up to (not past) a Mermaid %%{init}%% directive: directives can't set
                # securityLevel (it is one of Mermaid's secure keys).
                (?<line> ^[\x20\t]*+ (?!//|/\*|\*|<!--) (?:(?!%%\{)[^\n])*? )
                # A key in an object literal or dict starts after { or , (and any comments between
                # keys), so prose and docstrings don't count. Keys may be quoted, with escaped
                # quotes inside a host string.
                (?<open> [{,] (?: \s++ | //[^\n]*+ | /\*(?s:.*?)\*/ | <!--(?s:.*?)--> )*+ )
                (?<q> \\?["'] )
                (?<colon> (?&q)? \s* : \s* )
                # A function that always returns true.
                (?<always_true> (?:\([^)\n]*\)|[\w$]+) \s* => \s* (?: true\b | \{ \s* return \s+ true \s* ;? \s* \} )
                  | function \s* [\w$]* \s* \( [^)\n]* \) \s* \{ \s* return \s+ true \s* ;? \s* \} )
                # A one-line arrow function that never reads the URL or its protocol and either
                # names \href, \url, or \includegraphics (allowing them) or is a blocklist written
                # as one negated expression.
                (?<open_trust> (?:\([^)\n]*\)|[\w$]+) \s* => (?![^\n]*protocol) (?![^\n]*(?<!\\)\burl\b)
                  (?: [^\n]* \\ (?:href|url|includegraphics) \b | \s* (?!\{) [^\n]*? (?: !==? | (?<![!=]) ! (?![!=]) ) ) )
              )
              # --- mermaid/katex config text (end) ---
              # KaTeX trust: true, an always-true function, or an open trust function.
              (?&line) (?&open) \K (?&q)? trust (?&colon) (?: true\b | (?&always_true) | (?&open_trust) )
    metadata:
      category: security
      subcategory: [audit]
      pack-category: ai-code
      owasp-llm:
        - "LLM10:2026 - Improper Output Handling"
        - "LLM05:2025 - Improper Output Handling"
      mitre-atlas:
        - "AML.T0077 - LLM Response Rendering"
        - "AML.T0051 - LLM Prompt Injection"
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mermaid, katex, nicegui]
      # Mermaid 12.2.0 and KaTeX 0.19.0 behavior checked 2026-10-23; see
      # mermaid-or-katex-unsafe-config for the source details. NiceGUI 3.18.0: ui.mermaid's
      # config dict goes straight to mermaid.initialize() (elements/mermaid/mermaid.js), and
      # on_node_click binds its own listener, so clickable nodes don't need loose mode.
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM10_ImproperOutputHandling.md
        - https://cwe.mitre.org/data/definitions/79.html
        - https://mermaid.js.org/config/usage.html#securitylevel
        - https://katex.org/docs/options.html
        - https://katex.org/docs/autorender.html
        - https://nicegui.io/documentation/mermaid
        - https://github.com/advisories/GHSA-v8qj-hxv7-mgvv
        - https://github.com/advisories/GHSA-wvh5-6vjm-23qh
