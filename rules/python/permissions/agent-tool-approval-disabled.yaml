rules:
  - id: agent-tool-approval-disabled
    # Generated by scripts/gen_mcp_auto_approve.py, which holds the tool-name test shared by the
    # MCP auto-approval rules. Edit the script and run scripts/build.py; build.py --check fails if
    # this file drifts.
    languages: [python]
    severity: WARNING
    message: >-
      Human approval is switched off for tools this agent can call: require_approval "never" on a hosted MCP server (OpenAI Responses API, Agents SDK
      HostedMCPTool, Azure AI Foundry MCPTool, Azure AI Agents McpTool
      set_approval_mode, or Microsoft Agent Framework approval_mode "never_require"),
      a never-filter or LangChain /
      deepagents interrupt_on entry that auto-approves a tool whose name says it writes,
      sends, deletes, or runs something, or an on_approval_request callback that
      approves every call. The model's
      tool calls then run with nobody checking them, so a prompt injection in a document,
      ticket, email, web page, or tool result the model reads can make it take those
      actions (send messages, change or delete records, move money, push code) with the
      app's credentials. Keep approval on for tools that change things: leave
      require_approval at "always" (or list only read-only tools under "never"), limit
      allowed_tools to read-only tools, set interrupt_on entries for acting tools to True,
      and make approval callbacks decide from the tool name and arguments instead of
      approving everything.
    patterns:
      - pattern-either:
          # require_approval "never" on an MCP tool dict or a keyword-built one (dict(...),
          # Mcp(...), Azure AI Projects MCPTool(...)). server_label is required, so it marks a
          # hosted MCP tool.
          - patterns:
              - pattern-either:
                  - pattern: '{..., "type": "mcp", ..., "require_approval": $RA, ...}'
                  - pattern: '{..., "server_label": $L, ..., "require_approval": $RA, ...}'
                  - pattern: $F(..., server_label=$L, ..., require_approval=$RA, ...)
              - metavariable-regex:
                  metavariable: $RA
                  regex: ^[^{\[]
              - metavariable-pattern:
                  metavariable: $RA
                  pattern: '"never"'
              - focus-metavariable: $RA
          # Azure AI Agents McpTool (default "always") switched to "never", unless the McpTool
          # it is called on reaches only read-only tools or a documentation server.
          - patterns:
              - pattern: $M.set_approval_mode($RA)
              - metavariable-regex:
                  metavariable: $RA
                  regex: ^[^{\[]
              - metavariable-pattern:
                  metavariable: $RA
                  pattern: '"never"'
              - pattern-not-inside:
                  patterns:
                    - pattern-either:
                        - pattern: |
                            $M = McpTool(..., allowed_tools=$AT, ...)
                            ...
                        - pattern: |
                            $M = McpTool($L2, $U2, $AT, ...)
                            ...
                    - metavariable-regex:
                        metavariable: $AT
                        regex: |-
                          (?x)
                          (?(DEFINE)
                            (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                            (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                            (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                            (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                          )
                          ^ (?: \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \]
                            | \{ \s*+ ["']?+ (?:tool_names|toolNames) ["']?+ \s*+ : \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \}
                            | \{ [^{}]*? ["']?+ (?:read_only|readOnly) ["']?+ \s*+ : \s*+ (?:True|true) \b [^{}]*+ \}
                            | [\w.]++ \( \s*+ tool_names \s*+ = \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \)
                            | [\w.]++ \( [^()]*? \b read_only \s*+ = \s*+ True \b [^()]*+ \)
                            ) $
              - pattern-not-inside:
                  patterns:
                    - pattern-either:
                        - pattern: |
                            $M = McpTool(..., server_url=$U, ...)
                            ...
                        - pattern: |
                            $M = McpTool($L2, $U, ...)
                            ...
                    - metavariable-regex:
                        metavariable: $U
                        regex: |-
                          ^(?:[fFrRuU]{0,2})?[\"'`]https?://(?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#\"'`$]|$)
              - focus-metavariable: $RA
          # {"never": {"tool_names": [...]}} listing a tool that acts.
          - patterns:
              - pattern-either:
                  - pattern-inside: '{..., "require_approval": $X, ...}'
                  - pattern-inside: $F(..., require_approval=$X, ...)
                  - pattern-inside: $M.set_approval_mode($X)
              - pattern-either:
                  - pattern: '{..., "never": {..., "tool_names": [..., "$V", ...], ...}, ...}'
                  # Azure: MCPToolRequireApproval(never=MCPToolFilter(tool_names=[...])), and
                  # MCPApprovalPerTool(never=MCPToolList(tool_names=[...])) in Azure AI Agents.
                  - pattern: '$G(..., never=$H(..., tool_names=[..., "$V", ...], ...), ...)'
              - focus-metavariable: $V
              - metavariable-regex:
                  metavariable: $V
                  regex: |-
                    (?x)
                    (?(DEFINE)
                      (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                      (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                      (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                      (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                    )
                    ^ \s*+ (?: (?! (?&read) ) [^*?"] )*? (?: [*?] | (?&act) )
          # Microsoft Agent Framework: HostedMCPTool (1.0 betas) and the clients' get_mcp_tool()
          # map approval_mode "never_require" to require_approval "never", and
          # never_require_approval names to a never-filter.
          - patterns:
              - pattern-either:
                  - pattern: HostedMCPTool(..., approval_mode=$AM, ...)
                  - pattern: $P.HostedMCPTool(..., approval_mode=$AM, ...)
                  - pattern: get_mcp_tool(..., approval_mode=$AM, ...)
                  - pattern: $P.get_mcp_tool(..., approval_mode=$AM, ...)
              - metavariable-regex:
                  metavariable: $AM
                  regex: ^[^{\[]
              - metavariable-pattern:
                  metavariable: $AM
                  pattern: '"never_require"'
              - focus-metavariable: $AM
          - patterns:
              - pattern-either:
                  - pattern-inside: HostedMCPTool(..., approval_mode=$X, ...)
                  - pattern-inside: $P.HostedMCPTool(..., approval_mode=$X, ...)
                  - pattern-inside: get_mcp_tool(..., approval_mode=$X, ...)
                  - pattern-inside: $P.get_mcp_tool(..., approval_mode=$X, ...)
              - pattern: '{..., "never_require_approval": [..., "$V", ...], ...}'
              - focus-metavariable: $V
              - metavariable-regex:
                  metavariable: $V
                  regex: |-
                    (?x)
                    (?(DEFINE)
                      (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                      (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                      (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                      (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                    )
                    ^ \s*+ (?: (?! (?&read) ) [^*?"] )*? (?: [*?] | (?&act) )
          # on_approval_request that approves every call: a lambda, or a function whose body
          # has no condition before it returns {"approve": True}.
          - patterns:
              - pattern-inside: $T(..., on_approval_request=$CB, ...)
              - pattern: 'lambda $...P: {..., "approve": True, ...}'
          # A file-wide region from each def to the call costs too much on long modules, so
          # the file passing a callback by name is the gate: {"approve": ...} is the SDK's
          # MCPToolApprovalFunctionResult.
          - patterns:
              - pattern-regex: (?s)\A(?=.*?\bon_approval_request\s*+=\s*+[A-Za-z_]).*
              - pattern: 'return {..., "approve": True, ...}'
              - pattern-either:
                  - pattern-inside: |
                      def $FN(...):
                        ...
                  - pattern-inside: |
                      async def $FN(...):
                        ...
              - pattern-not-inside: |
                  def $FN(...):
                    ...
                    if $C:
                      ...
                    ...
              - pattern-not-inside: |
                  async def $FN(...):
                    ...
                    if $C:
                      ...
                    ...
              - pattern-not-inside: |
                  def $FN(...):
                    ...
                    raise $E
                    ...
              - pattern-not-inside: |
                  async def $FN(...):
                    ...
                    raise $E
                    ...
          # interrupt_on entries (HumanInTheLoopMiddleware, create_deep_agent, a subagent dict)
          # set to False or to a config whose `when` always returns False.
          - patterns:
              - pattern-either:
                  - pattern: '$F(..., interrupt_on={..., $K: False, ...}, ...)'
                  - pattern: '$F(..., interrupt_on={..., $K: {..., "when": lambda $...P: False, ...}, ...}, ...)'
                  - pattern: 'HumanInTheLoopMiddleware({..., $K: False, ...}, ...)'
                  - pattern: '{..., "interrupt_on": {..., $K: False, ...}, ...}'
                  - pattern: '{..., "interrupt_on": {..., $K: {..., "when": lambda $...P: False, ...}, ...}, ...}'
                  # A map kept in a variable or constant and passed in later.
                  - patterns:
                      - pattern-regex: (?s)\A(?=.*?\binterrupt_on\b|.*?HumanInTheLoopMiddleware\().*
                      - pattern-either:
                          - pattern: '$NAME = {..., $K: False, ...}'
                          - pattern: '$NAME: $TY = {..., $K: False, ...}'
                      - pattern-either:
                          - pattern-inside: |
                              $NAME = {..., $K2: False, ...}
                              ...
                              $F(..., interrupt_on=$NAME, ...)
                          - pattern-inside: |
                              $NAME = {..., $K2: False, ...}
                              ...
                              HumanInTheLoopMiddleware($NAME, ...)
                          - pattern-inside: |
                              $NAME = {..., $K2: False, ...}
                              ...
                              {..., "interrupt_on": $NAME, ...}
              - focus-metavariable: $K
              - metavariable-regex:
                  metavariable: $K
                  regex: |-
                    (?x)
                    (?(DEFINE)
                      (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                      (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                      (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                      (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                    )
                    ^ ["'`]?+ (?: (?! (?&read) ) [^"'`*?] )*? (?&act)
      # Only read-only tools are reachable, or the server is a public documentation server.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: '{..., "allowed_tools": $AT, ...}'
                - pattern: $F(..., allowed_tools=$AT, ...)
            - metavariable-regex:
                metavariable: $AT
                regex: |-
                  (?x)
                  (?(DEFINE)
                    (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
                    (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
                    (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
                    (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
                  )
                  ^ (?: \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \]
                    | \{ \s*+ ["']?+ (?:tool_names|toolNames) ["']?+ \s*+ : \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \}
                    | \{ [^{}]*? ["']?+ (?:read_only|readOnly) ["']?+ \s*+ : \s*+ (?:True|true) \b [^{}]*+ \}
                    | [\w.]++ \( \s*+ tool_names \s*+ = \s*+ \[ (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ )*+ ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] (?: (?: \s++ | , | \#[^\n]*+ | //[^\n]*+ ) | ["'`] (?! (?: (?! (?&read) ) [^*?"'`\n] )*? (?: [*?] | (?&act) ) ) [^"'`\n]*+ ["'`] )*+ \] \s*+ ,?+ \s*+ \)
                    | [\w.]++ \( [^()]*? \b read_only \s*+ = \s*+ True \b [^()]*+ \)
                    ) $
      - pattern-not-inside: '{..., "server_url": "=~/^https?:[/][/](?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#]|$)/", ...}'
      - pattern-not-inside: '$F(..., server_url="=~/^https?:[/][/](?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#]|$)/", ...)'
      - pattern-not-inside: '$F(..., url="=~/^https?:[/][/](?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#]|$)/", ...)'
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: '{..., "server_url": $U, ...}'
                - pattern: $F(..., server_url=$U, ...)
                - pattern: $F(..., url=$U, ...)
            - metavariable-regex:
                metavariable: $U
                regex: |-
                  ^(?:[fFrRuU]{0,2})?[\"'`]https?://(?:gitmcp[.]io|mcp[.]deepwiki[.]com|learn[.]microsoft[.]com[/]api[/]mcp|developers[.]openai[.]com[/]mcp|mcp[.]context7[.]com|docs[.][a-z0-9.-]+)(?:[/:?#\"'`$]|$)
    metadata:
      category: security
      subcategory: [audit]
      pack-category: ai-code
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI09 - Human-Agent Trust Exploitation"
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-aisvs:
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-862: Missing Authorization"
      # The setting is certain; whether the server's tools act is judged from allowed_tools,
      # never-filters, and tool names, which can't see what an unlisted server tool does.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [openai, openai-agents, langchain, langgraph, deepagents, mcp]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-Security-Corpus/blob/main/corpus/agentic-top10/2026-final/OWASP-Top-10-for-Agentic-Applications-2026-v1.0.pdf
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
        - https://developers.openai.com/api/docs/guides/tools-connectors-mcp
        - https://github.com/openai/openai-python/blob/v3.37.0/src/openai/types/responses/tool_param.py
        - https://github.com/openai/openai-agents-python/blob/v0.24.0/src/agents/tool.py
        - https://github.com/langchain-ai/langchain/blob/langchain%3D%3D1.4.7/libs/langchain_v1/langchain/agents/middleware/human_in_the_loop.py
        - https://pypi.org/project/deepagents/0.7.32/
        - https://pypi.org/project/azure-ai-projects/2.9.0/
        - https://pypi.org/project/azure-ai-agents/1.2.0b6/
        - https://pypi.org/project/agent-framework-core/1.0.0b251016/
        - https://pypi.org/project/agent-framework-openai/1.17.0/
