rules:
  - id: agent-sdk-mcp-auto-approve
    # Generated by scripts/gen_mcp_auto_approve.py, which holds the tool-name test shared by the
    # MCP auto-approval rules. Edit the script and run scripts/build.py; build.py --check fails if
    # this file drifts.
    languages: [python]
    severity: WARNING
    message: >-
      This Claude Agent SDK allow list lets the agent call MCP tools without any check.
      "mcp__github" or "mcp__github__*" approves every tool of that server, including tools
      the server adds later, and a named tool whose name says it writes, deletes, sends,
      merges, or runs something ("mcp__review__run_command") approves that action. The SDK
      applies allowed_tools entries as Claude Code allow rules before can_use_tool runs, so
      nothing reviews those calls. A prompt injection in a file, issue, web page, or tool
      result the agent reads can then make it use those tools (push code, post messages,
      change records, run commands) with this process's credentials. Allow named read-only
      tools, and decide on tools that change things in can_use_tool or a PreToolUse hook (for
      example, allow writes only to the repository being worked on).
    patterns:
      - pattern-either:
          # ClaudeAgentOptions(allowed_tools=[...]), the older ClaudeCodeOptions, a helper's
          # keyword, dataclasses.replace(), or an options dict.
          - pattern: $FN(..., allowed_tools=[..., "$V", ...], ...)
          - pattern: '{..., "allowed_tools": [..., "$V", ...], ...}'
          # A list kept in a named constant (ALLOWED_TOOLS) and passed in.
          - patterns:
              - pattern-either:
                  - pattern: $NAME = [..., "$V", ...]
                  - pattern: '$NAME: $T = [..., "$V", ...]'
              - metavariable-regex:
                  metavariable: $NAME
                  regex: (?i)^(?![\w.]*(?:disallow|deny|denied|block|forbid|exclude))[\w.]*allow
      # Bypass mode approves everything already; agent-sdk-bypass-permissions reports it.
      - pattern-not-inside: $FN(..., permission_mode="bypassPermissions", ...)
      - focus-metavariable: $V
      - metavariable-regex:
          metavariable: $V
          regex: |-
            (?x)
            (?(DEFINE)
              (?<ws> (?<![^"'_\-./: (*]) | (?<=[a-z0-9])(?=[A-Z]) )
              (?<we> (?: es | s )?+ (?= [\-_./: )*?"'A-Z0-9,\]] | \s | $ ) )
              (?<read> (?&ws) (?i:get|list|read|search|find|query|describe|view|show|fetch|lookup|count|check|status|inspect|preview|explain|diff|log|whoami|ping|help|info|summarize|analyze|validate|lint|resolve|browse|download|export|retrieve|select|ask|discover) (?&we) )
              (?<act> (?&ws) (?i:exec|execute|run|shell|command|cmd|bash|powershell|terminal|eval|evaluate|script|spawn|start|stop|kill|restart|interact|write|edit|create|update|delete|remove|rm|drop|truncate|insert|upsert|modify|patch|put|post|push|commit|merge|rebase|reset|deploy|publish|release|send|reply|email|move|rename|install|uninstall|apply|migrate|upload|transfer|approve|close|add|set|submit|trigger|dispatch|invoke|fork|assign|archive|cancel|revert|replace|append|save|import|mutate|manage|reassign|escalate|refund|charge|pay|purchase|grant|revoke|invite|share|enable|disable|suspend|block|unblock|lock|unlock|rollback|restore|scale|provision|destroy|terminate|purge|clear|wipe|quarantine) (?&we) )
            )
            ^ \s*+ mcp__ (?: (?!__) [^*?()\s,"'\]] )++ (?: (?![_\w-]) | __ (?: (?! (?&read) ) [^*?()\s,"'\]] )*? (?: [*?] | (?&act) ) ) (?! [^"]*\( )
    metadata:
      category: security
      subcategory: [audit]
      pack-category: agent-config
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI02 - Tool Misuse and Exploitation"
      owasp-mcp:
        - "MCP02:2025 - Privilege Escalation via Scope Creep"
      owasp-aisvs:
        - "v1.01-C9.2.1 - High-Impact Action Approval and Irreversibility Controls"
        - "v1.01-C9.5.1 - Agent Authorization, Delegation, and Continuous Enforcement"
      mitre-atlas:
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      # A headless SDK app has to allow the tools it uses, and in-process tools are the
      # app's own code; whole-server and action-tool approvals are still the calls that
      # nobody reviews, but more of them are deliberate than in shared config.
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      technology: [claude-agent-sdk, anthropic, mcp]
      references:
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP02-2025%E2%80%93Privilege-Escalation-via-Scope-Creep.md
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md
        - https://code.claude.com/docs/en/agent-sdk/permissions
        - https://code.claude.com/docs/en/agent-sdk/mcp
        - https://github.com/anthropics/claude-agent-sdk-python/blob/v0.2.173/src/claude_agent_sdk/_internal/transport/subprocess_cli.py
