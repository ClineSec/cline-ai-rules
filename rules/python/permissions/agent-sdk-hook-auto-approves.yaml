rules:
  - id: agent-sdk-hook-auto-approves
    # Generated by scripts/gen_agent_hooks.py, which holds the read-only tool list, command
    # test, and `if` filter test shared by the hook auto-approval rules, and the SDK, client,
    # and docs versions they were checked against. Edit the script and run scripts/build.py;
    # build.py --check fails if this file drifts.
    languages: [python]
    severity: ERROR
    message: >-
      This Claude Agent SDK hook approves every tool call it is registered for: the callback
      returns `permissionDecision: "allow"` (or a PermissionRequest `behavior: "allow"`, or the
      legacy `decision: "approve"`) without checking anything, and its matcher covers every tool
      or a tool that runs commands, writes files, or reaches the network. A hook's allow skips
      the permission prompt, `allowed_tools`, and the `can_use_tool` callback, so for those tools
      the session acts as if it ran in `bypassPermissions` mode; only deny and ask rules still
      apply. A prompt injection in any file, issue, web page, or tool result the agent reads can
      then run commands or change files with this process's credentials. Approve only calls the
      hook has checked (a read-only tool, an allowlisted command, a path inside the workspace),
      return `{}` to leave the rest to the normal permission flow, and deny or ask on anything
      it can't verify.
    # Tests register approving hooks on purpose against a mocked or throwaway session, so
    # test files are skipped, as in agent-sdk-bypass-permissions. OpenGrep's own ignore list
    # skips only test/ and tests/.
    paths:
      exclude:
        - "test_*.py"
        - "*_test.py"
        - "conftest.py"
        - "test/"
        - "tests/"
        - "e2e/"
        - "e2e-tests/"
    patterns:
      - pattern-either:
          # A coroutine defined in this file (a function, or a method registered as
          # self.name; functools.partial too), listed in the HookMatcher's hooks. It grants permission
          # outside any `if` (an early `return {}` for another event or for named tools leaves every
          # other tool approved), or inside `if tool_name == "Bash":` and the like, which is the same
          # as a matcher on that tool.
          - patterns:
              - pattern-inside: |
                  async def $CB($...P):
                      $...BODY
                  ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=[..., $CB, ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., $CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., $CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., $CB, ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., self.$CB, ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., self.$CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., self.$CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., self.$CB, ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., partial($CB, ...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., partial($CB, ...), ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., functools.partial($CB, ...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., functools.partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., functools.partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., functools.partial($CB, ...), ...], ...)
              - pattern-either:
                  - pattern: $CB
                  - pattern: self.$CB
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - pattern-not-inside: |
                            if $C:
                                ...
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                if $TOOL == "$TN":
                                    ...
                            - pattern-inside: |
                                if $TOOL in [..., "$TN", ...]:
                                    ...
                            - pattern-inside: |
                                if $TOOL in (..., "$TN", ...):
                                    ...
                            - pattern-inside: |
                                if $TOOL in {..., "$TN", ...}:
                                    ...
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - metavariable-regex:
                            metavariable: $TOOL
                            regex: (?i).*tool
                        - metavariable-regex:
                            metavariable: $TN
                            regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                              )
                              ^ (?! (?&safe) $ ) [\w-]+ $
          # The same, in a list kept in a variable and passed as hooks=.
          - patterns:
              - pattern-inside: |
                  async def $CB($...P):
                      $...BODY
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $L = [..., $CB, ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., $CB, ...]
                      ...
                  - pattern-inside: |
                      $L = [..., self.$CB, ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., self.$CB, ...]
                      ...
                  - pattern-inside: |
                      $L = [..., partial($CB, ...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., partial($CB, ...), ...]
                      ...
                  - pattern-inside: |
                      $L = [..., functools.partial($CB, ...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., functools.partial($CB, ...), ...]
                      ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: HookMatcher($POS, $L, ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: $SDK.HookMatcher($POS, $L, ...)
              - pattern: $L
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - pattern-not-inside: |
                            if $C:
                                ...
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                if $TOOL == "$TN":
                                    ...
                            - pattern-inside: |
                                if $TOOL in [..., "$TN", ...]:
                                    ...
                            - pattern-inside: |
                                if $TOOL in (..., "$TN", ...):
                                    ...
                            - pattern-inside: |
                                if $TOOL in {..., "$TN", ...}:
                                    ...
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - metavariable-regex:
                            metavariable: $TOOL
                            regex: (?i).*tool
                        - metavariable-regex:
                            metavariable: $TN
                            regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                              )
                              ^ (?! (?&safe) $ ) [\w-]+ $
          # A coroutine that returns an allow dict kept in a module constant, with no `if`
          # other than the hook_event_name guard.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $C = <... {..., "permissionDecision": "allow", ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... {..., "decision": {..., "behavior": "allow", ...}, ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... $T(..., permissionDecision="allow", ...) ...>
                      ...
              - pattern-inside: |
                  async def $CB($...P):
                      $...BODY
                  ...
              - pattern-inside: |
                  async def $CB($...P):
                      ...
                      return $C
                  ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=[..., $CB, ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., $CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., $CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., $CB, ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., self.$CB, ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., self.$CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., self.$CB, ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., self.$CB, ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., partial($CB, ...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., partial($CB, ...), ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., functools.partial($CB, ...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., functools.partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., functools.partial($CB, ...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., functools.partial($CB, ...), ...], ...)
              - pattern-either:
                  - pattern: $CB
                  - pattern: self.$CB
              - metavariable-regex:
                  metavariable: $...BODY
                  regex: (?sm)^(?!.*^[ \t]*+(?:el)?if\b(?![^\n]*hook_event_name))
          # The same, in a list kept in a variable.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $C = <... {..., "permissionDecision": "allow", ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... {..., "decision": {..., "behavior": "allow", ...}, ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... $T(..., permissionDecision="allow", ...) ...>
                      ...
              - pattern-inside: |
                  async def $CB($...P):
                      $...BODY
                  ...
              - pattern-inside: |
                  async def $CB($...P):
                      ...
                      return $C
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $L = [..., $CB, ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., $CB, ...]
                      ...
                  - pattern-inside: |
                      $L = [..., self.$CB, ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., self.$CB, ...]
                      ...
                  - pattern-inside: |
                      $L = [..., partial($CB, ...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., partial($CB, ...), ...]
                      ...
                  - pattern-inside: |
                      $L = [..., functools.partial($CB, ...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., functools.partial($CB, ...), ...]
                      ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: HookMatcher($POS, $L, ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: $SDK.HookMatcher($POS, $L, ...)
              - pattern: $L
              - metavariable-regex:
                  metavariable: $...BODY
                  regex: (?sm)^(?!.*^[ \t]*+(?:el)?if\b(?![^\n]*hook_event_name))
          # A coroutine built by a factory in this file (def make_hook(...): async def hook
          # ...; return hook) and registered as make_hook(...).
          - patterns:
              - pattern-inside: |
                  def $FACT(...):
                      ...
                      async def $CB($...P):
                          $...BODY
                      ...
                      return $CB
                  ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=[..., $FACT(...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., $FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., $FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., $FACT(...), ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., self.$FACT(...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., self.$FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., self.$FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., self.$FACT(...), ...], ...)
              - pattern-either:
                  - pattern: $FACT(...)
                  - pattern: self.$FACT(...)
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - pattern-not-inside: |
                            if $C:
                                ...
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                if $TOOL == "$TN":
                                    ...
                            - pattern-inside: |
                                if $TOOL in [..., "$TN", ...]:
                                    ...
                            - pattern-inside: |
                                if $TOOL in (..., "$TN", ...):
                                    ...
                            - pattern-inside: |
                                if $TOOL in {..., "$TN", ...}:
                                    ...
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - metavariable-regex:
                            metavariable: $TOOL
                            regex: (?i).*tool
                        - metavariable-regex:
                            metavariable: $TN
                            regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                              )
                              ^ (?! (?&safe) $ ) [\w-]+ $
          # The same, in a list kept in a variable.
          - patterns:
              - pattern-inside: |
                  def $FACT(...):
                      ...
                      async def $CB($...P):
                          $...BODY
                      ...
                      return $CB
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $L = [..., $FACT(...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., $FACT(...), ...]
                      ...
                  - pattern-inside: |
                      $L = [..., self.$FACT(...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., self.$FACT(...), ...]
                      ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: HookMatcher($POS, $L, ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: $SDK.HookMatcher($POS, $L, ...)
              - pattern: $L
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - pattern-not-inside: |
                            if $C:
                                ...
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                if $TOOL == "$TN":
                                    ...
                            - pattern-inside: |
                                if $TOOL in [..., "$TN", ...]:
                                    ...
                            - pattern-inside: |
                                if $TOOL in (..., "$TN", ...):
                                    ...
                            - pattern-inside: |
                                if $TOOL in {..., "$TN", ...}:
                                    ...
                        - pattern-either:
                            - pattern: '{..., "permissionDecision": "allow", ...}'
                            - pattern: '{..., "decision": {..., "behavior": "allow", ...}, ...}'
                            - pattern: '{..., "decision": "approve", ...}'
                            - pattern: $T(..., permissionDecision="allow", ...)
                            - pattern: '$T(..., decision={..., "behavior": "allow", ...}, ...)'
                            - pattern: $T(..., decision="approve", ...)
                            - pattern: return $F(..., "allow", ...)
                            - pattern: return $F(..., $K="allow", ...)
                        - metavariable-regex:
                            metavariable: $TOOL
                            regex: (?i).*tool
                        - metavariable-regex:
                            metavariable: $TN
                            regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                              )
                              ^ (?! (?&safe) $ ) [\w-]+ $
          # A factory-built coroutine that returns an allow constant.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $C = <... {..., "permissionDecision": "allow", ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... {..., "decision": {..., "behavior": "allow", ...}, ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... $T(..., permissionDecision="allow", ...) ...>
                      ...
              - pattern-inside: |
                  def $FACT(...):
                      ...
                      async def $CB($...P):
                          $...BODY
                      ...
                      return $CB
                  ...
              - pattern-inside: |
                  def $FACT(...):
                      ...
                      async def $CB($...P):
                          ...
                          return $C
                      ...
                      return $CB
                  ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=[..., $FACT(...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., $FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., $FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., $FACT(...), ...], ...)
                  - pattern-inside: HookMatcher(..., hooks=[..., self.$FACT(...), ...], ...)
                  - pattern-inside: HookMatcher($POS, [..., self.$FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=[..., self.$FACT(...), ...], ...)
                  - pattern-inside: $SDK.HookMatcher($POS, [..., self.$FACT(...), ...], ...)
              - pattern-either:
                  - pattern: $FACT(...)
                  - pattern: self.$FACT(...)
              - metavariable-regex:
                  metavariable: $...BODY
                  regex: (?sm)^(?!.*^[ \t]*+(?:el)?if\b(?![^\n]*hook_event_name))
          # The same, in a list kept in a variable.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $C = <... {..., "permissionDecision": "allow", ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... {..., "decision": {..., "behavior": "allow", ...}, ...} ...>
                      ...
                  - pattern-inside: |
                      $C = <... $T(..., permissionDecision="allow", ...) ...>
                      ...
              - pattern-inside: |
                  def $FACT(...):
                      ...
                      async def $CB($...P):
                          $...BODY
                      ...
                      return $CB
                  ...
              - pattern-inside: |
                  def $FACT(...):
                      ...
                      async def $CB($...P):
                          ...
                          return $C
                      ...
                      return $CB
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $L = [..., $FACT(...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., $FACT(...), ...]
                      ...
                  - pattern-inside: |
                      $L = [..., self.$FACT(...), ...]
                      ...
                  - pattern-inside: |
                      $L: $LT = [..., self.$FACT(...), ...]
                      ...
              - pattern-either:
                  - pattern-inside: HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: HookMatcher($POS, $L, ...)
                  - pattern-inside: $SDK.HookMatcher(..., hooks=$L, ...)
                  - pattern-inside: $SDK.HookMatcher($POS, $L, ...)
              - pattern: $L
              - metavariable-regex:
                  metavariable: $...BODY
                  regex: (?sm)^(?!.*^[ \t]*+(?:el)?if\b(?![^\n]*hook_event_name))
      # ... and nothing else in it could decide otherwise: no `if` other than the
      # hook_event_name guard and tool-name tests, no conditional expression, raise, assert,
      # match, other decision, or a call that reads as a check (policy.enforce(...)).
      - metavariable-regex:
          metavariable: $...BODY
          regex: |-
            (?sm)^(?!.*(?:^[ \t]*+(?:el)?if\b(?![^\n]*hook_event_name)(?![^\n]*tool\w*["']?\]?\)?\s*+(?:==|in)\s*+[\[({"'])|^[ \t]*+(?:raise|assert|match|case)\b|^[^#\n]*\bif\b[^\n#]*\belse\b|["'](?:deny|ask|block|defer)["']|\b\w*(?i:check|verify|validate|enforce|ensure|guard|authori[sz]e|require|policy|reject|forbid|permit)\w*\s*+\())
      # The HookMatcher's matcher reaches more than read-only tools.
      - pattern-either:
          # No matcher (or matcher=None): every tool.
          - patterns:
              - pattern-inside: HookMatcher(...)
              - pattern-not-inside: HookMatcher(..., matcher=$ANY, ...)
              - pattern-not-inside: HookMatcher($ANY, [...], ...)
              - pattern-not-inside: HookMatcher($ANY, $HL, ...)
              - pattern-not-inside: $SDK.HookMatcher(..., matcher=$ANY, ...)
              - pattern-not-inside: $SDK.HookMatcher($ANY, [...], ...)
              - pattern-not-inside: $SDK.HookMatcher($ANY, $HL, ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: HookMatcher(..., matcher=$M, ...)
                  - pattern-inside: HookMatcher($M, [...], ...)
                  - pattern-inside: HookMatcher($M, $HL, ...)
                  - pattern-inside: $SDK.HookMatcher(..., matcher=$M, ...)
                  - pattern-inside: $SDK.HookMatcher($M, [...], ...)
                  - pattern-inside: $SDK.HookMatcher($M, $HL, ...)
              # None, a literal, or a constant (constant propagation); a matcher read from
              # elsewhere is left alone.
              - metavariable-pattern:
                  metavariable: $M
                  pattern-either:
                    - pattern: None
                    - patterns:
                        - pattern: '"$MS"'
                        - metavariable-regex:
                            metavariable: $MS
                            regex: |-
                              (?x)
                              (?(DEFINE)
                                (?<safe> (?: Read | Glob | Grep | LS | NotebookRead | TodoWrite | TaskList | TaskGet | WebSearch | ListMcpResourcesTool | ReadMcpResourceTool | mcp__[\w-]+?__(?i:get|list|read|search|find|query|describe|view|show|lookup|count)(?:[_-][\w-]*)? ) )
                              )
                              ^ (?!  (?: \s*+ (?&safe) (?: \s*+ [|,] \s*+ (?&safe) )*+ \s*+ | \^ \(? (?: \?: )? (?&safe) (?: \| (?&safe) )*+ \)? \$ )  $ )
