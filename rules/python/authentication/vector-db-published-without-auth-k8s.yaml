                        # A service type that reaches beyond the cluster network.
                        (?<exposed> ["']?+ (?: LoadBalancer | NodePort ) ["']?+ (?= [ \t]*+ (?: [,}\#] | $ ) ) )
                        # An annotation that makes a cloud load balancer internal (the Kubernetes
                        # Service docs' list, plus the older AWS and GKE spellings).
                        (?<internal_lb> ["']?+
                          (?: (?: networking\.gke\.io | cloud\.google\.com ) / load-balancer-type ["']?+ [ \t]*+ : [ \t]*+ ["']?+ (?i: internal ) ["']?+
                            | service\.beta\.kubernetes\.io / aws-load-balancer-scheme ["']?+ [ \t]*+ : [ \t]*+ ["']?+ (?i: internal ) ["']?+
                            | service\.beta\.kubernetes\.io /
                              (?: aws-load-balancer-internal | azure-load-balancer-internal | oci-load-balancer-internal
                                | openstack-internal-load-balancer | cce-load-balancer-internal-vpc ) ["']?+ [ \t]*+ : [ \t]*+ (?&on)
                            | service\.kubernetes\.io / ibm-load-balancer-cloud-provider-ip-type ["']?+ [ \t]*+ : [ \t]*+ ["']?+ (?i: private ) ["']?+
                            | service\.kubernetes\.io / qcloud-loadbalancer-internal-subnetid ["']?+ [ \t]*+ : [ \t]*+ ["']?+ [\w-]
                            | service\.beta\.kubernetes\.io / alibaba-cloud-loadbalancer-address-type ["']?+ [ \t]*+ : [ \t]*+ ["']?+ (?i: intranet ) ["']?+ ) )
                        # loadBalancerSourceRanges with at least one entry: an allow-list, unless it
                        # lists everything.
                        (?<ranges> loadBalancerSourceRanges [ \t]*+ : [ \t]*+
                          (?: \[ [ \t]*+ ["']?+ [0-9a-fA-F:.]
                            | (?: \# [^\n]*+ )?+ \r?\n (?: [ \t]*+ (?: \# [^\n]*+ )?+ \r?\n )*+ [ \t]*+ - [ \t]++ ["']?+ [0-9a-fA-F:.] ) )
                        (?<everyone> ["']?+ (?: 0\.0\.0\.0/0 | ::/0 ) ["']?+ (?= [\s,\]] | $ ) ) )
                      # --- kubernetes exposure groups (end) ---
                      (?(DEFINE) (?<dl> (?! --- ) [^\n]*+ \n ) )
                      \A
                      (?= [\s\S]*? (?: \A | ^ --- [^\n]*+ \n )
                          (?= (?&dl)*? kind [ \t]*+ : [ \t]*+ ["']?+ Service ["']?+ [ \t]*+ (?: \# [^\n]*+ )?+ $ )
                          (?= (?&dl)*? [ \t]++ type [ \t]*+ : [ \t]*+ (?&exposed) )
                          (?= (?&dl)*? [^\n]*? (?i: weaviate )
                            | (?&dl)*? [ \t]*+ (?: - [ \t]++ )?+ (?: port | targetPort ) [ \t]*+ : [ \t]*+ ["']?+ 50051 (?! \d ) )
                          (?! (?&dl)*? [ \t]*+ (?&internal_lb) )
                          (?! (?= (?&dl)*? [ \t]*+ (?: - [ \t]++ )?+ (?&ranges) ) (?! (?&dl)*? [^\n]*? (?&everyone) ) ) )
                      [\s\S]*
                  - pattern-inside:
                      pattern-regex: |-
                        (?xm)
                        (?(DEFINE)
                          (?<dl> (?! --- ) [^\n]*+ \n )
                          (?<on> ["']?+ (?i: true | on | yes | 1 ) ["']?+ (?= [ \t]*+ (?: [,}\#] | $ ) ) ) )
                        (?: \A | ^ --- [^\n]*+ \n )
                        (?= (?&dl)*? [ \t]++ (?: hostNetwork [ \t]*+ : [ \t]*+ (?&on) | (?: - [ \t]++ )?+ hostPort [ \t]*+ : [ \t]*+ ["']?+ \d ) )
                        (?&dl)*+ (?: (?! --- ) [^\n]++ )?+
          - patterns:
              # Milvus with authorization off (the default).
              - pattern-regex: |-
                  (?xm)
                  ^ [ \t]*+ (?: - [ \t]++ )?+ \K image [ \t]*+ : [ \t]*+ ["']?+
                  (?: [\w.-]+ (?: :\d+ )? / )? milvusdb/milvus (?= [:@"'\s] | $ )
              - pattern-inside:
                  pattern-regex: |-
                    (?xm)
                    (?(DEFINE)
                      (?<dl> (?! --- ) [^\n]*+ \n )
                      (?<on> ["']?+ (?i: true | t | 1 ) ["']?+ (?= [ \t]*+ (?: [,}\#] | $ ) ) ) )
                    (?: \A | ^ --- [^\n]*+ \n )
                    (?! (?&dl)*? [^\n]*? \b name [ \t]*+ : [ \t]*+ ["']?+
                        (?i: (?: milvus_conf_ )? common [_./]*+ security [_./]*+ authorization [_./]*+ enabled ) ["']?+
                        [ \t]*+ (?: , [ \t]*+ | (?: \# [^\n]*+ )?+ \r?\n [ \t]*+ ) value [ \t]*+ : [ \t]*+ (?&on) )
