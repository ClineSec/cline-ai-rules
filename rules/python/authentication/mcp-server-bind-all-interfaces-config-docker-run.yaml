rules:
  - id: mcp-server-bind-all-interfaces-config-docker-run
    # `docker run` (or podman, nerdctl) that starts a fastmcp server bound to every interface
    # and publishes its port on every interface of the host, in scripts, Makefiles, CI jobs,
    # and systemd units. The bind is FASTMCP_HOST passed with -e/--env, or a
    # `fastmcp run --host 0.0.0.0` command after the image.
    # Sources: PrefectHQ fastmcp 4.1.3 settings.py and cli/cli.py (see
    # mcp-server-bind-all-interfaces-config); Docker's run reference for -p/--publish (no host
    # IP means every interface), -P/--publish-all, and --network host.
    # Inside a container the server has to bind 0.0.0.0 for a published port to reach it, so
    # a container that publishes nothing, or publishes only on 127.0.0.1 or ::1, is not
    # reported. The publish flag must come before the fastmcp command, whose own -p is the
    # server port.
    languages: [regex]
    severity: WARNING
    message: >-
      This starts a fastmcp MCP server in a container that listens on every interface and
      publishes its port on every interface of the host (or shares the host's network), so
      anyone who can reach the host on that port can list and call the server's tools and do
      whatever they can do. Nothing here shows whether the server requires auth. Keep the
      0.0.0.0 bind inside the container, but publish on loopback only (-p 127.0.0.1:8000:8000)
      for local use, or require auth in the server (fastmcp `auth=`) or put an authenticating
      proxy in front of it.
    paths:
      include:
        - "*.sh"
        - "*.bash"
        - "*.zsh"
        - "Makefile"
        - "GNUmakefile"
        - "*.mk"
        - "justfile"
        - "Justfile"
        - ".justfile"
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - ".gitlab-ci.yml"
        - ".circleci/config.yml"
        - "azure-pipelines.yml"
        - "bitbucket-pipelines.yml"
        - "Jenkinsfile"
        - "*.service"
    pattern-regex: |-
      (?xm)
      (?(DEFINE)
        # --- docker run command groups (begin): build.py keeps this block identical in
        # vector-db-published-without-auth-docker-run; edit both. ---
        (?<q> " (?:[^"\\\n] | \\.)*+ " | ' [^'\n]*+ ' )
        (?<lone> " (?![^"\n]*") | ' (?![^'\n]*') )
        (?<ws> [ \t]++ | [ \t]*+ \\\r?\n [ \t]*+ )
        (?<addr> 0\.0\.0\.0 | :: | \[::\] )
        # One piece of the command: a word, a quoted string, a \-newline continuation, or
        # one other character. The command stops at a newline, a comment, and ; & |
        # separators. Pieces are atomic and take whole words, so a long line costs one step
        # per word (per-character steps hit PCRE's match limit on lines of about 50 KB).
        (?<c> (?> (?&q) | \\\r?\n | \\[^\r\n] | [^\s"'\#;&|\\]++ | [^\n"'\#;&|\\] ) )
        (?<pp> \d++ (?: -\d++ )?+ | \$\{ [^}\n]*+ \} | \$\w++ | \$\( \w++ \) )
        # A port published on every host interface, or host networking.
        (?<pub> (?: -p | --publish ) (?: = | (?&ws) ) ["']?+
                (?: (?: (?&addr) | \$\{ \w++ :?- (?&addr) \} ) : )?+
                (?&pp) (?: : (?&pp) )?+ (?: / (?:tcp|udp|sctp) )?+ ["']?+ (?= \s | $ )
              | -P (?= \s ) | --publish-all (?= \s | =true )
              | (?: --network | --net ) (?: = | (?&ws) ) ["']?+ host ["']?+ (?= \s | $ ) )
        # Everything before the program on its line (quoted strings skipped unless they hold
        # a command, as in run: "..." or sh -c "...").
        (?<pre> (?> (?<= : | :\s | = | -c\s | -lc\s | -ec\s | \beval\s ) ["']
          | (?&q) | (?&lone) | \\[^\r\n] | (?<=\S)\#
          # A run of plain words in one step (a program never starts inside one); it stops
          # before then/do/else.
          | (?: (?! (?:then|do|else) [ \t] ) [^\s"'\#\\;&|(`]++ [ \t]*+ )++ | [^\n"'\#\\] )*? )
        # --- docker run command groups (end) ---
        (?<val> ["']?+ (?: (?&addr) | \$\{ \w++ :?[-=] ["']?+ (?&addr) ["']?+ \} ) ["']?+
          (?= [\s;&|)`"'\\] | $ ) )
        # The same, but never past the fastmcp command after the image.
        (?<cb> (?! (?<![\w./-]) fastmcp\b ) (?&c) )
        # The server's bind.
        (?<bind> (?: -e | --env ) (?: = | (?&ws) ) ["']?+ FASTMCP_(?:SERVER_)?HOST = (?&val)
              | fastmcp (?: \.cli | [=@][\w.=]++ )?+ (?&ws) run (?= \s ) (?&c)*? (?<=\s) --host
                (?: = | (?&ws) ) (?&val) ) )
      # --- docker run command start (begin): build.py keeps this block identical in
      # vector-db-published-without-auth-docker-run; edit both. ---
      # A continued line (the previous one ends in \) starts a command only after a separator
      # or a keyword: "cmd; \", "&& \", "then \".
      ^ (?: (?<! \\\n ) (?<! \\\r\n )
          | (?<= [;&|] \\\n | [;&|][ \t] \\\n | \bthen[ \t] \\\n | \belse[ \t] \\\n | \bdo[ \t] \\\n ) )
        (?&pre)
      (?: ^ (?: \t [@+-]{1,2}
              | [ \t]*+ (?: - [ \t]++ )?+
                (?: Exec(?:Start|StartPre|Reload)? = [@!+:-]*+ | [\w.-]++ [ \t]*+ : [ \t]++ )?+ )
        | (?<=[;&|(`]) [ \t]*+
        | (?<![\w-]) (?:then|do|else) [ \t]++
        | (?<= : ["'] | :\s["'] | =["'] | c\s["'] | \beval\s["'] ) )
      (?: [A-Za-z_]\w*+ = (?: (?&q) | [^\s"'\#;&|]*+ ) [ \t]++ | (?: sudo | exec | nohup ) [ \t]++ )*+
      \K
      ["']?+ (?: [\w.~${}-]*+ / )*+ (?: docker | podman | nerdctl ) ["']?+ (?: (?&ws) container )?+ (?&ws) run (?= \s )
      # --- docker run command start (end) ---
      (?= (?&cb)*? (?<=\s) (?&pub) )
      # The bind may sit in a quoted command after the image: sh -c "fastmcp run ...".
      (?= (?&c)*? (?<=\s) (?: ["'] (?: [^"'\n]*? [\s;&|] )?? )? (?&bind) )
      # A run with --transport stdio never binds the host.
      (?! (?&c)*? (?<=\s) (?: (?: --transport | -t ) (?: = | (?&ws) ) ["']?+ stdio \b
          | (?: -e | --env ) (?: = | (?&ws) ) ["']?+ FASTMCP_TRANSPORT = ["']?+ stdio \b ) )
    metadata:
      category: security
      subcategory: [audit]
      pack-category: mcp-server
      owasp-llm:
        - "LLM03:2026 - Excessive Agency"
        - "LLM06:2025 - Excessive Agency"
      owasp-agentic:
        - "ASI03 - Identity and Privilege Abuse"
      owasp-mcp:
        - "MCP07:2025 - Insufficient Authentication & Authorization"
        - "MCP09:2025 - Shadow MCP Servers"
      owasp-aisvs:
        - "v1.01-C10.2.1 - Authentication & Authorization"
        - "v1.01-C10.3.1 - Secure Transport"
      mitre-atlas:
        - "AML.T0132 - Misconfigured or Publicly Exposed AI Services"
        - "AML.T0053 - AI Agent Tool Invocation"
      cwe:
        - "CWE-1327: Binding to an Unrestricted IP Address"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, fastmcp, docker]
      references:
        - https://github.com/PrefectHQ/fastmcp/blob/v4.1.3/fastmcp_slim/fastmcp/settings.py
        - https://github.com/PrefectHQ/fastmcp/blob/v4.1.3/fastmcp_slim/fastmcp/cli/cli.py
        - https://github.com/punkpeye/fastmcp/blob/v4.23.5/src/FastMCP.ts
        - https://docs.docker.com/reference/cli/docker/container/run/
        - https://docs.docker.com/engine/network/port-publishing/
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP07-2025%E2%80%93Insufficient-Authentication%26Authorization.md
        - https://github.com/OWASP/www-project-mcp-top-10/blob/165fe0f78ef104459237b4a8e0f6e78db9b02391/2025/MCP09-2025%E2%80%93Shadow-MCP-Servers.md
        - https://cwe.mitre.org/data/definitions/1327.html
