# Exposure is decided per file, so each database has one Service state per fixture file.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  type: LoadBalancer
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          # ruleid: vector-db-published-without-auth-k8s
          image: qdrant/qdrant:v1.20.0
          ports:
            - containerPort: 6333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-keyed
spec:
  template:
    spec:
      containers:
        - name: qdrant
          # ok: vector-db-published-without-auth-k8s
          image: docker.io/qdrant/qdrant:v1.20.0
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant
                  key: api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-env-from
spec:
  template:
    spec:
      containers:
        - name: qdrant
          # ok: vector-db-published-without-auth-k8s
          image: qdrant/qdrant:v1.20.0
          envFrom:
            - secretRef:
                name: qdrant-settings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-config
spec:
  template:
    spec:
      containers:
        - name: qdrant
          # ok: vector-db-published-without-auth-k8s
          image: qdrant/qdrant:v1.20.0
          volumeMounts:
            - name: config
              mountPath: /qdrant/config/production.yaml
              subPath: production.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: vectors-grpc
spec:
  type: NodePort
  ports:
    - port: 19530
      nodePort: 31953
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-standalone
spec:
  template:
    spec:
      containers:
        - name: milvus
          # ruleid: vector-db-published-without-auth-k8s
          image: milvusdb/milvus:v3.0.2
          args: ["milvus", "run", "standalone"]
          env:
            - name: ETCD_USE_EMBED
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-auth
spec:
  template:
    spec:
      containers:
        - name: milvus
          # ok: vector-db-published-without-auth-k8s
          image: milvusdb/milvus:v3.0.2
          env:
            - name: COMMON_SECURITY_AUTHORIZATIONENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
spec:
  type: ClusterIP
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rag-ui
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weaviate
spec:
  template:
    spec:
      containers:
        - name: weaviate
          # ok: vector-db-published-without-auth-k8s
          image: cr.weaviate.io/semitechnologies/weaviate:1.40.2
          env:
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
spec:
  template:
    spec:
      containers:
        - name: chroma
          # ok: vector-db-published-without-auth-k8s
          image: chromadb/chroma:1.5.9
---
# A pod on the node's network is reachable on every node address.
apiVersion: v1
kind: Pod
metadata:
  name: chroma-scratch
spec:
  hostNetwork: true
  containers:
    - name: chroma
      # ruleid: vector-db-published-without-auth-k8s
      image: chromadb/chroma
