rules:
  - id: vector-filter-from-user-input
    # Generated by scripts/gen_vector_filter_from_user_input.py. The first pattern-sources and
    # pattern-sanitizers are user-input-in-system-prompt's request-data sources and
    # value sanitizers (the ones before its lookup sanitizer), imported from
    # gen_user_input_in_system_prompt.py (build.py SHARED_BLOCKS checks the copy). Edit the
    # scripts and run scripts/build.py; build.py --check fails if this file drifts.
    # SDKs checked 2026-10-24 from package source: chromadb 1.5.9 (Collection.query / get /
    # delete / search, validate_where), pinecone 10.2.0 (Index, documents),
    # qdrant-client 1.20.0, langchain-core 1.7.0 (VectorStoreRetriever merges
    # search_kwargs | kwargs), langchain-chroma 1.1.0, llama-index-core 0.14.25;
    # weaviate-client 4.24.0 takes only Filter builder objects, so it has no sink.
    languages: [python]
    severity: WARNING
    message: >-
      The request supplies the whole metadata filter of a vector-store query (or the last word
      in it: a trailing spread or a request-chosen key that overrides the server's). The filter
      is what keeps a search inside the caller's tenant, so whoever sends the request picks
      which documents it reads, or deletes: another customer's, by asking for their tenant ID
      or an `$or` that matches everything. Build the filter on the server, with the tenant
      from the session and request values only as field values:
      `where={"$and": [{"tenant_id": user.tenant_id}, {"topic": body.topic}]}`.
      Or pick it from an allowlist of saved filters. If the collection or namespace is already
      per-tenant, this finding may be safe.
    mode: taint
    options:
      # A comparison or a count says something about the request without carrying its text.
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      # Request data read from the request object: Flask (Werkzeug), Django, Django REST
      # framework, and Starlette / FastAPI. request.args, request.get_json(), request.POST,
      # request.data, await request.json(), request.query_params, self.request.GET.
      - patterns:
          - pattern: $R.$A
          - metavariable-regex:
              metavariable: $R
              regex: |-
                ^(?:self\.|flask\.)?(?:\w+_)?(?:request|req)$
          - metavariable-regex:
              metavariable: $A
              regex: |-
                ^(?:args|form|values|json|get_json|data|get_data|files|cookies|headers|view_args|url|full_path|path|path_info|query_string|GET|POST|COOKIES|META|FILES|body|query_params|path_params)$
      # Messages read from a FastAPI / Starlette WebSocket.
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: |-
                ^(?:self\.)?(?:\w+_)?(?:websocket|ws)$
          - metavariable-regex:
              metavariable: $M
              regex: |-
                ^(?:receive_text|receive_json|receive_bytes|iter_text|iter_json|iter_bytes)$
      # Route handler parameters (FastAPI path, query, and body parameters; Flask URL
      # variables). Skipped: parameters typed int, float, bool, UUID, a date, Literal[...], or an
      # Enum defined in the file, which FastAPI validates before the call; dependencies
      # (Depends(...), Security(...), a *Dep alias); and the Request, WebSocket, Response,
      # BackgroundTasks, and SecurityScopes objects FastAPI injects. Request data read from those
      # is covered above.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$VERB(...)
                  def $F(...): ...
              - pattern-inside: |
                  @$APP.$VERB(...)
                  async def $F(...): ...
          - metavariable-regex:
              metavariable: $VERB
              regex: ^(?:get|post|put|patch|delete|options|head|trace|websocket|api_route|route)$
          - pattern-either:
              - patterns:
                  - pattern: |
                      def $F(..., $P, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P = $DEFAULT, ...): ...
              - patterns:
                  - pattern: |
                      def $F(..., $P = $DEFAULT, ...): ...
                  - pattern-not: |
                      def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                  - metavariable-regex:
                      metavariable: $DEFAULT
                      regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
              - patterns:
                  - pattern-either:
                      - pattern: |
                          def $F(..., $P: $TYPE, ...): ...
                      - patterns:
                          - pattern: |
                              def $F(..., $P: $TYPE = $DEFAULT, ...): ...
                          - metavariable-regex:
                              metavariable: $DEFAULT
                              regex: ^(?!(?:[\w.]*\.)?(?:Depends|Security)\()
                  - metavariable-regex:
                      metavariable: $TYPE
                      regex: >-
                        ^(?!(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:int|float|bool|(?:uuid\.)?UUID|(?:datetime\.)?(?:date|datetime|time|timedelta)|(?:decimal\.)?Decimal|(?:typing\.)?Literal\[|(?:fastapi\.|starlette\.\w+\.)?(?:Request|WebSocket|HTTPConnection|Response|BackgroundTasks|SecurityScopes)\b)|.*\b(?:Depends|Security)\(|[\w.]*Deps?$)
                  - pattern-not-inside: |
                      class $TYPE(..., enum.Enum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.StrEnum, ...):
                        ...
                      ...
                  - pattern-not-inside: |
                      class $TYPE(..., enum.IntEnum, ...):
                        ...
                      ...
          - focus-metavariable: $P
    pattern-sanitizers:
      # An allowlist lookup: PERSONAS[persona], TONES.get(tone, TONES["formal"]). The table is
      # the application's own text, whatever key the caller sends.
      # The default must be constant too: TONES.get(tone, tone) hands the caller's text back.
      - patterns:
          - pattern-either:
              - pattern: $D[$K]
              - pattern: $D.get($K)
              - patterns:
                  - pattern: $D.get($K, $DEF)
                  - metavariable-regex:
                      metavariable: $DEF
                      regex: |-
                        ^(?:[rRbBuU]*[\"']|None$|-?\d|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*(?:\[|\.get\(|$))
          - metavariable-regex:
              metavariable: $D
              regex: |-
                ^(?!(?:self\.|flask\.)?(?:\w+_)?(?:request|req)\.)(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$
      # An allowlist check before use: `if tone not in ALLOWED_TONES: raise HTTPException(...)`.
      # Only the left operand, and not a blocklist (`if persona in BLOCKED: ...`).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $ALLOWED
              - pattern: $X not in $ALLOWED
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
          - focus-metavariable: $X
      # A format check before use, anchored at both ends: re.fullmatch(r"[a-z]{2}(-[A-Z]{2})?", locale).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: re.fullmatch($PAT, $X, ...)
              - pattern: $RE.fullmatch($X, ...)
              - patterns:
                  - pattern: re.match($PAT, $X, ...)
                  - metavariable-regex:
                      metavariable: $PAT
                      regex: ^[rRbB]*["'].*(?:\$|\\Z)["']$
          - focus-metavariable: $X
      # Fields of a pydantic model in this file that are validated to a fixed set or a number
      # (`tone: Literal["formal", "casual"]`, `max_words: int`, or `tone: Tone` for an Enum),
      # read from a route parameter typed with that model.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - metavariable-regex:
              metavariable: $FT
              regex: |-
                ^(?:typing\.)?(?:Annotated\[\s*)?(?:(?:typing\.)?Optional\[\s*)?(?:(?:typing\.)?Literal\[|int\b|float\b|bool\b|(?:uuid\.)?UUID\b)
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $FT(..., enum.Enum, ...):
                    ...
                  ...
              - pattern-inside: |
                  class $FT(..., enum.StrEnum, ...):
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT
                    ...
                  ...
              - pattern-inside: |
                  class $M(...):
                    ...
                    $FIELD: $FT = $FD
                    ...
                  ...
          - pattern-either:
              - pattern-inside: |
                  def $FN(..., $B: $M, ...): ...
              - pattern-inside: |
                  def $FN(..., $B: $M = $BD, ...): ...
          - pattern: $B.$FIELD
      - exact: true
        pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: bool(...)
          - pattern: len(...)
          - pattern: uuid.UUID(...)
      # A dict literal is the server's own structure: {"tenant_id": user.tenant_id, "topic":
      # body.topic} keeps its scope even though a field value comes from the request. Not when
      # the request gets the last word, which overrides a server key: a trailing **spread or a
      # request-chosen last key. A comprehension copies the request's keys.
      - exact: true
        patterns:
          - pattern-inside: '{...}'
          - pattern: $D
          # Nor a mapping that holds a filter itself (search_kwargs={"k": 4, "filter": f}, a
          # {"$vectorSearch": {...}} stage), since a sanitizer also hides the sink inside it.
          - pattern-not: '{..., "filter": $KWV, ...}'
          - pattern-not: '{..., "pre_filter": $KWV, ...}'
          - pattern-not: '{..., "expr": $KWV, ...}'
          - pattern-not: '{..., "$vectorSearch": $KWV, ...}'
          - metavariable-regex:
              metavariable: $D
              regex: |-
                (?s)^\{(?![^{}]*\bfor\b)(?!.*(?:\*\*(?:"[^"\n]*"|'[^'\n]*'|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|\{[^{}]*\}|[^,{}()\[\]"'])++|(?:(?<=^\{)|,)\s*(?![rRbBuUfF]{0,2}[\"']|[A-Z][A-Z0-9_]*\s*:)[^\s,{}:\"'](?:\[[^\[\]]*\]|\([^()]*\)|[^,{}:()\[\]\"'])*:\s*(?:"[^"\n]*"|'[^'\n]*'|\((?:[^()]|\([^()]*\))*\)|\[(?:[^\[\]]|\[[^\[\]]*\])*\]|\{[^{}]*\}|[^,{}()\[\]"'])++)\s*,?\s*\}$).*\}$
      # A merge where the server's literal comes last: body.filters | {"tenant_id": t}. (OpenGrep
      # matches `|` in either order, so the order is read from the text.)
      - exact: true
        patterns:
          - pattern-inside: $A | $B
          - pattern: $U
          - metavariable-regex:
              metavariable: $U
              regex: (?s)^.*\|\s*\{[^{}*]*\}\s*$
      # A dict comprehension that keeps only allowlisted keys: {k: v for k, v in f.items() if k in FILTER_KEYS}.
      - exact: true
        patterns:
          - pattern: '{$K: $V for $K, $V in $IT if $K in $ALLOWED}'
          - metavariable-regex:
              metavariable: $ALLOWED
              regex: |-
                ^(?!.*(?i:block|deny|denied|banned|forbid|reject|unsafe))
      # Any other call builds a new value on the server: a helper that adds the tenant, a
      # filter builder (models.Filter(must=[...]), MetadataFilters(filters=[...])), a quoted
      # value (json.dumps(body.topic) in a Milvus expression). Not the readers, parsers, copies,
      # and whole-object validators that hand the request's structure through, not a call that
      # spreads it (models.Filter(**body.filter)), and not string formatting, which pastes
      # request text into a Milvus expression unquoted.
      - exact: true
        patterns:
          - pattern: $F(...)
          # A spread with no keyword of the server's own; with one (dict(**f, tenant_id=t),
          # models.Filter(must=[...], **f)) a duplicate key raises instead of overriding.
          - pattern-not: $F(**$KW)
          - pattern-not: $F($POS, **$KW)
          # A sanitizer on a call also hides a sink in its arguments, so never the query
          # calls themselves.
          - pattern-not: $F(..., where=$KWV, ...)
          - pattern-not: $F(..., filter=$KWV, ...)
          - pattern-not: $F(..., filters=$KWV, ...)
          - pattern-not: $F(..., query_filter=$KWV, ...)
          - pattern-not: $F(..., scroll_filter=$KWV, ...)
          - pattern-not: $F(..., count_filter=$KWV, ...)
          - pattern-not: $F(..., facet_filter=$KWV, ...)
          - pattern-not: $F(..., points_selector=$KWV, ...)
          - pattern-not: $F(..., search_kwargs=$KWV, ...)
          - pattern-not: $F(..., expr=$KWV, ...)
          - pattern-not: $F(..., pre_filter=$KWV, ...)
          - pattern-not: '$F(..., query={..., "filter": $KWV, ...}, ...)'
          - pattern-not: $S.where(...)
          - pattern-not: $R.search_kwargs.update(...)
          - pattern-not: $C.aggregate(...)
          - pattern-not: '"...".format(...)'
          - pattern-not: '"...".join(...)'
          - metavariable-regex:
              metavariable: $F
              regex: |-
                (?s)^(?!(?:.*\.)?(?:get|getlist|get_json|json|get_data|to_dict|dict|items|values|copy|deepcopy|pop|setdefault|loads|load|literal_eval|cast|model_dump|model_copy|model_validate|model_validate_json|parse_obj|parse_raw|parse_obj_as|validate_python|validate_json|from_dict|from_dicts|from_json|receive_json|receive_text|iter_json|iter_text|str|strip|lstrip|rstrip|lower|upper|casefold|removeprefix|removesuffix)$)
      # A lookup keyed by request data returns the server's value: saved_views.get(view_id),
      # presets[body.preset]. A literal key reads the request itself (payload.get("filter")).
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $T.get($K, ...)
              - pattern: $T[$K]
          # Not Chroma's collection.get(ids, where=...), a query call.
          - pattern-not: $T.get(..., where=$W, ...)
          - metavariable-regex:
              metavariable: $K
              regex: ^(?![rRbBuU]?["']|-?\d)
      # A Pinecone namespace or Qdrant shard key chosen on the server (namespace=user.org_id,
      # f"org-{org}") partitions the index per tenant, so the filter only narrows inside it.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $O.$M(..., namespace=$NS, ...)
                  - pattern-either:
                      - pattern-inside: $O.$M(..., filter=$X, ...)
                      - pattern-inside: '$O.$M(..., query={..., "filter": $X, ...}, ...)'
              - patterns:
                  - pattern-inside: $O.$M(..., shard_key_selector=$NS, ...)
                  - pattern-either:
                      - pattern-inside: $O.$M(..., query_filter=$X, ...)
                      - pattern-inside: $O.$M(..., scroll_filter=$X, ...)
                      - pattern-inside: $O.$M(..., count_filter=$X, ...)
                      - pattern-inside: $O.$M(..., facet_filter=$X, ...)
          - metavariable-regex:
              metavariable: $NS
              regex: |-
                ^(?!(?:[rRbBuU]?[\"']|(?:[\w.]*\.)?[A-Z][A-Z0-9_]*$|None$))
          - pattern: $X
    pattern-sinks:
      # Chroma 1.5: Collection.query / get / delete(where=...), and langchain-chroma's
      # Chroma.get / delete(where=...). where_document only matches document text and is
      # ANDed with where, so it can't widen the scope.
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $O.query(..., where=$X, ...)
              - pattern-inside: $O.get(..., where=$X, ...)
              - pattern-inside: $O.delete(..., where=$X, ...)
          - pattern: $X
      # Chroma's Search API: Search(where=...), Search().where(...).
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $SEARCH(..., where=$X, ...)
              - pattern-inside: $SEARCH(...).where($X)
          - metavariable-regex:
              metavariable: $SEARCH
              regex: ^(?:[\w.]*\.)?Search$
          - pattern: $X
      # Pinecone 10: Index.query, query_namespaces, delete, fetch_by_metadata, search,
      # search_records, and documents.search / fetch (filter=...); pymilvus 3.0 MilvusClient
      # search / query / delete / search_iterator / query_iterator (filter=, a string
      # expression; filter_params templating keeps request values out of it) and the ORM
      # Collection's expr=; LangChain vector stores (similarity_search*,
      # max_marginal_relevance_search*, sync and async; langchain-mongodb 0.12 pre_filter=,
      # langchain-milvus 0.4 expr=) and a retriever call's kwargs (retriever.invoke(q,
      # filter=...), merged into search_kwargs).
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $O.$M(..., filter=$X, ...)
              - pattern-inside: $O.$M(..., pre_filter=$X, ...)
              - pattern-inside: $O.$M(..., expr=$X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:query|query_namespaces|delete|fetch_by_metadata|search|search_records|search_iterator|query_iterator|a?similarity_search\w*|a?max_marginal_relevance_search\w*|a?invoke|a?get_relevant_documents)$
          - pattern: $X
      # pymilvus hybrid search: AnnSearchRequest(data, anns_field, param, expr=...).
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $ASR(..., expr=$X, ...)
              - pattern-inside: $ASR(..., filter=$X, ...)
          - metavariable-regex:
              metavariable: $ASR
              regex: ^(?:[\w.]*\.)?AnnSearchRequest$
          - pattern: $X
      # MongoDB Atlas Vector Search: the filter of a $vectorSearch stage, in a pipeline passed
      # to pymongo's collection.aggregate or built beforehand. The stage name scopes it; a
      # later $match only narrows what the stage returned.
      - exact: true
        patterns:
          - pattern-inside: '{..., "$vectorSearch": {..., "filter": $X, ...}, ...}'
          - pattern: $X
      # update / fetch are common names, so only on a receiver named like an index.
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $O.update(..., filter=$X, ...)
              - pattern-inside: $O.fetch(..., filter=$X, ...)
          - metavariable-regex:
              metavariable: $O
              regex: (?i)^(?:[\w.]*[._])?(?:\w*index|idx|pinecone\w*|documents)$
          - pattern: $X
      # Pinecone search with a query mapping: index.search(namespace=..., query={"filter": ...}).
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: '$O.search(..., query={..., "filter": $X, ...}, ...)'
              - pattern-inside: '$O.search_records(..., query={..., "filter": $X, ...}, ...)'
          - pattern: $X
      # Qdrant 1.20: query_points, query_points_groups, search_matrix_*, and the older search /
      # recommend / discover (query_filter=), scroll (scroll_filter=), count (count_filter=),
      # facet (facet_filter=), and delete / set_payload / delete_payload / clear_payload /
      # delete_vectors by a points selector (points_selector=, or FilterSelector(filter=...)).
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: $O.$M(..., query_filter=$X, ...)
              - pattern-inside: $O.$M(..., scroll_filter=$X, ...)
              - pattern-inside: $O.$M(..., count_filter=$X, ...)
              - pattern-inside: $O.$M(..., facet_filter=$X, ...)
              - pattern-inside: $O.$M(..., points_selector=$X, ...)
          - pattern: $X
      - exact: true
        patterns:
          - pattern-inside: $FS(..., filter=$X, ...)
          - metavariable-regex:
              metavariable: $FS
              regex: ^(?:[\w.]*\.)?FilterSelector$
          - pattern: $X
      # LangChain retrievers: as_retriever(search_kwargs={"filter": ...}) or a whole
      # search_kwargs from the request, VectorStoreRetriever(search_kwargs=...), and
      # search_kwargs set on a retriever afterwards.
      - exact: true
        patterns:
          - pattern-either:
              - pattern-inside: '$O.as_retriever(..., search_kwargs={..., "filter": $X, ...}, ...)'
              - pattern-inside: '$O.as_retriever(..., search_kwargs={..., "pre_filter": $X, ...}, ...)'
              - pattern-inside: '$O.as_retriever(..., search_kwargs={..., "expr": $X, ...}, ...)'
              - pattern-inside: '$VSR(..., search_kwargs={..., "filter": $X, ...}, ...)'
              - pattern-inside: $O.as_retriever(..., search_kwargs=$X, ...)
              - pattern-inside: $VSR(..., search_kwargs=$X, ...)
              - pattern-inside: '$R.search_kwargs = {..., "filter": $X, ...}'
              - pattern-inside: $R.search_kwargs = $X
              - pattern-inside: $R.search_kwargs["filter"] = $X
              - pattern-inside: $R.search_kwargs.update(..., filter=$X, ...)
              - pattern-inside: '$R.search_kwargs.update({..., "filter": $X, ...})'
          - pattern: $X
      # LlamaIndex 0.14: index.as_retriever / as_query_engine / as_chat_engine(filters=...),
      # VectorIndexRetriever(filters=...), VectorStoreQuery(filters=...). MetadataFilters
      # objects come from the request through from_dict / from_dicts / **spread.
      - exact: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $O.$M(..., filters=$X, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(?:as_retriever|as_query_engine|as_chat_engine)$
              - patterns:
                  - pattern-inside: $C(..., filters=$X, ...)
                  - metavariable-regex:
                      metavariable: $C
                      regex: ^(?:[\w.]*\.)?(?:VectorIndexRetriever|VectorStoreQuery)$
          - pattern: $X
    metadata:
      category: security
      subcategory: [vuln]
      pack-category: ai-code
      owasp-llm:
        - "LLM09:2026 - Vector and Embedding Weaknesses"
        - "LLM08:2025 - Vector and Embedding Weaknesses"
      owasp-aisvs:
        - "v1.01-C8.1.3 - Access Controls on Memory & RAG Indices"
      mitre-atlas:
        - "AML.T0085.000 - Data from AI Services: RAG Databases"
      cwe:
        - "CWE-639: Authorization Bypass Through User-Controlled Key"
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      # A collection, namespace, or database that is already per-tenant makes a filter from
      # the request a search option rather than the access boundary; the rule skips Pinecone
      # namespaces and Qdrant shard keys set from a variable, but can't see per-tenant
      # collections.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [flask, django, fastapi, chromadb, pinecone, qdrant, langchain, llamaindex]
      references:
        - https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM09_VectorAndEmbeddingWeaknesses.md
        - https://github.com/OWASP/AISVS/blob/v1.01/1.01/en/0x10-C08-Memory-Embeddings-and-Vector-Database.md
        - https://cwe.mitre.org/data/definitions/639.html
        - https://github.com/chroma-core/chroma/blob/1.5.9/chromadb/api/models/Collection.py
        - https://pypi.org/project/pinecone/10.2.0/
        - https://github.com/qdrant/qdrant-client/blob/v1.20.0/qdrant_client/qdrant_client.py
        - https://github.com/langchain-ai/langchain/blob/langchain-core%3D%3D1.7.0/libs/core/langchain_core/vectorstores/base.py
        - https://pypi.org/project/llama-index-core/0.14.25/
