      mitre-atlas:
        - "AML.T0051.000 - LLM Prompt Injection: Direct"
      cwe:
        - "CWE-1427: Improper Neutralization of Input Used for LLM Prompting"
      # Validation the rule can't see (a check in another class, a database constraint, a
      # length-limited slug) makes some findings safe in practice.
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [spring-ai, langchain4j, spring-mvc, spring-webflux, servlet]
      # API shapes checked 2026-10-24 against Maven Central sources: spring-ai-client-chat and
      # spring-ai-model 2.0.2 and 1.1.8 (ChatClient.ChatClientRequestSpec.system,
      # Builder.defaultSystem, PromptSystemSpec text / param / params, SystemMessage,
      # SystemPromptTemplate), langchain4j and langchain4j-core 1.22.0 (AiServices.systemMessage /
      # systemMessageProvider / systemMessageProviderWithContext / systemMessageTransformer;
      # @SystemMessage on TYPE and METHOD; @V optional with -parameters, per V.java;
      # SystemMessage.from / systemMessage / builder; PromptTemplate.apply -> Prompt.toSystemMessage),
      # spring-web and spring-webflux 7.0.10 (handler parameter annotations, ServerRequest), and
      # jakarta.servlet 6.1. AI service interfaces declared in another file (a Spring Boot
      # @AiService bean) can't be followed by a single-file scan.
